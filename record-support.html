             transform:translate(-50%, -50%);

  .radio span { cursor:pointer; padding:2px 8px; border-radius:4px; }
  .radio span.on { color:#c62828; background:#ffebee; font-weight:bold; }

  .loginbox { max-width:400px; margin:56px auto; background:#fff; border-radius:12px;
              padding:32px; border:1px solid #e0e0e0; }
  .loginbox input { border:1px solid #ddd; padding:11px; border-radius:7px; font-size:15px; }
  .out { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13.5px;

async function loadStamp() {
  try {
    const { data, error } = await sb.storage.from('nl-private').download('stamp.png');
    if (error || !data) return;
    const img = $('stampImg');
    if (!img) return;
    img.src = URL.createObjectURL(data);
    img.style.display = 'inline';
  } catch (e) {}
}

// 끝난 수업도 두 달까지는 목록에 남긴다 (치료사가 기록지를 쓸 시간을 준다)
//   보기: 8월 말 종결 → 10월까지 보임
function _keepMk(mk) {
  const y = Number(String(mk).slice(0,4));
  const m = Number(String(mk).slice(5,7)) - 2;
  const y2 = y + Math.floor((m - 1) / 12);
  const m2 = ((m - 1) % 12 + 12) % 12 + 1;
  return y2 + '-' + String(m2).padStart(2,'0');
}

  const [th, st, tp] = await Promise.all([
    sb.from('nl_therapists').select('id, name'),
    sb.from('nl_support_types').select('id, name'),
    sb.from('nl_therapies')
      .select('id, child_id, therapy_type_id, support_type_id, ended_on, nl_children!inner(id, name, birth, manager_no, status, disability, school, grade_year), nl_therapy_schedules(therapist_id, to_month)')
      .in('support_type_id', SUPPORTS)
  ]);
  (th.data || []).forEach(t => THERAPISTS[t.id] = t.name);
  (st.data || []).forEach(s => SUPNAME[s.id] = s.name);

  TPRAW = tp.data || [];

  $('pMonth').value = mkNow();
  $('pMonth').onchange = () => buildPairs().then(drawPairSelect);
  await buildPairs();
  drawPairSelect();
  $('loginBox').style.display = 'none';
  $('mainBox').style.display  = 'block';
}

// 셈은 서버 한 곳 — nl_live_rows(달, 유예개월) 가 「그 달에 살아 있던 수업」을 돌려준다 (2026-09-19)
//   유예 2 = 끝난 수업도 두 달까지 남긴다 (기록지를 쓸 시간을 준다)
//   서버를 못 부르면 아래 옛 셈으로 그린다
async function buildPairs() {
  const mv = ($('pMonth') && $('pMonth').value) ? $('pMonth').value : mkNow();
  const allView = _isAllView(ME.role);
  const seen = {};
  PAIRS = [];
  try {
    const { data, error } = await sb.rpc('nl_live_rows', { p_month: mv, p_grace: 2 });
    if (error) throw error;
    (data || []).forEach(r => {
      if (SUPPORTS.indexOf(Number(r.support_type_id)) < 0) return;
      if (!allView && String(r.therapist_id) !== String(ME.id)) return;
      const c = KIDS[r.child_id];
      if (!c) return;
      const k = c.id + '-' + r.support_type_id;
      if (seen[k]) return;
      seen[k] = true;
      PAIRS.push({ child: c, support_type_id: Number(r.support_type_id),
                   therapy_id: r.therapy_id, therapy_type_id: r.therapy_type_id });
    });
    PAIRS.sort((a,b) => (a.child.name||'').localeCompare(b.child.name||'')
                     || a.support_type_id - b.support_type_id);
    return;
  } catch (e) { /* 서버를 못 부르면 아래 옛 셈으로 */ }
  const _keep0 = _keepMk(mv);
  TPRAW.forEach(r => {
    const c = r.nl_children;
    if (!c) return;
    if (r.ended_on && String(r.ended_on).slice(0,7) < _keep0) return;
    const sc = (r.nl_therapy_schedules || [])
      .filter(s => !s.to_month || s.to_month >= _keep0);
    if (!sc.length) return;
    if (!allView && !sc.some(s => String(s.therapist_id) === String(ME.id))) return;
    const k = c.id + '-' + r.support_type_id;
    if (seen[k]) return;
    seen[k] = true;
    PAIRS.push({ child: c, support_type_id: r.support_type_id,
                 therapy_id: r.id, therapy_type_id: r.therapy_type_id });
  });
  PAIRS.sort((a,b) => (a.child.name||'').localeCompare(b.child.name||'')
                   || a.support_type_id - b.support_type_id);
}

function drawPairSelect() {
  const keep = $('pChild').selectedOptions && $('pChild').selectedOptions[0]

  $('pChild').innerHTML = '<option value="">— 아동을 고르세요 —</option>'

// ── 그 달에 살아 있던 요일줄만 쓴다 (2026-09-17) ──
//   달 중간에 담당·요일·시각을 바꾸면 요일줄이 둘이 된다.
//   전에는 요일줄을 모두(지금 것까지) 읽어 지난 달 기록지의 담당·요일·시간이 바뀌어 보였다
const _SWD = { 일:0, 월:1, 화:2, 수:3, 목:4, 금:5, 토:6 };
function _ymd(d) { return year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
function schedActive(rows) {
  const mk = year + '-' + String(month).padStart(2,'0');
  const first = mk + '-01', last = _ymd(new Date(year, month, 0).getDate());
  return (rows || []).filter(s => (s.from_month || '0000-00') <= mk && (s.to_month || '9999-12') >= mk
    && (!s.from_date || String(s.from_date) <= last) && (!s.to_date || String(s.to_date) >= first));
}
function schedInMonth(rows) {
  const act = schedActive(rows);
  const st = s => String(s.from_date || ((s.from_month || '0000-00') + '-01'));
  return (act.length ? act : (rows || [])).slice().sort((a, b) => st(a).localeCompare(st(b)));
}
// 그 날 수업을 맡은 요일줄 (요일·기간이 맞는 것)
function schedOnDay(d) {
  const iso = _ymd(d), wd = new Date(year, month - 1, d).getDay();
  return SCHED.find(s => _SWD[s.weekday] === wd
    && (!s.from_date || String(s.from_date) <= iso)
    && (!s.to_date || String(s.to_date) >= iso)) || null;
}
function thOnIso(iso) {
  const pre = year + '-' + String(month).padStart(2,'0') + '-';
  const s = (iso && String(iso).startsWith(pre)) ? schedOnDay(parseInt(String(iso).slice(8, 10), 10)) : null;
  return s ? s.therapist_id : (SCHED.length ? SCHED[SCHED.length - 1].therapist_id : null);
}
function schedThNames(nameOf) {
  return [...new Set(SCHED.map(s => s.therapist_id).filter(v => v != null))]
    .map(nameOf).filter(Boolean).join('·');
}

// ── 불러오기 ──
async function loadOne() {

  const mv  = $('pMonth').value;
  if (DIRTY && !confirm('저장하지 않은 내용이 있습니다.\n\n그래도 다른 기록지를 불러올까요?\n(적어 둔 내용은 사라집니다)')) return;
  if (idx === '') { alert('아동을 고르세요.'); return; }
  if (!mv) { alert('달을 고르세요.'); return; }

  cur = PAIRS[Number(idx)];
  year  = parseInt(mv.split('-')[0], 10);
  month = parseInt(mv.split('-')[1], 10);
  const mk = mkNow();

  $('pLoad').disabled = true; $('pLoad').textContent = '불러오는 중...';
  try {
    const [sc, lg, pr] = await Promise.all([
      sb.from('nl_therapy_schedules')
        .select('id, weekday, start_time, therapist_id, duration, from_month, to_month, from_date, to_date')
        .eq('therapy_id', cur.therapy_id),
      sb.from('nl_session_logs').select('*')
        .eq('child_id', cur.child.id)
        .eq('support_type_id', cur.support_type_id)
        .eq('month_key', mk).maybeSingle(),
      // 지난 달들 중 가장 최근 기록 — 수행수준·목표를 이어받는다
      sb.from('nl_session_logs').select('*')
        .eq('child_id', cur.child.id)
        .eq('support_type_id', cur.support_type_id)
        .lt('month_key', mk)
        .order('month_key', { ascending: false }).limit(1)
    ]);
    SCHED = schedInMonth(sc.data || []);

        .eq('log_id', LOGID).order('seq_no');

    drawAll(lg.data);

    setSaveBtn(LOGID ? 'done' : 'before');

    alert('불러오지 못했습니다.\n' + e.message);
  } finally {
    $('pLoad').disabled = false; $('pLoad').textContent = '불러오기';
  }
}

// 그 달 수업일 (최대 3회)
function _classDays() {
  const M = { 일:0, 월:1, 화:2, 수:3, 목:4, 금:5, 토:6 };
  const dows = [...new Set(SCHED.map(s => M[s.weekday]).filter(v => v !== undefined))];
  if (!dows.length) return [];
  const last = new Date(year, month, 0).getDate();
  const out = [];
  for (let d = 1; d <= last; d++) {
    if (dows.includes(new Date(year, month - 1, d).getDay()) && schedOnDay(d)) out.push(d);
  }
  return out.slice(0, SESSIONS);
}
function _timeText() {
  if (!SCHED.length || !SCHED[0].start_time) return '';
  const p = String(SCHED[0].start_time).split(':');
  let h = parseInt(p[0],10), m = parseInt(p[1]||'0',10);
  const s = h + ':' + String(m).padStart(2,'0');
  const dur = SCHED[0].duration || 40;
  m += dur; h += Math.floor(m/60); m %= 60;
  return s + '-' + h + ':' + String(m).padStart(2,'0');
}

function drawAll(saved) {
  const c = cur.child;
  const areaName = TTYPE[cur.therapy_type_id] || '';
  $('pageTitle').textContent = `치료지원 누가기록서 — ${c.name} · ${SUPNAME[cur.support_type_id]} · ${year}년 ${month}월`;
  $('sheetTitle').textContent = `${areaName}치료 [ ${month} ]월 치료지원 누가기록서`;

  $('f_name').value   = c.name || '';
  $('f_birth').value  = fmtBirth(c.birth);
  // 이번 달 저장분 → 없으면 지난 기록 → 없으면 아동 표
  const pick = k => (saved && saved[k]) || (PREV && PREV[k]) || '';
  $('f_disab').value  = pick('disability_text');
  $('f_opinion').value = pick('month_summary') || '';
  $('f_school').value = pick('school_text') || c.school || '';
  $('f_grade').value  = pick('grade_text')  || c.grade_year || '';
  $('f_fine').value   = pick('level_fine');
  $('f_cog').value    = pick('level_cog');
  $('f_goalL').value  = pick('goal_long');
  $('f_goalS').value  = pick('goal_short');
  const carried = !saved && PREV;

  CONT = (saved && saved.continue_yn) || '';
  $('contBox').querySelectorAll('span').forEach(s =>
    s.classList.toggle('on', s.dataset.val === CONT));

  const tname = schedThNames(id => THERAPISTS[id] || '');
  $('signThr').textContent = tname || '\u00a0';
  // 작성일 = 그 달 마지막 수업일. 저장된 값이 있으면 그것을 쓴다
  let wd = saved && saved.written_on ? String(saved.written_on) : '';
  if (!wd) {
    const ds = _classDays();
    if (ds.length) {
      wd = year + '-' + String(month).padStart(2,'0')
         + '-' + String(ds[ds.length - 1]).padStart(2,'0');
    }
  }
  WRITTEN = wd || null;
  $('signDate').innerHTML = wd
    ? `${wd.slice(0,4)}년 ${parseInt(wd.slice(5,7),10)}월 ${parseInt(wd.slice(8,10),10)}일`
    : '20&nbsp;&nbsp;&nbsp;년&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;월&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;일';

  if (carried) {
    $('pInfo').textContent += ' · 지난 기록(' + PREV.month_key + ')에서 목표를 이어받았습니다';
  }
  buildSeq();
}

function buildSeq() {
  const tb = $('seqBody');
  tb.innerHTML = '';
  for (let i = 0; i < SESSIONS; i++) {
    const it = ITEMS[i] || {};
    // 수업일자·시간은 자동으로 채우지 않는다.
    // 실제 수업한 날과 카드 결제일이 다를 수 있어,
    // 치료사분이 직접 적으시도록 비워 둔다.
    const d  = it.service_date ? parseInt(String(it.service_date).slice(8,10),10) : '';
    const st = it.start_time ? String(it.start_time).slice(0,5) : '';
    const en = it.end_time   ? String(it.end_time).slice(0,5)   : '';
    const timeVal = (st && en) ? (st + '-' + en) : (st || en || '');
    const tr = document.createElement('tr');
    tr.innerHTML =
        '<td style="text-align:center;">'
      + '<div style="font-weight:bold;margin-bottom:4px;">' + (i+1) + '회</div>'
      + '<input type="text" class="q_date" value="' + (d ? month + '월 ' + d + '일' : '') + '" style="text-align:center;">'
      + '<input type="text" class="q_time" value="' + esc(timeVal) + '" style="text-align:center;margin-top:3px;">'
      + '</td>'
      + '<td><textarea class="q_content" style="min-height:64px;">' + esc(it.content || '') + '</textarea></td>'
      + '<td><textarea class="q_react" style="min-height:64px;">' + esc(it.reaction || '') + '</textarea></td>';
    tb.appendChild(tr);
  }
}

// ── 저장 ──
async function saveRecord() {
  if (!LOADED || !cur) { alert('먼저 아동과 달을 고르고 [불러오기]를 누르세요.'); return; }
  const mk = mkNow();
  SAVING = true;
  setSaveBtn('saving');
  try {
    const logRow = {
      child_id: cur.child.id, support_type_id: cur.support_type_id, month_key: mk,
      therapist_id: SCHED.length ? SCHED[SCHED.length - 1].therapist_id : null,
      goal_long:  $('f_goalL').value || null,
      goal_short: $('f_goalS').value || null,
      level_fine: $('f_fine').value  || null,
      level_cog:  $('f_cog').value   || null,
      school_text: $('f_school').value || null,
      grade_text:  $('f_grade').value  || null,
      disability_text: $('f_disab').value || null,
      continue_yn: CONT || null,
      month_summary: $('f_opinion').value || null,
      written_on: WRITTEN || null,
      updated_at: new Date().toISOString()
    };
    // 잠금 uq_session_log_th — 아동·지원유형·달·수업 (2026-09-11)
    const { data: lg, error: e1 } = await sb.from('nl_session_logs')
      .upsert(logRow, { onConflict: 'child_id,support_type_id,month_key,therapy_id' })
      .select('id').single();
    if (e1) throw e1;
    LOGID = lg.id;


    const trs = document.querySelectorAll('#seqBody tr');
    const items = [];
    trs.forEach((tr, i) => {
      const dtxt = tr.querySelector('.q_date').value;
      const dm = dtxt.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
      const iso = dm
        ? year + '-' + String(dm[1]).padStart(2,'0') + '-' + String(dm[2]).padStart(2,'0')
        : d2iso(dtxt);
      const tv = tr.querySelector('.q_time').value.split(/[-~]/);
      items.push({
        log_id: LOGID, seq_no: i + 1,
        service_date: iso,
        start_time: _hm(tv[0] || ''),
        end_time:   _hm(tv[1] || ''),
        therapist_id: thOnIso(iso),
        content:  tr.querySelector('.q_content').value || null,
        reaction: tr.querySelector('.q_react').value || null,
        status: '출석'
      });
    });
    // 회차 줄은 다 만든 뒤에 바꾼다 (2026-09-21)
    //   전에는 먼저 지우고 나서 만들어 넣었는데, 넣다가 실패하면(시간 글자 잘못 등)
    //   적어 둔 내용이 모두 사라졌다 → 옛 줄을 들고 있다가 실패하면 되돌린다
    const old = await sb.from('nl_session_items').select('*').eq('log_id', LOGID);
    if (old.error) throw old.error;
    const del = await sb.from('nl_session_items').delete().eq('log_id', LOGID);
    if (del.error) throw del.error;
    const ins = await sb.from('nl_session_items').insert(items);
    if (ins.error) {
      const back = (old.data || []).map(r => { const c = Object.assign({}, r); delete c.id; return c; });
      if (back.length) await sb.from('nl_session_items').insert(back);
      throw new Error('저장하지 못해 전에 적은 내용으로 되돌렸습니다.\n' + ins.error.message);
    }

    // 학교·학년을 아동 표에도 남긴다 (다음부터 자동으로 채워짐)
    const sc = $('f_school').value.trim(), gy = $('f_grade').value.trim();
    if (sc || gy) {
      await sb.from('nl_children')
        .update({ school: sc || null, grade_year: gy || null })
        .eq('id', cur.child.id);
      cur.child.school = sc; cur.child.grade_year = gy;
    }

    ITEMS = items;
    // 저장 알림 창은 뺐다 — 단추 모양이 알려 준다 (2026-09-16)
    $('pInfo').textContent = mk + ' · 저장됨';
    DIRTY = false;
    setSaveBtn('done');
  } catch (e) {
    alert('❌ 저장하지 못했습니다.\n' + e.message);
    setSaveBtn('before');
  } finally {
    setTimeout(() => { SAVING = false; }, 300);
  }
}

// ── 저장 단추 상태 (2026-09-16) ──

    show($('msg'), '❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false; $('btn').textContent = '로그인';
  }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
  else {
    // 로그인이 없으면 첫 화면으로 보낸다 (빈 화면이 열리는 것을 막기 위함)
    location.replace('index.html');
  }
})();
</script>
<script>
// 인쇄할 때 글상자의 높이를 내용만큼 늘린다 (2026-09-10)
//   그래야 긴 글이 잘리지 않고 다음 장으로 넘어간다
(function(){
  var saved = [];
  function grow(){
    saved = [];
    var list = document.querySelectorAll('textarea');
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      saved.push([a, a.style.height]);
      a.style.height = 'auto';
      a.style.height = (a.scrollHeight + 4) + 'px';
    }
  }
  function back(){
    for (var i = 0; i < saved.length; i++) saved[i][0].style.height = saved[i][1];
    saved = [];
  }
  window.addEventListener('beforeprint', grow);
  window.addEventListener('afterprint', back);
  if (window.matchMedia) {
    var mq = window.matchMedia('print');
    if (mq.addEventListener) {
      mq.addEventListener('change', function(e){ if (e.matches) grow(); else back(); });
    }
  }
})();
</script>

<!-- 아동 이름 타자로 찾기 (2026-09-17) — 안쪽 고르기 칸(#pChild)은 숨겨 두고 그대로 쓴다 -->
<style>
  .kidpickwrap { position:relative; display:inline-block; vertical-align:middle; }
  #pChildQ { min-width:260px; padding:6px 10px; font:inherit; font-size:14px;
             border:1px solid #ccc; border-radius:6px; background:#fff; }
  #pChildList { position:absolute; left:0; top:100%; z-index:50; min-width:100%; max-height:320px;
                overflow-y:auto; background:#fff; border:1px solid #ccc; border-radius:6px;
                box-shadow:0 4px 14px rgba(0,0,0,.12); display:none; margin-top:2px; }
  #pChildList div { padding:6px 10px; font-size:13.5px; cursor:pointer; white-space:nowrap; }
  #pChildList div.on, #pChildList div:hover { background:#F8F1E8; }
  #pChildList .none { color:#999; cursor:default; }
  @media print { .kidpickwrap { display:none !important; } }
</style>
<script>
(function () {
  const sel = document.getElementById('pChild');
  if (!sel) return;
  sel.style.display = 'none';
  const wrap = document.createElement('span');
  wrap.className = 'kidpickwrap';
  wrap.innerHTML = '<input id="pChildQ" type="text" autocomplete="off" placeholder="아동 이름이나 번호를 치세요">'
                 + '<div id="pChildList"></div>';
  sel.parentNode.insertBefore(wrap, sel);
  const q = document.getElementById('pChildQ'), box = document.getElementById('pChildList');
  let hits = [], cur = -1;
  const opts = () => Array.from(sel.options).filter(o => o.value !== '');
  function show() {
    const t = q.value.trim().toLowerCase();
    hits = opts().filter(o => !t || o.text.toLowerCase().includes(t)
      || (/^\d+$/.test(t) && String(o.dataset.cid || '') === t));
    cur = hits.length ? 0 : -1;
    box.innerHTML = hits.length
      ? hits.map((o, i) => '<div data-i="' + i + '"' + (i === cur ? ' class="on"' : '') + '>'
          + o.text.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</div>').join('')
      : '<div class="none">찾는 아동이 없습니다</div>';
    box.style.display = 'block';
  }
  function mark() {
    box.querySelectorAll('div[data-i]').forEach(d => d.classList.toggle('on', Number(d.dataset.i) === cur));
    const el = box.querySelector('div.on'); if (el) el.scrollIntoView({ block: 'nearest' });
  }
  function pick(o) {
    sel.value = o.value;
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    q.value = o.text;
    q.dataset.picked = o.value;
    box.style.display = 'none';
  }
  q.addEventListener('focus', () => { q.select(); show(); });
  q.addEventListener('input', () => { q.dataset.picked = ''; show(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { if (hits.length) { cur = (cur + 1) % hits.length; mark(); } e.preventDefault(); }
    else if (e.key === 'ArrowUp') { if (hits.length) { cur = (cur - 1 + hits.length) % hits.length; mark(); } e.preventDefault(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (box.style.display === 'block' && hits[cur]) pick(hits[cur]);
      else if (q.dataset.picked) { const b = document.getElementById('pLoad'); if (b) b.click(); }
    }
    else if (e.key === 'Escape') { box.style.display = 'none'; }
  });
  box.addEventListener('mousedown', e => {
    const d = e.target.closest('div[data-i]'); if (!d) return;
    e.preventDefault(); pick(hits[Number(d.dataset.i)]);
  });
  q.addEventListener('blur', () => setTimeout(() => {
    box.style.display = 'none';
    // 고르지 않고 나가면 지금 고른 아동 이름으로 되돌린다
    const o = sel.options[sel.selectedIndex];
    q.value = (o && o.value !== '') ? o.text : '';
  }, 150));
  // 목록이 다시 그려지면(달·전체 보기 바꿈) 칸 글자를 맞춘다
  new MutationObserver(() => {
    const o = sel.options[sel.selectedIndex];
    if (document.activeElement !== q) q.value = (o && o.value !== '') ? o.text : '';
  }).observe(sel, { childList: true });
})();
</script>

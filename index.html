<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나무링크</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3c7a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="나무링크">
<link rel="apple-touch-icon" href="img/nl-icon-180.png">
<style>
  :root {
    --ink:#1c1f1a; --ink2:#5a6156; --ink3:#9aa294;
    --line:#e8ebe4; --bg:#f7f8f5; --acc:#3c7a4a; --acc-bg:#eef3ec;
  }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg);
         margin:0; padding:28px 20px; color:var(--ink); -webkit-font-smoothing:antialiased; }

  .box { max-width:400px; margin:56px auto; background:#fff; border-radius:14px;
         padding:32px; border:1px solid var(--line); }
  .wide { max-width:760px; margin:0 auto; }

  h1 { font-size:19px; font-weight:600; letter-spacing:-.01em; margin:0; }
  .sub { font-size:13px; color:var(--ink3); margin:6px 0 24px; }
  label { display:block; font-size:12px; color:var(--ink2); margin:16px 0 6px; }
  input { font:inherit; font-size:14px; padding:9px 11px; color:var(--ink);
          border:1px solid var(--line); border-radius:8px; background:#fff; width:100%; }
  input:focus { outline:2px solid var(--acc); outline-offset:-1px; border-color:transparent; }
  button { font:inherit; font-size:14px; font-weight:500; padding:10px 16px;
           background:var(--acc); color:#fff; border:none; border-radius:8px; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button:disabled { background:#c3c8c0; cursor:default; }
  .box button { width:100%; padding:12px; margin-top:24px; }
  .ghost { background:none; color:var(--ink2); border:1px solid var(--line); }

  .out { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13.5px;
         line-height:1.6; display:none; white-space:pre-wrap; }
  .ok  { background:var(--acc-bg); color:#2c5c37; display:block; }
  .err { background:#fdeeee; color:#9c2b2b; display:block; }

  .top { display:flex; justify-content:space-between; align-items:flex-start;
         gap:12px; margin-bottom:6px; }
  .who { font-size:13px; color:var(--ink3); margin-top:4px; }

  .grp { margin-top:30px; }
  .grp h2 { font-size:11.5px; font-weight:600; letter-spacing:.08em; color:var(--ink3);
            margin:0 0 12px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(228px, 1fr)); gap:12px; }
  a.card { display:block; background:#fff; border:1px solid var(--line); border-radius:12px;
           padding:18px 20px; text-decoration:none; color:inherit; transition:.12s; }
  a.card:hover { border-color:var(--acc); transform:translateY(-1px);
                 box-shadow:0 3px 12px rgba(60,122,74,.09); }
  a.card .nm { font-size:15px; font-weight:600; letter-spacing:-.01em; }
  a.card .de { font-size:12.5px; color:var(--ink3); margin-top:5px; line-height:1.55; }
  a.card .tag { display:inline-block; font-size:10.5px; font-weight:600; padding:2px 7px;
                border-radius:20px; background:var(--acc-bg); color:#2c5c37; margin-left:6px;
                vertical-align:2px; }
  a.card .tag.adm { background:#fdf3e6; color:#a9701c; }

  .none { padding:44px 20px; text-align:center; color:var(--ink3); font-size:14px;
          background:#fff; border:1px solid var(--line); border-radius:12px; }
  .foot { margin-top:34px; font-size:12px; color:var(--ink3); line-height:1.9;
          border-top:1px solid var(--line); padding-top:16px; }

  /* 알림 */
  .bell { position:relative; background:none; border:1px solid var(--line);
          color:var(--ink2); padding:10px 14px; margin-right:6px; }
  .bell .cnt { position:absolute; top:-6px; right:-6px; min-width:19px; height:19px;
               line-height:19px; padding:0 5px; border-radius:10px; background:#c0392b;
               color:#fff; font-size:11px; font-weight:700; }
  .albg { position:fixed; inset:0; background:rgba(0,0,0,.42); display:none;
          align-items:center; justify-content:center; padding:20px; z-index:50; }
  .albox { background:#fff; border-radius:14px; padding:24px; max-width:440px;
           width:100%; max-height:78vh; overflow:auto; }
  .altitle { font-size:17px; font-weight:700; color:var(--ink); margin-bottom:14px; }
  .alrow { border-top:1px solid var(--line); padding:11px 0; font-size:14px;
           line-height:1.65; color:var(--ink2); }
  .alrow:first-of-type { border-top:none; }
  .alkind { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px;
            border-radius:10px; background:var(--acc-bg); color:#2c5c37; margin-right:6px; }
  .alkind.w { background:#fdf3e6; color:#a9701c; }
  .albtn { width:100%; margin-top:18px; padding:12px; }
  .alnone { padding:26px 0; text-align:center; color:var(--ink3); font-size:14px; }
</style>
</head>
<body>

<!-- 로그인 전 -->
<div class="box" id="loginBox">
  <h1>🌿 나무링크</h1>
  <div class="sub">자라는나무 아동발달치료센터</div>
  <label for="em">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com">
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 로그인 후 -->
<div class="wide" id="mainBox" style="display:none;">
  <div class="top">
    <div>
      <h1>🌿 나무링크</h1>
      <div class="who" id="who"></div>
    </div>
    <div>
      <button id="bell" class="bell" style="display:none;">🔔<span id="bellCnt" class="cnt" style="display:none;">0</span></button>
      <button id="pcKey" class="ghost" style="display:none;">이 컴퓨터 등록</button>
      <button id="out" class="ghost">로그아웃</button>
    </div>
  </div>

  <div id="menu"></div>

  <div class="foot">
    자라는나무 · 042-488-6011<br>
    화면이 예전 그대로 보이면 <b>Ctrl+Shift+R</b> 을 눌러 새로 고치세요.
  </div>
</div>

<!-- 알림 창 -->
<div class="albg" id="albg">
  <div class="albox">
    <div class="altitle" id="alTitle">새 알림</div>
    <div id="alList"></div>
    <button class="albtn" id="alOk">확인했습니다</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nl-login.js"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
// 로그인을 창(탭) 안에서만 유지한다.
// 창을 닫으면 자동으로 끊긴다. 공용 PC에 로그인이 남지 않게 하기 위함.
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: {
    storage: nlStore,
    persistSession: true,
    autoRefreshToken: true
  }
});
const $  = id => document.getElementById(id);

// 화면 목록 — roles 에 적힌 역할만 볼 수 있다
const MENU = [
{ grp:'일정', items:[
    { f:'schedule.html', nm:'시간표',
      de:'요일별 수업표. 결석·보강·휴무 표시. 치료사는 담당 수업만 보임',
      roles:['관리자','행정','치료사'] }
  ]},
{ grp:'아동', items:[
    { f:'children-new.html', nm:'등록 아동 관리',
      de:'관리번호<br>전화번호',
      roles:['관리자','행정'] },
    { f:'inquiry.html', nm:'신규 문의·상담·평가 관리',
      de:'문의 내용<br>시간 대기 명단<br>평가 내역',
      roles:['관리자','행정'] }
  ]},
  { grp:'납부', items:[
    { f:'billing-new.html', nm:'납부 계산',
      de:'그 달 회기로 금액 자동 계산. 매달 쓰는 화면',
      roles:['관리자','행정'] },
    // 지난 납부 입력 — 지금은 감춰둠 (납부 계산 화면으로 대신함)
    // 다시 쓰려면 아래 roles 에 '관리자','행정' 을 넣으면 된다
    { f:'payments-new.html', nm:'지난 납부 입력',
      de:'엑셀 보고 지난달 납부 넣기<br>연말정산 영수증용',
      roles:[] },
    { f:'voucher-upload.html', nm:'발달 올리기',
      de:'발달재활 전자바우처 결제내역 엑셀<br>승인번호가 기록지에 들어감',
      roles:['관리자','행정'] },
    { f:'card-upload.html', nm:'지원 결제 내역 올리기',
      de:'치료지원·방과후 카드 결제내역 엑셀<br>아동별 미결제 금액 점검',
      roles:['관리자','행정'] }
  ]},
  { grp:'학부모', items:[
    { f:'notice.html', nm:'공지사항',
      de:'학부모께 보낼 안내 올리기<br>중요 공지는 창으로 띄움',
      roles:['관리자','행정'] },
    { f:'absence.html', nm:'결석·보강 신청',
      de:'학부모가 낸 신청 확인하기<br>확정하면 시간표에 반영됨',
      roles:['관리자','행정'] }
  ]},
  { grp:'치료 기록지', items:[
    { f:'record-develop.html', nm:'발달재활 기록지',
      de:'서비스 일정표·제공기록지 · 월 4회',
      roles:['관리자','행정','치료사'] },
    { f:'record-support.html', nm:'치료지원 기록지',
      de:'치료지원 누가기록서 · 월 3회',
      roles:['관리자','행정','치료사'] },
    { f:'record-center.html', nm:'센터 기록지',
      de:'센터비용 아동 치료 기록 · 월 4회',
      roles:['관리자','행정','치료사'] }
  ]}
];

function show(el, t, ok) { el.textContent = t; el.className = 'out ' + (ok ? 'ok' : 'err'); }
function esc(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function afterLogin(user) {
  const { data: me, error } = await sb
    .from('nl_therapists').select('id, name, role')
    .eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (error) { show($('msg'), '❌ 직원 조회 실패\n' + error.message, false); return; }
  if (!me)   { show($('msg'), '⚠️ 직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.', false); return; }
  nlKeep(me.id);   // 대표(8번)만 로그인을 브라우저에 남긴다

  const role = String(me.role || '').trim();
  $('who').textContent = me.name + ' (' + role + ') 님';

  // 대표(8번)만 — 이 컴퓨터를 센터 컴퓨터로 등록하거나 뺄 수 있다
  //   등록해 둔 컴퓨터에서만 행정(9번)이 로그인할 수 있다
  if (Number(me.id) === 8) {
    const pk = $('pcKey');
    const draw = () => {
      const on = nlHasPcKey();
      pk.textContent = on ? '✅ 센터 컴퓨터' : '이 컴퓨터 등록';
      pk.title = on
        ? '이 컴퓨터에서는 행정 선생님이 로그인할 수 있습니다. 누르면 뺍니다.'
        : '이 컴퓨터를 센터 컴퓨터로 등록합니다. 행정 선생님이 여기서 로그인할 수 있게 됩니다.';
      pk.style.display = '';
    };
    draw();
    pk.onclick = () => {
      const on = nlHasPcKey();
      if (on) {
        if (!confirm('이 컴퓨터를 센터 컴퓨터에서 뺍니다.\n\n'
          + '행정 선생님이 여기서 로그인할 수 없게 됩니다.\n계속할까요?')) return;
        nlSetPcKey(false);
      } else {
        if (!confirm('이 컴퓨터를 센터 컴퓨터로 등록합니다.\n\n'
          + '행정 선생님이 여기서 로그인할 수 있게 됩니다.\n'
          + '개인 컴퓨터라면 등록하지 마세요.\n\n계속할까요?')) return;
        nlSetPcKey(true);
      }
      draw();
    };
  }

  let html = '';
  MENU.forEach(g => {
    const list = g.items.filter(it => it.roles.includes(role));
    if (!list.length) return;
    html += '<div class="grp"><h2>' + esc(g.grp) + '</h2><div class="cards">'
      + list.map(it =>
          '<a class="card" href="' + it.f + '">'
          + '<div class="nm">' + esc(it.nm)
          + (it.tag ? '<span class="tag adm">' + esc(it.tag) + '</span>' : '') + '</div>'
          + '<div class="de">' + esc(it.de).replace(/&lt;br&gt;/g, '<br>') + '</div></a>').join('')
      + '</div></div>';
  });

  if (!html) {
    html = '<div class="grp"><div class="none">'
      + '아직 사용할 수 있는 화면이 없습니다.<br>'
      + '필요한 화면이 있으면 관리자에게 말씀해 주세요.</div></div>';
  } else if (role === '치료사') {
    html += '<div class="foot" style="border:none;padding-top:14px;margin-top:18px;">'
      + '기록지에는 <b>담당하시는 아동만</b> 나옵니다. '
      + '담당이 아닌 아동이 보이지 않으면 관리자에게 문의하세요.</div>';
  }
  $('menu').innerHTML = html;

  $('loginBox').style.display = 'none';
  $('mainBox').style.display  = 'block';

  $('bell').style.display = 'inline-block';
  await loadAlerts(true);
}

// ── 알림 ───────────────────────────────────────────
let ALERTS = [];   // 지금 창에 보이는 알림

function alDraw(list, title) {
  $('alTitle').textContent = title;
  if (!list.length) {
    $('alList').innerHTML = '<div class="alnone">새 알림이 없습니다.</div>';
    $('alOk').textContent = '닫기';
  } else {
    $('alList').innerHTML = list.map(a =>
      '<div class="alrow">'
      + '<span class="alkind' + (a.kind === '결석신청' ? ' w' : '') + '">'
      + esc(a.kind) + '</span>'
      + esc(a.body) + '</div>').join('');
    $('alOk').textContent = '확인했습니다';
  }
  $('albg').style.display = 'flex';
}

// 안 읽은 알림을 가져온다. pop 이 참이면 있을 때 창을 띄운다
async function loadAlerts(pop) {
  const { data, error } = await sb
    .from('nl_alerts')
    .select('id, kind, body, created_at')
    .is('read_at', null)
    .order('id', { ascending: false })
    .limit(50);
  if (error) { $('bell').style.display = 'none'; return; }

  ALERTS = data || [];
  const n = ALERTS.length;
  $('bellCnt').textContent = n;
  $('bellCnt').style.display = n ? 'inline-block' : 'none';

  if (pop && n) alDraw(ALERTS, '새 알림 ' + n + '건');
}

// 종을 누르면 — 안 읽은 것이 있으면 그것을, 없으면 지난 알림을 보여준다
$('bell').onclick = async () => {
  if (ALERTS.length) { alDraw(ALERTS, '새 알림 ' + ALERTS.length + '건'); return; }
  const { data } = await sb
    .from('nl_alerts')
    .select('id, kind, body, created_at')
    .order('id', { ascending: false })
    .limit(15);
  alDraw(data || [], '지난 알림');
};

// 확인했습니다 — 안 읽은 것을 다 읽음으로
$('alOk').onclick = async () => {
  $('alOk').disabled = true;
  if (ALERTS.length) {
    try {
      await sb.from('nl_alerts')
        .update({ read_at: new Date().toISOString() })
        .in('id', ALERTS.map(a => a.id));
    } catch (e) {}
  }
  $('albg').style.display = 'none';
  $('alOk').disabled = false;
  await loadAlerts(false);
};

// 바깥을 눌러도 닫힌다 (읽음 처리는 안 함)
$('albg').onclick = e => { if (e.target === $('albg')) $('albg').style.display = 'none'; };

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show($('msg'), '이메일과 비밀번호를 모두 입력하세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    // 이메일만 기억해 둔다 (비밀번호는 저장하지 않는다)
    try { localStorage.setItem('nl_last_email', email); } catch (e) {}
    await afterLogin(data.user);
  } catch (e) {
    show($('msg'), '❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false; $('btn').textContent = '로그인';
  }
};
$('out').onclick = async () => {
  $('out').disabled = true;
  $('out').textContent = '로그아웃 중...';
  nlKeepOff();
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

// 화면을 열면 지난번 이메일을 채워둔다 (비밀번호는 매번 입력)
try {
  const _last = localStorage.getItem('nl_last_email');
  if (_last) { $('em').value = _last; }
} catch (e) {}

// 비밀번호 재설정 메일 링크로 들어오면 비밀번호 정하는 화면으로 보낸다
function _isRecovery() {
  const h = location.hash || '';
  const q = location.search || '';
  return /type=recovery/.test(h) || /type=recovery/.test(q);
}
if (_isRecovery()) {
  location.replace('reset-password.html' + location.search + location.hash);
} else {
  sb.auth.onAuthStateChange(evt => {
    if (evt === 'PASSWORD_RECOVERY') location.replace('reset-password.html');
  });
  (async () => {
    const { data } = await sb.auth.getSession();
    if (data.session) await afterLogin(data.session.user);
  })();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간표 - 나무링크</title>
<style>
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:#f5f9f0;
         margin:0; padding:20px; color:#333; }
  .box { max-width:460px; margin:40px auto; background:#fff; border-radius:12px;
         padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .wide { max-width:1500px; margin:16px auto; background:#fff; border-radius:12px;
          padding:22px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:20px; color:#2e7d32; margin:0 0 4px; }
  #monBig { font-size:30px; font-weight:800; color:#1b5e20; letter-spacing:-.02em;
            vertical-align:-3px; margin-left:6px; }
  .nosess { background:#fff3e0; border:1px solid #ffcc80; color:#e65100;
            border-radius:8px; padding:12px 14px; font-size:13.5px; margin-bottom:12px; }
  .sub { font-size:13px; color:#888; margin-bottom:22px; }
  label { display:block; font-size:13px; font-weight:bold; margin:14px 0 5px; }
  input { width:100%; padding:11px; border:1px solid #ddd; border-radius:7px;
          font-size:15px; box-sizing:border-box; }
  button { width:100%; padding:13px; margin-top:20px; background:#2e7d32; color:#fff;
           border:none; border-radius:7px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { background:#bbb; cursor:default; }
  .out { margin-top:16px; padding:13px; border-radius:8px; font-size:14px;
         line-height:1.7; display:none; white-space:pre-wrap; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }

  .top { display:flex; justify-content:space-between; align-items:center;
         flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .who { font-size:13px; color:#666; }
  .btn-out { width:auto; margin:0; padding:8px 16px; background:#757575; font-size:13px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .tab { width:auto; margin:0; padding:9px 18px; background:#eee; color:#555;
         font-size:14px; font-weight:normal; }
  .tab.on { background:#2e7d32; color:#fff; font-weight:bold; }
  .count { font-size:13px; color:#666; margin-left:auto; }
  .sel { width:auto; padding:8px 10px; font-size:14px; border:1px solid #ddd;
         border-radius:7px; font-family:inherit; }

  .scroll { overflow-x:auto; }
  table.grid { border-collapse:collapse; font-size:12.5px; width:100%; table-layout:fixed; }
  table.grid th, table.grid td { border:1px solid #e0e6da; padding:0; }
  table.grid thead th { background:#f1f8e9; color:#33691e; padding:8px 4px; text-align:center; }
  .thname { font-weight:bold; font-size:13px; }
  .thkind { font-weight:normal; color:#7a8a6a; font-size:11px; }
  .hcol { width:104px; background:#fafdf7; text-align:center; padding:6px 2px; color:#5a6156; }
  .hno { font-weight:bold; color:#33691e; font-size:12px; }
  .htime { font-size:11.5px; white-space:nowrap; }
  td.cell { vertical-align:top; }
  td.free { background:#fcfdfb; }
  td.lunch { background:#f0f0ec; }
  .lunchtxt { color:#9aa294; font-size:11.5px; text-align:center; display:block; padding:16px 0; }

  .chip { display:block; padding:5px 6px; line-height:1.4; border-radius:4px; margin:2px; }
  .chip .nm { font-weight:bold; font-size:12.5px; }
  .chip .dur { font-size:11px; color:#5a6156; }
  .chip .warn { margin-top:3px; font-size:11px; font-weight:bold; color:#c62828; }

  /* 회차 한 줄 */
  .run { display:flex; align-items:center; gap:4px; font-size:12px;
         padding:3px 5px; margin-top:2px; border-radius:3px; cursor:pointer;
         background:rgba(255,255,255,.75); color:#5a6156; }
  .run:hover { outline:1px solid #9ccc65; }
  .run .no { font-weight:800; font-size:12.5px; color:#33691e; min-width:30px; }
  .run .dt { min-width:28px; text-align:right; }
  .run .st { margin-left:auto; font-weight:bold; }
  .r-done { background:#c8e6c9; color:#1b5e20; }
  .r-abs  { background:#ffcdd2; color:#b71c1c; }
  .r-mk   { background:#ffe0b2; color:#e65100; }
  .stabs  { margin-left:auto; font-weight:800; color:#b71c1c; font-size:11.5px;
            white-space:nowrap; }
  .mkbtn  { width:auto; margin:0 0 0 5px; padding:2px 7px; font-size:10.5px;
            font-weight:bold; background:#ef6c00; border-radius:10px;
            white-space:nowrap; }
  .mkbtn:hover { background:#e65100; }
  .mkinfo { margin-left:5px; font-size:10.5px; color:#e65100; font-weight:bold;
            white-space:nowrap; }
  .mkfrom { font-size:10.5px; color:#bf6000; margin-top:2px; }

  .sp1 { background:#e8f5e9; }
  .sp2 { background:#e3f2fd; }
  .sp3, .sp4 { background:#f3e5f5; }
  .sp5, .sp6, .sp7 { background:#fff8e1; }
  .sp0, .sp8, .sp9 { background:#f5f5f5; }

  /* 보강 잡기 창 */
  .panel { background:#fff3e0; border:1px solid #ffcc80; border-radius:10px;
           padding:16px 18px; margin-bottom:14px; }
  .panel-t { font-size:15px; font-weight:bold; color:#e65100; margin-bottom:10px; }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px 14px; }
  .pgrid label { font-size:12.5px; margin:0 0 4px; color:#555; }
  .pgrid input, .pgrid select { width:100%; padding:8px 10px; font-size:14px;
        border:1px solid #ddd; border-radius:6px; box-sizing:border-box; font-family:inherit; }
  .pbtns { margin-top:12px; display:flex; gap:8px; }
  .pbtn { width:auto; margin:0; padding:8px 16px; font-size:13.5px; }
  .grey { background:#9e9e9e; }

  .legend { font-size:12px; color:#7a8a6a; margin-top:12px; line-height:2.2; }
  .lg { display:inline-block; padding:2px 9px; border-radius:10px; margin-right:6px; }
  .note { font-size:12.5px; color:#888; margin-top:8px; line-height:1.9; }
</style>
</head>
<body>

<!-- 로그인 전 -->
<div class="box" id="loginBox">
  <h1>🌿 나무링크</h1>
  <div class="sub">시간표를 보려면 로그인하세요.</div>
  <label for="em">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com">
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 로그인 후 -->
<div class="wide" id="mainBox" style="display:none;">
  <div class="top">
    <div>
      <h1>🌿 시간표 <span id="monBig">　</span></h1>
      <div class="who" id="who"></div>
    </div>
    <button id="out" class="btn-out">로그아웃</button>
  </div>

  <div class="tools">
    <button class="tab" data-wd="월">월</button>
    <button class="tab" data-wd="화">화</button>
    <button class="tab" data-wd="수">수</button>
    <button class="tab" data-wd="목">목</button>
    <button class="tab" data-wd="금">금</button>
    <button class="tab" data-wd="토">토</button>
    <select id="mon" class="sel"></select>
    <span class="count" id="count"></span>
  </div>

  <div id="noSess" class="nosess" style="display:none;"></div>

  <!-- 보강 잡기 창 -->
  <div id="mkBox" class="panel" style="display:none;">
    <div class="panel-t" id="mkTitle"></div>
    <div class="pgrid">
      <div>
        <label for="mk_date">보강 날짜</label>
        <input id="mk_date" type="date">
      </div>
      <div>
        <label for="mk_slot">시간</label>
        <select id="mk_slot"></select>
      </div>
      <div>
        <label for="mk_th">치료사</label>
        <select id="mk_th"></select>
      </div>
      <div>
        <label for="mk_memo">메모</label>
        <input id="mk_memo" type="text" placeholder="예: 보호자 요청">
      </div>
    </div>
    <div class="pbtns">
      <button id="mkSave" class="pbtn">보강 잡기</button>
      <button id="mkDel"  class="pbtn grey">보강 취소</button>
      <button id="mkClose" class="pbtn grey">닫기</button>
    </div>
    <div id="mkMsg" class="out"></div>
  </div>

  <div class="scroll">
    <table class="grid">
      <thead id="ghead"></thead>
      <tbody id="gbody"></tbody>
    </table>
  </div>

  <div class="legend">
    <span class="lg sp1">센터비용</span>
    <span class="lg sp2">발달재활</span>
    <span class="lg sp3">치료지원</span>
    <span class="lg sp5">방과후</span>
    &nbsp;&nbsp;회차 상태 —
    <span class="lg" style="background:rgba(0,0,0,.06);">예정</span>
    <span class="lg r-done">완료</span>
    <span class="lg r-abs">결석</span>
    <span class="lg r-mk">보강</span>
  </div>
  <div class="note">
    회차를 <b>누를 때마다</b> 예정 → 완료 → 결석 → 예정 순으로 바뀝니다.
    결석은 <b>두 번</b> 눌러야 나옵니다.<br>
    결석이 되면 옆에 주황색 <b>보강 잡기</b> 단추가 생깁니다.
    눌러서 날짜·시간·치료사를 정하면, <b>그 날짜 칸에 보강 수업이 만들어집니다.</b><br>
    빈 칸이 그 치료사의 빈 시간입니다. 5교시는 주중 점심(보강 가능)입니다.<br>
    수업분은 50분·60분만 적습니다.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
const sb = window.supabase.createClient(URL_, KEY_);
const $  = id => document.getElementById(id);

const SLOTS = [
  { no:1,  t:'9:00~9:40',   m:9*60,      hm:'09:00' },
  { no:2,  t:'9:50~10:30',  m:9*60+50,   hm:'09:50' },
  { no:3,  t:'10:40~11:20', m:10*60+40,  hm:'10:40' },
  { no:4,  t:'11:30~12:10', m:11*60+30,  hm:'11:30' },
  { no:5,  t:'12:20~13:00', m:12*60+20,  hm:'12:20' },
  { no:6,  t:'13:30~14:10', m:13*60+30,  hm:'13:30' },
  { no:7,  t:'14:20~15:00', m:14*60+20,  hm:'14:20' },
  { no:8,  t:'15:10~15:50', m:15*60+10,  hm:'15:10' },
  { no:9,  t:'16:00~16:40', m:16*60,     hm:'16:00' },
  { no:10, t:'16:50~17:30', m:16*60+50,  hm:'16:50' },
  { no:11, t:'17:40~18:20', m:17*60+40,  hm:'17:40' },
  { no:12, t:'18:30~19:10', m:18*60+30,  hm:'18:30' },
  { no:13, t:'19:20~20:00', m:19*60+20,  hm:'19:20' }
];
const LUNCH_NO = 5;
const WDS = ['일','월','화','수','목','금','토'];

const TTYPE = {1:'언어',2:'작업',3:'전산',4:'감통',5:'음악',6:'일상'};
const STYPE = {1:'센',2:'발',3:'치',4:'치',5:'방',6:'방치',7:'방치',8:'발추',9:'평가'};
const NEXT  = { '예정':'완료', '완료':'결석', '결석':'예정' };

const CAN_SEE = [1,2,3,4,5,6,7,8,9];

let ROWS = [];          // 수업(요일) 전체
let THS  = [];          // 치료사 1~7
let SESS = [];          // 그 달 회차 전체
let BAL  = new Set();   // 그 달 발추 아동
let wd = '월', mon = '';
let mkSess = null;      // 지금 보강 잡는 결석 회차

function show(t, ok){ $('msg').textContent=t; $('msg').className='out '+(ok?'ok':'err'); }
function mkmsg(t, ok){ $('mkMsg').textContent=t; $('mkMsg').className='out '+(ok?'ok':'err'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toMin(t){ if(!t) return null; const p=String(t).split(':'); return Number(p[0])*60+Number(p[1]||0); }
function nearest(m){ if(m==null) return SLOTS[0];
  let b=SLOTS[0],g=1e9; SLOTS.forEach(s=>{const x=Math.abs(s.m-m); if(x<g){g=x;b=s;}}); return b; }
function monNo(k){ return Number(String(k).split('-')[1]); }
function dayNo(d){ return Number(String(d).split('-')[2]); }
function wdOf(d){ const p=String(d).split('-'); return WDS[new Date(p[0],p[1]-1,p[2]).getDay()]; }
function countWd(k, w){
  const p=String(k).split('-'), y=Number(p[0]), m=Number(p[1]);
  const i=WDS.indexOf(w); let n=0; const d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){ if(d.getDay()===i) n++; d.setDate(d.getDate()+1); }
  return n;
}

function drawHead(){
  $('ghead').innerHTML = '<tr><th class="hcol">교시</th>'
    + THS.map(t=>'<th><div class="thname">'+esc(t.name)+'</div>'
        + '<div class="thkind">'+t.id+'번</div></th>').join('') + '</tr>';
}

function draw(){
  const day = ROWS.filter(r => r.weekday === wd);
  $('monBig').textContent = monNo(mon) + '월';
  $('count').textContent = wd+'요일 수업 '+day.length+'건 · '
    + monNo(mon)+'월에 '+countWd(mon,wd)+'번';

  if (!SESS.length) {
    $('noSess').style.display = 'block';
    $('noSess').innerHTML = '<b>' + monNo(mon) + '월은 회차가 아직 없습니다.</b> '
      + '그래서 9-1 같은 회차 번호가 안 나옵니다. '
      + '위 달 고르는 칸에서 회차를 깔아둔 달을 고르세요.';
  } else {
    $('noSess').style.display = 'none';
  }

  // 회차를 수업별로 모으기
  const byScd = {};
  SESS.forEach(s => {
    if (s.status === '보강') return;
    (byScd[s.schedule_id] = byScd[s.schedule_id] || []).push(s);
  });
  Object.values(byScd).forEach(a => a.sort((x,y)=>x.run_no-y.run_no));

  // 결석 -> 보강 잇기
  const mkOf = {};
  SESS.forEach(s => { if (s.status === '보강' && s.makeup_for) mkOf[s.makeup_for] = s; });

  // 고정 수업을 칸에 담기
  const cell = {};
  day.forEach(r => {
    const k = nearest(toMin(r.start_time)).no + '_' + r.therapist_id;
    (cell[k] = cell[k] || []).push(r);
  });

  // 이 요일에 놓인 보강을 칸에 담기
  const mkCell = {};
  SESS.forEach(s => {
    if (s.status !== '보강' || !s.plan_date) return;
    if (wdOf(s.plan_date) !== wd) return;
    const k = nearest(toMin(s.start_time)).no + '_' + s.therapist_id;
    (mkCell[k] = mkCell[k] || []).push(s);
  });

  const isSat = (wd === '토');
  const colW = 'width:' + Math.floor(88/Math.max(THS.length,1)) + '%';

  $('gbody').innerHTML = SLOTS.map(s => {
    const lunch = (!isSat && s.no === LUNCH_NO);
    return '<tr>'
      + '<td class="hcol"><div class="hno">'+s.no+'교시</div>'
        + '<div class="htime">'+s.t+'</div>'
        + (lunch ? '<div class="thkind">점심</div>' : '') + '</td>'
      + THS.map(t => {
          const key  = s.no+'_'+t.id;
          const list = cell[key] || [];
          const mks  = mkCell[key] || [];
          if (!list.length && !mks.length) {
            return '<td class="cell '+(lunch?'lunch':'free')+'" style="'+colW+'">'
              + (lunch ? '<span class="lunchtxt">점심 / 보강</span>' : '') + '</td>';
          }
          let html = '';
          list.forEach(r => {
            const sp  = 'sp' + (r.support_type_id || 0);
            const dur = (r.duration && Number(r.duration)!==40)
                        ? ' <span class="dur">'+r.duration+'분</span>' : '';
            const runs = (byScd[r.id] || []).map(x => {
              const cls = x.status==='완료' ? 'r-done'
                        : x.status==='결석' ? 'r-abs' : '';
              const mk = mkOf[x.id];
              let tail;
              if (x.status === '결석') {
                tail = '<span class="stabs">🔴 결석</span>'
                  + (mk
                    ? '<span class="mkinfo">→ ' + dayNo(mk.plan_date) + '일 '
                      + nearest(toMin(mk.start_time)).hm + '</span>'
                    : '<button class="mkbtn" data-mk="'+x.id+'">보강 잡기</button>');
              } else {
                tail = '<span class="st">'+x.status+'</span>';
              }
              return '<div class="run '+cls+'" data-sid="'+x.id+'">'
                + '<span class="no">'+monNo(mon)+'-'+x.run_no+'</span>'
                + '<span class="dt">'+dayNo(x.plan_date)+'일</span>'
                + tail + '</div>';
            }).join('');
            const need5 = BAL.has(r._cid) && r.support_type_id === 2;
            const warn = (need5 && (byScd[r.id]||[]).length < 5)
              ? '<div class="warn">발추 5회차 보강 필요</div>' : '';
            html += '<span class="chip '+sp+'">'
              + '<span class="nm">'+(STYPE[r.support_type_id]||'?')
              + (r._tt===3 ? '(전산)' : ' ')+esc(r._name)+'</span>'+dur
              + runs + warn + '</span>';
          });
          mks.forEach(x => {
            const org = ROWS.find(r => r.id === x.schedule_id);
            const nmtxt = (org ? (STYPE[org.support_type_id]||'?')
                                 + (org._tt===3 ? '(전산)' : ' ') : '')
                          + esc(x._name||'');
            const from = SESS.find(y => y.id === x.makeup_for);
            html += '<span class="chip r-mk">'
              + '<span class="nm">🔁 '+nmtxt+'</span>'
              + '<div class="run r-mk" data-sid="'+x.id+'">'
              + '<span class="no">'+monNo(mon)+'-'+x.run_no+'</span>'
              + '<span class="dt">'+dayNo(x.plan_date)+'일</span>'
              + '<span class="st">보강</span></div>'
              + (from ? '<div class="mkfrom">'+dayNo(from.plan_date)+'일 결석분</div>' : '')
              + '</span>';
          });
          return '<td class="cell" style="'+colW+'">'+html+'</td>';
        }).join('')
      + '</tr>';
  }).join('');
}

// ===== 회차 누르기 =====
$('gbody').addEventListener('click', async e => {
  const mkb = e.target.closest('.mkbtn');
  if (mkb) { e.stopPropagation(); openMk(Number(mkb.dataset.mk)); return; }
  const el = e.target.closest('.run');
  if (!el) return;
  const id = Number(el.dataset.sid);
  const s  = SESS.find(x => x.id === id);
  if (!s) return;
  if (s.status === '보강') { openMk(s.makeup_for); return; }

  const nx = NEXT[s.status] || '완료';
  const { error } = await sb.from('nl_sessions')
    .update({ status: nx, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('바꾸지 못했습니다.\n' + error.message); return; }
  s.status = nx;
  draw();
});

// ===== 보강 잡기 =====
function openMk(absId){
  const s = SESS.find(x => x.id === absId);
  if (!s) return;
  mkSess = s;
  const has = SESS.find(x => x.status==='보강' && x.makeup_for === absId);
  $('mkTitle').textContent = (s._name||'') + ' · ' + monNo(mon)+'-'+s.run_no
    + ' (' + dayNo(s.plan_date) + '일 결석) 보강';
  $('mk_date').value = has ? has.plan_date : '';
  $('mk_slot').value = has ? String(nearest(toMin(has.start_time)).no)
                           : String(nearest(toMin(s.start_time)).no);
  $('mk_th').value   = String(has ? has.therapist_id : s.therapist_id);
  $('mk_memo').value = has ? (has.memo || '') : '';
  $('mkDel').style.display = has ? '' : 'none';
  mkmsg('', true); $('mkMsg').className = 'out';
  $('mkBox').style.display = 'block';
  $('mkBox').scrollIntoView({ behavior:'smooth', block:'center' });
}
$('mkClose').onclick = () => { $('mkBox').style.display='none'; mkSess=null; };

$('mkSave').onclick = async () => {
  if (!mkSess) return;
  const d = $('mk_date').value;
  if (!d) { mkmsg('보강 날짜를 고르세요.', false); return; }
  const slot = SLOTS.find(x => x.no === Number($('mk_slot').value));
  const th   = Number($('mk_th').value);

  // 그 칸이 이미 찼는지 살펴본다
  const dw = wdOf(d);
  const taken = ROWS.filter(r => r.therapist_id === th && r.weekday === dw
                  && nearest(toMin(r.start_time)).no === slot.no);
  const takenMk = SESS.filter(s => s.status === '보강' && s.plan_date === d
                  && s.therapist_id === th
                  && nearest(toMin(s.start_time)).no === slot.no
                  && s.makeup_for !== mkSess.id);
  if (taken.length || takenMk.length) {
    if (!confirm('그 시간에 이미 ' + (taken.length + takenMk.length)
        + '건이 있습니다.\n그래도 보강을 넣을까요?')) return;
  }

  const row = {
    child_id:   mkSess.child_id,
    therapy_id: mkSess.therapy_id,
    schedule_id: mkSess.schedule_id,
    month_key:  mon,
    run_no:     mkSess.run_no,
    plan_date:  d,
    status:     '보강',
    therapist_id: th,
    start_time: slot.hm + ':00',
    makeup_for: mkSess.id,
    memo:       $('mk_memo').value.trim() || null
  };

  $('mkSave').disabled = true; $('mkSave').textContent = '저장 중...';
  try {
    const old = SESS.find(x => x.status==='보강' && x.makeup_for === mkSess.id);
    let data, error;
    if (old) {
      ({ data, error } = await sb.from('nl_sessions')
        .update(row).eq('id', old.id).select().single());
      if (error) throw error;
      Object.assign(old, data);
    } else {
      ({ data, error } = await sb.from('nl_sessions').insert(row).select().single());
      if (error) throw error;
      data._name = mkSess._name;
      SESS.push(data);
    }
    mkmsg('✅ 보강을 ' + dayNo(d) + '일 ' + slot.hm + '으로 잡았습니다.', true);
    $('mkDel').style.display = '';
    draw();
  } catch (e) {
    mkmsg('❌ 저장하지 못했습니다.\n' + e.message, false);
  } finally {
    $('mkSave').disabled = false; $('mkSave').textContent = '보강 잡기';
  }
};

$('mkDel').onclick = async () => {
  if (!mkSess) return;
  const old = SESS.find(x => x.status==='보강' && x.makeup_for === mkSess.id);
  if (!old) { mkmsg('취소할 보강이 없습니다.', false); return; }
  if (!confirm('이 보강을 취소할까요?')) return;
  const { error } = await sb.from('nl_sessions').delete().eq('id', old.id);
  if (error) { mkmsg('❌ 취소하지 못했습니다.\n' + error.message, false); return; }
  SESS = SESS.filter(x => x.id !== old.id);
  mkmsg('✅ 보강을 취소했습니다.', true);
  $('mkDel').style.display = 'none';
  draw();
};

// ===== 자료 불러오기 =====
async function loadMonth(){
  BAL = new Set();
  const { data: pay } = await sb.from('nl_payments')
    .select('child_id').eq('support_type_id', 8).eq('month_key', mon);
  if (pay) pay.forEach(p => BAL.add(p.child_id));

  const { data, error } = await sb.from('nl_sessions')
    .select('id, child_id, therapy_id, schedule_id, month_key, run_no, plan_date, status, therapist_id, start_time, makeup_for, memo')
    .eq('month_key', mon);
  SESS = error ? [] : (data || []);
  const nameOf = {}; ROWS.forEach(r => nameOf[r._cid] = r._name);
  SESS.forEach(s => s._name = nameOf[s.child_id] || '');
}

async function afterLogin(user){
  const { data: me, error: e1 } = await sb.from('nl_therapists')
    .select('id, name, role').eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (e1)  { show('❌ 직원 조회 실패\n'+e1.message, false); return; }
  if (!me) { show('⚠️ 직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.', false); return; }
  if (CAN_SEE.indexOf(me.id) < 0) { show('이 화면을 볼 권한이 없습니다.', false); return; }

  const { data: ths } = await sb.from('nl_therapists').select('id, name').lte('id',7).order('id');
  THS = ths || [];

  const { data: sc, error: e3 } = await sb.from('nl_therapy_schedules')
    .select('id, therapy_id, weekday, start_time, therapist_id, duration');
  if (e3) { show('❌ 시간표 조회 실패\n'+e3.message, false); return; }
  const { data: tp } = await sb.from('nl_therapies')
    .select('id, child_id, therapy_type_id, support_type_id');
  const { data: kids } = await sb.from('nl_children')
    .select('id, name, status').eq('status','치료중');

  const tpMap={}; (tp||[]).forEach(x=>tpMap[x.id]=x);
  const kdMap={}; (kids||[]).forEach(x=>kdMap[x.id]=x);
  ROWS = (sc||[]).map(r=>{
    const t=tpMap[r.therapy_id]; if(!t) return null;
    const k=kdMap[t.child_id];   if(!k) return null;
    r._cid=t.child_id; r._tt=t.therapy_type_id;
    r.support_type_id=t.support_type_id; r._name=k.name;
    return r;
  }).filter(Boolean);

  // 달 목록
  const now = new Date();
  let opts='';
  for (let k=6; k>=-1; k--){
    const d=new Date(now.getFullYear(), now.getMonth()-k, 1);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    opts += '<option value="'+key+'">'+key+'</option>';
  }
  $('mon').innerHTML = opts;
  mon = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  $('mon').value = mon;

  $('mk_slot').innerHTML = SLOTS.map(s=>'<option value="'+s.no+'">'+s.t+'</option>').join('');
  $('mk_th').innerHTML   = THS.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('');

  await loadMonth();

  // 이번 달에 회차가 없으면 다음 달로 옮겨 본다
  if (!SESS.length) {
    const d2 = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const nk = d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0');
    const save = mon;
    mon = nk;
    await loadMonth();
    if (SESS.length) { $('mon').value = nk; }
    else { mon = save; $('mon').value = save; await loadMonth(); }
  }

  const nm = WDS[new Date().getDay()];
  wd = (nm==='일') ? '월' : nm;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.wd===wd));

  $('who').textContent = me.name+' ('+me.role+') 님으로 로그인됨';
  $('loginBox').style.display='none';
  $('mainBox').style.display='block';
  drawHead(); draw();
}

$('mon').onchange = async () => { mon=$('mon').value; $('mkBox').style.display='none';
  await loadMonth(); draw(); };
document.querySelectorAll('.tab').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); wd=b.dataset.wd; draw(); };
});

$('btn').onclick = async () => {
  const email=$('em').value.trim().toLowerCase(), pw=$('pw').value;
  if(!email||!pw){ show('이메일과 비밀번호를 모두 입력하세요.', false); return; }
  $('btn').disabled=true; $('btn').textContent='로그인 중...';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if(error) throw error;
    await afterLogin(data.user);
  }catch(e){ show('❌ 로그인 실패\n'+e.message, false); }
  finally{ $('btn').disabled=false; $('btn').textContent='로그인'; }
};
$('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') $('btn').click(); });

(async()=>{ const { data } = await sb.auth.getSession();
  if (data.session) await afterLogin(data.session.user); })();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규 아동 관리 (문의, 대기, 평가) - 나무링크</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; background:#f5f9f0;
         margin:0; padding:24px; color:#333; }
  .box { max-width:460px; margin:40px auto; background:#fff; border-radius:12px;
         padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .wide { max-width:1100px; margin:20px auto; background:#fff; border-radius:12px;
          padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:20px; color:#2e7d32; margin:0 0 4px; }
  .sub { font-size:13px; color:#888; margin-bottom:22px; }
  label { display:block; font-size:13px; font-weight:bold; margin:14px 0 5px; }
  input, select, textarea { width:100%; padding:11px; border:1px solid #ddd; border-radius:7px;
          font-size:15px; box-sizing:border-box; font-family:inherit; }
  button { width:100%; padding:13px; margin-top:20px; background:#2e7d32; color:#fff;
           border:none; border-radius:7px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { background:#bbb; cursor:default; }
  .out { margin-top:20px; padding:14px; border-radius:8px; font-size:14px;
         line-height:1.7; display:none; white-space:pre-wrap; word-break:break-all; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }

  .top { display:flex; justify-content:space-between; align-items:center;
         flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .who { font-size:13px; color:#666; }
  .btn-out { width:auto; margin:0; padding:8px 16px; background:#757575; font-size:13px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .tab { width:auto; margin:0; padding:8px 14px; background:#eee; color:#555;
         font-size:13px; font-weight:normal; }
  .tab.on { background:#2e7d32; color:#fff; font-weight:bold; }
  .count { font-size:13px; color:#666; margin-left:auto; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { background:#f1f8e9; color:#33691e; padding:10px 8px; text-align:left;
       border-bottom:2px solid #c5e1a5; font-size:13px; white-space:nowrap; }
  td { padding:10px 8px; border-bottom:1px solid #eee; vertical-align:middle; }
  tr:hover td { background:#fafdf7; }
  .empty { padding:40px; text-align:center; color:#999; font-size:14px; }
  .idcell { color:#8d6e63; font-weight:bold; white-space:nowrap; width:50px; }
  .nowrap { white-space:nowrap; }

  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px;
           white-space:nowrap; }
  .s-wait { background:#fff8e1; color:#e65100; }
  .s-eval { background:#e3f2fd; color:#0d47a1; }
  .s-seat { background:#f3e5f5; color:#6a1b9a; }
  .s-go   { background:#e8f5e9; color:#1b5e20; }
  .s-end  { background:#eceff1; color:#546e7a; }

  /* 오늘 확인할 건 */
  .alert { background:#fff3e0; border:1px solid #ffcc80; border-radius:10px;
           padding:16px 18px; margin-bottom:18px; }
  .alert-t { font-size:15px; font-weight:bold; color:#e65100; margin-bottom:10px; }
  .alert-line { font-size:14px; padding:6px 0; border-bottom:1px dashed #ffcc80;
                cursor:pointer; }
  .alert-line:last-child { border-bottom:none; }
  .alert-line:hover { color:#bf360c; }
  .late { color:#c62828; font-weight:bold; }

  /* 등록 창 · 상세 창 */
  .panel { background:#f1f8e9; border:1px solid #c5e1a5; border-radius:10px;
           padding:18px; margin-bottom:18px; }
  .panel-t { font-size:15px; font-weight:bold; color:#33691e; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
          gap:10px 14px; }
  .grid label { font-size:12.5px; font-weight:bold; margin:0 0 4px; color:#555; }
  .grid input, .grid select, .grid textarea { width:100%; padding:8px 10px; font-size:14px;
          border:1px solid #ddd; border-radius:6px; box-sizing:border-box; }
  .btns { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .hint { font-size:12px; color:#7cb342; margin-top:4px; }

  /* 상담 기록 */
  .logbox { background:#fff; border:1px solid #ddd; border-radius:8px;
            padding:14px; margin-top:14px; }
  .logbox-t { font-size:14px; font-weight:bold; color:#555; margin-bottom:10px; }
  .logrow { font-size:13.5px; padding:8px 0; border-bottom:1px solid #f0f0f0;
            line-height:1.6; }
  .logrow:last-child { border-bottom:none; }
  .logdate { color:#8d6e63; font-weight:bold; margin-right:8px; }
  .logway { display:inline-block; background:#eee; color:#666; border-radius:9px;
            padding:1px 8px; font-size:11.5px; margin-right:8px; }
  .logwho { color:#999; font-size:12px; margin-left:6px; }
  .lognone { color:#999; font-size:13px; padding:8px 0; }
  .openbtn { width:auto; margin:0; padding:5px 12px; background:#8bc34a;
             font-size:12.5px; font-weight:bold; }

  .btn-home { display:inline-block; padding:8px 16px; background:#2e7d32; color:#fff;
              font-size:13px; border-radius:8px; text-decoration:none;
              white-space:nowrap; margin-right:8px; }
  .btn-home:hover { filter:brightness(1.08); }

  /* 평가 관리 — 아동 이름 고르기 */
  .kidlist { position:absolute; z-index:30; left:0; right:0; top:100%;
             background:#fff; border:1px solid #cfd8dc; border-radius:8px;
             max-height:220px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,.12); }
  .kidone { padding:9px 12px; font-size:14px; cursor:pointer; border-bottom:1px solid #f0f0f0; }
  .kidone:last-child { border-bottom:none; }
  .kidone:hover { background:#eef3ec; }
  .kidone .st { font-size:12px; color:#888; margin-left:6px; }
  .kidnone { padding:10px 12px; font-size:13px; color:#999; }
  .kidpick { margin-top:6px; font-size:13.5px; color:#2e7d32; min-height:20px; }
  .kidpick b { font-size:14.5px; }
  .re { display:inline-block; background:#fff3e0; color:#e65100; border-radius:10px;
        padding:1px 8px; font-size:11.5px; font-weight:bold; margin-left:6px; }
  .evrow { display:flex; gap:10px; align-items:center; font-size:13.5px;
           padding:7px 0; border-bottom:1px dashed #e0e0e0; flex-wrap:wrap; }
  .evrow:last-child { border-bottom:none; }
  .evrow .d { color:#555; }
  .evrow .amt { margin-left:auto; font-weight:bold; }
  .evedit { width:auto; margin:0; padding:3px 10px; font-size:11.5px;
            background:#5c6bc0; color:#fff; border:none; border-radius:5px; cursor:pointer; }
  .evtools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .evtools input[type=month] { width:auto; padding:6px 9px; font-size:13px; }
  .evtab { width:auto; margin:0; padding:6px 12px; font-size:12.5px; background:#fff;
           color:#5a6156; border:1px solid #cfd8dc; border-radius:7px; cursor:pointer; }
  .evtab.on { background:#5c6bc0; color:#fff; border-color:#5c6bc0; }
  .evsum { margin-left:auto; font-size:13px; color:#666; }
  .evrow .kn { font-weight:bold; min-width:70px; }
  .evrow .unpaid { color:#c62828; font-weight:bold; }
</style>
</head>
<body>

<!-- 로그인 전 화면 -->
<div class="box" id="loginBox">
  <h1>🌿 나무링크</h1>
  <div class="sub">신규 아동 관리 화면입니다. 로그인하세요.</div>

  <label for="em">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com">

  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">

  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 로그인 후 화면 -->
<div class="wide" id="listBox" style="display:none;">
  <div class="top">
    <div>
      <h1>🌿 신규 아동 관리 (문의, 대기, 평가)</h1>
      <div class="who" id="who"></div>
    </div>
    <a href="index.html" class="btn-home">🌿 처음으로</a>
    <button id="out" class="btn-out">로그아웃</button>
  </div>

  <!-- 오늘 확인할 건 -->
  <div class="alert" id="alertBox" style="display:none;">
    <div class="alert-t" id="alertTitle"></div>
    <div id="alertRows"></div>
  </div>

  <div class="tools">
    <button class="tab on" data-st="전체">전체</button>
    <button class="tab" data-st="연락대기">연락대기</button>
    <button id="wlBtn" class="tab" style="background:#00695c;color:#fff;font-weight:bold;">⏳ 자리 대기 명단</button>
    <button class="tab" data-st="그룹대기">그룹대기</button>
    <button id="wlGBtn" class="tab" style="background:#5c6bc0;color:#fff;font-weight:bold;">👥 그룹 대기 명단</button>
    <span class="count" id="count"></span>
  </div>

  <!-- 새 문의 등록 창 -->
  <div id="addBox" class="panel" style="display:block;">
    <div class="panel-t">새 문의 등록</div>
    <div class="grid">
      <div style="grid-column:1 / -1;">
        <label for="k_name" style="display:flex;justify-content:space-between;align-items:baseline;">
          <span>아동 이름 <span style="color:#c62828;">*</span></span>
          <span style="color:#1c1f1a;font-weight:600;">문의일 : <span id="dateTxt"></span></span>
        </label>
        <input id="k_name" type="text" autocomplete="off" placeholder="이름을 넣으세요">
        <div id="dupWarn" style="display:none;margin-top:6px;padding:9px 11px;
             border-radius:6px;background:#fff8e1;border:1px solid #f0c36d;
             color:#8a6116;font-size:13px;line-height:1.6;"></div>
      </div>
      <div>
        <label for="k_birth">생년월일</label>
        <input id="k_birth" type="date">
      </div>
      <div>
        <label for="k_gender">성별</label>
        <select id="k_gender">
          <option value="">-- 고르기 --</option>
          <option value="남">남</option>
          <option value="여">여</option>
        </select>
      </div>
      <div>
        <label for="k_status">아동 상태 <span style="color:#c62828;">*</span></label>
        <select id="k_status">
          <option value="대기중">대기중</option>
          <option value="치료중">치료중</option>
        </select>
      </div>
      <div>
        <label for="k_guardian">보호자</label>
        <input id="k_guardian" type="text" placeholder="예: 모">
      </div>
      <div>
        <label for="k_phone">연락처</label>
        <input id="k_phone" type="text" placeholder="010-0000-0000">
      </div>
      <div>
        <label for="a_channel">유입경로</label>
        <input id="a_channel" type="text" placeholder="전화 / 네이버 / 소개 등">
      </div>
      <div>
        <label for="a_status">문의 상태 <span style="color:#c62828;">*</span></label>
        <select id="a_status"></select>
      </div>
      <div>
        <label for="a_next">다음 확인 날짜</label>
        <input id="a_next" type="date">
      </div>
      <div>
        <label for="a_action">다음 할 일</label>
        <input id="a_action" type="text" placeholder="예: 보호자에게 다시 전화">
      </div>

      <div style="grid-column:1 / -1;">
        <label for="k_memo">상담 내용</label>
        <textarea id="k_memo" rows="7" style="font:inherit;font-size:14px;padding:9px 11px;
          border:1px solid #ddd;border-radius:6px;width:100%;line-height:1.7;resize:vertical;"
          placeholder="희망영역 : 언어치료, 감각통합&#10;희망요일 : 화·목 / 금도 가능&#10;희망시간 : 오후 4시 이후, 수요일은 3시부터&#10;아동특징 : 낯가림 심함. 발화 거의 없음&#10;기타 : 형제도 함께 상담 원함">희망영역 : 
희망요일 : 
희망시간 : 
아동특징 : 
기타 : </textarea>
        <div class="hint">희망요일·시간은 여러 개 적어두면 빈 자리 찾기가 쉬워집니다.</div>
      </div>
      <div style="grid-column:1 / -1; border-top:2px solid #cfe0d0;
                  margin-top:14px; padding-top:14px;">
        <label style="display:flex; align-items:center; gap:10px;">
          <span>평가 (받은 것이 있으면 넣으세요. 없으면 비워두면 됩니다)</span>
          <button type="button" id="nvAdd" class="tab"
                  style="background:#fff8e1;border-color:#f0c36d;color:#8a6116;
                         font-weight:600;padding:5px 12px;">＋ 평가 줄 추가</button>
        </label>
        <div id="nvRows"></div>
      </div>
      <input id="a_child" type="hidden">
      <input id="a_date" type="hidden">
      <input id="a_area" type="hidden">
      <input id="a_day" type="hidden">
      <input id="a_time" type="hidden">
      <input id="a_memo" type="hidden">
    </div>
    <div class="btns">
      <button id="saveNew" class="tab" style="background:#2e7d32;color:#fff;font-weight:bold;">등록하기</button>
      <button id="cancelNew" class="tab" style="display:none;">취소</button>
    </div>
    <div id="msgA" class="out"></div>
  </div>

  <!-- 자리 대기 명단 창 -->
  <div id="wlBox" class="panel" style="display:none;">
    <div class="panel-t" id="wlTitle">자리 대기 명단</div>

    <div class="grid">
      <div style="grid-column:1 / -1; position:relative;">
        <label for="w_kidq">아동 <span style="color:#c62828;">*</span>
          <span style="font-weight:normal;color:#888;">— 이름을 치면 목록이 뜹니다 (신규·등록 아동 모두)</span></label>
        <input id="w_kidq" type="text" placeholder="이름 두 글자만 쳐도 됩니다" autocomplete="off">
        <div id="w_kidlist" class="kidlist" style="display:none;"></div>
        <div id="w_kidpick" class="kidpick"></div>
      </div>

      <div id="w_groupWrap" style="grid-column:1 / -1; display:none;">
        <label for="w_group">그룹 이름
          <span style="font-weight:normal;color:#888;">— 예: 사회성그룹 / 언어그룹</span></label>
        <input id="w_group" type="text" placeholder="어떤 그룹을 기다리는지 적으세요" autocomplete="off">
      </div>

      <div style="grid-column:1 / -1;">
        <label>희망 요일·시간 <span style="font-weight:normal;color:#888;">— 최대 5개</span></label>
        <div id="w_slots"></div>
        <button id="w_addslot" type="button" class="tab"
          style="margin-top:6px;padding:4px 10px;font-size:12px;">＋ 시간 추가</button>
      </div>

      <div>
        <label for="w_status">상태 <span style="color:#c62828;">*</span></label>
        <select id="w_status">
          <option value="대기중">대기중</option>
          <option value="보류">보류</option>
          <option value="배정됨">배정됨</option>
        </select>
      </div>
      <div>
        <label for="w_contact">마지막 연락일</label>
        <input id="w_contact" type="date">
      </div>
      <div style="grid-column:1 / -1;">
        <label for="w_memo">연락 결과 · 메모</label>
        <input id="w_memo" type="text" placeholder="예: 9월부터 가능하다고 함 / 다른 기관 정리 후 연락 주기로">
      </div>
    </div>

    <div class="btns">
      <button id="w_save" class="tab"
        style="background:#00695c;color:#fff;font-weight:bold;">저장</button>
      <button id="w_del" class="tab" style="color:#c62828;">이 아동 대기 취소</button>
      <button id="w_close" class="tab">닫기</button>
    </div>
    <div id="msgW" class="out"></div>

    <div style="margin-top:16px;">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">
        <button class="wltab tab on" data-wl="전체">전체</button>
        <button class="wltab tab" data-wl="대기중">대기중</button>
        <button class="wltab tab" data-wl="보류">보류</button>
        <button class="wltab tab" data-wl="배정됨">배정됨</button>
        <span class="count" id="wlCount"></span>
      </div>
      <div id="wlRows"></div>
    </div>
  </div>

  <!-- 평가 관리 창 -->
  <div id="evBox" class="panel" style="display:none;">
    <div class="panel-t">평가 예약 · 기록</div>

    <div class="grid">
      <div style="grid-column:1 / -1; position:relative;">
        <label for="e_kidq">아동 <span style="color:#c62828;">*</span>
          <span style="font-weight:normal;color:#888;">— 이름을 치면 목록이 뜹니다</span></label>
        <input id="e_kidq" type="text" placeholder="이름 두 글자만 쳐도 됩니다" autocomplete="off">
        <div id="e_kidlist" class="kidlist" style="display:none;"></div>
        <div id="e_kidpick" class="kidpick"></div>
      </div>

      <div>
        <label for="e_date">평가 날짜 <span style="color:#c62828;">*</span></label>
        <input id="e_date" type="date">
      </div>
      <div>
        <label for="e_time">평가 시간</label>
        <input id="e_time" type="time">
      </div>
      <div>
        <label for="e_type">평가 종류</label>
        <select id="e_type"></select>
      </div>
      <div>
        <label for="e_cnt">평가 개수</label>
        <select id="e_cnt">
          <option value="1">1개</option>
          <option value="2">2개</option>
          <option value="3">3개</option>
        </select>
      </div>
      <div>
        <label for="e_thr">담당 치료사</label>
        <select id="e_thr"></select>
      </div>
      <div>
        <label for="e_fee">평가비 <span style="font-weight:normal;color:#888;">— 자동, 고칠 수 있음</span></label>
        <input id="e_fee" type="text" inputmode="numeric" placeholder="0">
      </div>
      <div>
        <label for="e_status">상태</label>
        <select id="e_status">
          <option value="예정">예정</option>
          <option value="완료">완료</option>
          <option value="취소">취소</option>
        </select>
      </div>
      <div>
        <label for="e_paid">납부일</label>
        <input id="e_paid" type="date">
      </div>
      <div>
        <label for="e_card">카드 승인번호</label>
        <input id="e_card" type="text" placeholder="평가일에 받으면 기재">
      </div>
      <div style="grid-column:1 / -1;">
        <label for="e_memo">메모</label>
        <input id="e_memo" type="text" placeholder="예: 타기관 보고서 제출">
      </div>
    </div>

    <div class="btns">
      <button id="evSave" class="tab" style="background:#5c6bc0;color:#fff;font-weight:bold;">저장</button>
      <button id="evNew"  class="tab">새로 넣기</button>
      <button id="evClose" class="tab">닫기</button>
    </div>
    <div id="msgE" class="out"></div>

    <div class="logbox">
      <div class="logbox-t">평가 목록</div>
      <div class="evtools">
        <input id="e_mon" type="month">
        <button class="evtab on" data-ev="all">전체</button>
        <button class="evtab" data-ev="예정">예정</button>
        <button class="evtab" data-ev="완료">완료</button>
        <button class="evtab" data-ev="unpaid">미납만</button>
        <button class="evtab" data-ev="kid">고른 아동만</button>
        <span class="evsum" id="evSum"></span>
      </div>
      <div id="evRows"></div>
    </div>
  </div>

  <!-- 상세 · 수정 창 -->

// 틀만 있고 실제로 적은 내용이 없으면 빈 값으로 저장한다

// ===== 평가 관리 =====
let EVTYPES = [];    // 평가 종류 (심리·발달·언어)
let EVFEES  = [];    // 평가비 기준 (nl_eval_fees)
let THRS    = [];    // 치료사 목록
let EVALS   = [];    // 평가 기록
let evKid   = null;  // 지금 고른 아동
let evEditId = null; // 고치는 중인 평가 번호

}
function showBox(id, text, ok) {
  $(id).textContent = text;
  $(id).className = 'out ' + (ok ? 'ok' : 'err');
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// 오늘 날짜를 2026-08-14 모양으로
function today() {
  const t = new Date();
  const p = n => String(n).padStart(2, '0');
  return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate());
}
function kidName(cid) {
  const k = KIDS.find(x => x.id === cid);
  return k ? k.name : '(번호 ' + cid + ')';
}
// 이 아동이 평가를 받은 적이 있는가 (취소는 뺀다)
function hasEval(cid) {

}
function badge(st) {
  const c = (st === '평가중') ? 's-eval'
          : (st === '자리대기' || st === '그룹대기') ? 's-seat'
          : (st === '치료시작') ? 's-go' : 's-wait';
  return '<span class="badge ' + c + '">' + esc(st || '미지정') + '</span>';
}

function fillStatus(id) {

// 「치료시작」으로 바뀌면 아동 상태도 「치료중」으로 (한 번 물어본 뒤)
async function kidToActive(cid) {
  const k = KIDS.find(x => x.id === cid);
  if (!k) return;
  if (k.status === '치료중') return;          // 이미 치료중이면 묻지 않는다
  if (!confirm(k.name + ' 아동은 아직 「' + (k.status || '미지정') + '」 입니다.\n\n'
    + '아동 상태도 「치료중」으로 바꿀까요?')) return;
  const { error } = await sb.from('nl_children')
    .update({ status: '치료중', updated_at: new Date().toISOString() })
    .eq('id', cid);
  if (error) { alert('⚠️ 아동 상태를 바꾸지 못했습니다.\n' + error.message); return; }
  k.status = '치료중';
}

// ===== 오늘 확인할 건 =====
function drawAlert() {
  const td = today();
  // 평가중·일정조율중·자리대기 는 날짜와 상관없이 늘 띄운다
  const list = ALL.filter(r =>
    LIVE.indexOf(r.status) >= 0 &&
    ( URGENT.indexOf(r.status) >= 0 ||
      (r.next_check_date && r.next_check_date <= td) )
  ).sort((a, b) => {
    const ua = URGENT.indexOf(a.status) >= 0 ? 0 : 1;
    const ub = URGENT.indexOf(b.status) >= 0 ? 0 : 1;
    if (ua !== ub) return ua - ub;              // 세 단계를 맨 위로
    const da = a.next_check_date || '9999-99-99';
    const db = b.next_check_date || '9999-99-99';
    return da < db ? -1 : (da > db ? 1 : 0);
  });

  if (!list.length) { $('alertBox').style.display = 'none'; return; }

  $('alertBox').style.display = 'block';
  $('alertTitle').textContent = '⏰ 오늘까지 확인할 문의 ' + list.length + '건';
  $('alertRows').innerHTML = list.map(r => {
    const late = r.next_check_date && r.next_check_date < td;
    const days = late ? Math.round((new Date(td) - new Date(r.next_check_date)) / 86400000) : 0;
    const when = late ? days + '일 지남'
               : (r.next_check_date === td ? '오늘' : (r.next_check_date || '날짜 없음'));
    return '<div class="alert-line" data-open="' + r.id + '">'
      + '<b>' + esc(kidName(r.child_id)) + '</b> — ' + esc(r.status)
      + ' · ' + esc(r.next_action || '할 일 안 적힘')
      + ' <span class="' + (late ? 'late' : '') + '">('
      + when + ')</span>'
      + '</div>';
  }).join('');

  document.querySelectorAll('.alert-line').forEach(el => {
    el.onclick = () => openDetail(Number(el.dataset.open));
  });
}

// ===== 목록 =====
function draw() {
  const q = ($('pastQ') ? $('pastQ').value : '').trim().toLowerCase();

  const list = ALL.filter(r => {
    // 치료시작은 아동 목록으로 넘어간 것이므로 평소엔 감춘다
    if (r.status === '치료시작' && stFilter !== '치료시작') return false;
    if (q) return kidName(r.child_id).toLowerCase().includes(q);
    if (stFilter === '전체') return true;
    if (stFilter === '진행중') return LIVE.indexOf(r.status) >= 0;
    return r.status === stFilter;
  });

  // 줄 세우기 — 날짜 지난 것 먼저, 치료 시작은 맨 아래
  const tdNow = today();
  function orderOf(r) {
    if (LIVE.indexOf(r.status) < 0) return 3;                 // 치료 시작 등
    if (r.next_check_date && r.next_check_date <= tdNow) return 1;  // 날짜 지남
    return 2;
  }
  list.sort(function(a, b) {
    const d = orderOf(a) - orderOf(b);
    if (d) return d;
    return String(b.inquiry_date || '').localeCompare(String(a.inquiry_date || ''));
  });

  const goneN = ALL.filter(r => r.status === '치료시작').length;
  $('count').innerHTML = list.length + '건 / 전체 ' + ALL.length + '건'
    + (q ? ' · 「' + esc(q) + '」 로 찾는 중' : '')
    + (goneN && stFilter !== '치료시작'
        ? ' · <a href="#" id="goneLink" style="color:#00695c;">치료시작 '
          + goneN + '건 보기</a>' : '')
    + (stFilter === '치료시작'
        ? ' · <a href="#" id="backLink" style="color:#00695c;">전체로 돌아가기</a>' : '');
  const gl = document.getElementById('goneLink');
  if (gl) gl.onclick = (ev) => { ev.preventDefault(); stFilter = '치료시작';
    document.querySelectorAll('.tab[data-st]').forEach(x => x.classList.remove('on')); draw(); };
  const bl = document.getElementById('backLink');
  if (bl) bl.onclick = (ev) => { ev.preventDefault(); stFilter = '전체';
    document.querySelectorAll('.tab[data-st]').forEach(x =>
      x.classList.toggle('on', x.dataset.st === '전체')); draw(); };
  $('empty').style.display = list.length ? 'none' : 'block';

  const td = today();
  $('rows').innerHTML = list.map(r => {
    const late = r.next_check_date && r.next_check_date <= td
                 && LIVE.indexOf(r.status) >= 0;
    return '<tr>'
      + '<td class="idcell">' + r.id + '</td>'
      + '<td>' + esc(kidName(r.child_id)) + '</td>'
      + '<td class="nowrap">' + esc(r.inquiry_date) + '</td>'
      + '<td>' + badge(r.status)
        + (hasEval(r.child_id) ? ' ' + badge('평가완료') : '') + '</td>'
      + '<td class="nowrap ' + (late ? 'late' : '') + '">'
        + esc(r.next_check_date) + '</td>'
      + '<td>' + esc(r.next_action).slice(0, 30) + '</td>'
      + '<td><button class="openbtn" data-open="' + r.id + '">열기</button></td>'
      + '</tr>';
  }).join('');

  document.querySelectorAll('.openbtn').forEach(el => {
    el.onclick = () => openDetail(Number(el.dataset.open));
  });
  drawAlert();
}

  openId = id;

  $('addBox').style.display = 'none';

  $('detTitle').textContent = '문의 ' + r.id + '번 — ' + kidName(r.child_id);

  $('d_status').value    = r.status || '연락대기';
  $('d_next').value      = r.next_check_date || '';
  $('d_action').value    = r.next_action || '';
  $('d_date').value      = r.inquiry_date || '';
  $('d_channel').value   = r.channel || '';
  $('d_area').value      = r.wish_area || '';
  $('d_day').value       = r.wish_day || '';
  $('d_time').value      = r.wish_time || '';
  $('d_evalplace').value = r.eval_place || '';
  $('d_evaldate').value  = r.eval_date || '';
  $('d_endreason').value = r.end_reason || '';
  $('d_memo').value      = r.memo || '';
  // 아동 메모 — 등록 때 적은 상담 내용은 아동 표에 있다
  const kk = KIDS.find(k => k.id === r.child_id);
  $('d_kmemo').value = (kk && kk.memo) ? kk.memo : '';
  $('d_kmemo').dataset.orig = $('d_kmemo').value;
  showBox('msgD', '', true); $('msgD').className = 'out';

  // 이 아동의 평가를 채운다
  $('dvRows').innerHTML = '';
  EVALS.filter(e => e.child_id === r.child_id)
    .sort((a, b) => String(a.eval_date).localeCompare(String(b.eval_date)))
    .forEach(e => dvAddRow(e));

  $('l_date').value = today();
  $('l_content').value = '';
  showBox('msgL', '', true); $('msgL').className = 'out';

  await loadLogs(id);
  $('detBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function loadLogs(id) {
  $('logRows').innerHTML = '<div class="lognone">불러오는 중...</div>';
  const { data, error } = await sb
    .from('nl_inquiry_logs')
    .select('id, log_date, way, content, staff_id')
    .eq('inquiry_id', id)
    .order('log_date', { ascending: false })
    .order('id', { ascending: false });

  if (error) {
    $('logRows').innerHTML = '<div class="lognone">기록을 불러오지 못했습니다.</div>';
    return;
  }
  if (!data || !data.length) {
    $('logRows').innerHTML = '<div class="lognone">아직 상담 기록이 없습니다.</div>';
    return;
  }
  $('logRows').innerHTML = data.map(l =>
    '<div class="logrow">'
    + '<span class="logdate">' + esc(l.log_date) + '</span>'
    + '<span class="logway">' + esc(l.way) + '</span>'
    + esc(l.content)
    + '<span class="logwho">· ' + (l.staff_id ? l.staff_id + '번' : '') + '</span>'
    + '</div>'
  ).join('');
}

$('saveDet').onclick = async () => {

  };

  $('saveDet').disabled = true;

  try {
    const { data, error } = await sb.from('nl_inquiries')
      .update(up).eq('id', openId).select().single();
    if (error) throw error;

    // 아동 메모가 바뀌었으면 아동 표에도 저장한다
    const km = $('d_kmemo').value.trim();

      const { error: ek } = await sb.from('nl_children')

      const kk = KIDS.find(k => k.id === data.child_id);
      if (kk) kk.memo = km || null;
      $('d_kmemo').dataset.orig = km;
    }

    // 평가 줄도 함께 저장한다
    const cid = data.child_id;
    let evN = 0, evErr = '';
    const boxes = Array.from(document.querySelectorAll('#dvRows .dvrow'))
      .filter(b => b.querySelector('.dv_date').value);
    for (const b of boxes) {
      const fee = parseInt(String(b.querySelector('.dv_fee').value)
                    .replace(/[^0-9]/g, ''), 10);
      const row = {
        child_id:     cid,
        eval_type_id: Number(b.querySelector('.dv_type').value) || null,
        eval_date:    b.querySelector('.dv_date').value,
        eval_time:    b.querySelector('.dv_time').value || null,
        therapist_id: Number(b.querySelector('.dv_thr').value) || null,
        item_cnt:     Number(b.querySelector('.dv_cnt').value) || 1,
        fee:          isNaN(fee) ? 0 : fee,
        status:       b.querySelector('.dv_st').value,
        paid_on:      b.querySelector('.dv_paid').value || null,
        card_no:      b.querySelector('.dv_card').value.trim() || null
      };
      const eid = b.dataset.id;
      let res;
      if (eid) res = await sb.from('nl_evaluations')
                       .update(row).eq('id', Number(eid)).select().single();
      else     res = await sb.from('nl_evaluations')
                       .insert(row).select().single();
      if (res.error) { evErr = res.error.message; break; }
      evN++;
      if (eid) {
        const k = EVALS.findIndex(x => x.id === Number(eid));
        if (k >= 0) EVALS[k] = res.data;
      } else {
        EVALS.push(res.data);
        b.dataset.id = res.data.id;
      }
    }

    draw();
    if (up.status === '치료시작') {
      await kidToActive(data.child_id);
      if (confirm(kidName(data.child_id) + ' — 「치료시작」으로 저장했습니다.\n\n'
        + '문의 목록에서는 감춰집니다.\n아동 목록으로 갈까요?')) {
        location.href = 'children-new.html'; return;
      }
    }
    showBox('msgD', '✅ 저장했습니다.'
      + (evN ? '\n평가 ' + evN + '건' : '')
      + (evErr ? '\n⚠️ 평가는 저장하지 못했습니다: ' + evErr : ''), true);
  } catch (e) {
    showBox('msgD', '❌ 저장하지 못했습니다.\n' + e.message, false);
  } finally {
    $('saveDet').disabled = false;
    $('saveDet').textContent = '저장';
  }
};

// 평가 종류·개수로 평가비를 찾는다
// 기준표 이름 모양: 「언어평가 1개」 「발달평가 2개」 「심리평가 (기본)」
function feeOf(tid, cnt) {
  const t  = EVTYPES.find(x => x.id === Number(tid));
  if (!t) return '';
  const tn = String(t.name).trim();          // 예: 언어평가
  const c  = Number(cnt) || 1;
  const same = EVFEES.filter(f => String(f.name || '').indexOf(tn) === 0);
  if (!same.length) return '';
  // 개수가 적힌 것이 있으면 그것으로
  let hit = same.find(f => String(f.name).indexOf(c + '개') >= 0);
  // 개수가 없는 종류(심리평가 등)는 개수 표시 없는 줄로
  if (!hit) hit = same.find(f => !/[0-9]개/.test(String(f.name)));
  if (!hit) hit = same[0];
  return hit ? Number(hit.amount).toLocaleString() : '';
}

// 평가 목록 그리기
function drawEvalList() {
  const mk  = $('e_mon').value;
  const fil = evFilter;

  let list = EVALS.slice();

  if (fil === 'kid') {
    if (!evKid) {
      $('evRows').innerHTML = '<div class="kidnone">아동을 먼저 고르세요.</div>';
      $('evSum').textContent = '';
      return;
    }
    list = list.filter(e => e.child_id === evKid.id);
  } else {
    if (mk) list = list.filter(e => String(e.eval_date || '').slice(0, 7) === mk);
    if (fil === '예정' || fil === '완료') list = list.filter(e => e.status === fil);
    else if (fil === 'unpaid') list = list.filter(e => !e.paid_on && e.status !== '취소');
  }

  list.sort((a, b) => String(b.eval_date).localeCompare(String(a.eval_date)));

  const total = list.reduce((s, e) => s + Number(e.fee || 0), 0);
  const nUnpaid = list.filter(e => !e.paid_on && e.status !== '취소').length;
  $('evSum').textContent = list.length + '건 · ' + total.toLocaleString() + '원'
    + (nUnpaid ? ' · 미납 ' + nUnpaid + '건' : '');

  if (!list.length) {
    $('evRows').innerHTML = '<div class="kidnone">해당하는 평가 기록이 없습니다.</div>';
    return;
  }

  $('evRows').innerHTML = list.map(e => {
    const t  = EVTYPES.find(x => x.id === e.eval_type_id);
    const th = THRS.find(x => x.id === e.therapist_id);
    const pay = e.paid_on
      ? '납부 ' + e.paid_on
      : (e.status === '취소' ? '—' : '<span class="unpaid">미납</span>');
    return '<div class="evrow">'
      + '<span class="d">' + esc(e.eval_date)
        + (e.eval_time ? ' ' + String(e.eval_time).slice(0,5) : '') + '</span>'
      + '<span class="kn">' + esc(kidName(e.child_id)) + '</span>'
      + '<span>' + esc(t ? t.name : '') + ' ' + e.item_cnt + '개</span>'
      + '<span class="d">' + esc(th ? th.name : '') + '</span>'
      + '<span class="d">' + esc(e.status) + ' · ' + pay + '</span>'
      + '<span class="amt">' + Number(e.fee || 0).toLocaleString() + '원</span>'
      + '<button class="evedit" data-ev="' + e.id + '">고치기</button>'
      + '</div>';
  }).join('');

  $('evRows').querySelectorAll('.evedit').forEach(el => {
    el.onclick = () => loadEval(Number(el.dataset.ev));
  });
}

// 목록 읽기
async function loadWl(){
  const { data, error } = await sb.from('nl_waitlist')
    .select('*, nl_waitlist_slots(weekday, start_time)')
    .order('created_at');
  if (error) { wlmsg('❌ 대기 명단을 읽지 못했습니다.\n' + error.message, false); return; }
  WL = data || [];
}

function wlSlotText(w){
  const ss = (w.nl_waitlist_slots || []).slice()
    .sort((a,b) => WLWDS.indexOf(a.weekday) - WLWDS.indexOf(b.weekday)
                || String(a.start_time).localeCompare(String(b.start_time)));
  if (!ss.length) return '<span style="color:#c62828;">희망 시간 없음</span>';
  return ss.map(v => v.weekday + ' ' + String(v.start_time).slice(0,5)).join(' · ');
}

function drawWl(){
  const mine = WL.filter(w => (w.kind || '자리') === wlKind);
  const list = mine.filter(w => wlFilter === '전체' || w.status === wlFilter);
  $('wlCount').textContent = list.length + '명 / 전체 ' + mine.length + '명';
  if (!list.length) { $('wlRows').innerHTML =
    '<div class="evnone">해당하는 아동이 없습니다.</div>'; return; }

  $('wlRows').innerHTML = list.map(w => {
    const k = KIDS.find(x => x.id === w.child_id);
    const cls = w.status === '대기중' ? '#00695c'
              : w.status === '보류'   ? '#8a6116' : '#5a625c';
    return '<div class="evrow" style="cursor:pointer;" data-wlid="' + w.id + '">'
      + '<span class="kn">' + esc(k ? k.name : '(' + w.child_id + '번)') + '</span>'
      + (wlKind === '그룹'
          ? '<span class="d">' + esc(w.group_name || '(그룹 미정)') + '</span>' : '')
      + '<span class="d">' + (k && k.phone ? esc(k.phone) : '연락처 없음') + '</span>'
      + '<span>' + wlSlotText(w) + '</span>'
      + '<span style="font-weight:bold;color:' + cls + ';">' + esc(w.status) + '</span>'
      + '<span class="d">' + (w.last_contact ? esc(w.last_contact) : '') + '</span>'
      + '<span class="d">' + esc(String(w.memo || '').slice(0, 20)) + '</span>'
      + '</div>';
  }).join('');

  $('wlRows').querySelectorAll('[data-wlid]').forEach(el => {
    el.onclick = () => openWl(Number(el.dataset.wlid));
  });
}

function openWl(id){

  wlEditId = id;

    ? ss.map(v => wlSlotRow(v.weekday, String(v.start_time).slice(0,5))).join('')
    : wlSlotRow('월', '15:10');

// 저장
$('w_save').onclick = async () => {
  if (!wlKid) { wlmsg('아동을 고르세요.', false); return; }

  const slots = [];
  $('w_slots').querySelectorAll('.wlslot').forEach(el => {
    const wd = el.querySelector('.wlwd').value;
    const hm = el.querySelector('.wlhm').value;
    if (!slots.some(v => v.weekday === wd && v.start_time === hm + ':00'))
      slots.push({ weekday: wd, start_time: hm + ':00' });
  });
  if (!slots.length) { wlmsg('희망 시간을 하나 이상 넣으세요.', false); return; }

  const dup = WL.find(w => w.child_id === wlKid.id && w.id !== wlEditId
                        && (w.kind || '자리') === wlKind);
  if (dup && !confirm(wlKid.name + ' 아동은 이미 ' + wlKind
    + ' 대기 명단에 있습니다.\n그래도 새로 넣을까요?')) return;

  const row = {
    child_id:     wlKid.id,
    kind:         wlKind,
    group_name:   wlKind === '그룹' ? ($('w_group').value.trim() || null) : null,
    status:       $('w_status').value,
    last_contact: $('w_contact').value || null,
    memo:         $('w_memo').value.trim() || null,
    updated_at:   new Date().toISOString()
  };

  $('w_save').disabled = true;
  try {
    let wid = wlEditId;
    if (wid) {
      const { error } = await sb.from('nl_waitlist').update(row).eq('id', wid);
      if (error) throw error;
      await sb.from('nl_waitlist_slots').delete().eq('waitlist_id', wid);
    } else {
      const { data, error } = await sb.from('nl_waitlist')
        .insert(row).select('id').single();
      if (error) throw error;
      wid = data.id;
    }
    const { error: e2 } = await sb.from('nl_waitlist_slots')
      .insert(slots.map(v => ({ waitlist_id: wid, weekday: v.weekday, start_time: v.start_time })));
    if (e2) throw e2;

    await loadWl(); drawWl();
    wlmsg('✅ ' + esc(wlKid.name) + ' 아동을 ' + wlKind
      + ' 대기 명단에 저장했습니다. (희망 시간 ' + slots.length + '개)', true);
    clearWlForm();
  } catch (e) {
    wlmsg('❌ 저장하지 못했습니다.\n' + e.message, false);
  } finally {
    $('w_save').disabled = false;
  }
};

function watchFee(boxId, pre) {
  const wrap = $(boxId);
  if (!wrap) return;
  const redo = function (ev) {
    const t = ev.target;
    if (!t) return;
    if (!t.classList.contains(pre + '_type')
     && !t.classList.contains(pre + '_cnt')) return;
    const row = t.closest('.' + pre + 'row');
    if (!row) return;
    row.querySelector('.' + pre + '_fee').value =
      feeOf(row.querySelector('.' + pre + '_type').value,
            row.querySelector('.' + pre + '_cnt').value);
  };
  wrap.addEventListener('change', redo, true);
  wrap.addEventListener('input',  redo, true);
}

// ===== 관리번호 자동 =====
function nextManagerNo() {
  const yr  = new Date().getFullYear();
  const pre = String(yr) + '01-자라는 ';
  let max = 0;
  KIDS.forEach(c => {
    const t = c.manager_no || '';
    if (t.startsWith(pre)) {
      const n = parseInt(t.slice(pre.length).trim(), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return pre + String(max + 1).padStart(3, '0');
}

    .select('*')
    .order('inquiry_date', { ascending: false });
  if (error) { show('❌ 문의 목록 조회 실패\n' + error.message, false); return; }
  ALL = data || [];

  // 평가 관리에 쓰는 자료들
  const [et, ef, th, ev] = await Promise.all([
    sb.from('nl_eval_types').select('id, name').order('id'),
    sb.from('nl_eval_fees').select('*').order('id'),
    sb.from('nl_therapists').select('id, name, active').order('id'),
    sb.from('nl_evaluations').select('*')
  ]);
  EVTYPES = et.data || [];
  EVFEES  = (ef.data || []).filter(x => x.active !== false);
  THRS    = (th.data || []).filter(x => x.active !== false);
  EVALS   = ev.data || [];

  $('e_type').innerHTML = EVTYPES.map(t =>
    '<option value="' + t.id + '">' + esc(t.name) + '</option>').join('');
  $('e_thr').innerHTML = '<option value="">— 담당 고르기 —</option>'
    + THRS.filter(t => t.id <= 7).map(t =>
        '<option value="' + t.id + '">' + esc(t.name) + '</option>').join('');

  $('who').textContent = me.name + ' (' + me.role + ') 님으로 로그인됨';
  $('loginBox').style.display = 'none';
  $('listBox').style.display  = 'block';

  // 화면을 열면 「새 문의 등록」 창을 바로 펼쳐 둔다
  resetAddBox();
  draw();
}

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show('이메일과 비밀번호를 모두 입력하세요.', false); return; }

  $('btn').disabled = true;
  $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show('❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false;
    $('btn').textContent = '로그인';
  }
};

$('out').onclick = async () => {
  nlKeepOff();
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
};

// 상태 단추
document.querySelectorAll('.tab[data-st]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tab[data-st]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    stFilter = b.dataset.st;
    draw();
  };
});

fillStatus('a_status');
fillStatus('d_status');

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

// 이미 로그인되어 있으면 바로 목록 표시
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
  else {
    // 로그인이 없으면 첫 화면으로 보낸다 (빈 화면이 열리는 것을 막기 위함)
    location.replace('index.html');
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규 아동 관리 - 나무링크</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; background:#f5f9f0;
         margin:0; padding:24px; color:#333; }
  .box { max-width:460px; margin:40px auto; background:#fff; border-radius:12px;
         padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .wide { max-width:1100px; margin:20px auto; background:#fff; border-radius:12px;
          padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:20px; color:#2e7d32; margin:0 0 4px; }
  .sub { font-size:13px; color:#888; margin-bottom:22px; }
  label { display:block; font-size:13px; font-weight:bold; margin:14px 0 5px; }
  input, select, textarea { width:100%; padding:11px; border:1px solid #ddd; border-radius:7px;
          font-size:15px; box-sizing:border-box; font-family:inherit; }
  button { width:100%; padding:13px; margin-top:20px; background:#2e7d32; color:#fff;
           border:none; border-radius:7px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { background:#bbb; cursor:default; }
  .out { margin-top:20px; padding:14px; border-radius:8px; font-size:14px;
         line-height:1.7; display:none; white-space:pre-wrap; word-break:break-all; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }

  .top { display:flex; justify-content:space-between; align-items:center;
         flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .who { font-size:13px; color:#666; }
  .btn-out { width:auto; margin:0; padding:8px 16px; background:#757575; font-size:13px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .tab { width:auto; margin:0; padding:8px 14px; background:#eee; color:#555;
         font-size:13px; font-weight:normal; }
  .tab.on { background:#2e7d32; color:#fff; font-weight:bold; }
  .count { font-size:13px; color:#666; margin-left:auto; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { background:#f1f8e9; color:#33691e; padding:10px 8px; text-align:left;
       border-bottom:2px solid #c5e1a5; font-size:13px; white-space:nowrap; }
  td { padding:10px 8px; border-bottom:1px solid #eee; vertical-align:middle; }
  tr:hover td { background:#fafdf7; }
  .empty { padding:40px; text-align:center; color:#999; font-size:14px; }
  .idcell { color:#8d6e63; font-weight:bold; white-space:nowrap; width:50px; }
  .nowrap { white-space:nowrap; }

  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px;
           white-space:nowrap; }
  .s-wait { background:#fff8e1; color:#e65100; }
  .s-eval { background:#e3f2fd; color:#0d47a1; }
  .s-seat { background:#f3e5f5; color:#6a1b9a; }
  .s-go   { background:#e8f5e9; color:#1b5e20; }
  .s-end  { background:#eceff1; color:#546e7a; }

  /* 오늘 확인할 건 */
  .alert { background:#fff3e0; border:1px solid #ffcc80; border-radius:10px;
           padding:16px 18px; margin-bottom:18px; }
  .alert-t { font-size:15px; font-weight:bold; color:#e65100; margin-bottom:10px; }
  .alert-line { font-size:14px; padding:6px 0; border-bottom:1px dashed #ffcc80;
                cursor:pointer; }
  .alert-line:last-child { border-bottom:none; }
  .alert-line:hover { color:#bf360c; }
  .late { color:#c62828; font-weight:bold; }

  /* 등록 창 · 상세 창 */
  .panel { background:#f1f8e9; border:1px solid #c5e1a5; border-radius:10px;
           padding:18px; margin-bottom:18px; }
  .panel-t { font-size:15px; font-weight:bold; color:#33691e; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
          gap:10px 14px; }
  .grid label { font-size:12.5px; font-weight:bold; margin:0 0 4px; color:#555; }
  .grid input, .grid select, .grid textarea { width:100%; padding:8px 10px; font-size:14px;
          border:1px solid #ddd; border-radius:6px; box-sizing:border-box; }
  .btns { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .hint { font-size:12px; color:#7cb342; margin-top:4px; }

  /* 상담 기록 */
  .logbox { background:#fff; border:1px solid #ddd; border-radius:8px;
            padding:14px; margin-top:14px; }
  .logbox-t { font-size:14px; font-weight:bold; color:#555; margin-bottom:10px; }
  .logrow { font-size:13.5px; padding:8px 0; border-bottom:1px solid #f0f0f0;
            line-height:1.6; }
  .logrow:last-child { border-bottom:none; }
  .logdate { color:#8d6e63; font-weight:bold; margin-right:8px; }
  .logway { display:inline-block; background:#eee; color:#666; border-radius:9px;
            padding:1px 8px; font-size:11.5px; margin-right:8px; }
  .logwho { color:#999; font-size:12px; margin-left:6px; }
  .lognone { color:#999; font-size:13px; padding:8px 0; }
  .openbtn { width:auto; margin:0; padding:5px 12px; background:#8bc34a;
             font-size:12.5px; font-weight:bold; }

  .btn-home { display:inline-block; padding:8px 16px; background:#2e7d32; color:#fff;
              font-size:13px; border-radius:8px; text-decoration:none;
              white-space:nowrap; margin-right:8px; }
  .btn-home:hover { filter:brightness(1.08); }
</style>
</head>
<body>

<!-- 로그인 전 화면 -->
<div class="box" id="loginBox">
  <h1>🌿 나무링크</h1>
  <div class="sub">신규 아동 관리 화면입니다. 로그인하세요.</div>

  <label for="em">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com">

  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">

  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 로그인 후 화면 -->
<div class="wide" id="listBox" style="display:none;">
  <div class="top">
    <div>
      <h1>🌿 신규 아동 관리</h1>
      <div class="who" id="who"></div>
    </div>
    <a href="index.html" class="btn-home">🌿 처음으로</a>
    <button id="out" class="btn-out">로그아웃</button>
  </div>

  <!-- 오늘 확인할 건 -->
  <div class="alert" id="alertBox" style="display:none;">
    <div class="alert-t" id="alertTitle"></div>
    <div id="alertRows"></div>
  </div>

  <div class="tools">
    <button class="tab on" data-st="진행중">진행중</button>
    <button class="tab" data-st="전체">전체</button>
    <button class="tab" data-st="연락 대기">연락 대기</button>
    <button class="tab" data-st="회신 대기">회신 대기</button>
    <button class="tab" data-st="평가 대기">평가 대기</button>
    <button class="tab" data-st="자리 대기">자리 대기</button>
    <button class="tab" data-st="그룹 대기">그룹 대기</button>
    <button class="tab" data-st="일정 조율 중">일정 조율 중</button>
    <button class="tab" data-st="치료 시작">치료 시작</button>
    <button class="tab" data-st="종료">종료</button>
    <button id="addBtn" class="tab" style="background:#8bc34a;color:#fff;font-weight:bold;">＋ 새 문의</button>
    <span class="count" id="count"></span>
  </div>

  <!-- 새 문의 등록 창 -->
  <div id="addBox" class="panel" style="display:none;">
    <div class="panel-t">새 문의 등록</div>
    <div class="grid">
      <div style="grid-column:1 / -1;">
        <label for="a_child">아동 <span style="color:#c62828;">*</span></label>
        <select id="a_child"></select>
        <div class="hint">목록에 없으면 아동 목록 화면에서 먼저 등록하세요.</div>
      </div>
      <div>
        <label for="a_date">문의일 <span style="color:#c62828;">*</span></label>
        <input id="a_date" type="date">
      </div>
      <div>
        <label for="a_channel">유입경로</label>
        <input id="a_channel" type="text" placeholder="전화 / 네이버 / 소개 등">
      </div>
      <div>
        <label for="a_area">희망영역</label>
        <input id="a_area" type="text" placeholder="언어치료">
      </div>
      <div>
        <label for="a_day">희망요일</label>
        <input id="a_day" type="text" placeholder="화">
      </div>
      <div>
        <label for="a_time">희망시간</label>
        <input id="a_time" type="text" placeholder="오후 4시 이후">
      </div>
      <div>
        <label for="a_status">상태 <span style="color:#c62828;">*</span></label>
        <select id="a_status"></select>
      </div>
      <div>
        <label for="a_next">다음 확인 날짜</label>
        <input id="a_next" type="date">
      </div>
      <div>
        <label for="a_action">다음 할 일</label>
        <input id="a_action" type="text" placeholder="예: 보호자에게 다시 전화">
      </div>
      <div style="grid-column:1 / -1;">
        <label for="a_memo">메모</label>
        <input id="a_memo" type="text">
      </div>
    </div>
    <div class="btns">
      <button id="saveNew" class="tab" style="background:#2e7d32;color:#fff;font-weight:bold;">등록하기</button>
      <button id="cancelNew" class="tab">취소</button>
    </div>
    <div id="msgA" class="out"></div>
  </div>

  <!-- 상세 · 수정 창 -->
  <div id="detBox" class="panel" style="display:none;">
    <div class="panel-t" id="detTitle"></div>
    <div class="grid">
      <div>
        <label for="d_status">상태</label>
        <select id="d_status"></select>
      </div>
      <div>
        <label for="d_next">다음 확인 날짜</label>
        <input id="d_next" type="date">
      </div>
      <div style="grid-column:span 2;">
        <label for="d_action">다음 할 일</label>
        <input id="d_action" type="text">
      </div>
      <div>
        <label for="d_date">문의일</label>
        <input id="d_date" type="date">
      </div>
      <div>
        <label for="d_channel">유입경로</label>
        <input id="d_channel" type="text">
      </div>
      <div>
        <label for="d_area">희망영역</label>
        <input id="d_area" type="text">
      </div>
      <div>
        <label for="d_day">희망요일</label>
        <input id="d_day" type="text">
      </div>
      <div>
        <label for="d_time">희망시간</label>
        <input id="d_time" type="text">
      </div>
      <div>
        <label for="d_evalplace">평가 장소</label>
        <input id="d_evalplace" type="text">
      </div>
      <div>
        <label for="d_evaldate">평가 날짜</label>
        <input id="d_evaldate" type="date">
      </div>
      <div>
        <label for="d_endreason">종료 사유</label>
        <input id="d_endreason" type="text" placeholder="상태가 종료일 때만">
      </div>
      <div style="grid-column:1 / -1;">
        <label for="d_memo">메모</label>
        <input id="d_memo" type="text">
      </div>
    </div>
    <div class="btns">
      <button id="saveDet" class="tab" style="background:#2e7d32;color:#fff;font-weight:bold;">저장하기</button>
      <button id="closeDet" class="tab">닫기</button>
    </div>
    <div id="msgD" class="out"></div>

    <!-- 상담 기록 -->
    <div class="logbox">
      <div class="logbox-t">상담 기록</div>
      <div id="logRows"></div>
      <div class="grid" style="margin-top:12px;">
        <div>
          <label for="l_date">날짜</label>
          <input id="l_date" type="date">
        </div>
        <div>
          <label for="l_way">방법</label>
          <select id="l_way">
            <option value="전화">전화</option>
            <option value="문자">문자</option>
            <option value="카카오톡">카카오톡</option>
            <option value="방문">방문</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div style="grid-column:1 / -1;">
          <label for="l_content">내용</label>
          <input id="l_content" type="text" placeholder="예: 보호자와 통화. 9월부터 가능하다고 함">
        </div>
      </div>
      <div class="btns">
        <button id="addLog" class="tab" style="background:#8bc34a;color:#fff;font-weight:bold;">기록 추가</button>
      </div>
      <div id="msgL" class="out"></div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>번호</th>
        <th>아동</th>
        <th>문의일</th>
        <th>상태</th>
        <th>다음 확인</th>
        <th>다음 할 일</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none;">해당하는 문의가 없습니다.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';

// 로그인을 창(탭) 안에서만 유지한다. 창을 닫으면 자동으로 끊긴다.
const sb  = window.supabase.createClient(URL_, KEY_, {
  auth: {
    storage: window.sessionStorage,
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false
  }
});
const $   = id => document.getElementById(id);
const msg = $('msg');

// 상태 8가지
const STATUS = ['연락 대기','회신 대기','평가 대기','자리 대기','그룹 대기',
                '일정 조율 중','치료 시작','종료'];
// 아직 결론이 안 난 상태 (= 진행중)
const LIVE = ['연락 대기','회신 대기','평가 대기','자리 대기','그룹 대기','일정 조율 중'];

// 이 화면을 볼 수 있는 직원 번호. 8=관리자 9=행정
// 나중에 치료사도 보게 하려면 아래 줄에 번호를 더하면 됩니다.
const CAN_SEE = [8, 9];

let ALL = [];        // 문의 전체
let KIDS = [];       // 아동 이름표 (번호 -> 이름)
let ME = null;       // 로그인한 직원
let stFilter = '진행중';
let openId = null;   // 지금 열어본 문의 번호

function show(text, ok) {
  msg.textContent = text;
  msg.className = 'out ' + (ok ? 'ok' : 'err');
}
function showBox(id, text, ok) {
  $(id).textContent = text;
  $(id).className = 'out ' + (ok ? 'ok' : 'err');
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// 오늘 날짜를 2026-08-14 모양으로
function today() {
  const t = new Date();
  const p = n => String(n).padStart(2, '0');
  return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate());
}
function kidName(cid) {
  const k = KIDS.find(x => x.id === cid);
  return k ? k.name : '(번호 ' + cid + ')';
}
function badge(st) {
  const c = (st === '평가 대기') ? 's-eval'
          : (st === '자리 대기' || st === '그룹 대기') ? 's-seat'
          : (st === '치료 시작') ? 's-go'
          : (st === '종료') ? 's-end' : 's-wait';
  return '<span class="badge ' + c + '">' + esc(st || '미지정') + '</span>';
}
// 상태 고르는 칸 채우기
function fillStatus(id) {
  $(id).innerHTML = STATUS.map(s => '<option value="' + s + '">' + s + '</option>').join('');
}

// ===== 오늘 확인할 건 =====
function drawAlert() {
  const td = today();
  const list = ALL.filter(r =>
    LIVE.indexOf(r.status) >= 0 && r.next_check_date && r.next_check_date <= td
  ).sort((a, b) => (a.next_check_date < b.next_check_date ? -1 : 1));

  if (!list.length) { $('alertBox').style.display = 'none'; return; }

  $('alertBox').style.display = 'block';
  $('alertTitle').textContent = '⏰ 오늘까지 확인할 문의 ' + list.length + '건';
  $('alertRows').innerHTML = list.map(r => {
    const late = r.next_check_date < td;
    const days = late ? Math.round((new Date(td) - new Date(r.next_check_date)) / 86400000) : 0;
    return '<div class="alert-line" data-open="' + r.id + '">'
      + '<b>' + esc(kidName(r.child_id)) + '</b> — ' + esc(r.status)
      + ' · ' + esc(r.next_action || '할 일 안 적힘')
      + ' <span class="' + (late ? 'late' : '') + '">('
      + (late ? days + '일 지남' : '오늘') + ')</span>'
      + '</div>';
  }).join('');

  document.querySelectorAll('.alert-line').forEach(el => {
    el.onclick = () => openDetail(Number(el.dataset.open));
  });
}

// ===== 목록 =====
function draw() {
  const list = ALL.filter(r => {
    if (stFilter === '전체') return true;
    if (stFilter === '진행중') return LIVE.indexOf(r.status) >= 0;
    return r.status === stFilter;
  });

  $('count').textContent = list.length + '건 / 전체 ' + ALL.length + '건';
  $('empty').style.display = list.length ? 'none' : 'block';

  const td = today();
  $('rows').innerHTML = list.map(r => {
    const late = r.next_check_date && r.next_check_date <= td
                 && LIVE.indexOf(r.status) >= 0;
    return '<tr>'
      + '<td class="idcell">' + r.id + '</td>'
      + '<td>' + esc(kidName(r.child_id)) + '</td>'
      + '<td class="nowrap">' + esc(r.inquiry_date) + '</td>'
      + '<td>' + badge(r.status) + '</td>'
      + '<td class="nowrap ' + (late ? 'late' : '') + '">'
        + esc(r.next_check_date) + '</td>'
      + '<td>' + esc(r.next_action).slice(0, 30) + '</td>'
      + '<td><button class="openbtn" data-open="' + r.id + '">열기</button></td>'
      + '</tr>';
  }).join('');

  document.querySelectorAll('.openbtn').forEach(el => {
    el.onclick = () => openDetail(Number(el.dataset.open));
  });
  drawAlert();
}

// ===== 상세 열기 =====
async function openDetail(id) {
  const r = ALL.find(x => x.id === id);
  if (!r) return;
  openId = id;

  $('addBox').style.display = 'none';
  $('detBox').style.display = 'block';
  $('detTitle').textContent = '문의 ' + r.id + '번 — ' + kidName(r.child_id);

  $('d_status').value    = r.status || '연락 대기';
  $('d_next').value      = r.next_check_date || '';
  $('d_action').value    = r.next_action || '';
  $('d_date').value      = r.inquiry_date || '';
  $('d_channel').value   = r.channel || '';
  $('d_area').value      = r.wish_area || '';
  $('d_day').value       = r.wish_day || '';
  $('d_time').value      = r.wish_time || '';
  $('d_evalplace').value = r.eval_place || '';
  $('d_evaldate').value  = r.eval_date || '';
  $('d_endreason').value = r.end_reason || '';
  $('d_memo').value      = r.memo || '';
  showBox('msgD', '', true); $('msgD').className = 'out';

  $('l_date').value = today();
  $('l_content').value = '';
  showBox('msgL', '', true); $('msgL').className = 'out';

  await loadLogs(id);
  $('detBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function loadLogs(id) {
  $('logRows').innerHTML = '<div class="lognone">불러오는 중...</div>';
  const { data, error } = await sb
    .from('nl_inquiry_logs')
    .select('id, log_date, way, content, staff_id')
    .eq('inquiry_id', id)
    .order('log_date', { ascending: false })
    .order('id', { ascending: false });

  if (error) {
    $('logRows').innerHTML = '<div class="lognone">기록을 불러오지 못했습니다.</div>';
    return;
  }
  if (!data || !data.length) {
    $('logRows').innerHTML = '<div class="lognone">아직 상담 기록이 없습니다.</div>';
    return;
  }
  $('logRows').innerHTML = data.map(l =>
    '<div class="logrow">'
    + '<span class="logdate">' + esc(l.log_date) + '</span>'
    + '<span class="logway">' + esc(l.way) + '</span>'
    + esc(l.content)
    + '<span class="logwho">· ' + (l.staff_id ? l.staff_id + '번' : '') + '</span>'
    + '</div>'
  ).join('');
}

$('closeDet').onclick = () => { $('detBox').style.display = 'none'; openId = null; };

$('saveDet').onclick = async () => {
  if (!openId) return;
  const up = {
    status:          $('d_status').value,
    next_check_date: $('d_next').value || null,
    next_action:     $('d_action').value.trim() || null,
    inquiry_date:    $('d_date').value || null,
    channel:         $('d_channel').value.trim() || null,
    wish_area:       $('d_area').value.trim() || null,
    wish_day:        $('d_day').value.trim() || null,
    wish_time:       $('d_time').value.trim() || null,
    eval_place:      $('d_evalplace').value.trim() || null,
    eval_date:       $('d_evaldate').value || null,
    end_reason:      $('d_endreason').value.trim() || null,
    memo:            $('d_memo').value.trim() || null,
    updated_at:      new Date().toISOString()
  };

  $('saveDet').disabled = true;
  $('saveDet').textContent = '저장 중...';
  try {
    const { data, error } = await sb.from('nl_inquiries')
      .update(up).eq('id', openId).select().single();
    if (error) throw error;
    const i = ALL.findIndex(x => x.id === openId);
    if (i >= 0) ALL[i] = data;
    draw();
    showBox('msgD', '✅ 저장했습니다.', true);
  } catch (e) {
    showBox('msgD', '❌ 저장하지 못했습니다.\n' + e.message, false);
  } finally {
    $('saveDet').disabled = false;
    $('saveDet').textContent = '저장하기';
  }
};

$('addLog').onclick = async () => {
  if (!openId) return;
  const content = $('l_content').value.trim();
  if (!content) { showBox('msgL', '내용을 적으세요.', false); return; }

  $('addLog').disabled = true;
  $('addLog').textContent = '추가 중...';
  try {
    const { error } = await sb.from('nl_inquiry_logs').insert({
      inquiry_id: openId,
      log_date:   $('l_date').value || today(),
      way:        $('l_way').value,
      content:    content,
      staff_id:   ME ? ME.id : null
    });
    if (error) throw error;
    $('l_content').value = '';
    await loadLogs(openId);
    showBox('msgL', '✅ 기록을 추가했습니다.', true);
  } catch (e) {
    showBox('msgL', '❌ 추가하지 못했습니다.\n' + e.message, false);
  } finally {
    $('addLog').disabled = false;
    $('addLog').textContent = '기록 추가';
  }
};

// ===== 새 문의 등록 =====
$('addBtn').onclick = () => {
  const open = $('addBox').style.display !== 'none';
  if (open) { $('addBox').style.display = 'none'; return; }
  $('detBox').style.display = 'none';
  $('a_date').value = today();
  $('a_next').value = today();
  $('a_status').value = '연락 대기';
  ['a_channel','a_area','a_day','a_time','a_action','a_memo']
    .forEach(k => $(k).value = '');
  $('msgA').className = 'out'; $('msgA').textContent = '';
  $('addBox').style.display = 'block';
};

$('cancelNew').onclick = () => { $('addBox').style.display = 'none'; };

$('saveNew').onclick = async () => {
  const cid = Number($('a_child').value);
  if (!cid) { showBox('msgA', '아동을 고르세요.', false); return; }
  if (!$('a_date').value) { showBox('msgA', '문의일을 넣으세요.', false); return; }

  const dup = ALL.find(r => r.child_id === cid && LIVE.indexOf(r.status) >= 0);
  if (dup) {
    showBox('msgA', '⚠️ 이 아동은 이미 진행중인 문의가 있습니다. (문의 '
      + dup.id + '번) 중복 등록이 아닌지 확인하세요.', false);
    return;
  }

  const row = {
    child_id:        cid,
    inquiry_date:    $('a_date').value,
    channel:         $('a_channel').value.trim() || null,
    wish_area:       $('a_area').value.trim() || null,
    wish_day:        $('a_day').value.trim() || null,
    wish_time:       $('a_time').value.trim() || null,
    status:          $('a_status').value,
    next_check_date: $('a_next').value || null,
    next_action:     $('a_action').value.trim() || null,
    memo:            $('a_memo').value.trim() || null
  };

  $('saveNew').disabled = true;
  $('saveNew').textContent = '등록 중...';
  try {
    const { data, error } = await sb.from('nl_inquiries')
      .insert(row).select().single();
    if (error) throw error;
    ALL.unshift(data);
    draw();
    showBox('msgA', '✅ 등록했습니다. 문의 ' + data.id + '번', true);
    $('a_child').value = '';
    ['a_channel','a_area','a_day','a_time','a_action','a_memo']
      .forEach(k => $(k).value = '');
  } catch (e) {
    showBox('msgA', '❌ 등록하지 못했습니다.\n' + e.message, false);
  } finally {
    $('saveNew').disabled = false;
    $('saveNew').textContent = '등록하기';
  }
};

// ===== 로그인 후 =====
async function afterLogin(user) {
  const { data: me, error: e1 } = await sb
    .from('nl_therapists')
    .select('id, name, role, active')
    .eq('login_email', user.email.toLowerCase())
    .maybeSingle();

  if (e1)  { show('❌ 직원 조회 실패\n' + e1.message, false); return; }
  if (!me) { show('⚠️ 직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.', false); return; }
  if (CAN_SEE.indexOf(me.id) < 0) {
    show('이 화면은 관리자와 행정만 볼 수 있습니다.', false); return;
  }
  ME = me;

  // 아동 이름표
  const { data: kids, error: e2 } = await sb
    .from('nl_children')
    .select('id, name, status')
    .order('name');
  if (e2) { show('❌ 아동 목록 조회 실패\n' + e2.message, false); return; }
  KIDS = kids || [];

  $('a_child').innerHTML = '<option value="">-- 아동 고르기 --</option>'
    + KIDS.map(k => '<option value="' + k.id + '">' + esc(k.name)
        + ' (' + k.id + '번 · ' + esc(k.status) + ')</option>').join('');

  // 문의 목록
  const { data, error } = await sb
    .from('nl_inquiries')
    .select('*')
    .order('inquiry_date', { ascending: false });
  if (error) { show('❌ 문의 목록 조회 실패\n' + error.message, false); return; }
  ALL = data || [];

  $('who').textContent = me.name + ' (' + me.role + ') 님으로 로그인됨';
  $('loginBox').style.display = 'none';
  $('listBox').style.display  = 'block';
  draw();
}

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show('이메일과 비밀번호를 모두 입력하세요.', false); return; }

  $('btn').disabled = true;
  $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show('❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false;
    $('btn').textContent = '로그인';
  }
};

$('out').onclick = async () => {
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
};

// 상태 단추
document.querySelectorAll('.tab[data-st]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tab[data-st]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    stFilter = b.dataset.st;
    draw();
  };
});

fillStatus('a_status');
fillStatus('d_status');

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

// 이미 로그인되어 있으면 바로 목록 표시
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
  else {
    // 로그인이 없으면 첫 화면으로 보낸다 (빈 화면이 열리는 것을 막기 위함)
    location.replace('index.html');
  }
})();
</script>

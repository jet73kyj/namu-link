<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규 아동 관리 - 나무링크</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; background:#f5f9f0;
         margin:0; padding:24px; color:#333; }
  .box { max-width:460px; margin:40px auto; background:#fff; border-radius:12px;
         padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .wide { max-width:1100px; margin:20px auto; background:#fff; border-radius:12px;
          padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:20px; color:#2e7d32; margin:0 0 4px; }
  .sub { font-size:13px; color:#888; margin-bottom:22px; }
  label { display:block; font-size:13px; font-weight:bold; margin:14px 0 5px; }
  input, select, textarea { width:100%; padding:11px; border:1px solid #ddd; border-radius:7px;
          font-size:15px; box-sizing:border-box; font-family:inherit; }
  button { width:100%; padding:13px; margin-top:20px; background:#2e7d32; color:#fff;
           border:none; border-radius:7px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { background:#bbb; cursor:default; }
  .out { margin-top:20px; padding:14px; border-radius:8px; font-size:14px;
         line-height:1.7; display:none; white-space:pre-wrap; word-break:break-all; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }

  .top { display:flex; justify-content:space-between; align-items:center;
         flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .who { font-size:13px; color:#666; }
  .btn-out { width:auto; margin:0; padding:8px 16px; background:#757575; font-size:13px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .tab { width:auto; margin:0; padding:8px 14px; background:#eee; color:#555;
         font-size:13px; font-weight:normal; }
  .tab.on { background:#2e7d32; color:#fff; font-weight:bold; }
  .count { font-size:13px; color:#666; margin-left:auto; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { background:#f1f8e9; color:#33691e; padding:10px 8px; text-align:left;
       border-bottom:2px solid #c5e1a5; font-size:13px; white-space:nowrap; }
  td { padding:10px 8px; border-bottom:1px solid #eee; vertical-align:middle; }
  tr:hover td { background:#fafdf7; }
  .empty { padding:40px; text-align:center; color:#999; font-size:14px; }
  .idcell { color:#8d6e63; font-weight:bold; white-space:nowrap; width:50px; }
  .nowrap { white-space:nowrap; }

  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px;
           white-space:nowrap; }
  .s-wait { background:#fff8e1; color:#e65100; }
  .s-eval { background:#e3f2fd; color:#0d47a1; }
  .s-seat { background:#f3e5f5; color:#6a1b9a; }
  .s-go   { background:#e8f5e9; color:#1b5e20; }
  .s-end  { background:#eceff1; color:#546e7a; }

  /* 오늘 확인할 건 */
  .alert { background:#fff3e0; border:1px solid #ffcc80; border-radius:10px;
           padding:16px 18px; margin-bottom:18px; }
  .alert-t { font-size:15px; font-weight:bold; color:#e65100; margin-bottom:10px; }
  .alert-line { font-size:14px; padding:6px 0; border-bottom:1px dashed #ffcc80;
                cursor:pointer; }
  .alert-line:last-child { border-bottom:none; }
  .alert-line:hover { color:#bf360c; }
  .late { color:#c62828; font-weight:bold; }

  /* 등록 창 · 상세 창 */
  .panel { background:#f1f8e9; border:1px solid #c5e1a5; border-radius:10px;
           padding:18px; margin-bottom:18px; }
  .panel-t { font-size:15px; font-weight:bold; color:#33691e; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
          gap:10px 14px; }
  .grid label { font-size:12.5px; font-weight:bold; margin:0 0 4px; color:#555; }
  .grid input, .grid select, .grid textarea { width:100%; padding:8px 10px; font-size:14px;
          border:1px solid #ddd; border-radius:6px; box-sizing:border-box; }
  .btns { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .hint { font-size:12px; color:#7cb342; margin-top:4px; }

  /* 상담 기록 */
  .logbox { background:#fff; border:1px solid #ddd; border-radius:8px;
            padding:14px; margin-top:14px; }
  .logbox-t { font-size:14px; font-weight:bold; color:#555; margin-bottom:10px; }
  .logrow { font-size:13.5px; padding:8px 0; border-bottom:1px solid #f0f0f0;
            line-height:1.6; }
  .logrow:last-child { border-bottom:none; }
  .logdate { color:#8d6e63; font-weight:bold; margin-right:8px; }
  .logway { display:inline-block; background:#eee; color:#666; border-radius:9px;
            padding:1px 8px; font-size:11.5px; margin-right:8px; }
  .logwho { color:#999; font-size:12px; margin-left:6px; }
  .lognone { color:#999; font-size:13px; padding:8px 0; }
  .openbtn { width:auto; margin:0; padding:5px 12px; background:#8bc34a;
             font-size:12.5px; font-weight:bold; }

  .btn-home { display:inline-block; padding:8px 16px; background:#2e7d32; color:#fff;
              font-size:13px; border-radius:8px; text-decoration:none;
              white-space:nowrap; margin-right:8px; }
  .btn-home:hover { filter:brightness(1.08); }

  /* 평가 관리 — 아동 이름 고르기 */
  .kidlist { position:absolute; z-index:30; left:0; right:0; top:100%;
             background:#fff; border:1px solid #cfd8dc; border-radius:8px;
             max-height:220px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,.12); }
  .kidone { padding:9px 12px; font-size:14px; cursor:pointer; border-bottom:1px solid #f0f0f0; }
  .kidone:last-child { border-bottom:none; }
  .kidone:hover { background:#eef3ec; }
  .kidone .st { font-size:12px; color:#888; margin-left:6px; }
  .kidnone { padding:10px 12px; font-size:13px; color:#999; }
  .kidpick { margin-top:6px; font-size:13.5px; color:#2e7d32; min-height:20px; }
  .kidpick b { font-size:14.5px; }
  .re { display:inline-block; background:#fff3e0; color:#e65100; border-radius:10px;
        padding:1px 8px; font-size:11.5px; font-weight:bold; margin-left:6px; }
  .evrow { display:flex; gap:10px; align-items:center; font-size:13.5px;
           padding:7px 0; border-bottom:1px dashed #e0e0e0; flex-wrap:wrap; }
  .evrow:last-child { border-bottom:none; }
  .evrow .d { color:#555; }
  .evrow .amt { margin-left:auto; font-weight:bold; }
  .evedit { width:auto; margin:0; padding:3px 10px; font-size:11.5px;
            background:#5c6bc0; color:#fff; border:none; border-radius:5px; cursor:pointer; }
  .evtools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .evtools input[type=month] { width:auto; padding:6px 9px; font-size:13px; }
  .evtab { width:auto; margin:0; padding:6px 12px; font-size:12.5px; background:#fff;
           color:#5a6156; border:1px solid #cfd8dc; border-radius:7px; cursor:pointer; }
  .evtab.on { background:#5c6bc0; color:#fff; border-color:#5c6bc0; }
  .evsum { margin-left:auto; font-size:13px; color:#666; }
  .evrow .kn { font-weight:bold; min-width:70px; }
  .evrow .unpaid { color:#c62828; font-weight:bold; }
</style>
</head>
<body>

<!-- 로그인 전 화면 -->
<div class="box" id="loginBox">
  <h1>🌿 나무링크</h1>
  <div class="sub">신규 아동 관리 화면입니다. 로그인하세요.</div>

  <label for="em">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com">

  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">

  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 로그인 후 화면 -->
<div class="wide" id="listBox" style="display:none;">
  <div class="top">
    <div>
      <h1>🌿 신규 아동 관리</h1>
      <div class="who" id="who"></div>
    </div>
    <a href="index.html" class="btn-home">🌿 처음으로</a>
    <button id="out" class="btn-out">로그아웃</button>
  </div>

  <!-- 오늘 확인할 건 -->
  <div class="alert" id="alertBox" style="display:none;">
    <div class="alert-t" id="alertTitle"></div>
    <div id="alertRows"></div>
  </div>

  <div class="tools">
    <button class="tab on" data-st="진행중">진행중</button>
    <button class="tab" data-st="전체">전체</button>
    <button class="tab" data-st="연락 대기">연락 대기</button>
    <button class="tab" data-st="회신 대기">회신 대기</button>
    <button class="tab" data-st="평가 대기">평가 대기</button>
    <button class="tab" data-st="자리 대기">자리 대기</button>
    <button class="tab" data-st="그룹 대기">그룹 대기</button>
    <button class="tab" data-st="일정 조율 중">일정 조율 중</button>
    <button class="tab" data-st="치료 시작">치료 시작</button>
    <button class="tab" data-st="종료">종료</button>
    <input id="findQ" type="text" autocomplete="off" placeholder="🔍 아동 이름으로 찾기"
      style="font:inherit;font-size:14px;padding:6px 11px;border:1px solid #bbb;
             border-radius:6px;width:180px;">
    <button id="addBtn" class="tab" style="background:#8bc34a;color:#fff;font-weight:bold;">＋ 새 문의</button>
    <button id="evBtn" class="tab" style="background:#5c6bc0;color:#fff;font-weight:bold;">📋 평가 관리</button>
    <span class="count" id="count"></span>
  </div>

  <!-- 새 문의 등록 창 -->
  <div id="addBox" class="panel" style="display:none;">
    <div class="panel-t">새 문의 등록</div>
    <div class="grid">
      <div style="grid-column:1 / -1;">
        <label for="k_name" style="display:flex;justify-content:space-between;align-items:baseline;">
          <span>아동 이름 <span style="color:#c62828;">*</span></span>
          <span style="color:#1c1f1a;font-weight:600;">문의일 : <span id="dateTxt"></span></span>
        </label>
        <input id="k_name" type="text" autocomplete="off" placeholder="이름을 넣으세요">
        <div id="dupWarn" style="display:none;margin-top:6px;padding:9px 11px;
             border-radius:6px;background:#fff8e1;border:1px solid #f0c36d;
             color:#8a6116;font-size:13px;line-height:1.6;"></div>
      </div>
      <div>
        <label for="k_birth">생년월일</label>
        <input id="k_birth" type="date">
      </div>
      <div>
        <label for="k_gender">성별</label>
        <select id="k_gender">
          <option value="">-- 고르기 --</option>
          <option value="남">남</option>
          <option value="여">여</option>
        </select>
      </div>
      <div>
        <label for="k_status">아동 상태 <span style="color:#c62828;">*</span></label>
        <select id="k_status">
          <option value="대기중">대기중</option>
          <option value="치료중">치료중</option>
        </select>
      </div>
      <div>
        <label for="k_guardian">보호자</label>
        <input id="k_guardian" type="text" placeholder="예: 모">
      </div>
      <div>
        <label for="k_phone">연락처</label>
        <input id="k_phone" type="text" placeholder="010-0000-0000">
      </div>
      <div>
        <label for="a_channel">유입경로</label>
        <input id="a_channel" type="text" placeholder="전화 / 네이버 / 소개 등">
      </div>
      <div>
        <label for="a_status">문의 상태 <span style="color:#c62828;">*</span></label>
        <select id="a_status"></select>
      </div>
      <div>
        <label for="a_next">다음 확인 날짜</label>
        <input id="a_next" type="date">
      </div>
      <div>
        <label for="a_action">다음 할 일</label>
        <input id="a_action" type="text" placeholder="예: 보호자에게 다시 전화">
      </div>
      <div>
        <label for="pastQ">과거 문의 찾기</label>
        <input id="pastQ" type="text" autocomplete="off" placeholder="🔍 이름 두 글자">
      </div>
      <div id="pastBox" style="grid-column:1 / -1;display:none;padding:10px 12px;
           border:1px solid #90caf9;border-radius:6px;background:#f1f8fe;
           font-size:13px;line-height:1.8;color:#1c1f1a;"></div>
      <div style="grid-column:1 / -1;">
        <label for="k_memo">상담 내용</label>
        <textarea id="k_memo" rows="7" style="font:inherit;font-size:14px;padding:9px 11px;
          border:1px solid #ddd;border-radius:6px;width:100%;line-height:1.7;resize:vertical;"
          placeholder="희망영역 : 언어치료, 감각통합&#10;희망요일 : 화·목 / 금도 가능&#10;희망시간 : 오후 4시 이후, 수요일은 3시부터&#10;아동특징 : 낯가림 심함. 발화 거의 없음&#10;기타 : 형제도 함께 상담 원함"></textarea>
        <div class="hint">희망요일·시간은 여러 개 적어두면 빈 자리 찾기가 쉬워집니다.</div>
      </div>
      <input id="a_child" type="hidden">
      <input id="a_date" type="hidden">
      <input id="a_area" type="hidden">
      <input id="a_day" type="hidden">
      <input id="a_time" type="hidden">
      <input id="a_memo" type="hidden">
    </div>
    <div class="btns">
      <button id="saveNew" class="tab" style="background:#2e7d32;color:#fff;font-weight:bold;">등록하기</button>
      <button id="cancelNew" class="tab">취소</button>
    </div>
    <div id="msgA" class="out"></div>
  </div>

  <!-- 평가 관리 창 -->
  <div id="evBox" class="panel" style="display:none;">
    <div class="panel-t">평가 예약 · 기록</div>

    <div class="grid">
      <div style="grid-column:1 / -1; position:relative;">
        <label for="e_kidq">아동 <span style="color:#c62828;">*</span>
          <span style="font-weight:normal;color:#888;">— 이름을 치면 목록이 뜹니다</span></label>
        <input id="e_kidq" type="text" placeholder="이름 두 글자만 쳐도 됩니다" autocomplete="off">
        <div id="e_kidlist" class="kidlist" style="display:none;"></div>
        <div id="e_kidpick" class="kidpick"></div>
      </div>

      <div>
        <label for="e_date">평가 날짜 <span style="color:#c62828;">*</span></label>
        <input id="e_date" type="date">
      </div>
      <div>
        <label for="e_time">평가 시간</label>
        <input id="e_time" type="time">
      </div>
      <div>
        <label for="e_type">평가 종류</label>
        <select id="e_type"></select>
      </div>
      <div>
        <label for="e_cnt">평가 개수</label>
        <select id="e_cnt">
          <option value="1">1개</option>
          <option value="2">2개</option>
          <option value="3">3개</option>
        </select>
      </div>
      <div>
        <label for="e_thr">담당 치료사</label>
        <select id="e_thr"></select>
      </div>
      <div>
        <label for="e_fee">평가비 <span style="font-weight:normal;color:#888;">— 자동, 고칠 수 있음</span></label>
        <input id="e_fee" type="text" inputmode="numeric" placeholder="0">
      </div>
      <div>
        <label for="e_status">상태</label>
        <select id="e_status">
          <option value="예정">예정</option>
          <option value="완료">완료</option>
          <option value="취소">취소</option>
        </select>
      </div>
      <div>
        <label for="e_paid">납부일</label>
        <input id="e_paid" type="date">
      </div>
      <div>
        <label for="e_card">카드 승인번호</label>
        <input id="e_card" type="text" placeholder="평가일에 받으면 기재">
      </div>
      <div style="grid-column:1 / -1;">
        <label for="e_memo">메모</label>
        <input id="e_memo" type="text" placeholder="예: 타기관 보고서 제출">
      </div>
    </div>

    <div class="btns">
      <button id="evSave" class="tab" style="background:#5c6bc0;color:#fff;font-weight:bold;">저장하기</button>
      <button id="evNew"  class="tab">새로 넣기</button>
      <button id="evClose" class="tab">닫기</button>
    </div>
    <div id="msgE" class="out"></div>

    <div class="logbox">
      <div class="logbox-t">평가 목록</div>
      <div class="evtools">
        <input id="e_mon" type="month">
        <button class="evtab on" data-ev="all">전체</button>
        <button class="evtab" data-ev="예정">예정</button>
        <button class="evtab" data-ev="완료">완료</button>
        <button class="evtab" data-ev="unpaid">미납만</button>
        <button class="evtab" data-ev="kid">고른 아동만</button>
        <span class="evsum" id="evSum"></span>
      </div>
      <div id="evRows"></div>
    </div>
  </div>

  <!-- 상세 · 수정 창 -->
  <div id="detBox" class="panel" style="display:none;">
    <div class="panel-t" id="detTitle"></div>
    <div class="grid">
      <div>
        <label for="d_status">상태</label>
        <select id="d_status"></select>
      </div>
      <div>
        <label for="d_next">다음 확인 날짜</label>
        <input id="d_next" type="date">
      </div>
      <div style="grid-column:span 2;">
        <label for="d_action">다음 할 일</label>
        <input id="d_action" type="text">
      </div>
      <div>
        <label for="d_date">문의일</label>
        <input id="d_date" type="date">
      </div>
      <div>
        <label for="d_channel">유입경로</label>
        <input id="d_channel" type="text">
      </div>
      <div>
        <label for="d_area">희망영역</label>
        <input id="d_area" type="text">
      </div>
      <div>
        <label for="d_day">희망요일</label>
        <input id="d_day" type="text">
      </div>
      <div>
        <label for="d_time">희망시간</label>
        <input id="d_time" type="text">
      </div>
      <div>
        <label for="d_evalplace">평가 장소</label>
        <input id="d_evalplace" type="text">
      </div>
      <div>
        <label for="d_evaldate">평가 날짜</label>
        <input id="d_evaldate" type="date">
      </div>
      <div>
        <label for="d_endreason">종료 사유</label>
        <input id="d_endreason" type="text" placeholder="상태가 종료일 때만">
      </div>
      <div style="grid-column:1 / -1;">
        <label for="d_memo">메모</label>
        <input id="d_memo" type="text">
      </div>
    </div>
    <div class="btns">
      <button id="saveDet" class="tab" style="background:#2e7d32;color:#fff;font-weight:bold;">저장하기</button>
      <button id="closeDet" class="tab">닫기</button>
    </div>
    <div id="msgD" class="out"></div>

    <!-- 상담 기록 -->
    <div class="logbox">
      <div class="logbox-t">상담 기록</div>
      <div id="logRows"></div>
      <div class="grid" style="margin-top:12px;">
        <div>
          <label for="l_date">날짜</label>
          <input id="l_date" type="date">
        </div>
        <div>
          <label for="l_way">방법</label>
          <select id="l_way">
            <option value="전화">전화</option>
            <option value="문자">문자</option>
            <option value="카카오톡">카카오톡</option>
            <option value="방문">방문</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div style="grid-column:1 / -1;">
          <label for="l_content">내용</label>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';

// 로그인을 창(탭) 안에서만 유지한다. 창을 닫으면 자동으로 끊긴다.
const sb  = window.supabase.createClient(URL_, KEY_, {

});
const $   = id => document.getElementById(id);

// 상태 8가지

                '일정 조율 중','치료 시작','종료'];
// 아직 결론이 안 난 상태 (= 진행중)
const LIVE = ['연락 대기','회신 대기','평가 대기','자리 대기','그룹 대기','일정 조율 중'];

// 이 화면을 볼 수 있는 직원 번호. 8=관리자 9=행정
// 나중에 치료사도 보게 하려면 아래 줄에 번호를 더하면 됩니다.
const CAN_SEE = [8, 9];

let ALL = [];        // 문의 전체
let KIDS = [];       // 아동 이름표 (번호 -> 이름)
let ME = null;       // 로그인한 직원
let stFilter = '진행중';
let openId = null;   // 지금 열어본 문의 번호

// ===== 평가 관리 =====
let EVTYPES = [];    // 평가 종류 (심리·발달·언어)
let EVFEES  = [];    // 평가비 기준 (nl_eval_fees)
let THRS    = [];    // 치료사 목록
let EVALS   = [];    // 평가 기록
let evKid   = null;  // 지금 고른 아동
let evEditId = null; // 고치는 중인 평가 번호
let evFilter = 'all'; // 목록 걸러내기 (전체·예정·완료·미납만·고른아동)

function show(text, ok) {
  msg.textContent = text;
  msg.className = 'out ' + (ok ? 'ok' : 'err');
}
function showBox(id, text, ok) {
  $(id).textContent = text;
  $(id).className = 'out ' + (ok ? 'ok' : 'err');
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// 오늘 날짜를 2026-08-14 모양으로
function today() {
  const t = new Date();
  const p = n => String(n).padStart(2, '0');
  return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate());
}
function kidName(cid) {
  const k = KIDS.find(x => x.id === cid);
  return k ? k.name : '(번호 ' + cid + ')';
}
function badge(st) {
  const c = (st === '평가 대기') ? 's-eval'
          : (st === '자리 대기' || st === '그룹 대기') ? 's-seat'
          : (st === '치료 시작') ? 's-go'
          : (st === '종료') ? 's-end' : 's-wait';
  return '<span class="badge ' + c + '">' + esc(st || '미지정') + '</span>';
}
// 상태 고르는 칸 채우기
function fillStatus(id) {
  $(id).innerHTML = STATUS.map(s => '<option value="' + s + '">' + s + '</option>').join('');
}

// ===== 오늘 확인할 건 =====
function drawAlert() {
  const td = today();
  const list = ALL.filter(r =>
    LIVE.indexOf(r.status) >= 0 && r.next_check_date && r.next_check_date <= td
  ).sort((a, b) => (a.next_check_date < b.next_check_date ? -1 : 1));

  if (!list.length) { $('alertBox').style.display = 'none'; return; }

  $('alertBox').style.display = 'block';
  $('alertTitle').textContent = '⏰ 오늘까지 확인할 문의 ' + list.length + '건';
  $('alertRows').innerHTML = list.map(r => {
    const late = r.next_check_date < td;
    const days = late ? Math.round((new Date(td) - new Date(r.next_check_date)) / 86400000) : 0;
    return '<div class="alert-line" data-open="' + r.id + '">'
      + '<b>' + esc(kidName(r.child_id)) + '</b> — ' + esc(r.status)
      + ' · ' + esc(r.next_action || '할 일 안 적힘')
      + ' <span class="' + (late ? 'late' : '') + '">('
      + (late ? days + '일 지남' : '오늘') + ')</span>'
      + '</div>';
  }).join('');

  document.querySelectorAll('.alert-line').forEach(el => {
    el.onclick = () => openDetail(Number(el.dataset.open));
  });
}

// ===== 목록 =====
function draw() {
  const q = ($('findQ') ? $('findQ').value : '').trim().toLowerCase();

  const list = ALL.filter(r => {
    if (q && !kidName(r.child_id).toLowerCase().includes(q)) return false;
    if (stFilter === '전체') return true;
    if (stFilter === '진행중') return LIVE.indexOf(r.status) >= 0;
    return r.status === stFilter;
  });

  $('count').textContent = list.length + '건 / 전체 ' + ALL.length + '건'
    + (q ? ' · 「' + esc(q) + '」 로 찾는 중' : '');
  $('empty').style.display = list.length ? 'none' : 'block';

  const td = today();
  $('rows').innerHTML = list.map(r => {
    const late = r.next_check_date && r.next_check_date <= td
                 && LIVE.indexOf(r.status) >= 0;
    return '<tr>'
      + '<td class="idcell">' + r.id + '</td>'
      + '<td>' + esc(kidName(r.child_id)) + '</td>'
      + '<td class="nowrap">' + esc(r.inquiry_date) + '</td>'
      + '<td>' + badge(r.status) + '</td>'
      + '<td class="nowrap ' + (late ? 'late' : '') + '">'
        + esc(r.next_check_date) + '</td>'
      + '<td>' + esc(r.next_action).slice(0, 30) + '</td>'
      + '<td><button class="openbtn" data-open="' + r.id + '">열기</button></td>'
      + '</tr>';
  }).join('');

  document.querySelectorAll('.openbtn').forEach(el => {
    el.onclick = () => openDetail(Number(el.dataset.open));
  });
  drawAlert();
}

// ===== 상세 열기 =====
async function openDetail(id) {
  const r = ALL.find(x => x.id === id);
  if (!r) return;
  openId = id;

  $('addBox').style.display = 'none';
  $('detBox').style.display = 'block';
  $('detTitle').textContent = '문의 ' + r.id + '번 — ' + kidName(r.child_id);

  $('d_status').value    = r.status || '연락 대기';
  $('d_next').value      = r.next_check_date || '';
  $('d_action').value    = r.next_action || '';
  $('d_date').value      = r.inquiry_date || '';
  $('d_channel').value   = r.channel || '';
  $('d_area').value      = r.wish_area || '';
  $('d_day').value       = r.wish_day || '';
  $('d_time').value      = r.wish_time || '';
  $('d_evalplace').value = r.eval_place || '';
  $('d_evaldate').value  = r.eval_date || '';
  $('d_endreason').value = r.end_reason || '';
  $('d_memo').value      = r.memo || '';
  showBox('msgD', '', true); $('msgD').className = 'out';

  $('l_date').value = today();
  $('l_content').value = '';
  showBox('msgL', '', true); $('msgL').className = 'out';

  await loadLogs(id);
  $('detBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function loadLogs(id) {
  $('logRows').innerHTML = '<div class="lognone">불러오는 중...</div>';
  const { data, error } = await sb
    .from('nl_inquiry_logs')
    .select('id, log_date, way, content, staff_id')
    .eq('inquiry_id', id)
    .order('log_date', { ascending: false })
    .order('id', { ascending: false });

  if (error) {
    $('logRows').innerHTML = '<div class="lognone">기록을 불러오지 못했습니다.</div>';
    return;
  }
  if (!data || !data.length) {
    $('logRows').innerHTML = '<div class="lognone">아직 상담 기록이 없습니다.</div>';
    return;
  }
  $('logRows').innerHTML = data.map(l =>
    '<div class="logrow">'
    + '<span class="logdate">' + esc(l.log_date) + '</span>'
    + '<span class="logway">' + esc(l.way) + '</span>'
    + esc(l.content)
    + '<span class="logwho">· ' + (l.staff_id ? l.staff_id + '번' : '') + '</span>'
    + '</div>'
  ).join('');
}

$('closeDet').onclick = () => { $('detBox').style.display = 'none'; openId = null; };

$('saveDet').onclick = async () => {
  if (!openId) return;
  const up = {
    status:          $('d_status').value,
    next_check_date: $('d_next').value || null,
    next_action:     $('d_action').value.trim() || null,
    inquiry_date:    $('d_date').value || null,
    channel:         $('d_channel').value.trim() || null,
    wish_area:       $('d_area').value.trim() || null,
    wish_day:        $('d_day').value.trim() || null,
    wish_time:       $('d_time').value.trim() || null,
    eval_place:      $('d_evalplace').value.trim() || null,
    eval_date:       $('d_evaldate').value || null,
    end_reason:      $('d_endreason').value.trim() || null,
    memo:            $('d_memo').value.trim() || null,
    updated_at:      new Date().toISOString()
  };

  $('saveDet').disabled = true;
  $('saveDet').textContent = '저장 중...';
  try {
    const { data, error } = await sb.from('nl_inquiries')
      .update(up).eq('id', openId).select().single();
    if (error) throw error;
    const i = ALL.findIndex(x => x.id === openId);
    if (i >= 0) ALL[i] = data;
    draw();
    showBox('msgD', '✅ 저장했습니다.', true);
  } catch (e) {
    showBox('msgD', '❌ 저장하지 못했습니다.\n' + e.message, false);
  } finally {
    $('saveDet').disabled = false;
    $('saveDet').textContent = '저장하기';
  }
};

$('addLog').onclick = async () => {
  if (!openId) return;
  const content = $('l_content').value.trim();
  if (!content) { showBox('msgL', '내용을 적으세요.', false); return; }

  $('addLog').disabled = true;
  $('addLog').textContent = '추가 중...';
  try {
    const { error } = await sb.from('nl_inquiry_logs').insert({
      inquiry_id: openId,
      log_date:   $('l_date').value || today(),
      way:        $('l_way').value,
      content:    content,
      staff_id:   ME ? ME.id : null
    });
    if (error) throw error;
    $('l_content').value = '';
    await loadLogs(openId);
    showBox('msgL', '✅ 기록을 추가했습니다.', true);
  } catch (e) {
    showBox('msgL', '❌ 추가하지 못했습니다.\n' + e.message, false);
  } finally {
    $('addLog').disabled = false;
    $('addLog').textContent = '기록 추가';
  }
};

// ===== 새 문의 등록 =====
// ===== 평가 관리 =====
function evMsg(t, ok) {
  const e = $('msgE');
  e.textContent = t;
  e.className = 'out ' + (ok ? 'ok' : 'err');
  e.style.display = t ? 'block' : 'none';
}

// 아동 이름을 치면 목록을 보여준다
$('e_kidq').addEventListener('input', () => {
  const q = $('e_kidq').value.trim().toLowerCase();
  const box = $('e_kidlist');
  if (!q) { box.style.display = 'none'; return; }

  const hit = KIDS.filter(k => (k.name || '').toLowerCase().includes(q)).slice(0, 20);
  if (!hit.length) {
    box.innerHTML = '<div class="kidnone">그런 이름의 아동이 없습니다.</div>';
  } else {
    box.innerHTML = hit.map(k =>
      '<div class="kidone" data-kid="' + k.id + '">' + esc(k.name)
      + '<span class="st">' + k.id + '번 · ' + esc(k.status) + '</span></div>').join('');
    box.querySelectorAll('.kidone').forEach(el => {
      el.onclick = () => pickKid(Number(el.dataset.kid));
    });
  }
  box.style.display = 'block';
});

// 아동을 고른다
function pickKid(cid) {
  const k = KIDS.find(x => x.id === cid);
  if (!k) return;
  evKid = k;
  $('e_kidq').value = '';
  $('e_kidlist').style.display = 'none';
  // 이미 다니는 아동이면 재평가로 본다
  const isRe = (k.status === '치료중');
  $('e_kidpick').innerHTML = '고른 아동: <b>' + esc(k.name) + '</b> ('
    + k.id + '번 · ' + esc(k.status) + ')'
    + (isRe ? '<span class="re">재평가</span>' : '');
  // 고른 아동의 평가 기록을 바로 보여준다
  evFilter = 'kid';
  document.querySelectorAll('.evtab').forEach(x =>
    x.classList.toggle('on', x.dataset.ev === 'kid'));
  drawEvalList();
}

// 평가 종류·개수를 고르면 평가비를 자동으로 채운다
function autoFee() {
  const tid = Number($('e_type').value);
  const cnt = Number($('e_cnt').value);
  const t = EVTYPES.find(x => x.id === tid);
  const tn = t ? t.name : '';
  // nl_eval_fees 에서 이름이 맞는 것을 찾는다
  let hit = EVFEES.find(f => {
    const n = String(f.name || '');
    if (!n.includes(tn.replace('평가', ''))) return false;
    return n.includes(cnt + '개') || (cnt === 1 && !/[123]개/.test(n));
  });
  if (!hit) hit = EVFEES.find(f => String(f.name || '').includes(tn.replace('평가', '')));
  $('e_fee').value = hit ? Number(hit.amount).toLocaleString() : '';
}
$('e_type').addEventListener('change', autoFee);
$('e_cnt').addEventListener('change', autoFee);

// 평가 목록 그리기
function drawEvalList() {
  const mk  = $('e_mon').value;
  const fil = evFilter;

  let list = EVALS.slice();

  if (fil === 'kid') {
    if (!evKid) {
      $('evRows').innerHTML = '<div class="kidnone">아동을 먼저 고르세요.</div>';
      $('evSum').textContent = '';
      return;
    }
    list = list.filter(e => e.child_id === evKid.id);
  } else {
    if (mk) list = list.filter(e => String(e.eval_date || '').slice(0, 7) === mk);
    if (fil === '예정' || fil === '완료') list = list.filter(e => e.status === fil);
    else if (fil === 'unpaid') list = list.filter(e => !e.paid_on && e.status !== '취소');
  }

  list.sort((a, b) => String(b.eval_date).localeCompare(String(a.eval_date)));

  const total = list.reduce((s, e) => s + Number(e.fee || 0), 0);
  const nUnpaid = list.filter(e => !e.paid_on && e.status !== '취소').length;
  $('evSum').textContent = list.length + '건 · ' + total.toLocaleString() + '원'
    + (nUnpaid ? ' · 미납 ' + nUnpaid + '건' : '');

  if (!list.length) {
    $('evRows').innerHTML = '<div class="kidnone">해당하는 평가 기록이 없습니다.</div>';
    return;
  }

  $('evRows').innerHTML = list.map(e => {
    const t  = EVTYPES.find(x => x.id === e.eval_type_id);
    const th = THRS.find(x => x.id === e.therapist_id);
    const pay = e.paid_on
      ? '납부 ' + e.paid_on
      : (e.status === '취소' ? '—' : '<span class="unpaid">미납</span>');
    return '<div class="evrow">'
      + '<span class="d">' + esc(e.eval_date)
        + (e.eval_time ? ' ' + String(e.eval_time).slice(0,5) : '') + '</span>'
      + '<span class="kn">' + esc(kidName(e.child_id)) + '</span>'
      + '<span>' + esc(t ? t.name : '') + ' ' + e.item_cnt + '개</span>'
      + '<span class="d">' + esc(th ? th.name : '') + '</span>'
      + '<span class="d">' + esc(e.status) + ' · ' + pay + '</span>'
      + '<span class="amt">' + Number(e.fee || 0).toLocaleString() + '원</span>'
      + '<button class="evedit" data-ev="' + e.id + '">고치기</button>'
      + '</div>';
  }).join('');

  $('evRows').querySelectorAll('.evedit').forEach(el => {
    el.onclick = () => loadEval(Number(el.dataset.ev));
  });
}

// 기존 평가를 칸에 불러온다
function loadEval(id) {
  const e = EVALS.find(x => x.id === id);
  if (!e) return;
  evEditId = id;
  $('e_date').value   = e.eval_date || '';
  $('e_time').value   = e.eval_time ? String(e.eval_time).slice(0,5) : '';
  $('e_type').value   = e.eval_type_id || '';
  $('e_cnt').value    = e.item_cnt || 1;
  $('e_thr').value    = e.therapist_id || '';
  $('e_fee').value    = e.fee ? Number(e.fee).toLocaleString() : '';
  $('e_status').value = e.status || '예정';
  $('e_paid').value   = e.paid_on || '';
  $('e_card').value   = e.card_no || '';
  $('e_memo').value   = e.memo || '';
  evMsg('고치는 중입니다. 저장하면 이 기록이 바뀝니다.', true);
}

// 칸 비우기
function clearEvalForm() {
  evEditId = null;
  $('e_date').value = today();
  $('e_time').value = '';
  $('e_cnt').value  = '1';
  $('e_status').value = '예정';
  $('e_paid').value = '';
  $('e_card').value = '';
  $('e_memo').value = '';
  autoFee();
  evMsg('', true);
}

$('evBtn').onclick = () => {
  $('addBox').style.display = 'none';
  $('detBox').style.display = 'none';
  $('evBox').style.display = 'block';
  if (!$('e_mon').value) $('e_mon').value = today().slice(0, 7);
  clearEvalForm();
  drawEvalList();
  $('evBox').scrollIntoView({ behavior:'smooth', block:'start' });
};

// 달을 바꾸면 다시 그린다
$('e_mon').addEventListener('change', () => { drawEvalList(); });

// 전체 / 예정 / 완료 / 미납만 / 고른 아동만
document.querySelectorAll('.evtab').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.evtab').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    evFilter = b.dataset.ev;
    drawEvalList();
  };
});
$('evClose').onclick = () => { $('evBox').style.display = 'none'; };
$('evNew').onclick   = () => { clearEvalForm(); };

$('evSave').onclick = async () => {
  if (!evKid)             { evMsg('아동을 먼저 고르세요.', false); return; }
  if (!$('e_date').value) { evMsg('평가 날짜를 넣으세요.', false); return; }

  const feeNum = parseInt(String($('e_fee').value).replace(/[^0-9]/g, ''), 10);
  const row = {
    child_id:     evKid.id,
    eval_type_id: Number($('e_type').value) || null,
    eval_date:    $('e_date').value,
    eval_time:    $('e_time').value || null,
    therapist_id: Number($('e_thr').value) || null,
    item_cnt:     Number($('e_cnt').value) || 1,
    fee:          isNaN(feeNum) ? 0 : feeNum,
    status:       $('e_status').value,
    paid_on:      $('e_paid').value || null,
    card_no:      $('e_card').value.trim() || null,
    memo:         $('e_memo').value.trim() || null
  };

  $('evSave').disabled = true;
  try {
    let res;
    if (evEditId) res = await sb.from('nl_evaluations').update(row).eq('id', evEditId);
    else          res = await sb.from('nl_evaluations').insert(row);
    if (res.error) throw res.error;

    const { data } = await sb.from('nl_evaluations').select('*');
    EVALS = data || [];
    drawEvalList();
    clearEvalForm();
    evMsg('✅ 저장했습니다.', true);
  } catch (e) {
    evMsg('❌ 저장하지 못했습니다.\n' + e.message, false);
  } finally { $('evSave').disabled = false; }
};

// ===== 과거 문의 찾기 =====
$('pastQ').addEventListener('input', () => {
  const q = $('pastQ').value.trim().toLowerCase();
  const box = $('pastBox');
  if (q.length < 1) { box.style.display = 'none'; return; }

  const kids = KIDS.filter(k => (k.name || '').toLowerCase().includes(q));
  if (!kids.length) {
    box.innerHTML = '「' + esc(q) + '」 로 등록된 아동이 없습니다. 처음 문의하는 아동입니다.';
    box.style.display = 'block';
    return;
  }

  const ids = kids.map(k => k.id);
  const rows = ALL.filter(r => ids.indexOf(r.child_id) >= 0)
                  .sort((a, b) => (b.inquiry_date || '').localeCompare(a.inquiry_date || ''));

  let h = '<b>찾은 아동 ' + kids.length + '명</b><br>'
    + kids.map(k => '　· ' + esc(k.name) + ' (' + k.id + '번 · ' + esc(k.status) + ')').join('<br>');

  if (rows.length) {
    h += '<br><br><b>과거 문의 ' + rows.length + '건</b><br>'
      + rows.slice(0, 8).map(r => '　· ' + esc(r.inquiry_date) + ' · '
          + esc(kidName(r.child_id)) + ' · ' + esc(r.status)
          + (r.next_action ? ' · ' + esc(r.next_action).slice(0, 20) : '')).join('<br>');
    if (rows.length > 8) h += '<br>　… 그 밖에 ' + (rows.length - 8) + '건';
    h += '<br><br>같은 아동이면 「취소」를 누르고 목록에서 그 문의를 열어 고치세요.';
  } else {
    h += '<br><br>이 아동으로 등록된 문의는 없습니다.';
  }

  box.innerHTML = h;
  box.style.display = 'block';
});

// ===== 이름 타이핑 중 같은 이름 알림 =====
function sameNamed(nm) {
  const t = (nm || '').trim();
  if (!t) return [];
  return KIDS.filter(k => (k.name || '').trim() === t);
}

$('k_name').addEventListener('input', () => {
  const hit = sameNamed($('k_name').value);
  const box = $('dupWarn');
  if (!hit.length) { box.style.display = 'none'; return; }
  box.innerHTML = '⚠️ <b>같은 이름이 이미 있습니다.</b><br>'
    + hit.map(k => '　· ' + esc(k.name) + ' (' + k.id + '번 · ' + esc(k.status) + ')').join('<br>')
    + '<br>같은 아동이면 아동 관리 화면에서 확인하세요. 동명이인이면 그대로 진행하세요.';
  box.style.display = 'block';
});

// ===== 관리번호 자동 =====
function nextManagerNo() {
  const yr  = new Date().getFullYear();
  const pre = String(yr) + '01-자라는 ';
  let max = 0;
  KIDS.forEach(c => {
    const t = c.manager_no || '';
    if (t.startsWith(pre)) {
      const n = parseInt(t.slice(pre.length).trim(), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return pre + String(max + 1).padStart(3, '0');
}

$('saveNew').onclick = async () => {
  const nm = $('k_name').value.trim();
  if (!nm) { showBox('msgA', '아동 이름을 넣으세요.', false); return; }
  if (!$('a_date').value) { showBox('msgA', '문의일을 넣으세요.', false); return; }

  const hit = sameNamed(nm);
  if (hit.length) {
    const list = hit.map(k => '  · ' + k.name + ' (' + k.id + '번 · ' + k.status + ')').join('\n');
    if (!confirm('⚠️ 같은 이름이 이미 있습니다.\n\n' + list
      + '\n\n같은 아동이면 「취소」를 누르고\n'
      + '아동 관리 화면에서 확인하세요.\n\n'
      + '동명이인이라 새로 만들어야 하면 「확인」을 누르세요.')) return;
  }

  $('saveNew').disabled = true;
  $('saveNew').textContent = '등록 중...';

  // (1) 아동 먼저 만들기
  let cid = null, kid = null;
  try {
    const { data, error } = await sb.from('nl_children').insert({
      manager_no: nextManagerNo(),
      name:       nm,
      birth:      $('k_birth').value || null,
      gender:     $('k_gender').value || null,
      status:     $('k_status').value,
      guardian:   $('k_guardian').value.trim() || null,
      phone:      $('k_phone').value.trim() || null,
      memo:       $('k_memo').value.trim() || null
    }).select('id, name, status, manager_no').single();
    if (error) throw error;
    kid = data; cid = data.id;
    KIDS.push(data);
  } catch (e) {
    showBox('msgA', '❌ 아동을 만들지 못했습니다.\n' + e.message, false);
    $('saveNew').disabled = false;
    $('saveNew').textContent = '등록하기';
    return;
  }

  // (2) 이어서 문의 만들기
  const row = {
    child_id:        cid,
    inquiry_date:    $('a_date').value,
    channel:         $('a_channel').value.trim() || null,
    wish_area:       $('a_area').value.trim() || null,
    wish_day:        $('a_day').value.trim() || null,
    wish_time:       $('a_time').value.trim() || null,
    status:          $('a_status').value,
    next_check_date: $('a_next').value || null,
    next_action:     $('a_action').value.trim() || null,
    memo:            $('a_memo').value.trim() || null
  };

  try {
    const { data, error } = await sb.from('nl_inquiries')
      .insert(row).select().single();
    if (error) throw error;
    ALL.unshift(data);
    draw();
    showBox('msgA', '✅ 등록했습니다.\n아동 ' + esc(kid.name) + ' (' + cid + '번 · '
      + kid.manager_no + ')\n문의 ' + data.id + '번', true);
    ['a_channel','a_area','a_day','a_time','a_action','a_memo',
     'k_name','k_birth','k_guardian','k_phone','k_memo']
      .forEach(k => $(k).value = '');
    $('k_gender').value = '';
    $('k_status').value = '대기중';
    $('dupWarn').style.display = 'none';
  } catch (e) {
    showBox('msgA', '⚠️ 아동 ' + esc(kid.name) + ' (' + cid + '번) 은 만들어졌으나\n'
      + '문의는 등록하지 못했습니다.\n' + e.message
      + '\n\n아동을 다시 만들지 마세요. 문의만 다시 넣으세요.', false);
  } finally {
    $('saveNew').disabled = false;
    $('saveNew').textContent = '등록하기';
  }
};

// ===== 로그인 후 =====
async function afterLogin(user) {
  const { data: me, error: e1 } = await sb
    .from('nl_therapists')
    .select('id, name, role, active')
    .eq('login_email', user.email.toLowerCase())
    .maybeSingle();

  if (e1)  { show('❌ 직원 조회 실패\n' + e1.message, false); return; }
  if (!me) { show('⚠️ 직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.', false); return; }
  if (CAN_SEE.indexOf(me.id) < 0) {
    show('이 화면은 관리자와 행정만 볼 수 있습니다.', false); return;
  }
  ME = me;

  // 아동 이름표
  const { data: kids, error: e2 } = await sb
    .from('nl_children')
    .select('id, name, status, manager_no')
    .order('name');
  if (e2) { show('❌ 아동 목록 조회 실패\n' + e2.message, false); return; }
  KIDS = kids || [];


  // 문의 목록
  const { data, error } = await sb
    .from('nl_inquiries')
    .select('*')
    .order('inquiry_date', { ascending: false });
  if (error) { show('❌ 문의 목록 조회 실패\n' + error.message, false); return; }
  ALL = data || [];

  // 평가 관리에 쓰는 자료들
  const [et, ef, th, ev] = await Promise.all([
    sb.from('nl_eval_types').select('id, name').order('id'),
    sb.from('nl_eval_fees').select('*').order('id'),
    sb.from('nl_therapists').select('id, name, active').order('id'),
    sb.from('nl_evaluations').select('*')
  ]);
  EVTYPES = et.data || [];
  EVFEES  = (ef.data || []).filter(x => x.active !== false);
  THRS    = (th.data || []).filter(x => x.active !== false);
  EVALS   = ev.data || [];

  $('e_type').innerHTML = EVTYPES.map(t =>
    '<option value="' + t.id + '">' + esc(t.name) + '</option>').join('');
  $('e_thr').innerHTML = '<option value="">— 담당 고르기 —</option>'
    + THRS.filter(t => t.id <= 7).map(t =>
        '<option value="' + t.id + '">' + esc(t.name) + '</option>').join('');

  $('who').textContent = me.name + ' (' + me.role + ') 님으로 로그인됨';
  $('loginBox').style.display = 'none';
  $('listBox').style.display  = 'block';
  draw();
}

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show('이메일과 비밀번호를 모두 입력하세요.', false); return; }

  $('btn').disabled = true;
  $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show('❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false;
    $('btn').textContent = '로그인';
  }
};

$('out').onclick = async () => {
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
};

  else {
    // 로그인이 없으면 첫 화면으로 보낸다 (빈 화면이 열리는 것을 막기 위함)

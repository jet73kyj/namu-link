<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치료 기록지 - 나무링크</title>
<style>
  body { font-family:'Malgun Gothic','맑은 고딕',sans-serif; background:#f5f7fa; margin:0; }
  header { background:#2e7d32; color:white; padding:12px 24px; display:flex; align-items:center; gap:12px; }
  .container { max-width:1000px; margin:16px auto; padding:0 16px; }
  .page-title { font-size:18px; font-weight:bold; color:#2e7d32; margin:10px 0; }
  .form-actions { display:flex; gap:8px; margin:12px 0; }
  .form-actions button { padding:8px 18px; border:none; border-radius:6px;
                         font-size:13px; font-weight:bold; cursor:pointer; }
  .btn-save { background:#2e7d32; color:white; }
  .btn-print { background:#1565c0; color:white; }
  .sheet { background:white; padding:26px 32px; border:1px solid #ddd;
           box-shadow:0 1px 4px rgba(0,0,0,0.05); margin-bottom:22px; }
  .sheet h2.title { text-align:center; font-size:16px; margin:0 0 4px; letter-spacing:2px; }
  .sheet .subtitle { text-align:center; font-size:12px; color:#777; margin-bottom:14px; }
  .rec-tbl { border-collapse:collapse; width:100%; font-size:12px; table-layout:fixed; }
  .rec-tbl td, .rec-tbl th { border:1px solid #333; padding:5px 8px; vertical-align:top; }
  .rec-tbl td.lbl { background:#f5f5f5; font-weight:bold; text-align:center; vertical-align:middle; }
  .rec-tbl th { background:#f0f4c3; font-weight:bold; text-align:center; }
  .side { background:#f5f5f5; font-weight:bold; text-align:center; vertical-align:middle;
          width:54px; letter-spacing:2px; }
  .memo-cell { background:#fffdf5; }
  .memo-tag { font-size:10px; color:#a9701c; font-weight:bold; }
  input[type=text], textarea { border:1px solid #ccc; padding:3px 6px; font-size:12px;
    font-family:inherit; box-sizing:border-box; width:100%; }
  textarea { resize:vertical; min-height:44px; }
  .sign { text-align:center; font-size:12.5px; line-height:2.4; margin-top:22px; }
  .sign .line { margin-top:6px; }

  .loginbox { max-width:400px; margin:56px auto; background:#fff; border-radius:12px;
              padding:32px; border:1px solid #e0e0e0; }
  .loginbox input { border:1px solid #ddd; padding:11px; border-radius:7px; font-size:15px; }
  .out { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13.5px;
         line-height:1.6; display:none; white-space:pre-wrap; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }
  .picker { max-width:1000px; margin:14px auto 0; padding:0 16px; display:flex;
            gap:8px; align-items:center; flex-wrap:wrap; }
  .picker select, .picker input { width:auto; font-size:13px; padding:7px 9px;
            border:1px solid #ccc; border-radius:6px; }
  .picker button { background:#2e7d32; color:#fff; border:none; border-radius:6px;
                   padding:8px 16px; font-size:13px; font-weight:bold; cursor:pointer; }
  .picker #pInfo { font-size:12.5px; color:#777; margin-left:4px; }

  @media print {
    @page { size:A4 portrait; margin:8mm 8mm; }
    header, .form-actions, .page-title, .picker, .no-print { display:none !important; }
    body { background:white; }
    .container { max-width:none; margin:0; padding:0; }
    .sheet { border:none; box-shadow:none; padding:0; margin:0; }
    .rec-tbl { font-size:10.5px; }
    .rec-tbl td, .rec-tbl th { padding:4px 6px; }
    input, textarea { border:none; padding:1px 3px; font-size:10.5px; background:transparent; }
    textarea { min-height:36px; }
    .memo-row { display:none !important; }   /* 치료사 메모는 인쇄에 안 나옴 */
  }
</style>
</head>
<body>

<!-- 로그인 전 -->
<div class="loginbox" id="loginBox">
  <h1 style="font-size:19px;margin:0 0 4px;color:#2e7d32;">치료 기록지</h1>
  <div style="font-size:13px;color:#888;margin-bottom:20px;">나무링크</div>
  <label style="display:block;font-size:12px;color:#666;margin:12px 0 5px;">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com" style="width:100%;">

<div id="mainBox" style="display:none;">
<header>

  <button onclick="logout()" class="no-print" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;">로그아웃</button>

  <div class="sheet">

    <table class="rec-tbl" style="margin-top:-1px;">
      <colgroup>
        <col style="width:14%;"><col style="width:30%;"><col style="width:30%;"><col>
      </colgroup>
      <tr>
        <th>회 기</th>
        <th>오늘 활동</th>
        <th>아동 반응</th>
        <th>가정 과제</th>
      </tr>
      <tbody id="seqBody"></tbody>

    <table class="rec-tbl" style="margin-top:-1px;">
      <colgroup><col style="width:14%;"><col></colgroup>
      <tr>
        <td class="lbl">이번 달 총평</td>
        <td><textarea id="f_sum" style="min-height:52px;"></textarea></td>
      </tr>
      <tr>
        <td class="lbl">보호자<br>전달사항</td>
        <td><textarea id="f_guard" style="min-height:52px;"></textarea></td>

    <div class="sign">
      <div class="line" id="signDate">20&nbsp;&nbsp;&nbsp;년&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;월&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;일</div>
      <div class="line">담당치료사 <span id="signThr" style="display:inline-block;min-width:110px;border-bottom:1px solid #999;">&nbsp;</span> (인)</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
// 로그인을 창(탭) 안에서만 유지한다. 창을 닫으면 자동으로 끊긴다.
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: {
    storage: nlStore,
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false
  }
});
const $  = id => document.getElementById(id);

const SESSIONS = 4;          // 센터비용 = 월 4회
const SUPPORT  = 1;          // 센터비용
const TTYPE = { 1:'언어치료', 2:'작업치료', 3:'전산화인지치료',
                4:'감각통합치료', 5:'음악치료', 6:'일상자립' };

let ME = null, PAIRS = [], THERAPISTS = {};
let cur = null, SCHED = [], LOGID = null, ITEMS = [], PREV = null, WRITTEN = null;
let year = new Date().getFullYear();
let month = new Date().getMonth() + 1;
let LOADED = false;

function show(el, t, ok) { el.textContent = t; el.className = 'out ' + (ok ? 'ok' : 'err'); }
function esc(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mkNow() { return year + '-' + String(month).padStart(2,'0'); }
async function logout() {
  nlKeepOff();
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
}
function fmtBirth(b) {
  if (!b) return '';
  const s = String(b).replace(/\D/g,'');
  if (s.length < 8) return b;
  return s.slice(0,4) + '.' + s.slice(4,6) + '.' + s.slice(6,8);
}
function _hm(v) { const m = String(v||'').match(/(\d{1,2}):(\d{2})/);
  return m ? m[1].padStart(2,'0') + ':' + m[2] : null; }


// ─────────────────────────────────────────────
// 권한 — 관리자·행정은 전체, 치료사는 담당 아동만, 홍보는 못 들어옴
// ─────────────────────────────────────────────
function _roleOf(r) { return String(r || '').trim(); }
function _isAllView(r) { const x = _roleOf(r); return x === '관리자' || x === '행정'; }
function _isBlocked(r) { return _roleOf(r) === '홍보'; }
function _blockScreen(role) {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainBox').style.display = 'none';
  const b = document.createElement('div');
  b.style.cssText = 'max-width:420px;margin:80px auto;background:#fff;border-radius:12px;'
    + 'padding:34px;border:1px solid #e0e0e0;text-align:center;font-family:inherit;';
  b.innerHTML = '<div style="font-size:34px;margin-bottom:10px;">\uD83D\uDD12</div>'
    + '<div style="font-size:16px;font-weight:bold;color:#2e7d32;margin-bottom:8px;">'
    + '이 화면은 볼 수 없습니다</div>'
    + '<div style="font-size:13px;color:#666;line-height:1.8;">'
    + '치료 기록지는 관리자 · 행정 · 담당 치료사만 볼 수 있습니다.<br>'
    + '현재 역할: <b>' + _roleOf(role) + '</b></div>'
    + '<button onclick="logout()" style="margin-top:20px;background:#2e7d32;color:#fff;'
    + 'border:none;border-radius:7px;padding:10px 20px;font-size:14px;cursor:pointer;">로그아웃</button>';
  document.body.appendChild(b);
}

// ── 로그인 ──
// 끝난 수업도 두 달까지는 목록에 남긴다 (치료사가 기록지를 쓸 시간을 준다)
//   보기: 8월 말 종결 → 10월까지 보임
function _keepMk(mk) {
  const y = Number(String(mk).slice(0,4));
  const m = Number(String(mk).slice(5,7)) - 2;
  const y2 = y + Math.floor((m - 1) / 12);
  const m2 = ((m - 1) % 12 + 12) % 12 + 1;
  return y2 + '-' + String(m2).padStart(2,'0');
}

async function afterLogin(user) {
  const { data: me, error: e1 } = await sb
    .from('nl_therapists').select('id, name, role')
    .eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (e1)  { show($('msg'), '❌ 직원 조회 실패\n' + e1.message, false); return; }
  if (!me) { show($('msg'), '⚠️ 직원 표에 이 이메일이 없습니다.', false); return; }
  nlKeep(me.id);   // 대표(8번)만 로그인을 브라우저에 남긴다
  ME = me;
  if (_isBlocked(me.role)) { _blockScreen(me.role); return; }

  const [th, tp] = await Promise.all([
    sb.from('nl_therapists').select('id, name'),
    sb.from('nl_therapies')
      .select('id, child_id, therapy_type_id, ended_on, nl_children!inner(id, name, birth, manager_no, status), nl_therapy_schedules(weekday, start_time, therapist_id, duration, to_month)')
      .eq('support_type_id', SUPPORT)
  ]);
  (th.data || []).forEach(t => THERAPISTS[t.id] = t.name);

  const mineOnly = !_isAllView(me.role);
  const _mk0 = mkNow();

  // 기록지는 한 달에 아동당 한 장이다. 요일이 여럿이어도 한 줄로 모은다.
  const _keep0 = _keepMk(_mk0);
  const byKid = {};
  (tp.data || []).forEach(r => {
    const c = r.nl_children;
    if (!c) return;
    // 끝난 수업도 두 달까지는 남긴다 (기록지를 쓸 시간을 준다)
    if (r.ended_on && String(r.ended_on).slice(0,7) < _keep0) return;
    const sc = (r.nl_therapy_schedules || [])
      .filter(s => !s.to_month || s.to_month >= _keep0);
    if (!sc.length) return;
    // 치료사면 자기가 담당인 수업이 하나라도 있어야 한다
    if (mineOnly && !sc.some(x => String(x.therapist_id) === String(me.id))) return;

    const g = byKid[c.id] = byKid[c.id] || {
      child: c, therapy_id: r.id, therapy_type_id: r.therapy_type_id,
      tts: [], sched: [] };
    if (g.tts.indexOf(r.therapy_type_id) < 0) g.tts.push(r.therapy_type_id);
    sc.forEach(s => g.sched.push(s));
  });

  PAIRS = Object.keys(byKid).map(k => byKid[k]);
  PAIRS.sort((a,b) => (a.child.name||'').localeCompare(b.child.name||''));

  $('pChild').innerHTML = '<option value="">— 아동을 고르세요 —</option>'
    + PAIRS.map((p,i) => {
        const tt = p.tts.map(v => TTYPE[v] || '').filter(v => v).join('·');
        const wd = [...new Set(p.sched.map(s => s.weekday).filter(v => v))].join('·');
        return '<option value="' + i + '">' + esc(p.child.name)
             + (tt ? ' · ' + esc(tt) : '')
             + (wd ? ' · ' + esc(wd) : '') + '</option>';
      }).join('');
  $('pMonth').value = mkNow();
  $('who').textContent = me.name + ' (' + me.role + ') 님 · 센터비용 ' + PAIRS.length + '건'
    + (_isAllView(me.role) ? '' : ' (담당)');
  $('loginBox').style.display = 'none';
  $('mainBox').style.display  = 'block';
}

// ── 불러오기 ──
async function loadOne() {
  const idx = $('pChild').value;
  const mv  = $('pMonth').value;
  if (idx === '') { alert('아동을 고르세요.'); return; }
  if (!mv) { alert('달을 고르세요.'); return; }

  cur = PAIRS[Number(idx)];
  SCHED = cur.sched || [];
  year  = parseInt(mv.split('-')[0], 10);
  month = parseInt(mv.split('-')[1], 10);
  const mk = mkNow();

  $('pLoad').disabled = true; $('pLoad').textContent = '불러오는 중...';
  try {
    const [lg, pr] = await Promise.all([
      sb.from('nl_session_logs').select('*')
        .eq('child_id', cur.child.id).eq('support_type_id', SUPPORT)
        .eq('therapy_id', cur.therapy_id).eq('month_key', mk).maybeSingle(),
      sb.from('nl_session_logs').select('*')
        .eq('child_id', cur.child.id).eq('support_type_id', SUPPORT)
        .eq('therapy_id', cur.therapy_id).lt('month_key', mk)
        .order('month_key', { ascending: false }).limit(1)
    ]);

    LOGID = lg.data ? lg.data.id : null;
    PREV  = (pr.data || [])[0] || null;
    ITEMS = [];
    if (LOGID) {
      const it = await sb.from('nl_session_items').select('*')
        .eq('log_id', LOGID).order('seq_no');
      ITEMS = it.data || [];
    }
    LOADED = true;
    $('pInfo').textContent = mk + (LOGID ? ' · 저장된 기록 있음' : ' · 새로 작성');
    drawAll(lg.data);
  } catch (e) {
    alert('불러오지 못했습니다.\n' + e.message);
  } finally {
    $('pLoad').disabled = false; $('pLoad').textContent = '불러오기';
  }
}

// 그 달 수업일 (최대 4회)
function _classDays() {
  const M = { 일:0, 월:1, 화:2, 수:3, 목:4, 금:5, 토:6 };
  const dows = [...new Set(SCHED.map(s => M[s.weekday]).filter(v => v !== undefined))];
  if (!dows.length) return [];
  const last = new Date(year, month, 0).getDate();
  const out = [];
  for (let d = 1; d <= last; d++) {
    if (dows.includes(new Date(year, month - 1, d).getDay())) out.push(d);
  }
  return out.slice(0, SESSIONS);
}
function _timeText() {
  if (!SCHED.length || !SCHED[0].start_time) return '';
  const p = String(SCHED[0].start_time).split(':');
  let h = parseInt(p[0],10), m = parseInt(p[1]||'0',10);
  const s = h + ':' + String(m).padStart(2,'0');
  m += (SCHED[0].duration || 40); h += Math.floor(m/60); m %= 60;
  return s + '-' + h + ':' + String(m).padStart(2,'0');
}

function drawAll(saved) {
  const c = cur.child;
  const area = TTYPE[cur.therapy_type_id] || '';
  const tname = SCHED.length ? (THERAPISTS[SCHED[0].therapist_id] || '') : '';

  $('pageTitle').textContent = `치료 기록지 — ${c.name} · ${area} · ${year}년 ${month}월`;
  $('sheetTitle').textContent = `${year}년 ${month}월 치료 기록지`;
  $('sheetSub').textContent = '자라는나무 · ' + area;

  $('f_name').value  = c.name || '';
  $('f_birth').value = fmtBirth(c.birth);
  $('f_area').value  = area;
  $('f_thr').value   = tname;

  const pick = k => (saved && saved[k]) || '';
  $('f_goal').value  = pick('goal_short') || (PREV && !saved ? (PREV.next_plan || '') : '');
  $('f_sum').value   = pick('month_summary');
  $('f_guard').value = pick('guardian_note');
  $('f_next').value  = pick('next_plan');

  // 작성일 = 그 달 마지막 수업일
  let wd = saved && saved.written_on ? String(saved.written_on) : '';
  if (!wd) {
    const ds = _classDays();
    if (ds.length) wd = year + '-' + String(month).padStart(2,'0')
                      + '-' + String(ds[ds.length-1]).padStart(2,'0');
  }
  WRITTEN = wd || null;
  $('signDate').innerHTML = wd
    ? `${wd.slice(0,4)}년 ${parseInt(wd.slice(5,7),10)}월 ${parseInt(wd.slice(8,10),10)}일`
    : '20&nbsp;&nbsp;&nbsp;년&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;월&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;일';
  $('signThr').textContent = tname || '\u00a0';

  if (!saved && PREV) {
    $('pInfo').textContent += ' · 지난 기록(' + PREV.month_key + ')의 다음 달 계획을 목표로 가져왔습니다';
  }
  buildSeq();
}

function buildSeq() {
  const days = _classDays();
  const tt = _timeText();
  const tb = $('seqBody');
  tb.innerHTML = '';
  for (let i = 0; i < SESSIONS; i++) {
    const it = ITEMS[i] || {};
    const d  = it.service_date ? parseInt(String(it.service_date).slice(8,10),10) : days[i];
    const st = it.start_time ? String(it.start_time).slice(0,5) : '';
    const en = it.end_time   ? String(it.end_time).slice(0,5)   : '';
    const timeVal = (st && en) ? (st + '-' + en) : tt;

    const tr = document.createElement('tr');
    tr.innerHTML =
        '<td style="text-align:center;">'
      + '<div style="font-weight:bold;margin-bottom:4px;">' + (i+1) + '회</div>'
      + '<input type="text" class="q_date" value="' + (d ? month + '월 ' + d + '일' : '') + '" style="text-align:center;">'
      + '<input type="text" class="q_time" value="' + esc(timeVal) + '" style="text-align:center;margin-top:3px;">'
      + '<div style="font-size:10px;color:#999;margin-top:3px;">결석이면 비우세요</div>'
      + '</td>'
      + '<td><textarea class="q_content">' + esc(it.content || '') + '</textarea></td>'
      + '<td><textarea class="q_react">' + esc(it.reaction || '') + '</textarea></td>'
      + '<td><textarea class="q_home">' + esc(it.homework || '') + '</textarea></td>';
    tb.appendChild(tr);

    // 치료사 메모 — 학부모에게 안 나가고 인쇄에도 안 나옴
    const tr2 = document.createElement('tr');
    tr2.className = 'memo-row no-print';
    tr2.innerHTML = '<td class="memo-cell" style="text-align:center;">'
      + '<span class="memo-tag">치료사 메모</span></td>'
      + '<td class="memo-cell" colspan="3">'
      + '<textarea class="q_memo" style="min-height:34px;background:#fffdf5;" '
      + 'placeholder="학부모에게 보이지 않습니다">' + esc(it.staff_memo || '') + '</textarea></td>';
    tb.appendChild(tr2);
  }
}

// ── 저장 ──
async function saveRecord() {
  if (!LOADED || !cur) { alert('먼저 아동과 달을 고르고 [불러오기]를 누르세요.'); return; }
  const mk = mkNow();
  try {
    const logRow = {
      child_id: cur.child.id, support_type_id: SUPPORT,
      therapy_id: cur.therapy_id, month_key: mk,
      therapist_id: SCHED.length ? SCHED[0].therapist_id : null,
      goal_short:     $('f_goal').value  || null,
      month_summary:  $('f_sum').value   || null,
      guardian_note:  $('f_guard').value || null,
      next_plan:      $('f_next').value  || null,
      area_text:      $('f_area').value  || null,
      written_on:     WRITTEN || null,
      updated_at:     new Date().toISOString()
    };
    let saved;
    if (LOGID) {
      const r = await sb.from('nl_session_logs').update(logRow)
        .eq('id', LOGID).select('id').single();
      if (r.error) throw r.error;
      saved = r.data;
    } else {
      const r = await sb.from('nl_session_logs').insert(logRow).select('id').single();
      if (r.error) throw r.error;
      saved = r.data;
    }
    LOGID = saved.id;

    const del = await sb.from('nl_session_items').delete().eq('log_id', LOGID);
    if (del.error) throw del.error;

    const trs = document.querySelectorAll('#seqBody tr:not(.memo-row)');
    const memos = document.querySelectorAll('#seqBody tr.memo-row');
    const items = [];
    trs.forEach((tr, i) => {
      const dtxt = tr.querySelector('.q_date').value;
      const dm = dtxt.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
      const iso = dm ? year + '-' + String(dm[1]).padStart(2,'0')
                             + '-' + String(dm[2]).padStart(2,'0') : null;
      const tv = tr.querySelector('.q_time').value.split(/[-~]/);
      const memoEl = memos[i] ? memos[i].querySelector('.q_memo') : null;
      items.push({
        log_id: LOGID, seq_no: i + 1,
        service_date: iso,
        start_time: _hm(tv[0] || ''),
        end_time:   _hm(tv[1] || ''),
        therapist_id: SCHED.length ? SCHED[0].therapist_id : null,
        content:  tr.querySelector('.q_content').value || null,
        reaction: tr.querySelector('.q_react').value || null,
        homework: tr.querySelector('.q_home').value || null,
        staff_memo: memoEl ? (memoEl.value || null) : null,
        status: iso ? '출석' : null
      });
    });
    const ins = await sb.from('nl_session_items').insert(items);
    if (ins.error) throw ins.error;

    ITEMS = items;
    alert('✅ 저장되었습니다.');
    $('pInfo').textContent = mk + ' · 저장됨';
  } catch (e) {
    alert('❌ 저장하지 못했습니다.\n' + e.message);
  }
}

$('pLoad').onclick = loadOne;
$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show($('msg'), '이메일과 비밀번호를 모두 입력하세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show($('msg'), '❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false; $('btn').textContent = '로그인';
  }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
  else {
    // 로그인이 없으면 첫 화면으로 보낸다 (빈 화면이 열리는 것을 막기 위함)
    location.replace('index.html');
  }
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매일 점검 - 나무링크</title>
<style>
  :root{
    --bg:#F5F4F2; --sf:#FFFFFF; --line:#ECE8E3; --tx:#2F2926; --dim:#A39C95;
    --cam:#B07A4A; --camL:#F8F1E8; --camB:#C9A27E;
    --sage:#5E9A6E; --coral:#D8684A; --coralL:#FCEFEA; --coralT:#993C1D;
  }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg);
         margin:0; padding:0; color:var(--tx); }
  .hd { background:var(--sf); border-bottom:1px solid var(--line);
        display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        padding:10px 16px; }
  .hd img.lg { height:22px; display:block; }
  .hd .bar { width:1px; height:16px; background:var(--line); }
  .hd h1 { font-size:15px; font-weight:600; margin:0; color:var(--tx); }
  .hd .who { font-size:12px; color:var(--dim); }
  .hd .sp { flex:1 1 auto; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  button { font:inherit; border-radius:8px; padding:6px 13px; font-size:13px;
           background:var(--sf); color:var(--tx); border:1px solid var(--dim);
           cursor:pointer; font-weight:500; }
  button:hover { background:var(--camL); }
  button.grey { border-color:var(--line); color:var(--cam); }
  button.grey:hover { background:var(--camL); }
  select { font:inherit; font-size:13px; padding:6px 9px; border-radius:8px;
           border:1px solid var(--line); background:var(--sf); color:var(--tx); }
  .card { background:var(--sf); border:1px solid var(--line); border-radius:12px;
          padding:18px 20px; margin-bottom:14px; }
  .ok { background:var(--sf); border-left:3px solid var(--sage);
        padding:22px; text-align:center; font-size:16px; font-weight:600;
        color:var(--tx); }
  .ok .sub { font-size:13px; font-weight:400; color:var(--dim); margin-top:7px; }
  .grp { margin-bottom:22px; border-left:3px solid var(--coral); padding-left:13px; }
  .grp:last-child { margin-bottom:0; }
  .grp-t { font-size:14px; font-weight:600; color:var(--tx); margin-bottom:3px; }
  .grp-n { display:inline-block; background:var(--coralL); color:var(--coralT);
           border-radius:10px; padding:1px 9px; font-size:12px;
           margin-left:6px; vertical-align:1px; font-weight:500; }
  .grp-why { font-size:12.5px; color:var(--dim); margin-bottom:9px;
             line-height:1.6; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:var(--camL); color:#4A1B0C; text-align:left; font-weight:500;
       padding:6px 10px; border-bottom:1px solid var(--camB); white-space:nowrap; }
  td { padding:7px 10px; border-bottom:1px solid #F0EEEA; }
  tr:last-child td { border-bottom:none; }
  .cid { font-weight:500; color:var(--cam); white-space:nowrap; }
  .sum { font-size:13px; color:var(--dim); margin-bottom:14px; }
  .err { background:var(--sf); border-left:3px solid var(--coral);
         padding:14px 16px; color:var(--coralT); font-size:13.5px;
         white-space:pre-wrap; line-height:1.7; }
  .load { text-align:center; padding:34px; color:var(--dim); font-size:14px; }
  .note { font-size:12px; color:var(--dim); line-height:1.8; margin-top:16px; }
</style>
</head>

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function monNo(k){ return Number(String(k).slice(5,7)); }

// 아동 번호 → 이름 (점검 결과에 나온 아동만 가져온다)
let KIDNM = {};
async function loadNames(ids){
  KIDNM = {};
  if (!ids.length) return;
  try {
    const { data } = await sb.from('nl_children').select('id, name').in('id', ids);
    (data || []).forEach(function(c){ KIDNM[c.id] = c.name || ''; });
  } catch (e) {}
}
// 22번(지난달 기록지 미작성)은 선생님별로 묶는다 (2026-09-21 은정님)
//   서버 글 「2026-08 · 센터 · ○○○ 선생님 · 4회 중 1회 미작성」을 나눠
//   제목 「3번 ○○○ 선생님」 아래 「28번 ○○○ · 센터 · 4회 중 1회 미작성」
let THNO = {};
function logByTh(list){
  const g = {}, ord = [];
  list.forEach(function(r){
    const p = String(r['내용'] || '').split(' · ');
    const th = (p[2] || '').replace(/\s*선생님$/, '');
    const key = th || '?';
    if (!g[key]) { g[key] = []; ord.push(key); }
    g[key].push({ cid: r['아동'], sp: p[1] || '', cnt: p[3] || '' });
  });
  const noOf = function(nm){
    const m = /^(\d+)번$/.exec(nm);
    if (m) return Number(m[1]);
    return THNO[nm] != null ? Number(THNO[nm]) : 999;
  };
  ord.sort(function(a, b){ return noOf(a) - noOf(b); });
  let h = '';
  ord.forEach(function(nm){
    const n = noOf(nm);
    const head = /^\d+번$/.test(nm) ? nm : ((n < 999 ? n + '번 ' : '') + nm);
    h += '<div style="margin:0 0 14px;">'
       + '<div style="font-weight:bold;padding:6px 0;border-bottom:1px solid var(--line,#ECE8E3);">'
       + esc(head) + ' 선생님 <span style="font-weight:normal;color:var(--dim);font-size:12px;">'
       + g[nm].length + '명</span></div>';
    g[nm].sort(function(a, b){ return Number(a.cid) - Number(b.cid); }).forEach(function(x){
      h += '<div style="padding:5px 0 5px 12px;">' + esc(kidTxt(x.cid))
         + ' · ' + esc(x.sp) + ' · ' + esc(x.cnt) + '</div>';
    });
    h += '</div>';
  });
  return h;
}
function kidTxt(no){
  const nm = KIDNM[Number(no)];
  return no + '번' + (nm ? ' ' + nm : '');
}

// 달 고르기 — 지난 6달부터 다음 3달까지
function fillMon(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  let html = '';
  for (let i = -6; i <= 3; i++) {
    const d = new Date(y, m + i, 1);
    const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    html += '<option value="' + k + '"' + (i === 0 ? ' selected' : '') + '>'
          + d.getFullYear() + '년 ' + (d.getMonth()+1) + '월</option>';
  }
  $('mon').innerHTML = html;
}

async function run(){
  const k = $('mon').value;
  $('body').innerHTML = '<div class="load">' + monNo(k) + '월을 점검하고 있습니다…</div>';
  const { data, error } = await sb.rpc('nl_daily_check', { p_month: k });
  if (error) {
    $('body').innerHTML = '<div class="err">점검하지 못했습니다.\n' + esc(error.message) + '</div>';
    return;
  }
  const rows = data || [];
  if (!rows.length) {
    $('body').innerHTML = '<div class="ok">' + monNo(k) + '월 — 어긋난 것이 없습니다'
      + '<div class="sub">모든 항목을 살펴봤습니다. 가벼운 마음으로 시작하세요.</div></div>';
    return;
  }

  // 22번을 선생님별로 묶을 때 쓸 선생님 번호 (2026-09-21)
  THNO = {};
  try {
    const { data: th } = await sb.from('nl_therapists').select('id, name');
    (th || []).forEach(function(t){ if (t.name) THNO[t.name] = t.id; });
  } catch (e) {}

  // 아동 이름을 함께 보여 준다 (2026-09-13)
  await loadNames(Array.from(new Set(rows.map(function(r){ return Number(r['아동']); })
                                         .filter(function(v){ return v; }))));

  // 항목별로 묶는다
  const grp = {}, ord = [];
  rows.forEach(function(r){
    const t = String(r['항목'] || '');
    if (!grp[t]) { grp[t] = []; ord.push(t); }
    grp[t].push(r);
  });

  let h = '<div class="card">';
  h += '<div class="sum"><b>' + monNo(k) + '월</b> — 살펴볼 것이 '
     + rows.length + '건 있습니다.</div>';
  ord.forEach(function(t){
    const list = grp[t];
    const no = String(t).split(' ')[0];
    h += '<div class="grp">'
      + '<div class="grp-t">' + esc(t.replace(/^\d+\s*/, ''))
      + '<span class="grp-n">' + list.length + '건</span></div>'
      + '<div class="grp-why">' + esc(WHY[no] || '') + '</div>'
      + (no === '22'
          ? '<div style="margin:0 0 12px;">'
            + '<button id="sendLog" style="width:auto;margin:0;">선생님께 알림 보내기</button>'
            + '<span id="sendLogMsg" style="font-size:12px;color:var(--dim);margin-left:8px;">'
            + '같은 달은 한 번만 갑니다</span></div>'
          : '')
      ;
    if (no === '22') { h += logByTh(list) + '</div>'; return; }
    h += '<table><tr><th style="width:150px;">아동</th><th>내용</th></tr>';
    list.forEach(function(r){
      h += '<tr><td class="cid">' + esc(kidTxt(r['아동'])) + '</td>'
         + '<td>' + esc(r['내용']) + '</td></tr>';
    });
    h += '</table></div>';
  });
  h += '<div class="note">※ 아동 이름이 나오므로 캡처해서 올리실 때는 이름을 가려 주세요.<br>'
     + '※ 고치는 방법을 모르시겠으면 이 화면을 캡처해 물어보세요.</div>';
  h += '</div>';
  $('body').innerHTML = h;

  // 「선생님께 알림 보내기」 — 22번(지난달 기록지 미작성) 상자에만 있다 (2026-09-19)
  const sbtn = $('sendLog');
  if (sbtn) sbtn.onclick = async function(){
    const pm = prevMk(k);
    if (!confirm('담당 선생님께 ' + pm + ' 기록지 알림을 보낼까요?\n\n'
      + '· 선생님 화면 🔔 에 뜹니다\n'
      + '· 같은 달 알림은 두 번 가지 않습니다')) return;
    sbtn.disabled = true; sbtn.textContent = '보내는 중…';
    try {
      const { data, error } = await sb.rpc('nl_send_log_alerts', { p_month: pm });
      if (error) throw error;
      sbtn.textContent = '✓ 보냈습니다';
      $('sendLogMsg').textContent = String(data || '');
    } catch (e) {
      sbtn.disabled = false; sbtn.textContent = '선생님께 알림 보내기';
      alert('보내지 못했습니다.\n' + e.message);
    }
  };
}

// 고른 달의 지난달 ('2026-09' → '2026-08')
function prevMk(k){
  const y = Number(String(k).slice(0,4)), m = Number(String(k).slice(5,7));
  const d = new Date(y, m - 2, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

$('run').onclick = run;
$('mon').onchange = run;
$('home').onclick = () => { location.href = 'index.html'; };

(async () => {
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { location.replace('index.html'); return; }
  const user = data.session.user;
  const { data: me, error } = await sb.from('nl_therapists')
    .select('id, name, role').eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (error || !me) {
    $('body').innerHTML = '<div class="err">직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.</div>';
    return;
  }
  nlKeep(me.id);
  if (CAN_SEE.indexOf(Number(me.id)) < 0) {
    $('body').innerHTML = '<div class="err">이 화면을 볼 권한이 없습니다.</div>';
    return;
  }
  $('who').textContent = me.name + ' 님으로 로그인됨';
  fillMon();
  run();
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매일 점검 - 나무링크</title>
<style>
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:#f5f9f0;
         margin:0; padding:18px; color:#333; }
  .wrap { max-width:900px; margin:0 auto; }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
         margin-bottom:14px; }
  .top h1 { font-size:21px; margin:0; color:#2c5c37; }
  .top .who { font-size:12.5px; color:#7a8a76; }
  .top .sp { flex:1 1 auto; }
  button { font:inherit; border:none; border-radius:8px; padding:8px 15px;
           background:#4a7c59; color:#fff; cursor:pointer; font-weight:700;
           font-size:13.5px; }
  button:hover { background:#3d6849; }
  button.grey { background:#8a938a; }
  button.grey:hover { background:#767f76; }
  select { font:inherit; font-size:13.5px; padding:7px 9px; border-radius:8px;
           border:1px solid #cfd8cb; background:#fff; color:#2a2f2b; }
  .card { background:#fff; border-radius:12px; padding:20px 22px;
          box-shadow:0 2px 12px rgba(0,0,0,.07); margin-bottom:14px; }
  .ok { background:#e8f5e9; border:1px solid #7cc466; border-radius:12px;
        padding:26px; text-align:center; font-size:17px; font-weight:800;
        color:#2c5c37; }
  .ok .sub { font-size:13px; font-weight:500; color:#5b7a56; margin-top:8px; }
  .grp { margin-bottom:20px; }
  .grp:last-child { margin-bottom:0; }
  .grp-t { font-size:15px; font-weight:800; color:#b34a2a; margin-bottom:3px; }
  .grp-n { display:inline-block; background:#b34a2a; color:#fff;
           border-radius:11px; padding:1px 9px; font-size:12px;
           margin-left:7px; vertical-align:1px; }
  .grp-why { font-size:12.5px; color:#7a8a76; margin-bottom:9px;
             line-height:1.6; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { background:#f2f6f0; color:#3d5a38; text-align:left; font-weight:700;
       padding:7px 10px; border-bottom:1px solid #dfe6db; white-space:nowrap; }
  td { padding:7px 10px; border-bottom:1px solid #eef2ec; }
  tr:last-child td { border-bottom:none; }
  .cid { font-weight:800; color:#2c5c37; white-space:nowrap; }
  .sum { font-size:13.5px; color:#5b7a56; margin-bottom:12px; }
  .err { background:#fdecea; border:1px solid #e8a49a; border-radius:10px;
         padding:14px 16px; color:#a33a25; font-size:13.5px;
         white-space:pre-wrap; line-height:1.7; }
  .load { text-align:center; padding:34px; color:#7a8a76; font-size:14px; }
  .note { font-size:12px; color:#8a938a; line-height:1.8; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🩺 매일 점검</h1>
    <span class="who" id="who"></span>
    <span class="sp"></span>
    <select id="mon"></select>
    <button id="run">점검하기</button>
    <button id="home" class="grey">홈으로</button>
  </div>

  <div id="body">
    <div class="load">불러오는 중…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nl-login.js"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: { storage: nlStore, persistSession: true,
          autoRefreshToken: true, detectSessionInUrl: false }
});
const $ = id => document.getElementById(id);

// 이 화면을 볼 수 있는 직원 — 관리자·행정·데스크
const CAN_SEE = [8, 9, 11];

// 항목마다 「무슨 뜻인지」와 「어떻게 하면 되는지」
const WHY = {
  '1': '센터 운영시간(9:00~20:20) 밖에 회기가 있습니다. 시험용으로 만든 줄이거나 시각을 잘못 넣은 것입니다.',
  '2': '같은 아동이 같은 날 같은 시각에 두 줄입니다. 시각이나 지원유형을 고칠 때 옛 줄이 안 지워지면 이렇게 됩니다.',
  '3': '발달재활은 한 달 4회입니다. 회차가 5 이상이면 줄이 하나 더 있는 것입니다.',
  '4': '회차가 중간에 비었습니다(1·3·4 처럼). 줄을 지운 뒤 번호를 다시 안 매긴 것입니다.',
  '5': '수업줄에 적힌 시각과 회기 시각이 다릅니다. 그대로 두면 저장할 때마다 회기가 두 벌이 될 수 있습니다.',
  '6': '회기는 「휴무」인데 그 날 휴무 기록이 없습니다. 휴무를 지우신 뒤 회기가 그대로 남은 것입니다. 「예정」으로 되돌리면 됩니다.',
  '7': '이미 끝난 수업줄에 회기가 남아 있습니다.',
  '8': '한 수업줄 안에서 같은 회차가 두 번 나옵니다.',
  '9': '회기방식이 정한 횟수보다 회기가 많습니다.',
  '10': '아직 오지 않은 날인데 「완료」로 되어 있습니다. 자료를 정리하다 섞였거나 잘못 눌린 것입니다. 「예정」으로 되돌리면 됩니다.'
};

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function monNo(k){ return Number(String(k).slice(5,7)); }

// 달 고르기 — 지난 6달부터 다음 3달까지
function fillMon(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  let html = '';
  for (let i = -6; i <= 3; i++) {
    const d = new Date(y, m + i, 1);
    const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    html += '<option value="' + k + '"' + (i === 0 ? ' selected' : '') + '>'
          + d.getFullYear() + '년 ' + (d.getMonth()+1) + '월</option>';
  }
  $('mon').innerHTML = html;
}

async function run(){
  const k = $('mon').value;
  $('body').innerHTML = '<div class="load">' + monNo(k) + '월을 점검하고 있습니다…</div>';
  const { data, error } = await sb.rpc('nl_daily_check', { p_month: k });
  if (error) {
    $('body').innerHTML = '<div class="err">❌ 점검하지 못했습니다.\n' + esc(error.message) + '</div>';
    return;
  }
  const rows = data || [];
  if (!rows.length) {
    $('body').innerHTML = '<div class="ok">✅ ' + monNo(k) + '월 — 어긋난 것이 없습니다'
      + '<div class="sub">열 가지를 모두 살펴봤습니다. 가벼운 마음으로 시작하세요.</div></div>';
    return;
  }

  // 항목별로 묶는다
  const grp = {}, ord = [];
  rows.forEach(function(r){
    const t = String(r['항목'] || '');
    if (!grp[t]) { grp[t] = []; ord.push(t); }
    grp[t].push(r);
  });

  let h = '<div class="card">';
  h += '<div class="sum"><b>' + monNo(k) + '월</b> — 살펴볼 것이 '
     + rows.length + '건 있습니다.</div>';
  ord.forEach(function(t){
    const list = grp[t];
    const no = String(t).split(' ')[0];
    h += '<div class="grp">'
      + '<div class="grp-t">' + esc(t.replace(/^\d+\s*/, ''))
      + '<span class="grp-n">' + list.length + '건</span></div>'
      + '<div class="grp-why">' + esc(WHY[no] || '') + '</div>'
      + '<table><tr><th style="width:90px;">아동</th><th>내용</th></tr>';
    list.forEach(function(r){
      h += '<tr><td class="cid">' + esc(r['아동']) + '번</td>'
         + '<td>' + esc(r['내용']) + '</td></tr>';
    });
    h += '</table></div>';
  });
  h += '<div class="note">※ 아동 번호로만 보여 드립니다. 시간표 화면에서 번호로 찾으실 수 있습니다.<br>'
     + '※ 고치는 방법을 모르시겠으면 이 화면을 캡처해 물어보세요.</div>';
  h += '</div>';
  $('body').innerHTML = h;
}

$('run').onclick = run;
$('mon').onchange = run;
$('home').onclick = () => { location.href = 'index.html'; };

(async () => {
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { location.replace('index.html'); return; }
  const user = data.session.user;
  const { data: me, error } = await sb.from('nl_therapists')
    .select('id, name, role').eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (error || !me) {
    $('body').innerHTML = '<div class="err">⚠️ 직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.</div>';
    return;
  }
  nlKeep(me.id);
  if (CAN_SEE.indexOf(Number(me.id)) < 0) {
    $('body').innerHTML = '<div class="err">이 화면을 볼 권한이 없습니다.</div>';
    return;
  }
  $('who').textContent = me.name + ' 님으로 로그인됨';
  fillMon();
  run();
})();
</script>
</body>
</html>

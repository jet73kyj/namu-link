<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>아동</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F5F4F2; --card:#FFFFFF; --line:#ECE8E3; --ink:#2F2926; --mute:#A39C95; --soft:#6E6660;
  --camel:#B07A4A; --camel-line:#C9A27E; --camel-bg:#F8F1E8; --err:#C2553A; --err-bg:#FBEDE6; --ok:#3b7a4a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;border-radius:9px;height:40px;padding:0 14px}
.plain{background:#fff;color:var(--ink);border:1px solid var(--line)}
.plain:hover{border-color:var(--camel-line)}
.main{background:var(--camel);color:#fff;border:1px solid var(--camel);font-weight:600}
.main:disabled,.plain:disabled{opacity:.6;cursor:default}
.acc{color:var(--camel);border-color:var(--camel-line)}
.red{color:var(--err)}
button:focus-visible{outline:2px solid var(--camel);outline-offset:2px}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;color:var(--ink);background:#fff}
input,select{height:40px}
textarea{padding:8px 12px;width:100%;min-height:90px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--camel-line);box-shadow:0 0 0 3px var(--camel-bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;z-index:5}
.top .l{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:32px;height:32px;border-radius:50%;background:var(--camel-bg);border:1px solid var(--camel-line);
  display:flex;align-items:center;justify-content:center;color:var(--camel);font-weight:600;font-size:14px;flex-shrink:0}
.top .bar{width:1px;height:22px;background:var(--line)}
.top b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .pg{font-size:14px;color:var(--soft);white-space:nowrap}
.top .r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.top .who{font-size:13px;color:var(--soft);white-space:nowrap}
.top button{height:34px;font-size:13px;padding:0 12px}
.home-btn{color:var(--camel);border-color:var(--camel-line)}
.wrap{max-width:1100px;margin:24px auto 60px;padding:0 20px}
.msg{font-size:13.5px;border-radius:8px;padding:9px 12px;margin:0 0 14px;display:none}
.msg.err{display:block;background:var(--err-bg);color:var(--err)}
.msg.ok{display:block;background:var(--camel-bg);color:#7a5230}
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.tabs{display:flex;gap:18px;flex-wrap:wrap}
.tabs button{height:auto;padding:0 0 6px;border:none;border-bottom:2px solid transparent;border-radius:0;background:none;font-size:14.5px;color:var(--soft)}
.tabs button.on{border-bottom-color:var(--camel);color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.tools input{width:170px}
.tbl{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
.list{min-width:860px}
th{background:var(--camel-bg);color:#7a5230;font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--camel-line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.list tbody tr{cursor:pointer}
.list tbody tr:hover td{background:#FBF8F4}
.list tbody tr.sel td{background:var(--camel-bg)}
td.n{text-align:right;font-variant-numeric:tabular-nums;width:48px}
td.nw{white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;margin:0 4px 3px 0;white-space:nowrap;background:#F1EFE8;color:#444441}
.chip.sup{background:#E1F5EE;color:#085041}
.chip.st{background:#F1EFE8;color:#444441}
.chip.st.on{background:#EAF3DE;color:#27500A}
.chip.st.wait{background:#FAEEDA;color:#633806}
.none{color:var(--mute)}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 16px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--camel-bg);border-bottom:1px solid var(--camel-line)}
.phead b{font-size:16px;font-weight:600}
.phead span{color:var(--soft);font-size:13.5px}
.phead .x{margin-left:auto;height:32px;font-size:13px}
.sec{padding:14px 18px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:none}
.sech{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.sech h3{font-size:14.5px;font-weight:600;margin:0}
.sech .who{font-size:12px;color:var(--mute)}
.sech .sp{margin-left:auto;display:flex;gap:6px}
.sech button{height:32px;font-size:13px;padding:0 10px}
/* 좁은 화면 — 단추 글자가 세로로 쪼개지지 않게 · 자리가 모자라면 단추 줄을 아래로 (2026-09-30) */
.sech{flex-wrap:wrap}
.sech h3,.sech button{white-space:nowrap}
.sech .sp{flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.sech .who{flex-basis:100%;order:2}.sech .sp{order:3;margin-left:0;width:100%}}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv .k{color:var(--soft)}
.pre{white-space:pre-wrap;word-break:break-word}
.form{display:flex;flex-wrap:wrap;gap:10px 12px;margin:4px 0 0}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft);flex:1 1 200px;min-width:0}
.form label.full{flex-basis:100%}
.form label.narrow{flex:0 0 96px}
.form input,.form select{width:100%}
.btns{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.btns button{height:36px;font-size:13.5px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{height:36px;font-size:13.5px;padding:0 12px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.pick button.on{border-color:var(--camel);color:var(--camel);background:var(--camel-bg)}
.glist{width:100%;font-size:14px}
.glist td{padding:6px 8px;vertical-align:middle}
.glist td button{height:30px;font-size:12.5px;padding:0 9px;margin-left:4px}
.glist input,.glist select{height:34px;padding:0 8px}
.star{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--camel-bg);color:#7a5230;margin-left:6px}
.note{border-top:1px solid var(--line);padding:9px 0}
.note:first-child{border-top:none;padding-top:2px}
.note .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--soft);margin:0 0 3px}
.note .meta button{height:28px;font-size:12px;padding:0 8px;margin-left:4px}
.note .meta .sp{margin-left:auto}
.th{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.th.ended{background:#FAFAF8;color:var(--soft)}
.th .t1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.th .t1 b{font-weight:600}
.th .t2{font-size:13.5px;margin:4px 0 0}
.ev{font-size:13px;color:var(--soft);border-left:2px solid var(--line);padding:0 0 0 10px;margin:8px 0 0}
.ev div{padding:1px 0}
.soon{font-size:13px;color:var(--mute)}
.hint{font-size:12.5px;color:var(--soft);margin:6px 0 0}
.lt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.age{font-size:12.5px;color:#7a5230;white-space:nowrap}
.newbox{background:#fff;border:1px solid var(--line);border-left:3px solid var(--camel-line);border-radius:0;padding:14px 18px;margin:0 0 16px}
.newbox h3{font-size:15px;font-weight:600;margin:0 0 6px}
.newbox h4{font-size:13.5px;font-weight:600;margin:14px 0 2px;color:var(--soft)}
.deny{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px}
[hidden]{display:none!important}
@media (max-width:640px){.top .who,.top .pg{display:none}.tools input{width:120px}.kv{grid-template-columns:78px minmax(0,1fr)}}
.wk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 6px}
.wk select{height:36px;padding:0 8px;width:auto}
.wk button{height:34px;font-size:12.5px;padding:0 10px}
.fl{font-size:13px;color:var(--soft);margin:10px 0 4px}
.th .t3{display:flex;gap:6px;margin:8px 0 0;flex-wrap:wrap}
.th .t3 button{height:30px;font-size:12.5px;padding:0 10px}
.th .t2 .why{margin-left:10px;font-size:12.5px;color:#7a5230}
.tap{cursor:pointer}
.tap:hover,.tap:hover td{background:#FBF8F4}
.xdel{height:28px!important;width:28px;padding:0!important;margin-left:6px;border:none;background:none;color:#B5533C;font-size:15px;line-height:28px}
.xdel:hover{background:#FCEFEA}
.cbx{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--soft);white-space:nowrap}
.evrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.evrow .m{flex:1;min-width:220px;font-size:14px}
.evrow.cx .m{color:var(--mute);text-decoration:line-through}
.evrow .sp{display:flex;gap:6px}
button.sm{height:28px!important;padding:0 10px!important;font-size:12.5px!important;width:auto!important;margin:0!important}
button.dim{color:var(--mute)}
button.on{font-weight:600}
.pane{margin:0 0 10px 14px;padding:8px 10px;border-left:3px solid #E7DCCF;background:#FCFAF7;border-radius:6px}
.pane textarea{width:100%;min-height:90px;box-sizing:border-box}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.flist>div{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0}
.flist .fn{flex:1;word-break:break-all}
.drop{border:1.5px dashed #9fb6cf;border-radius:8px;padding:12px;text-align:center;color:var(--soft);cursor:pointer;margin-top:8px;font-size:13px}
.drop.over{background:#EFF4F9}
.smpop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9998;display:flex;align-items:center;justify-content:center;padding:16px}
.smbox{background:#fff;border-radius:12px;width:720px;max-width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.smhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 16px;background:#F8F1E8;border-bottom:2px solid #C9A27E}
.smtt b{display:block;font-size:15.5px}
.smtt span{font-size:12.5px;color:var(--soft)}
button.smx{width:auto!important;margin:0!important;height:30px!important;padding:0 10px!important;border:none;background:none;font-size:18px;color:#7D7670}
.smbd{flex:1;overflow:auto;padding:14px 16px;min-height:220px;display:flex;flex-direction:column}
.smtxt{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.75}
.smta{flex:1;width:100%;min-height:50vh;box-sizing:border-box;font-size:15px;line-height:1.75;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical}
.smft{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.smft button,.smbs button{width:auto!important;margin:0!important}
.smbs{display:flex;gap:8px}
@media (max-width:640px){
  .smpop{padding:0;align-items:stretch}
  .smbox{width:100vw;height:100dvh;max-height:none;border-radius:0}
  .smhd{padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .smtxt,.smta{font-size:16px}
  .smta{min-height:0;resize:none}
  .smft{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .smbs{margin-left:auto}
}
.evtg{height:auto;padding:0;margin:8px 0 0;border:none;background:none;font-size:12.5px;color:var(--mute);text-decoration:underline}
</style>
</head>
<body>

<div class="top">
  <div class="l"><div class="mark" aria-hidden="true">링</div><div class="bar"></div><b id="jlOrg"></b><span class="pg">아동</span></div>
  <div class="r">
    <span class="who" id="jlWho"></span>
    <button class="plain home-btn" id="goHome">처음으로</button>
    <button class="plain" id="goOut">로그아웃</button>
  </div>
</div>

<div class="wrap" id="page" hidden>
  <p class="msg" id="msg" role="alert"></p>

  <!-- 신규 등록 -->
  <div class="newbox" id="newBox" hidden>
    <h3>신규 아동 등록</h3>
    <div class="form">
      <label>이름<input id="nName" maxlength="30" autocomplete="off"></label>
      <label><span class="lt">생년월일<span class="age" id="nAge"></span></span><input id="nBirth" type="date"></label>
      <label class="narrow">성별<select id="nGender"><option value="">고르기</option><option>남</option><option>여</option></select></label>
      <label>관리번호<input id="nManage" maxlength="20" autocomplete="off"></label>
      <label>유치원 · 학교<input id="nSchool" maxlength="50" autocomplete="off"></label>
      <label class="narrow">학년<input id="nGrade" maxlength="20" autocomplete="off" placeholder="2학년"></label>
      <label class="narrow">반<input id="nClass" maxlength="20" autocomplete="off" placeholder="3반"></label>
      <label class="narrow">번호<input id="nSno" type="number" min="1" max="99" autocomplete="off"></label>
      <label class="full">거주지<div id="nRegion"></div></label>
    </div>
    <h4>보호자 (대표 연락처)</h4>
    <div class="form">
      <label>관계<select id="nRel"><option>모</option><option>부</option><option>조모</option><option>조부</option><option>활동보조</option><option>기타</option></select></label>
      <label>이름<input id="nGName" maxlength="30" autocomplete="off"></label>
      <label>휴대폰 번호<input id="nPhone" inputmode="numeric" maxlength="13" placeholder="01012345678" autocomplete="off"></label>
    </div>
    <h4>진단 · 초기 상담</h4>
    <div class="form">
      <label>진단명<input id="nDiag" maxlength="200" autocomplete="off"></label>
      <label>장애<input id="nDis" maxlength="200" autocomplete="off"></label>
      <label>초기 상담한 날<input id="nIntakeOn" type="date"></label>
      <label class="full">초기 상담 내용<textarea id="nIntake" maxlength="5000"></textarea></label>
    </div>
    <p class="hint">상태는 「대기중」으로 등록됩니다. 수업을 넣으면 치료중으로 바뀝니다.</p>
    <div class="btns">
      <button class="main" id="nGo">등록</button>
      <button class="plain" id="nCancel">나가기</button>
    </div>
  </div>

  <!-- 열린 아동 -->
  <div class="panel" id="panel" hidden></div>

  <div class="headrow">
    <div class="tabs" role="tablist" id="tabs">
      <button data-t="new" role="tab">신규 아동</button>
      <button data-t="on" role="tab">치료중</button>
      <button data-t="wait" role="tab">대기중</button>
      <button data-t="end" role="tab">종결 · 타기관</button>
      <button data-t="all" role="tab">전체</button>
    </div>
    <div class="tools">
      <input id="q" placeholder="이름 또는 번호" aria-label="찾기" autocomplete="off">
      <button class="plain acc" id="openNew" hidden>신규 등록</button>
    </div>
  </div>

  <div class="tbl">
    <table class="list">
      <thead><tr id="lhead"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<div class="wrap" id="deny" hidden>
  <div class="deny"><b>이 화면을 볼 수 없습니다</b><p class="hint">처음으로 돌아가 주세요.</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
let CTX = null, ROLE = '', ME = 0;
let KIDS = [], THS = [], SCHS = [], GUARDS = [], PROG = {}, PNOTE = {}, TTYPE = {}, STAFF = {};
let UNITS = [], UPS = [], AREAS = [], APPR = [];
// 평가 · 보고서 (2026-09-30)
let PKIND = {}, EVTYPE = {}, EREP = [], EFILE = [], OPENSUM = new Set(), OPENDOC = new Set();
let WEEKS = [], TEACH = [], OPENWD = null;   // 수업 넣기 (2026-09-29)
let TAB = 'on', OPEN = null, BUSY = false, DIRTY = false;
const EDITORS = ['대표', '관리직', '행정'];
const CONTACT = ['대표', '관리직', '행정', '데스크'];
const WD = ['일', '월', '화', '수', '목', '금', '토'];

// 알림 (2026-09-29) — 막히거나 실패하면 알림 창으로 알린다 (화면 위 글만으로는 눈에 안 띄고 화면이 흔들렸음)
//   됐을 때(ok)는 위쪽 글만 · 화면을 끌어올리지 않는다
function say(text, kind) {
  const m = $('msg'); m.textContent = text || ''; m.className = 'msg' + (text ? ' ' + (kind || 'err') : '');
  if (text && (kind || 'err') === 'err') alert(text);
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
// 유치원 · 학교 / 학년 / 반 / 번호 (2026-09-30) — 한 칸에 값 하나
function schoolVals(name, grade, cls, no) {
  const row = { school: name.trim() || null, school_grade: grade.trim() || null, school_class: cls.trim() || null, school_no: null };
  const n = String(no || '').trim();
  if (n) {
    if (!/^\d{1,2}$/.test(n) || Number(n) < 1) return { err: '번호는 1~99 숫자로 적어 주세요' };
    row.school_no = Number(n);
  }
  return { row };
}
function schoolTxt(k) {
  const tail = [k.school_grade, k.school_class, k.school_no ? k.school_no + '번' : ''].filter(Boolean).join(' ');
  return [k.school, tail].filter(Boolean).join(' · ');
}
// 거주지 — 공용 법정동 목록 regions (2026-09-30) · 고르기만 · 동까지 골라야 저장
let REGIONS = null, REGNAME = {}, NEW_RG = null, BASIC_RG = null;
async function ensureRegions() {
  if (REGIONS) return REGIONS;
  const r = await readAll(() => sb.from('regions').select('code, sido, sigungu, dong').eq('active', true).order('code'));
  if (r.error) throw r.error;
  REGIONS = r.data; REGIONS.forEach(x => { REGNAME[x.code] = x; });
  return REGIONS;
}
// 목록에 쓰인 코드만 이름 받기 (화면을 열 때 전국 목록을 다 받지 않게)
async function loadRegNames() {
  const codes = [...new Set(KIDS.map(k => k.region_code).filter(c => c && !REGNAME[c]))];
  for (let i = 0; i < codes.length; i += 100) {
    const { data, error } = await sb.from('regions').select('code, sido, sigungu, dong').in('code', codes.slice(i, i + 100));
    if (error) return;
    (data || []).forEach(x => { REGNAME[x.code] = x; });
  }
}
function regTxt(code) { const x = REGNAME[code]; return x ? x.sido + ' ' + x.sigungu + ' ' + x.dong : ''; }
function regionPicker(code) {
  const d = el('div', 'wk');
  const s1 = el('select'), s2 = el('select'), s3 = el('select');
  [s1, s2, s3].forEach(x => { x.disabled = true; d.append(x); });
  s1.add(new Option('목록 읽는 중…', ''));
  let ready = false;
  const uniq = a => [...new Set(a)].sort((x, y) => x.localeCompare(y, 'ko'));
  const fill2 = () => {

    }

  d.get = () => {

}

// 1,000줄씩 끝까지 읽기
async function readAll(q) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await q().range(from, from + 999);
    if (error) return { error };
    out.push(...(data || []));
    if (!data || data.length < 1000) return { data: out };
  }
}

// 대표 연락처 옮기기 — 옛 대표를 풀고 새 줄을 대표로 · 실패하면 까닭 글을 돌려줌 (BUSY 는 부르는 쪽이 잡음)
async function primaryTo(k, g) {
  const old = GUARDS.filter(x => x.child_id === k.id && x.is_primary && x.id !== g.id);
  for (const o of old) {
    const { data, error } = await sb.from('guardians').update({ is_primary: false }).eq('id', o.id).select('id');
    if (error || !data || data.length !== 1) return error ? error.message : '옛 대표를 풀지 못했습니다';
    o.is_primary = false;
  }
  const { data, error } = await sb.from('guardians').update({ is_primary: true }).eq('id', g.id).select('id');
  if (error || !data || data.length !== 1) return error ? error.message : '대표로 바꾸지 못했습니다';
  g.is_primary = true;
  return '';
}

// 운영 요일 — 요일마다 오늘 적용되는 줄의 is_open (못 읽으면 모든 요일)
async function loadOpenDays(org) {
  OPENWD = null;
  try {
    const { data, error } = await sb.from('org_days').select('weekday, from_date, is_open').eq('org_id', org);
    if (error || !data || !data.length) return;
    const td = today(), best = {};
    data.forEach(d => {
      if (d.from_date > td) return;
      if (!best[d.weekday] || d.from_date > best[d.weekday].from_date) best[d.weekday] = d;
    });
    const open = Object.values(best).filter(d => d.is_open).map(d => d.weekday);
    if (open.length) OPENWD = open;

async function shrinkImg(file) {

    const bm = await createImageBitmap(file);
    const r = Math.min(1, 2000 / Math.max(bm.width, bm.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bm.width * r); c.height = Math.round(bm.height * r);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);

    return b || file;
  } catch (x) { return file; }
}

      if (error || !data || data.length !== 1) {

  }

//   한 번 저장에 생긴 히스토리 줄은 created_at 이 같음 — 그 묶음의 변경일을 함께 보임
const CHG_KINDS = ['요일변경', '시간변경', '담당변경', '요일줄추가', '요일줄종료'];
function lastChangeWhy(tid) {
  const evs = EVTS.filter(e => e.therapy_id === tid && e.reason && CHG_KINDS.includes(e.kind));
  if (!evs.length) return '';
  const last = evs.reduce((a, b) => (b.id > a.id ? b : a));
  const grp = evs.filter(e => e.created_at === last.created_at);
  const add = grp.find(e => e.kind === '요일줄추가');
  const day = (add || last).on_date || '';
  return (day ? day.slice(5).replace('-', '/') + ' 변경 · ' : '변경 · ') + last.reason;
}

async function saveTherapy(k, v) {
  if (BUSY) return;
  if (!v.up) { say('사업을 골라 주세요'); return; }
  if (!v.type) { say('치료 종류를 골라 주세요'); return; }
  if (!v.start || v.start < '2020-01-01') { say('시작일을 확인해 주세요'); return; }
  const need = v.rule === '월3' ? 3 : v.rule === '월2' ? 2 : 0;
  if (need && v.weeks.length !== need) { say(v.rule + '이면 주차를 ' + need + '개 골라 주세요'); return; }
  if (v.rows.some(r => !r.therapist_id)) { say('요일줄마다 선생님을 골라 주세요'); return; }
  const keys = v.rows.map(r => r.weekday + ' ' + r.start_time);
  if (new Set(keys).size !== keys.length) { say('같은 요일 · 같은 시각 요일줄이 두 줄 있습니다'); return; }
  BUSY = true; say('');
  try {
    const { data, error } = await sb.rpc('add_therapy', {
      p_child: k.id, p_unit: v.up.unit_id, p_program: v.up.program_id, p_type: v.type,
      p_rule: v.rule, p_start: v.start,
      p_weeks: need ? v.weeks : null, p_rows: v.rows
    });
    if (error || !data) { say(thErr(error, '수업을 넣지 못했습니다')); return; }
    doneSave();
    await reloadKid(k.id);
    say('수업을 넣었습니다', 'ok');
  } catch (e) { say('서버에 닿지 못했습니다. 다시 해 주세요'); } finally { BUSY = false; }
}

  const showWk = r => { wkBox.hidden = !(r === '월3' || r === '월2'); wkHint.textContent = r === '월3' ? '3개를 고릅니다' : r === '월2' ? '2개를 고릅니다' : ''; };
  const pRule = pickRow([['매주', '매주'], ['월4', '월4'], ['월3', '월3'], ['월2', '월2']], t.count_rule, false, showWk);
  d.append(pRule, wkBox); showWk(t.count_rule);

  const live = schOf(t.id).filter(liveSch).sort((a, b) => (a.from_date < b.from_date ? -1 : 1));
  const rows = [];
  let fd = null, why = null;
  if (live.length) {
    const box = el('div');
    box.style.cssText = 'border-top:1px solid var(--line);margin-top:12px;padding-top:10px';
    box.append(el('div', 'fl', '요일 · 시간 · 선생님 — 변경일부터 바뀜'));
    const f = el('div', 'form');
    const l1 = el('label', null, '변경일'); fd = el('input'); fd.type = 'date';
    const minFrom = live.reduce((m, x) => (x.from_date > m ? x.from_date : m), live[0].from_date);
    fd.value = today() < minFrom ? minFrom : today(); fd.min = minFrom;
    fd.oninput = markDirty; l1.append(fd); f.append(l1);
    box.append(f);
    live.forEach(x => {
      box.append(el('p', 'hint', '지금: ' + WD[x.weekday] + ' ' + hm(x.start_time) + ' · ' + x.minutes + '분 · ' + (STAFF[x.therapist_id] || '?') + ' 선생님'));
      const w = el('div', 'wk');
      const sw = el('select');
      [1, 2, 3, 4, 5, 6, 0].filter(v => !OPENWD || OPENWD.includes(v) || v === x.weekday).forEach(v => sw.add(new Option(WD[v], String(v))));
      sw.value = String(x.weekday);
      const sh = el('select'); for (let h = 7; h <= 21; h++) sh.add(new Option(String(h).padStart(2, '0') + '시', String(h).padStart(2, '0')));
      sh.value = hm(x.start_time).slice(0, 2);
      const sm = el('select'); for (let m = 0; m < 60; m += 10) sm.add(new Option(String(m).padStart(2, '0') + '분', String(m).padStart(2, '0')));
      sm.value = hm(x.start_time).slice(3, 5);
      const sn = el('select'); for (let m = 30; m <= 120; m += 10) sn.add(new Option(m + '분', String(m)));
      sn.value = String(x.minutes);
      const sT = el('select');
      if (!TEACH.some(v => v.id === x.therapist_id)) sT.add(new Option((STAFF[x.therapist_id] || '?') + ' 선생님 (지금)', String(x.therapist_id)));
      TEACH.forEach(v => sT.add(new Option(v.name + ' 선생님', String(v.id))));
      sT.value = String(x.therapist_id);
      [sw, sh, sm, sn, sT].forEach(v => v.onchange = markDirty);
      w.append(sw, sh, el('span', null, ':'), sm, sn, sT);
      box.append(w);
      rows.push({ x, get: () => ({ sched: x.id, weekday: Number(sw.value), start_time: sh.value + ':' + sm.value, minutes: Number(sn.value), therapist_id: Number(sT.value) || 0 }) });
    });
    const fr = el('div', 'form');
    const lr = el('label', 'full', '변경 사유 (200자까지 · 히스토리에 남음)'); why = el('input'); why.maxLength = 200;
    why.placeholder = '예) 어머님 요청 · 월요일 학원'; why.oninput = markDirty; lr.append(why); fr.append(lr);
    box.append(fr);
    box.append(el('p', 'hint', '안 바꾼 줄은 그대로입니다. 변경일 전날까지는 지금대로 남고, 변경일 뒤에 결석이나 잡힌 보강이 있으면 먼저 정리해야 바꿀 수 있습니다.'));
    d.append(box);
  }
  d.append(el('p', 'hint', '사업 · 치료 종류 · 시작일은 바꿀 수 없습니다. 바꿔야 하면 이 수업을 종결하고 새로 넣어 주세요.'));
  FORM_SAVE = () => saveThEdit(t, pRule.get(), pWeek.get().map(Number), fd ? fd.value : null, rows, why ? why.value.trim() : '');
  const b = el('div', 'btns'); b.style.justifyContent = 'flex-end';
  b.append(btn('이 수업 종결', 'plain red', () => { if (!leaveOk()) return; DIRTY = false; EDIT = 'x' + t.id; drawPanel(); }));
  d.append(b);
  return d;
}
async function saveThEdit(t, rule, weeks, from, rows, reason) {
  if (BUSY) return;
  const need = rule === '월3' ? 3 : rule === '월2' ? 2 : 0;
  if (need && weeks.length !== need) { say(rule + '이면 주차를 ' + need + '개 골라 주세요'); return; }
  const ch = rows.map(r => r.get()).filter((v, i) => {
    const x = rows[i].x;
    return !(v.weekday === x.weekday && v.start_time === hm(x.start_time) && v.minutes === x.minutes && v.therapist_id === x.therapist_id);
  });
  if (ch.some(v => !v.therapist_id)) { say('선생님을 골라 주세요'); return; }
  if (ch.length) {
    if (!from) { say('변경일을 넣어 주세요'); return; }
    if (reason && reason.length > 200) { say('변경 사유는 200자까지 적을 수 있습니다'); return; }
    if (!confirm(from + ' 부터 요일줄 ' + ch.length + '줄을 바꿀까요?\n그 전날까지는 지금대로 남습니다.'
                 + (reason ? '\n변경 사유: ' + reason : ''))) return;
  }
  BUSY = true; say('');
  try {
    const { data, error } = await sb.rpc('edit_therapy', {
      p_id: t.id, p_rule: rule, p_weeks: need ? weeks : null,
      p_from: ch.length ? from : null, p_rows: ch,
      p_reason: ch.length && reason ? reason : null
    });
    if (error || !data) { say(thErr(error, '고치지 못했습니다')); return; }
    doneSave();
    await reloadKid(t.child_id);
    say(data, 'ok');
  } catch (e) { say('서버에 닿지 못했습니다. 다시 해 주세요'); } finally { BUSY = false; }
}

// 종결 — 마지막 수업일 · 사유 (요일줄은 서버가 닫음)
function thEndForm(t) {
  const d = el('div');
  const f = el('div', 'form');
  const l1 = el('label', null, '마지막 수업일'); const ed = el('input'); ed.type = 'date'; ed.value = today(); ed.oninput = markDirty; l1.append(ed); f.append(l1);
  const l2 = el('label', 'full', '종결 사유'); const rs = el('input'); rs.maxLength = 200; rs.oninput = markDirty; l2.append(rs); f.append(l2);
  d.append(f);
  d.append(el('p', 'hint', '마지막 수업일 다음 날부터 이 수업의 요일줄이 모두 닫힙니다. 한 번도 수업하지 않고 끝내면 시작일 하루 앞을 넣어 주세요.'));
  d.append(el('p', 'hint', '위 「저장」을 누르면 종결합니다.'));
  FORM_SAVE = () => saveThEnd(t, ed.value, rs.value.trim());
  return d;
}
async function saveThEnd(t, endOn, reason) {
  if (BUSY) return;
  if (!endOn) { say('마지막 수업일을 넣어 주세요'); return; }
  const min = new Date(Date.parse(t.started_on + 'T00:00:00Z') - 86400000).toISOString().slice(0, 10);
  if (endOn < min) { say('마지막 수업일은 시작일 하루 앞(' + min + ')보다 앞일 수 없습니다'); return; }
  if (!reason) { say('종결 사유를 적어 주세요'); return; }
  if (!confirm((TTYPE[t.therapy_type_id] || '수업') + ' 수업을 ' + endOn + ' 까지로 종결할까요?\n요일줄도 함께 닫힙니다.')) return;
  BUSY = true; say('');
  try {
    const { data, error } = await sb.from('therapies').update({ ended_on: endOn, end_reason: reason }).eq('id', t.id).select('id');
    if (error || !data || data.length !== 1) { say(thErr(error, '종결하지 못했습니다')); return; }
    doneSave();
    await reloadKid(t.child_id);
    say('종결했습니다', 'ok');
  } catch (e) { say('서버에 닿지 못했습니다. 다시 해 주세요'); } finally { BUSY = false; }
}

// ── 신규 등록 ──
function openNew() {
  if (!leaveOk()) return;
  DIRTY = false;
  ['nName', 'nBirth', 'nManage', 'nSchool', 'nGrade', 'nClass', 'nSno', 'nGName', 'nPhone', 'nDiag', 'nDis', 'nIntake'].forEach(i => $(i).value = '');
  $('nAge').textContent = ''; $('nGender').value = ''; $('nRel').value = '모'; $('nIntakeOn').value = today(); $('nIntakeOn').max = today(); $('nBirth').max = today();
  NEW_RG = regionPicker(null); $('nRegion').innerHTML = ''; $('nRegion').append(NEW_RG);
  $('newBox').hidden = false; $('nName').focus();
}
function closeNew() { if (!leaveOk()) return; DIRTY = false; $('newBox').hidden = true; }
async function makeKid() {
  if (BUSY) return;
  const name = $('nName').value.trim(), birth = $('nBirth').value || null, phone = digits($('nPhone').value);
  if (!name) { say('이름을 적어 주세요'); $('nName').focus(); return; }
  if (birth && (birth < '2000-01-01' || birth > today())) { say('생년월일을 확인해 주세요'); return; }
  if (phone && !/^0\d{9,10}$/.test(phone)) { say('휴대폰 번호를 0으로 시작하는 10~11자리 숫자로 적어 주세요'); return; }
  const sch = schoolVals($('nSchool').value, $('nGrade').value, $('nClass').value, $('nSno').value);
  if (sch.err) { say(sch.err); return; }
  const rg = NEW_RG ? NEW_RG.get() : { code: null };
  if (rg.err) { say(rg.err); return; }
  const io = $('nIntakeOn').value || null;
  if (io && (io < '2020-01-01' || io > today())) { say('초기 상담한 날을 확인해 주세요'); return; }
  const priv = { diagnosis: $('nDiag').value.trim() || null, disability: $('nDis').value.trim() || null,
                 intake_memo: $('nIntake').value.trim() || null, intake_on: io };
  BUSY = true; $('nGo').disabled = true; $('nGo').textContent = '등록 중…'; say('');
  let kid = null;
  try {
    const r1 = await sb.from('children').insert({
      name, birth, gender: $('nGender').value || null, status: '대기중',
      manage_no: $('nManage').value.trim() || null, ...sch.row, region_code: rg.code,
    }).select('id, child_no, name, birth, gender, status, manage_no, school, school_grade, school_class, school_no, region_code, created_at');
    if (r1.error || !r1.data || r1.data.length !== 1) { say('등록하지 못했습니다' + (r1.error ? ' — ' + r1.error.message : '')); return; }
    kid = r1.data[0]; KIDS.push(kid);
    const fails = [];
    if (phone) {
      const r2 = await sb.from('guardians').insert({ child_id: kid.id, relation: $('nRel').value, name: $('nGName').value.trim() || null, phone, is_primary: true })
        .select('id, child_id, relation, name, phone, is_primary, memo');
      if (r2.error || !r2.data || r2.data.length !== 1) fails.push('보호자'); else GUARDS.push(r2.data[0]);
    }
    if (priv.diagnosis || priv.disability || priv.intake_memo) {
      const r3 = await sb.from('child_private').insert({ ...priv, child_id: kid.id }).select('child_id');
      if (r3.error || !r3.data || r3.data.length !== 1) fails.push('진단 · 초기 상담');
    }
    DIRTY = false; $('newBox').hidden = true; TAB = 'new'; jlRemember('tab', TAB);
    await openKid(kid.id);
    if (fails.length) say(kid.child_no + '번으로 등록했으나 ' + fails.join(' · ') + ' 은(는) 저장하지 못했습니다. 열린 창에서 다시 적어 주세요');
    else say(kid.child_no + '번으로 등록했습니다', 'ok');
  } catch (e) {
    say(kid ? kid.child_no + '번으로 등록했으나 나머지를 저장하지 못했습니다. 열린 창에서 확인해 주세요' : '서버에 닿지 못했습니다. 다시 해 주세요');
  } finally {
    BUSY = false; $('nGo').disabled = false; $('nGo').textContent = '등록';
  }
}

// ── 단추 ──
$('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { TAB = b.dataset.t; jlRemember('tab', TAB); draw(); });
$('q').addEventListener('input', draw);
$('openNew').onclick = openNew;
$('nCancel').onclick = closeNew;
$('nGo').onclick = makeKid;
$('nBirth').addEventListener('input', () => { $('nAge').textContent = ageTxt($('nBirth').value); });
$('newBox').querySelectorAll('input, select, textarea').forEach(i => i.addEventListener('input', markDirty));
$('goHome').onclick = () => { if (!leaveOk()) return; DIRTY = false; location.href = './'; };
$('goOut').onclick = () => { if (!leaveOk()) return; DIRTY = false; jlOut(); };

// ── 처음 열 때 ──
(async () => {
  CTX = await jlStart();
  if (!CTX) return;
  ROLE = CTX.me.role; ME = CTX.me.id;
  $('openNew').hidden = !canEdit();
  $('page').hidden = false;
  TAB = jlRecall('tab') || (canEdit() ? 'new' : 'on');
  const ok = await load();
  const o = Number(jlRecall('open'));
  if (ok && o && KIDS.some(k => k.id === o)) await openKid(o);
})();
</script>

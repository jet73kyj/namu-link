<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 정하기 - 나무링크</title>
<style>
  :root { --ink:#1c1f1a; --ink2:#5a6156; --ink3:#9aa294;
          --line:#e8ebe4; --bg:#f7f8f5; --acc:#3c7a4a; --acc-bg:#eef3ec; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg);
         margin:0; padding:24px; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .box { max-width:420px; margin:48px auto; background:#fff; border-radius:14px;
         padding:32px; border:1px solid var(--line); }
  h1 { font-size:19px; font-weight:600; margin:0 0 4px; }
  .sub { font-size:13px; color:var(--ink3); margin-bottom:22px; line-height:1.7; }
  label { display:block; font-size:12px; color:var(--ink2); margin:16px 0 6px; }
  input { width:100%; font:inherit; font-size:15px; padding:11px; color:var(--ink);
          border:1px solid var(--line); border-radius:8px; background:#fff; }
  input:focus { outline:2px solid var(--acc); outline-offset:-1px; border-color:transparent; }
  button { width:100%; font:inherit; font-size:15px; font-weight:600; padding:13px;
           margin-top:22px; background:var(--acc); color:#fff; border:none;
           border-radius:8px; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button:disabled { background:#c3c8c0; cursor:default; }
  .ghost { background:none; color:var(--ink2); border:1px solid var(--line); margin-top:10px; }
  .out { margin-top:18px; padding:13px 15px; border-radius:8px; font-size:13.5px;
         line-height:1.7; display:none; white-space:pre-wrap; }
  .ok  { background:var(--acc-bg); color:#2c5c37; display:block; }
  .err { background:#fdeeee; color:#9c2b2b; display:block; }
  .hint { font-size:12px; color:var(--ink3); margin-top:7px; line-height:1.7; }
  .who { font-size:13px; color:var(--ink2); background:var(--acc-bg);
         padding:10px 13px; border-radius:8px; margin-bottom:6px; }
  .bar { height:4px; border-radius:3px; background:#eceee9; margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:#d9534f; transition:.2s; }
</style>
</head>
<body>

<div class="box">
  <h1>🌿 비밀번호 정하기</h1>
  <div class="sub" id="sub">확인 중입니다...</div>

  <!-- 정상 진입 -->
  <div id="form" style="display:none;">
    <div class="who" id="who"></div>

    <label for="p1">새 비밀번호</label>
    <input id="p1" type="password" autocomplete="new-password" placeholder="8자 이상">
    <div class="bar"><i id="bar"></i></div>
    <div class="hint">8자 이상. 영문과 숫자를 섞으면 더 안전합니다.</div>

    <label for="p2">한 번 더 입력</label>
    <input id="p2" type="password" autocomplete="new-password" placeholder="같은 비밀번호">

    <button id="save">비밀번호 정하기</button>
  </div>

  <!-- 링크 없이 들어온 경우 -->
  <div id="nolink" style="display:none;">
    <div class="hint" style="font-size:13px;line-height:1.9;">
      비밀번호를 바꾸려면 <b>메일로 받은 링크</b>를 눌러 들어오셔야 합니다.<br><br>
      메일을 못 받으셨거나 링크가 만료되었으면 관리자에게 다시 보내달라고 요청해 주세요.<br><br>
      자라는나무 · 042-488-6011
    </div>
    <button class="ghost" onclick="location.href='index.html'">첫 화면으로</button>
  </div>

  <div id="msg" class="out"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
const sb = window.supabase.createClient(URL_, KEY_);
const $  = id => document.getElementById(id);

function show(t, ok) {
  $('msg').textContent = t;
  $('msg').className = 'out ' + (ok ? 'ok' : 'err');
}

// 비밀번호가 얼마나 튼튼한지 (0~4)
function strength(p) {
  let s = 0;
  if (p.length >= 8) s++;
  if (p.length >= 12) s++;
  if (/[a-zA-Z]/.test(p) && /[0-9]/.test(p)) s++;
  if (/[^a-zA-Z0-9]/.test(p)) s++;
  return s;
}
$('p1').addEventListener('input', () => {
  const s = strength($('p1').value);
  const w = [0, 25, 50, 75, 100][s];
  const c = ['#d9534f','#d9534f','#e0a02a','#7aa63c','#3c7a4a'][s];
  $('bar').style.width = w + '%';
  $('bar').style.background = c;
});

async function ready() {
  // 메일 링크로 들어오면 주소 뒤에 표시가 붙는다. 그걸로 로그인 상태가 만들어진다.
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    $('sub').textContent = '메일 링크를 통해 들어와 주세요.';
    $('nolink').style.display = 'block';
    return;
  }
  const email = data.session.user.email;
  let name = '';
  try {
    const { data: me } = await sb.from('nl_therapists')
      .select('name, role').eq('login_email', email.toLowerCase()).maybeSingle();
    if (me) name = me.name + ' (' + me.role + ')';
  } catch (e) { /* 이름을 못 찾아도 비밀번호는 바꿀 수 있다 */ }

  $('sub').textContent = '새 비밀번호를 정해 주세요. 본인만 알 수 있는 것으로 정하세요.';
  $('who').textContent = (name ? name + ' 님 · ' : '') + email;
  $('form').style.display = 'block';
  $('p1').focus();
}

$('save').onclick = async () => {
  const p1 = $('p1').value, p2 = $('p2').value;
  if (p1.length < 8) { show('비밀번호는 8자 이상으로 정해주세요.', false); $('p1').focus(); return; }
  if (p1 !== p2)     { show('두 칸에 넣은 비밀번호가 서로 다릅니다.', false); $('p2').focus(); return; }

  $('save').disabled = true; $('save').textContent = '바꾸는 중...';
  try {
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) throw error;
    $('form').style.display = 'none';
    $('sub').textContent = '';
    show('✅ 비밀번호를 바꿨습니다.\n\n앞으로 이 비밀번호로 로그인하세요.\n잠시 후 첫 화면으로 넘어갑니다.', true);
    setTimeout(() => { location.href = 'index.html'; }, 2500);
  } catch (e) {
    let m = e.message || '';
    if (/should be different|same as the old/i.test(m)) m = '지금 쓰는 비밀번호와 다른 것으로 정해주세요.';
    else if (/expired|invalid/i.test(m)) m = '링크가 만료되었습니다. 관리자에게 다시 보내달라고 요청해 주세요.';
    show('❌ 바꾸지 못했습니다.\n' + m, false);
    $('save').disabled = false; $('save').textContent = '비밀번호 정하기';
  }
};
$('p2').addEventListener('keydown', e => { if (e.key === 'Enter') $('save').click(); });

// 메일 링크 처리에 잠깐 시간이 걸릴 수 있어 로그인 상태가 잡히면 바로 진행
sb.auth.onAuthStateChange((evt, session) => {
  if (session && $('form').style.display === 'none' && $('nolink').style.display !== 'none') {
    $('nolink').style.display = 'none';
    ready();
  }
});
setTimeout(ready, 400);
</script>
</body>
</html>

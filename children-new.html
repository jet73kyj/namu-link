<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아동 목록 - 나무링크</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; background:#f5f9f0;
         margin:0; padding:24px; color:#333; }
  .box { max-width:460px; margin:40px auto; background:#fff; border-radius:12px;
         padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .wide { max-width:1000px; margin:20px auto; background:#fff; border-radius:12px;
          padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:20px; color:#2e7d32; margin:0 0 4px; }
  .sub { font-size:13px; color:#888; margin-bottom:22px; }
  label { display:block; font-size:13px; font-weight:bold; margin:14px 0 5px; }
  input { width:100%; padding:11px; border:1px solid #ddd; border-radius:7px;
          font-size:15px; box-sizing:border-box; }
  button { width:100%; padding:13px; margin-top:20px; background:#2e7d32; color:#fff;
           border:none; border-radius:7px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { background:#bbb; cursor:default; }
  .out { margin-top:20px; padding:14px; border-radius:8px; font-size:14px;
         line-height:1.7; display:none; white-space:pre-wrap; word-break:break-all; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }

  /* 목록 화면 */
  .top { display:flex; justify-content:space-between; align-items:center;
         flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .who { font-size:13px; color:#666; }
  .btn-out { width:auto; margin:0; padding:8px 16px; background:#757575; font-size:13px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .tab { width:auto; margin:0; padding:8px 14px; background:#eee; color:#555;
         font-size:13px; font-weight:normal; }
  .tab.on { background:#2e7d32; color:#fff; font-weight:bold; }
  .search { width:200px; padding:8px 11px; font-size:14px; }
  .count { font-size:13px; color:#666; margin-left:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { background:#f1f8e9; color:#33691e; padding:10px 8px; text-align:left;
       border-bottom:2px solid #c5e1a5; font-size:13px; white-space:nowrap; }
  td { padding:10px 8px; border-bottom:1px solid #eee; }
  tr:hover td { background:#fafdf7; }
  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px; }
  .b-ing  { background:#e8f5e9; color:#1b5e20; }
  .b-end  { background:#eceff1; color:#546e7a; }
  .b-wait { background:#fff8e1; color:#e65100; }
  .b-etc  { background:#f5f5f5; color:#777; }
  .empty { padding:40px; text-align:center; color:#999; font-size:14px; }
  .flag { color:#e65100; font-size:12px; }
  .idcell { color:#8d6e63; font-weight:bold; white-space:nowrap; width:50px; }
  .addbox { background:#f1f8e9; border:1px solid #c5e1a5; border-radius:10px;
            padding:18px; margin-bottom:18px; }
  .addtitle { font-size:15px; font-weight:bold; color:#33691e; margin-bottom:12px; }
  .addgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
             gap:10px 14px; }
  .addgrid label { font-size:12.5px; font-weight:bold; margin:0 0 4px; color:#555; }
  .addgrid input, .addgrid select { width:100%; padding:8px 10px; font-size:14px;
             border:1px solid #ddd; border-radius:6px; box-sizing:border-box; }
  .addbtns { margin-top:14px; display:flex; gap:8px; }
  .editbox { background:#e8f0fe; border:1px solid #a8c7fa; border-radius:10px;
             padding:18px; margin-bottom:18px; }
  .edittitle { font-size:15px; font-weight:bold; color:#1a468f; margin-bottom:12px; }
  tbody tr { cursor:pointer; }
  table.readonly tbody tr { cursor:default; }
  .edmark { color:#1565c0; font-size:11.5px; font-weight:bold; }
  .tel { font-size:12.5px; color:#00695c; margin-top:3px; white-space:nowrap; }
  .notel { color:#bbb; }

  .btn-home { display:inline-block; padding:8px 16px; background:#2e7d32; color:#fff;
              font-size:13px; border-radius:8px; text-decoration:none;
              white-space:nowrap; margin-right:8px; }
  .btn-home:hover { filter:brightness(1.08); }
</style>
</head>
<body>

<!-- 로그인 전 화면 -->
<div class="box" id="loginBox">
  <h1>🌿 나무링크</h1>
  <div class="sub">아동 목록을 보려면 로그인하세요.</div>

  <label for="em">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com">

  <label for="pw">비밀번호</label>

  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 로그인 후 화면 -->
<div class="wide" id="listBox" style="display:none;">
  <div class="top">
    <div>
      <h1>🌿 아동 목록</h1>
      <div class="who" id="who"></div>

  <div class="tools">

    <span class="count" id="count"></span>

  <!-- 신규 등록 창 -->

    <div class="addtitle">신규 아동 등록</div>

      <div>

          <option value="치료중">치료중</option>
          <option value="종결">종결</option>
        </select>
      </div>
      <div>
        <label for="f_gender">성별</label>
        <select id="f_gender">
          <option value="">-- 선택 --</option>
          <option value="남">남</option>
          <option value="여">여</option>
        </select>
      </div>
      <div>
        <label for="f_phone">연락처</label>
        <input id="f_phone" type="text" placeholder="010-0000-0000">
      </div>
      <div>
        <label for="f_guardian">보호자</label>
        <input id="f_guardian" type="text" placeholder="보호자 이름">
      </div>
      <div>
        <label for="f_diagnosis">진단명</label>
        <input id="f_diagnosis" type="text">
      </div>
      <div>
        <label for="f_disability">장애구분</label>
        <input id="f_disability" type="text">
      </div>
      <div>
        <label for="f_school">학교</label>
        <input id="f_school" type="text">
      </div>
      <div>
        <label for="f_grade">학년</label>
        <input id="f_grade" type="text">
      </div>
      <div style="grid-column:1 / -1;">
        <label for="f_memo">메모</label>
        <input id="f_memo" type="text">
      </div>
    </div>
    <div class="addbtns">
      <button id="saveNew" class="tab" style="background:#2e7d32;color:#fff;font-weight:bold;">저장하기</button>
      <button id="cancelNew" class="tab">취소</button>

    <div id="msg3" class="out"></div>
  </div>

  <!-- 고치기 창 -->
  <div id="edBox" class="editbox" style="display:none;">
    <div class="edittitle" id="edTitle"></div>
    <div class="addgrid">
      <div>
        <label for="e_no">관리번호</label>
        <input id="e_no" type="text">
      </div>
      <div>
        <label for="e_name">이름 <span style="color:#c62828;">*</span></label>
        <input id="e_name" type="text">
      </div>
      <div>
        <label for="e_birth">생년월일</label>
        <input id="e_birth" type="date">
      </div>
      <div>
        <label for="e_status">상태 <span style="color:#c62828;">*</span></label>
        <select id="e_status">
          <option value="치료중">치료중</option>
          <option value="대기중">대기중</option>
          <option value="종결">종결</option>
        </select>
      </div>
      <div>
        <label for="e_gender">성별</label>
        <select id="e_gender">
          <option value="">-- 선택 --</option>
          <option value="남">남</option>
          <option value="여">여</option>
        </select>
      </div>
      <div>
        <label for="e_phone">연락처</label>
        <input id="e_phone" type="text">
      </div>
      <div>
        <label for="e_guardian">보호자</label>
        <input id="e_guardian" type="text">
      </div>
      <div>
        <label for="e_diagnosis">진단명</label>
        <input id="e_diagnosis" type="text">
      </div>
      <div>
        <label for="e_disability">장애구분</label>
        <input id="e_disability" type="text">
      </div>
      <div>
        <label for="e_school">학교</label>
        <input id="e_school" type="text">
      </div>
      <div>
        <label for="e_grade">학년</label>

      </div>
      <div style="grid-column:1 / -1;">

      <button id="saveEdit" class="tab" style="background:#1565c0;color:#fff;font-weight:bold;">저장하기</button>

  </div>

  <table>
    <thead>
      <tr>
        <th>번호</th>
        <th>관리번호</th>
        <th>이름</th>
        <th>생년월일</th>
        <th>나이</th>
        <th>성별</th>
        <th>상태</th>
        <th>메모</th>
        <th></th>
      </tr>

    <tbody id="rows"></tbody>

  <div class="empty" id="empty" style="display:none;">해당하는 아동이 없습니다.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';

// 로그인을 창(탭) 안에서만 유지한다. 창을 닫으면 자동으로 끊긴다.
const sb  = window.supabase.createClient(URL_, KEY_, {
  auth: {
    storage: window.sessionStorage,
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false
  }
});
const $   = id => document.getElementById(id);
const msg = $('msg');

let ALL = [];        // 불러온 아동 전체
let stFilter = '전체';  // 지금 고른 상태
let CAN_EDIT = false;   // 8번 관리자 · 9번 행정만 true

function show(text, ok) {
  msg.textContent = text;
  msg.className = 'out ' + (ok ? 'ok' : 'err');
}

// 생년월일 -> 만 나이
function age(birth) {
  if (!birth) return '';
  const b = new Date(birth);
  if (isNaN(b)) return '';
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a + '세';
}

function badge(st) {
  const c = st === '치료중' ? 'b-ing'
          : st === '종결'   ? 'b-end'
          : st === '대기중' ? 'b-wait' : 'b-etc';
  return '<span class="badge ' + c + '">' + (st || '미지정') + '</span>';
}

// 화면에 글자 그대로 넣기 (따옴표 등 안전 처리)
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function draw() {
  const q = $('q').value.trim();
  const list = ALL.filter(c => {
    const okSt = (stFilter === '전체') || (c.status === stFilter);
    const okQ  = !q || (c.name || '').includes(q);
    return okSt && okQ;
  });

  $('count').textContent = list.length + '명 / 전체 ' + ALL.length + '명';
  $('empty').style.display = list.length ? 'none' : 'block';

  $('rows').innerHTML = list.map(c => {
    const flag = (c.memo || '').includes('[확인필요]')
      ? ' <span class="flag">[확인필요]</span>' : '';

    // 메모 밑에 붙는 연락처 줄 (8번 관리자 · 9번 행정만 보임)
    let tel = '';
    if (CAN_EDIT) {
      if (c.phone) {
        tel = '<div class="tel">📞 '
            + (c.guardian ? esc(c.guardian) + ' ' : '')
            + esc(c.phone) + '</div>';
      } else {
        tel = '<div class="tel"><span class="notel">연락처 없음</span></div>';
      }
    }

    return '<tr' + (CAN_EDIT ? ' data-ed="' + c.id + '"' : '') + '>'
      + '<td class="idcell">' + c.id + '</td>'
      + '<td>' + esc(c.manager_no) + '</td>'
      + '<td>' + esc(c.name) + '</td>'
      + '<td>' + esc(c.birth) + '</td>'
      + '<td>' + age(c.birth) + '</td>'
      + '<td>' + esc(c.gender) + '</td>'
      + '<td>' + badge(c.status) + '</td>'
      + '<td>' + esc(String(c.memo == null ? '' : c.memo).slice(0, 30)) + flag + tel + '</td>'
      + '<td class="edmark">' + (CAN_EDIT ? '고치기' : '') + '</td>'
      + '</tr>';
  }).join('');

  document.querySelectorAll('tr[data-ed]').forEach(tr => {
    tr.onclick = () => openEdit(Number(tr.dataset.ed));
  });
}

async function afterLogin(user) {
  // 1) 직원 확인
  const { data: me, error: e1 } = await sb
    .from('nl_therapists')
    .select('id, name, role, active')
    .eq('login_email', user.email.toLowerCase())
    .maybeSingle();

  if (e1)  { show('❌ 직원 조회 실패\n' + e1.message, false); return; }
  if (!me) { show('⚠️ 직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.', false); return; }

  // 2) 아동 불러오기
  const { data, error } = await sb
    .from('nl_children')
    .select('id, manager_no, name, birth, gender, status, memo, phone, guardian, diagnosis, disability, school, grade_year')
    .order('id');

  if (error) { show('❌ 아동 목록 조회 실패\n' + error.message, false); return; }

  ALL = data || [];

  // 3) 권한 정하기 — 8번 관리자, 9번 행정만 고치기·등록·연락처 보기
  CAN_EDIT = [8, 9].includes(Number(me.id)) || /관리자|행정/.test(me.role || '');

  if (!CAN_EDIT) {
    $('addBtn').style.display = 'none';          // ＋ 신규 등록 감추기
    $('addBox').style.display = 'none';
    $('edBox').style.display  = 'none';
    document.querySelector('table').classList.add('readonly');
  }

  $('who').textContent = me.name + ' (' + me.role + ') 님으로 로그인됨'
                       + (CAN_EDIT ? '' : ' · 보기 전용');
  $('loginBox').style.display = 'none';
  $('listBox').style.display  = 'block';
  draw();
}

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show('이메일과 비밀번호를 모두 입력하세요.', false); return; }

  $('btn').disabled = true;
  $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show('❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false;
    $('btn').textContent = '로그인';
  }
};

$('out').onclick = async () => {
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
};

// 상태 단추
document.querySelectorAll('.tab[data-st]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tab[data-st]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    stFilter = b.dataset.st;
    draw();
  };
});

// ===== 신규 아동 등록 =====

// 올해 마지막 관리번호 다음 번호를 만든다
function nextManagerNo() {
  const yr = new Date().getFullYear();
  const pre = String(yr) + '01-자라는 ';
  let max = 0;
  ALL.forEach(c => {
    const s = c.manager_no || '';
    if (s.startsWith(pre)) {
      const n = parseInt(s.slice(pre.length).trim(), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return pre + String(max + 1).padStart(3, '0');
}

function show3(text, ok) {
  $('msg3').textContent = text;
  $('msg3').className = 'out ' + (ok ? 'ok' : 'err');
}

function clearForm() {
  ['f_name','f_birth','f_phone','f_guardian','f_diagnosis','f_disability',
   'f_school','f_grade','f_memo']
    .forEach(k => $(k).value = '');
  $('f_gender').value = '';
  $('f_status').value = '대기중';
  $('msg3').className = 'out';
  $('msg3').textContent = '';
}

$('addBtn').onclick = () => {
  const open = $('addBox').style.display !== 'none';
  if (open) { $('addBox').style.display = 'none'; return; }
  clearForm();
  $('f_no').value = nextManagerNo();
  $('addBox').style.display = 'block';
  $('f_name').focus();
};

$('cancelNew').onclick = () => { $('addBox').style.display = 'none'; };

$('saveNew').onclick = async () => {
  const name  = $('f_name').value.trim();
  const birth = $('f_birth').value;
  const st    = $('f_status').value;

  if (!name)  { show3('이름을 입력하세요.', false); return; }
  if (!birth) { show3('생년월일을 입력하세요.', false); return; }
  if (!st)    { show3('상태를 고르세요.', false); return; }

  // 같은 이름 + 같은 생년월일이 이미 있으면 막는다
  const dup = ALL.find(c => (c.name || '') === name && (c.birth || '') === birth);
  if (dup) {
    show3('⚠️ 같은 이름 · 같은 생년월일 아동이 이미 있습니다.\n번호 ' + dup.id +
          ' (' + (dup.manager_no || '관리번호 없음') + ')\n중복 등록이 아닌지 확인하세요.', false);
    return;
  }

  const row = {
    manager_no: $('f_no').value,
    name: name,
    birth: birth,
    status: st,
    gender:     $('f_gender').value || null,
    phone:      $('f_phone').value.trim() || null,
    guardian:   $('f_guardian').value.trim() || null,
    diagnosis:  $('f_diagnosis').value.trim() || null,
    disability: $('f_disability').value.trim() || null,
    school:     $('f_school').value.trim() || null,
    grade_year: $('f_grade').value.trim() || null,
    memo:       $('f_memo').value.trim() || null
  };

  $('saveNew').disabled = true;
  $('saveNew').textContent = '저장 중...';
  try {
    const { data, error } = await sb.from('nl_children')
      .insert(row)
      .select('id, manager_no, name, birth, gender, status, memo, phone, guardian, diagnosis, disability, school, grade_year')
      .single();
    if (error) throw error;

    ALL.push(data);
    ALL.sort((a, b) => (a.id || 0) - (b.id || 0));
    draw();
    show3('✅ 등록했습니다. 번호 ' + data.id + ' / ' + data.manager_no, true);
    clearForm();
    $('f_no').value = nextManagerNo();
    $('f_name').focus();
  } catch (e) {
    show3('❌ 등록하지 못했습니다.\n' + e.message, false);
  } finally {
    $('saveNew').disabled = false;
    $('saveNew').textContent = '저장하기';
  }
};

// ===== 아동 정보 고치기 =====
let edId = null;

function show4(text, ok) {
  $('msg4').textContent = text;
  $('msg4').className = 'out ' + (ok ? 'ok' : 'err');
}

function openEdit(id) {
  if (!CAN_EDIT) return;
  const c = ALL.find(x => x.id === id);
  if (!c) return;
  edId = id;
  $('addBox').style.display = 'none';
  $('edTitle').textContent = '아동 ' + c.id + '번 고치기';
  $('e_no').value         = c.manager_no || '';
  $('e_name').value       = c.name || '';
  $('e_birth').value      = c.birth || '';
  $('e_status').value     = c.status || '치료중';
  $('e_gender').value     = c.gender || '';
  $('e_phone').value      = c.phone || '';
  $('e_guardian').value   = c.guardian || '';
  $('e_diagnosis').value  = c.diagnosis || '';
  $('e_disability').value = c.disability || '';
  $('e_school').value     = c.school || '';
  $('e_grade').value      = c.grade_year || '';
  $('e_memo').value       = c.memo || '';
  $('msg4').className = 'out';
  $('msg4').textContent = '';
  $('edBox').style.display = 'block';
  $('edBox').scrollIntoView({ behavior:'smooth', block:'start' });
}

$('cancelEdit').onclick = () => { $('edBox').style.display = 'none'; edId = null; };

$('saveEdit').onclick = async () => {
  if (!edId) return;
  const name = $('e_name').value.trim();
  if (!name) { show4('이름을 입력하세요.', false); return; }

  const before = ALL.find(x => x.id === edId);
  const newSt  = $('e_status').value;
  if (before && before.status !== newSt) {
    if (!confirm('상태를 ' + before.status + ' → ' + newSt + ' 로 바꿉니다.\n계속할까요?')) return;
  }

  const up = {
    manager_no: $('e_no').value.trim() || null,
    name:       name,
    birth:      $('e_birth').value || null,
    status:     newSt,
    gender:     $('e_gender').value || null,
    phone:      $('e_phone').value.trim() || null,
    guardian:   $('e_guardian').value.trim() || null,
    diagnosis:  $('e_diagnosis').value.trim() || null,
    disability: $('e_disability').value.trim() || null,
    school:     $('e_school').value.trim() || null,
    grade_year: $('e_grade').value.trim() || null,
    memo:       $('e_memo').value.trim() || null,
    updated_at: new Date().toISOString()
  };

  $('saveEdit').disabled = true;
  $('saveEdit').textContent = '저장 중...';
  try {
    const { data, error } = await sb.from('nl_children')
      .update(up).eq('id', edId)
      .select('id, manager_no, name, birth, gender, status, memo, phone, guardian, diagnosis, disability, school, grade_year')
      .single();
    if (error) throw error;

    const i = ALL.findIndex(x => x.id === edId);
    if (i >= 0) ALL[i] = data;
    ALL.sort((a, b) => (a.id || 0) - (b.id || 0));
    draw();
    show4('✅ 저장했습니다.'
      + (before && before.status !== newSt
         ? '\n상태를 ' + newSt + ' 로 바꿨습니다. 시간표와 납부 계산에도 반영됩니다.' : ''), true);
  } catch (e) {
    show4('❌ 저장하지 못했습니다.\n' + e.message, false);
  } finally {
    $('saveEdit').disabled = false;
    $('saveEdit').textContent = '저장하기';
  }
};

$('q').addEventListener('input', draw);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

// 이미 로그인되어 있으면 바로 목록 표시
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
  else {
    // 로그인이 없으면 첫 화면으로 보낸다 (빈 화면이 열리는 것을 막기 위함)
    location.replace('index.html');
  }
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아동 목록 - 나무링크</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; background:#f5f9f0;
         margin:0; padding:24px; color:#333; }
  .box { max-width:460px; margin:40px auto; background:#fff; border-radius:12px;
         padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .wide { max-width:1000px; margin:20px auto; background:#fff; border-radius:12px;
          padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:20px; color:#2e7d32; margin:0 0 4px; }
  .sub { font-size:13px; color:#888; margin-bottom:22px; }
  label { display:block; font-size:13px; font-weight:bold; margin:14px 0 5px; }
  input { width:100%; padding:11px; border:1px solid #ddd; border-radius:7px;
          font-size:15px; box-sizing:border-box; }
  button { width:100%; padding:13px; margin-top:20px; background:#2e7d32; color:#fff;
           border:none; border-radius:7px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { background:#bbb; cursor:default; }
  .out { margin-top:20px; padding:14px; border-radius:8px; font-size:14px;
         line-height:1.7; display:none; white-space:pre-wrap; word-break:break-all; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }

  /* 목록 화면 */
  .top { display:flex; justify-content:space-between; align-items:center;
         flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .who { font-size:13px; color:#666; }
  .btn-out { width:auto; margin:0; padding:8px 16px; background:#757575; font-size:13px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .tab { width:auto; margin:0; padding:8px 14px; background:#eee; color:#555;
         font-size:13px; font-weight:normal; }
  .tab.on { background:#2e7d32; color:#fff; font-weight:bold; }
  .search { width:200px; padding:8px 11px; font-size:14px; }
  .count { font-size:13px; color:#666; margin-left:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { background:#f1f8e9; color:#33691e; padding:10px 8px; text-align:left;
       border-bottom:2px solid #c5e1a5; font-size:13px; white-space:nowrap; }
  td { padding:10px 8px; border-bottom:1px solid #eee; }
  tr:hover td { background:#fafdf7; }
  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px; }
  .b-ing  { background:#e8f5e9; color:#1b5e20; }
  .b-end  { background:#eceff1; color:#546e7a; }
  .b-wait { background:#fff8e1; color:#e65100; }
  .b-etc  { background:#f5f5f5; color:#777; }
  .empty { padding:40px; text-align:center; color:#999; font-size:14px; }
  .flag { color:#e65100; font-size:12px; }
</style>
</head>
<body>

<!-- 로그인 전 화면 -->
<div class="box" id="loginBox">
  <h1>🌿 나무링크</h1>
  <div class="sub">아동 목록을 보려면 로그인하세요.</div>

  <label for="em">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com">

  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">

  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 로그인 후 화면 -->
<div class="wide" id="listBox" style="display:none;">
  <div class="top">
    <div>
      <h1>🌿 아동 목록</h1>
      <div class="who" id="who"></div>
    </div>
    <button id="out" class="btn-out">로그아웃</button>
  </div>

  <div class="tools">
    <button class="tab on" data-st="전체">전체</button>
    <button class="tab" data-st="치료중">치료중</button>
    <button class="tab" data-st="종결">종결</button>
    <button class="tab" data-st="대기중">대기중</button>
    <input class="search" id="q" type="text" placeholder="이름 검색">
    <span class="count" id="count"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th>관리번호</th>
        <th>이름</th>
        <th>생년월일</th>
        <th>나이</th>
        <th>성별</th>
        <th>상태</th>
        <th>메모</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none;">해당하는 아동이 없습니다.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';

const sb  = window.supabase.createClient(URL_, KEY_);
const $   = id => document.getElementById(id);
const msg = $('msg');

let ALL = [];        // 불러온 아동 전체
let stFilter = '전체';  // 지금 고른 상태

function show(text, ok) {
  msg.textContent = text;
  msg.className = 'out ' + (ok ? 'ok' : 'err');
}

// 생년월일 -> 만 나이
function age(birth) {
  if (!birth) return '';
  const b = new Date(birth);
  if (isNaN(b)) return '';
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a + '세';
}

function badge(st) {
  const c = st === '치료중' ? 'b-ing'
          : st === '종결'   ? 'b-end'
          : st === '대기중' ? 'b-wait' : 'b-etc';
  return '<span class="badge ' + c + '">' + (st || '미지정') + '</span>';
}

// 화면에 글자 그대로 넣기 (따옴표 등 안전 처리)
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function draw() {
  const q = $('q').value.trim();
  const list = ALL.filter(c => {
    const okSt = (stFilter === '전체') || (c.status === stFilter);
    const okQ  = !q || (c.name || '').includes(q);
    return okSt && okQ;
  });

  $('count').textContent = list.length + '명 / 전체 ' + ALL.length + '명';
  $('empty').style.display = list.length ? 'none' : 'block';

  $('rows').innerHTML = list.map(c => {
    const flag = (c.memo || '').includes('[확인필요]')
      ? ' <span class="flag">[확인필요]</span>' : '';
    return '<tr>'
      + '<td>' + esc(c.manager_no) + '</td>'
      + '<td>' + esc(c.name) + '</td>'
      + '<td>' + esc(c.birth) + '</td>'
      + '<td>' + age(c.birth) + '</td>'
      + '<td>' + esc(c.gender) + '</td>'
      + '<td>' + badge(c.status) + '</td>'
      + '<td>' + esc(c.memo).slice(0, 30) + flag + '</td>'
      + '</tr>';
  }).join('');
}

async function afterLogin(user) {
  // 1) 직원 확인
  const { data: me, error: e1 } = await sb
    .from('nl_therapists')
    .select('name, role, active')
    .eq('login_email', user.email.toLowerCase())
    .maybeSingle();

  if (e1)  { show('❌ 직원 조회 실패\n' + e1.message, false); return; }
  if (!me) { show('⚠️ 직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.', false); return; }

  // 2) 아동 불러오기
  const { data, error } = await sb
    .from('nl_children')
    .select('id, manager_no, name, birth, gender, status, memo')
    .order('name');

  if (error) { show('❌ 아동 목록 조회 실패\n' + error.message, false); return; }

  ALL = data || [];
  $('who').textContent = me.name + ' (' + me.role + ') 님으로 로그인됨';
  $('loginBox').style.display = 'none';
  $('listBox').style.display  = 'block';
  draw();
}

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show('이메일과 비밀번호를 모두 입력하세요.', false); return; }

  $('btn').disabled = true;
  $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show('❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false;
    $('btn').textContent = '로그인';
  }
};

$('out').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

// 상태 단추
document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    stFilter = b.dataset.st;
    draw();
  };
});

$('q').addEventListener('input', draw);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

// 이미 로그인되어 있으면 바로 목록 표시
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) await afterLogin(data.session.user);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나무링크 · 학부모</title>
<style>
  :root {
    --ink:#1c1f1a; --ink2:#5a6156; --ink3:#9aa294;
    --line:#e8ebe4; --bg:#f7f8f5; --acc:#3c7a4a; --acc-bg:#eef3ec;
  }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg);
         margin:0; padding:18px 14px 40px; color:var(--ink);
         -webkit-font-smoothing:antialiased; }

  .box  { max-width:400px; margin:36px auto; background:#fff; border-radius:14px;
          padding:26px 22px; border:1px solid var(--line); }
  .wrap { max-width:560px; margin:0 auto; }

  h1 { font-size:18px; font-weight:600; letter-spacing:-.01em; margin:0; }
  .sub { font-size:13px; color:var(--ink3); margin:6px 0 20px; }
  label { display:block; font-size:12px; color:var(--ink2); margin:14px 0 6px; }
  input { font:inherit; font-size:16px; padding:11px; color:var(--ink);
          border:1px solid var(--line); border-radius:8px; background:#fff; width:100%; }
  input:focus { outline:2px solid var(--acc); outline-offset:-1px; border-color:transparent; }
  button { font:inherit; font-size:14px; font-weight:500; padding:10px 15px;
           background:var(--acc); color:#fff; border:none; border-radius:8px; cursor:pointer; }
  button:disabled { background:#c3c8c0; cursor:default; }
  .box button { width:100%; padding:13px; margin-top:20px; font-size:15px; }
  .ghost { background:none; color:var(--ink2); border:1px solid var(--line); }

  .out { margin-top:14px; padding:11px 13px; border-radius:8px; font-size:13.5px;
         line-height:1.6; display:none; white-space:pre-wrap; }
  .ok  { background:var(--acc-bg); color:#2c5c37; display:block; }
  .err { background:#fdeeee; color:#9c2b2b; display:block; }

  .top { display:flex; justify-content:space-between; align-items:center;
         gap:10px; margin-bottom:14px; }

  .kids { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .kid  { background:#fff; color:var(--ink2); border:1px solid var(--line);
          border-radius:20px; padding:8px 16px; font-size:14px; }
  .kid.on { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:600; }

  .bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .bar .mk { font-size:15px; font-weight:600; flex:1; text-align:center; }
  .bar button { padding:8px 14px; }

  .day { background:#fff; border:1px solid var(--line); border-radius:12px;
         padding:13px 15px; margin-bottom:9px; }
  .day .dt { font-size:13px; color:var(--ink3); margin-bottom:7px; font-weight:600; }
  .row { display:flex; align-items:baseline; gap:9px; padding:5px 0;
         border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; }
  .row .tm { font-size:15px; font-weight:600; min-width:52px; }
  .row .nm { font-size:14px; flex:1; }
  .row .th { font-size:12.5px; color:var(--ink3); }
  .tag { font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px;
         background:var(--acc-bg); color:#2c5c37; white-space:nowrap; }
  .tag.off { background:#f0f1ee; color:#8b9186; }
  .tag.ab  { background:#fdeeee; color:#9c2b2b; }
  .tag.mk  { background:#fdf3e6; color:#a9701c; }
  .row.rest { background:#f0f1ee; border-radius:8px; padding:9px 12px; margin:4px 0;
              border-top:none; }
  .row.rest .nm { color:#8b9186; font-size:13.5px; font-weight:600; }

  /* 위쪽 갈래 단추 */
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { flex:1; background:#fff; color:var(--ink2);
                 border:1px solid var(--line); padding:11px; font-size:15px; }
  .tabs button.on { background:var(--acc); color:#fff; border-color:var(--acc);
                    font-weight:600; }

  /* 교육비 */
  .pkid { border-radius:16px; padding:16px 17px 14px; margin-bottom:12px;
          border:1px solid rgba(0,0,0,.05); }
  .pkid.c0 { background:#eef4ee; }
  .pkid.c1 { background:#eef1f6; }
  .pkid.c2 { background:#f6f0ea; }
  .pkid.c3 { background:#f3eef5; }
  .pkid .knm { font-size:16px; font-weight:700; margin-bottom:12px;
               display:flex; align-items:center; gap:7px; }
  .pkid .knm::before { content:''; width:5px; height:17px; border-radius:3px;
                       background:var(--acc); }
  .grpttl { font-size:12.5px; font-weight:700; color:var(--ink2);
            background:rgba(255,255,255,.75); border-radius:8px;
            padding:8px 11px; margin:12px 0 6px; }
  .pr { display:flex; align-items:center; gap:8px; padding:8px 11px;
        background:#fff; border-radius:9px; margin-bottom:5px; }
  .pr .pn { flex:1; font-size:14px; }
  .pr .pa { font-size:15px; font-weight:700; white-space:nowrap; }
  .pill { font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px;
          white-space:nowrap; }
  .pr.pblk { display:block; }
  .ptop { display:flex; align-items:center; gap:8px; }
  .pdet { margin-top:7px; padding-top:7px; border-top:1px dashed #e4e7e0; }
  .dtl { display:flex; justify-content:space-between; gap:8px;
         font-size:12.5px; color:var(--ink2); padding:2px 0; }
  .dtl.ded { color:#9c2b2b; }
  .dtl span:last-child { font-weight:600; white-space:nowrap; }
  .pill.paid { background:var(--acc-bg); color:#2c5c37; }
  .pill.no   { background:#fdeaea; color:#9c2b2b; }
  .pill.est  { background:#eef1f6; color:#3b5170; }
  .estnote { font-size:12px; color:var(--ink2); line-height:1.75;
             background:#eef1f6; border-radius:10px; padding:11px 13px;
             margin-bottom:12px; }
  .psub { text-align:right; font-size:13px; color:var(--ink2);
          margin:8px 3px 0; font-weight:600; }
  .ptot { background:var(--acc); color:#fff; border-radius:14px;
          padding:16px 18px; font-size:17px; font-weight:700; text-align:right;
          margin-bottom:12px; box-shadow:0 2px 10px rgba(60,122,74,.18); }
  .pacc { font-size:11.5px; color:var(--ink2); line-height:1.8; margin-top:7px;
          background:rgba(255,255,255,.6); border-radius:8px; padding:9px 11px; }
  .unpaid { background:#fdf1f1; border:1px solid #f4d9d9; border-radius:16px;
            padding:15px 17px; margin-bottom:12px; }
  .unpaid .ut { font-size:14px; font-weight:700; color:#9c2b2b; margin-bottom:9px; }
  .unpaid .pr { background:#fff; }
  .unpaid .pr .pa { color:#9c2b2b; }
  .pfoot { text-align:center; font-size:12px; color:var(--ink3);
           margin-top:16px; line-height:1.9; }

  .none { padding:40px 18px; text-align:center; color:var(--ink3); font-size:14px;
          background:#fff; border:1px solid var(--line); border-radius:12px; }
  .foot { margin-top:26px; font-size:12px; color:var(--ink3); line-height:1.9;
          border-top:1px solid var(--line); padding-top:14px; }
</style>
</head>
<body>

<!-- 로그인 전 -->
<div class="box" id="loginBox">
  <h1>🌿 나무링크</h1>
  <div class="sub">자라는나무 아동발달치료센터</div>
  <label for="ph">휴대폰 번호</label>
  <input id="ph" type="tel" inputmode="numeric" autocomplete="username"
         placeholder="01012345678">
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" inputmode="numeric" autocomplete="current-password">
  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 첫 로그인 — 비밀번호 바꾸기 -->
<div class="box" id="pwBox" style="display:none;">
  <h1>🌿 비밀번호 정하기</h1>
  <div class="sub">처음 들어오셨습니다.<br>쓰실 비밀번호를 정해 주세요.</div>
  <label for="np1">새 비밀번호 (숫자 4자리)</label>
  <input id="np1" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password">
  <label for="np2">한 번 더</label>
  <input id="np2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password">
  <button id="npBtn">이 번호로 정하기</button>
  <div id="npMsg" class="out"></div>
  <div style="margin-top:16px;font-size:12px;color:var(--ink3);line-height:1.8;">
    정하신 번호는 휴대폰에 적어 두시면 좋습니다.<br>
    잊으셨을 때는 센터(042-488-6011)로 연락 주세요.
  </div>
</div>

<!-- 로그인 후 -->
<div class="wrap" id="mainBox" style="display:none;">
  <div class="top">
    <h1>🌿 나무링크</h1>
    <button id="out" class="ghost">로그아웃</button>
  </div>

  <div class="tabs">
    <button id="tabSch" class="on">시간표</button>
    <button id="tabPay">교육비</button>
  </div>

  <div class="kids" id="kids"></div>

  <div class="bar">
    <button id="prev" class="ghost">‹ 지난달</button>
    <div class="mk" id="mkLabel"></div>
    <button id="next" class="ghost">다음달 ›</button>
  </div>

  <div id="list"></div>
  <div id="paylist" style="display:none;"></div>

  <div class="foot">
    자라는나무 · 042-488-6011<br>
    시간표가 실제와 다르면 센터로 연락 주세요.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';

// 로그인을 창(탭) 안에서만 유지한다. 창을 닫으면 끊긴다.
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
const $ = id => document.getElementById(id);

const MAIL_TAIL = '@parent.namu';
const PW_TAIL   = 'nl26';   // 4자리를 6자 이상으로 채우는 표시
const DAYS = ['일','월','화','수','목','금','토'];

let KIDS = [];      // 내 자녀 [{id, name}]
let CURKID = null;  // 지금 보고 있는 자녀
let CURMK = '';     // 지금 보고 있는 달 'YYYY-MM'
let TYPES = {};     // 치료 종류 이름
let THRS  = {};     // 치료사 이름

function show(el, t, ok) { el.textContent = t; el.className = 'out ' + (ok ? 'ok' : 'err'); }
function esc(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function thisMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function shiftMonth(mk, n) {
  const y = +mk.slice(0, 4), m = +mk.slice(5, 7);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }

// ── 로그인 ─────────────────────────────────────────────
$('btn').onclick = async () => {
  const phone = $('ph').value.replace(/[^0-9]/g, '');
  const pw    = $('pw').value;
  if (!phone || !pw) { show($('msg'), '휴대폰 번호와 비밀번호를 모두 넣어 주세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    // 잠겨 있는지 먼저 본다
    const { data: g } = await sb.rpc('nl_parent_gate', { p_phone: phone });
    const gate = Array.isArray(g) ? g[0] : g;
    if (gate && gate.locked) {
      const m = Math.ceil((gate.wait_sec || 0) / 60);
      show($('msg'), '비밀번호를 여러 번 잘못 넣어 잠겼습니다.\n'
        + m + '분 뒤에 다시 해 주세요.', false);
      return;
    }

    // 임시 비번은 4자리 그대로, 학부모가 바꾼 뒤에는 뒤에 표시가 붙는다
    let { error } = await sb.auth.signInWithPassword({
      email: phone + MAIL_TAIL, password: pw
    });
    if (error) {
      const r2 = await sb.auth.signInWithPassword({
        email: phone + MAIL_TAIL, password: pw + PW_TAIL
      });
      error = r2.error;
    }
    if (error) {
      const n = await sb.rpc('nl_parent_fail', { p_phone: phone });
      const cnt = Number(n && n.data != null ? n.data : (n || 0));
      const left = 5 - cnt;
      show($('msg'), left > 0
        ? '번호나 비밀번호가 맞지 않습니다.\n' + left + '번 더 틀리면 10분 잠깁니다.'
        : '5번 틀려서 10분 잠겼습니다.\n잠시 뒤에 다시 해 주세요.', false);
      return;
    }

    try { localStorage.setItem('nl_parent_phone', phone); } catch (e) {}

    // 성공 — 틀린 횟수를 되돌리고, 비번을 바꿔야 하는지 본다
    let mustChange = false;
    try {
      const { data: ok } = await sb.rpc('nl_parent_ok');
      const row = Array.isArray(ok) ? ok[0] : ok;
      mustChange = !!(row && row.must_change);
    } catch (e) {}

    if (mustChange) { showChange(); return; }
    await afterLogin();
  } catch (e) {
    show($('msg'), '로그인하지 못했습니다.\n잠시 뒤에 다시 해 주세요.', false);
  } finally {
    $('btn').disabled = false; $('btn').textContent = '로그인';
  }
};

// ── 첫 로그인 — 비밀번호 바꾸기 ─────────────────────────
function showChange() {
  $('loginBox').style.display = 'none';
  $('pwBox').style.display    = 'block';
  $('np1').focus();
}

$('npBtn').onclick = async () => {
  const a = $('np1').value.replace(/[^0-9]/g, '');
  const b = $('np2').value.replace(/[^0-9]/g, '');
  if (a.length !== 4) { show($('npMsg'), '숫자 4자리로 정해 주세요.', false); return; }
  if (a !== b)        { show($('npMsg'), '두 칸이 서로 다릅니다.', false); return; }
  if (/^(\d)\1{3}$/.test(a) || a === '1234' || a === '0000') {
    show($('npMsg'), '너무 쉬운 번호입니다. 다른 것으로 정해 주세요.', false); return;
  }
  $('npBtn').disabled = true; $('npBtn').textContent = '바꾸는 중...';
  try {
    const { error } = await sb.auth.updateUser({ password: a + PW_TAIL });
    if (error) throw error;
    await sb.rpc('nl_parent_done');
    $('pwBox').style.display = 'none';
    await afterLogin();
  } catch (e) {
    show($('npMsg'), '바꾸지 못했습니다.\n잠시 뒤에 다시 해 주세요.', false);
  } finally {
    $('npBtn').disabled = false; $('npBtn').textContent = '이 번호로 정하기';
  }
};
$('np2').addEventListener('keydown', e => { if (e.key === 'Enter') $('npBtn').click(); });

$('out').onclick = async () => {
  $('out').disabled = true; $('out').textContent = '나가는 중...';
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('parent.html');
};

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });
$('ph').addEventListener('keydown', e => { if (e.key === 'Enter') $('pw').focus(); });

// 지난번 번호를 채워둔다 (비밀번호는 저장하지 않는다)
try {
  const last = localStorage.getItem('nl_parent_phone');
  if (last) $('ph').value = last;
} catch (e) {}

// ── 로그인 뒤 ───────────────────────────────────────────
async function afterLogin() {
  // 내 자녀 — 표 잠금이 알아서 내 아이만 내려준다
  const { data: kids, error } = await sb
    .from('nl_children').select('id, name').order('id');

  if (error) { show($('msg'), '자료를 가져오지 못했습니다.\n센터로 연락해 주세요.', false); return; }
  if (!kids || !kids.length) {
    show($('msg'), '보실 수 있는 자녀가 없습니다.\n센터로 연락해 주세요.', false); return;
  }

  KIDS = kids;
  CURKID = kids[0].id;
  CURMK = thisMonth();

  // 이름표 미리 담아둔다
  const { data: tt } = await sb.from('nl_therapy_types').select('id, name');
  (tt || []).forEach(r => { TYPES[r.id] = r.name; });
  const { data: th } = await sb.from('nl_therapists').select('id, name');
  (th || []).forEach(r => { THRS[r.id] = r.name; });

  drawKids();
  $('loginBox').style.display = 'none';
  $('mainBox').style.display  = 'block';
  drawTabs();
  await reload();
}

function drawKids() {
  if (KIDS.length < 2) { $('kids').innerHTML = ''; return; }
  $('kids').innerHTML = KIDS.map(k =>
    '<button class="kid' + (k.id === CURKID ? ' on' : '') + '" data-id="' + k.id + '">'
    + esc(k.name) + '</button>').join('');
  $('kids').querySelectorAll('.kid').forEach(b => {
    b.onclick = async () => { CURKID = +b.dataset.id; drawKids(); await loadMonth(); };
  });
}

$('prev').onclick = async () => { CURMK = shiftMonth(CURMK, -1); await reload(); };
$('next').onclick = async () => { CURMK = shiftMonth(CURMK,  1); await reload(); };

// ── 갈래 단추 ──────────────────────────────────────────
let TAB = 'sch';
$('tabSch').onclick = async () => { TAB = 'sch'; drawTabs(); await reload(); };
$('tabPay').onclick = async () => { TAB = 'pay'; drawTabs(); await reload(); };

function drawTabs() {
  $('tabSch').className = (TAB === 'sch' ? 'on' : '');
  $('tabPay').className = (TAB === 'pay' ? 'on' : '');
  $('list').style.display    = (TAB === 'sch' ? 'block' : 'none');
  $('paylist').style.display = (TAB === 'pay' ? 'block' : 'none');
  $('kids').style.display    = (TAB === 'sch' ? 'flex'  : 'none');
}

async function reload() {
  if (TAB === 'sch') await loadMonth();
  else               await loadPay();
}

// ── 한 달 시간표 ────────────────────────────────────────
async function loadMonth() {
  $('mkLabel').textContent = CURMK.slice(0, 4) + '년 ' + (+CURMK.slice(5, 7)) + '월';
  $('list').innerHTML = '<div class="none">불러오는 중...</div>';

  const { data, error } = await sb
    .from('nl_sessions')
    .select('plan_date, start_time, status, therapist_id, therapy_id')
    .eq('child_id', CURKID)
    .eq('month_key', CURMK)
    .order('plan_date').order('start_time');

  if (error) {
    $('list').innerHTML = '<div class="none">시간표를 가져오지 못했습니다.<br>센터로 연락해 주세요.</div>';
    return;
  }
  if (!data || !data.length) {
    $('list').innerHTML = '<div class="none">이 달에는 수업이 없습니다.'
      + (CURMK < '2026-08'
         ? '<br><span style="font-size:12.5px;">시간표는 2026년 8월부터 기록되어 있습니다.</span>'
         : '')
      + '</div>';
    return;
  }

  // 치료 종류를 알아내기 위해 치료 줄을 함께 가져온다
  const tids = [...new Set(data.map(r => r.therapy_id).filter(Boolean))];
  const T = {};
  if (tids.length) {
    const { data: ths } = await sb
      .from('nl_therapies').select('id, therapy_type_id').in('id', tids);
    (ths || []).forEach(r => { T[r.id] = r.therapy_type_id; });
  }

  // 공휴일 이름을 가져온다 (치료사 휴가는 표 잠금이 막아 안 내려온다)
  const HOL = {};
  const dates = [...new Set(data.map(r => r.plan_date))];
  if (dates.length) {
    const { data: offs } = await sb
      .from('nl_offdays').select('off_date, reason').in('off_date', dates);
    (offs || []).forEach(r => { HOL[r.off_date] = r.reason || '휴무'; });
  }

  // 날짜별로 묶는다
  const byDay = {};
  data.forEach(r => { (byDay[r.plan_date] = byDay[r.plan_date] || []).push(r); });

  $('list').innerHTML = Object.keys(byDay).sort().map(d => {
    const dd = new Date(d + 'T00:00:00');
    const head = (+d.slice(5, 7)) + '월 ' + (+d.slice(8, 10)) + '일 ('
               + DAYS[dd.getDay()] + ')';
    const rows = byDay[d].map(r => {
      const tname = TYPES[T[r.therapy_id]] || '수업';
      const thn   = THRS[r.therapist_id] || '';
      const st    = String(r.status || '');

      // 쉬는 날 — 시간을 보이지 않는다
      if (st === '쉼' || st === '휴무') {
        const txt = HOL[d] ? HOL[d] + ' · 휴무'
                           : (thn ? thn + ' 선생님 휴무' : '휴무');
        return '<div class="row rest"><div class="nm">' + esc(txt) + '</div></div>';
      }

      let cls = 'tag', txt = st;
      if (st === '결석')      { cls = 'tag ab'; }
      else if (st === '보강') { cls = 'tag mk'; }
      return '<div class="row">'
        + '<div class="tm">' + esc(hhmm(r.start_time)) + '</div>'
        + '<div class="nm">' + esc(tname)
        + (thn ? ' <span class="th">' + esc(thn) + ' 선생님</span>' : '') + '</div>'
        + (txt ? '<span class="' + cls + '">' + esc(txt) + '</span>' : '')
        + '</div>';
    }).join('');
    return '<div class="day"><div class="dt">' + esc(head) + '</div>' + rows + '</div>';
  }).join('');
}

// ── 교육비 ─────────────────────────────────────────────
const BAR13 = '\u2501'.repeat(13);

function won(n) { return Number(n || 0).toLocaleString() + '원'; }
function mmdd(d) {
  if (!d) return '';
  return (+String(d).slice(5, 7)) + '/' + (+String(d).slice(8, 10));
}

async function loadPay() {
  $('mkLabel').textContent = CURMK.slice(0, 4) + '년 ' + (+CURMK.slice(5, 7)) + '월';
  $('paylist').innerHTML = '<div class="none">불러오는 중...</div>';

  const ids = KIDS.map(k => k.id);

  // 이 달 것 — 메모 칸은 가져오지 않는다
  let { data: cur, error } = await sb
    .from('nl_payments')
    .select('child_id, support_type_id, amount, paid_on, month_key, carry_over')
    .in('child_id', ids).eq('month_key', CURMK);

  if (error) {
    $('paylist').innerHTML = '<div class="none">교육비 내역을 가져오지 못했습니다.<br>센터로 연락해 주세요.</div>';
    return;
  }

  // 아직 안 낸 것 — 달을 가리지 않고 모두
  const { data: un } = await sb
    .from('nl_payments')
    .select('child_id, support_type_id, amount, month_key')
    .in('child_id', ids).is('paid_on', null).gt('amount', 0)
    .order('month_key');

  // 저장된 것이 없는 자녀는 「예정」으로 채운다
  if (!Array.isArray(cur)) cur = [];
  const EST = {};
  for (const k of KIDS) {
    const has = (cur || []).some(r => r.child_id === k.id && Number(r.amount) > 0);
    if (has) continue;
    try {
      const { data: e } = await sb.rpc('nl_parent_estimate',
        { p_child: k.id, p_mk: CURMK });
      (e || []).forEach(r => {
        if (Number(r.amount) > 0) {
          cur.push({ child_id: k.id, support_type_id: Number(r.support_type_id),
                     amount: Number(r.amount), paid_on: null,
                     month_key: CURMK, carry_over: 0, _est: true });
          EST[k.id] = true;
        }
      });
    } catch (e2) {}
  }

  // 지원유형 이름표
  const { data: sts } = await sb.from('nl_support_types').select('id, name');
  const SN = {};
  (sts || []).forEach(r => { SN[r.id] = r.name; });

  // 지원금 제외액
  const { data: rules } = await sb.from('nl_support_rules').select('*');
  const DED = {};
  (rules || []).forEach(r => {
    const k = r.support_type_id != null ? r.support_type_id : r.id;
    DED[k] = Number(r.deduction || 0);
  });

  // 이 달 회기 — 무슨 수업을 몇 번 받았는지 세려고
  const { data: ses } = await sb
    .from('nl_sessions')
    .select('child_id, support_type_id, therapist_id, therapy_id, plan_date, status')
    .in('child_id', ids).eq('month_key', CURMK);

  // 치료 종류 이름
  const tids2 = [...new Set((ses || []).map(r => r.therapy_id).filter(Boolean))];
  const T2 = {};
  if (tids2.length) {
    const { data: th2 } = await sb
      .from('nl_therapies').select('id, therapy_type_id').in('id', tids2);
    (th2 || []).forEach(r => { T2[r.id] = r.therapy_type_id; });
  }

  // 발추(8번) 담당 치료사 — 회기가 없으므로 납부 기록에서 가져온다
  const X8 = {};
  for (const k of KIDS) {
    const has = (cur || []).some(r =>
      r.child_id === k.id && Number(r.support_type_id) === 8 && Number(r.amount) > 0);
    if (!has) continue;
    try {
      const { data: tid } = await sb.rpc('nl_extra_therapist',
        { p_child: k.id, p_mk: CURMK });
      if (tid) X8[k.id] = Number(tid);
    } catch (e) {}
  }

  // 발추 요일 — 발달재활서비스(2번) 수업 요일을 그대로 쓴다
  function devWeekday(childId) {
    const r = (ses || []).find(x =>
      x.child_id === childId && Number(x.support_type_id) === 2
      && String(x.status || '') !== '쉼' && String(x.status || '') !== '휴무');
    return r ? DAYS[new Date(r.plan_date + 'T00:00:00').getDay()] + '요일' : '';
  }

  // 아동 + 지원유형별로 「치료종류(치료사) 요일 · N회」 줄을 만든다
  function detailOf(childId, stId) {
    const rows = (ses || []).filter(r =>
      r.child_id === childId && Number(r.support_type_id) === Number(stId)
      && String(r.status || '') !== '쉼' && String(r.status || '') !== '휴무');
    const bag = {};
    rows.forEach(r => {
      const tn  = TYPES[T2[r.therapy_id]] || '수업';
      const thn = THRS[r.therapist_id] || '';
      const wd  = DAYS[new Date(r.plan_date + 'T00:00:00').getDay()] + '요일';
      const key = tn + '|' + thn + '|' + wd;
      bag[key] = (bag[key] || 0) + 1;
    });
    return Object.keys(bag).map(key => {
      const p = key.split('|');
      return p[0] + (p[1] ? ' (' + p[1] + ')' : '') + ' ' + p[2] + ' · ' + bag[key] + '회';
    });
  }

  let html = '';
  let allTot = 0;

  KIDS.forEach((k, ki) => {
    const mine = (cur || []).filter(r => r.child_id === k.id && Number(r.amount) > 0);
    if (!mine.length) return;

    const card = mine.filter(r => Number(r.support_type_id) !== 2);
    const acct = mine.filter(r => Number(r.support_type_id) === 2);
    const cardTot = card.reduce((s, r) => s + Number(r.amount), 0);
    const acctTot = acct.reduce((s, r) => s + Number(r.amount), 0);
    allTot += cardTot + acctTot;

    const cc = 'c' + (ki % 4);
    let s = '<div class="pkid ' + cc + '"><div class="knm">' + esc(k.name) + ' 아동</div>';

    if (card.length) {
      s += '<div class="grpttl">\uD83D\uDCB3 신용카드 · 계좌입금</div>';
      card.forEach(r => {
        let det;
        if (Number(r.support_type_id) === 8) {
          // 발추는 회기로 세지 않는다. 담당 치료사만 보여 준다
          const thn = THRS[X8[k.id]] || '';
          const wd  = devWeekday(k.id);
          det = [ '발달재활 추가' + (thn ? ' (' + thn + ')' : '')
                  + (wd ? ' ' + wd : '') ];
        } else {
          det = detailOf(k.id, r.support_type_id);
        }
        const ded = Number(DED[r.support_type_id] || 0);
        const gross = Number(r.amount) + ded + Number(r.carry_over || 0);
        let inner = '';
        det.forEach((t, i) => {
          inner += '<div class="dtl"><span>· ' + esc(t) + '</span><span>'
                 + (i === 0 && det.length === 1 ? won(gross) : '') + '</span></div>';
        });
        if (det.length > 1) {
          inner += '<div class="dtl"><span>수업료</span><span>' + won(gross) + '</span></div>';
        }
        if (ded > 0) {
          inner += '<div class="dtl ded"><span>· 지원금 제외</span><span>−'
                 + Number(ded).toLocaleString() + '원</span></div>';
        }
        const co = Number(r.carry_over || 0);
        if (co > 0) {
          inner += '<div class="dtl ded"><span>· 전월 이월</span><span>−'
                 + co.toLocaleString() + '원</span></div>';
        }
        s += '<div class="pr pblk">'
           + '<div class="ptop"><div class="pn">' + esc(SN[r.support_type_id] || '수업료') + '</div>'
           + '<div class="pa">' + won(r.amount) + '</div>'
           + (r.paid_on
              ? '<span class="pill paid">납부완료 ' + mmdd(r.paid_on) + '</span>'
              : (r._est ? '<span class="pill est">예정</span>'
                        : '<span class="pill no">미납</span>')) + '</div>'
           + (inner ? '<div class="pdet">' + inner + '</div>' : '')
           + '</div>';
      });
      s += '<div class="psub">소계 ' + won(cardTot) + '</div>';
      s += '<div class="pacc">· 현장 또는 모바일 결제<br>'
         + '· 국민 자라는나무 749601-01-330411<br>&nbsp;&nbsp;(교육비 전용계좌)</div>';
    }

    if (acct.length) {
      s += '<div class="grpttl">\uD83C\uDFE6 계좌입금</div>';
      acct.forEach(r => {
        const det = detailOf(k.id, 2);
        let inner = '';
        det.forEach(t => {
          inner += '<div class="dtl"><span>· ' + esc(t) + '</span><span></span></div>';
        });
        s += '<div class="pr pblk">'
           + '<div class="ptop"><div class="pn">발달재활서비스</div>'
           + '<div class="pa">' + won(r.amount) + '</div>'
           + (r.paid_on
              ? '<span class="pill paid">납부완료 ' + mmdd(r.paid_on) + '</span>'
              : (r._est ? '<span class="pill est">예정</span>'
                        : '<span class="pill no">미납</span>')) + '</div>'
           + (inner ? '<div class="pdet">' + inner + '</div>' : '')
           + '</div>';
      });
      s += '<div class="psub">소계 ' + won(acctTot) + '</div>';
      s += '<div class="pacc">· 아동 이름으로 입금해 주세요<br>'
         + '· 국민 자라는나무 749601-01-348791<br>&nbsp;&nbsp;(본인부담금 전용계좌)</div>';
    }

    s += '</div>';
    html += s;
  });

  if (!html) {
    $('paylist').innerHTML = '<div class="none">이 달에는 교육비 내역이 없습니다.</div>';
    return;
  }

  const anyEst = Object.keys(EST).length > 0;
  html += '<div class="ptot">' + (+CURMK.slice(5, 7)) + '월 '
        + (anyEst ? '예정 금액 ' : '합계 ') + won(allTot) + '</div>';
  if (anyEst) {
    html += '<div class="estnote">아직 결제 전이라 시간표를 보고 셈한 금액입니다.<br>'
          + '리뷰 차감과 평가비는 결제하실 때 반영됩니다.</div>';
  }

  // 아직 안 낸 것
  if (un && un.length) {
    let u = '<div class="unpaid"><div class="ut">아직 안 낸 것</div>';
    un.forEach(r => {
      const kid = KIDS.find(x => x.id === r.child_id);
      const mon = (+String(r.month_key).slice(5, 7)) + '월';
      u += '<div class="pr"><div class="pn">' + esc(mon) + ' · '
         + (KIDS.length > 1 && kid ? esc(kid.name) + ' · ' : '')
         + esc(SN[r.support_type_id] || '수업료') + '</div>'
         + '<div class="pa">' + won(r.amount) + '</div>'
         + '<span class="pill no">미납</span></div>';
    });
    const ut = un.reduce((s, r) => s + Number(r.amount), 0);
    u += '<div class="psub" style="color:#9c2b2b;font-weight:600;">'
       + '안 낸 것 모두 ' + won(ut) + '</div></div>';
    html += u;
  }

  html += '<div class="pfoot">문의 : 042-488-6011</div>';
  $('paylist').innerHTML = html;
}

// 이미 로그인해 있으면 바로 들어간다
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) await afterLogin();
})();
</script>

const BAR13 = '\u2501'.repeat(13);

function won(n) { return Number(n || 0).toLocaleString() + '원'; }
function mmdd(d) {
  if (!d) return '';
  return (+String(d).slice(5, 7)) + '/' + (+String(d).slice(8, 10));
}

async function loadPay() {
  $('mkLabel').textContent = CURMK.slice(0, 4) + '년 ' + (+CURMK.slice(5, 7)) + '월';
  $('paylist').innerHTML = '<div class="none">불러오는 중...</div>';

  const ids = KIDS.map(k => k.id);

  // 이 달 것 — 메모 칸은 가져오지 않는다
  let { data: cur, error } = await sb
    .from('nl_payments')
    .select('child_id, support_type_id, amount, paid_on, month_key, carry_over')
    .in('child_id', ids).eq('month_key', CURMK);

  if (error) {
    $('paylist').innerHTML = '<div class="none">교육비 내역을 가져오지 못했습니다.<br>센터로 연락해 주세요.</div>';
    return;
  }

  // 아직 안 낸 것 — 달을 가리지 않고 모두
  const { data: un } = await sb
    .from('nl_payments')
    .select('child_id, support_type_id, amount, month_key')
    .in('child_id', ids).is('paid_on', null).gt('amount', 0)
    .order('month_key');

  // 저장된 것이 없는 자녀는 「예정」으로 채운다
  if (!Array.isArray(cur)) cur = [];
  const EST = {};
  for (const k of KIDS) {
    const has = (cur || []).some(r => r.child_id === k.id && Number(r.amount) > 0);
    if (has) continue;
    try {
      const { data: e } = await sb.rpc('nl_parent_estimate',
        { p_child: k.id, p_mk: CURMK });
      (e || []).forEach(r => {
        if (Number(r.amount) > 0) {
          cur.push({ child_id: k.id, support_type_id: Number(r.support_type_id),
                     amount: Number(r.amount), paid_on: null,
                     month_key: CURMK, carry_over: 0, _est: true });
          EST[k.id] = true;
        }
      });
    } catch (e2) {}
  }

  // 지원유형 이름표
  const { data: sts } = await sb.from('nl_support_types').select('id, name');
  const SN = {};
  (sts || []).forEach(r => { SN[r.id] = r.name; });

  // 지원금 제외액
  const { data: rules } = await sb.from('nl_support_rules').select('*');
  const DED = {};
  (rules || []).forEach(r => {
    const k = r.support_type_id != null ? r.support_type_id : r.id;
    DED[k] = Number(r.deduction || 0);
  });

  // 이 달 회기 — 무슨 수업을 몇 번 받았는지 세려고
  let { data: ses } = await sb
    .from('nl_sessions')
    .select('child_id, support_type_id, therapist_id, therapy_id, plan_date, status, minutes, no_makeup, makeup_for, want_makeup')
    .in('child_id', ids).eq('month_key', CURMK);
  // 「보강 없음」으로 뺀 날은 교육비 회수에서도 뺀다 (2026-09-09)
  if (ses) ses = ses.filter(r => !r.no_makeup);

  // 치료 종류 이름
  const tids2 = [...new Set((ses || []).map(r => r.therapy_id).filter(Boolean))];
  const T2 = {};
  if (tids2.length) {
    const { data: th2 } = await sb
      .from('nl_therapies').select('id, therapy_type_id').in('id', tids2);
    (th2 || []).forEach(r => { T2[r.id] = r.therapy_type_id; });
  }

  // 발추(8번) 담당 치료사 — 회기가 없으므로 납부 기록에서 가져온다
  const X8 = {};
  for (const k of KIDS) {
    const has = (cur || []).some(r =>
      r.child_id === k.id && Number(r.support_type_id) === 8 && Number(r.amount) > 0);
    if (!has) continue;
    try {
      const { data: tid } = await sb.rpc('nl_extra_therapist',
        { p_child: k.id, p_mk: CURMK });
      if (tid) X8[k.id] = Number(tid);
    } catch (e) {}
  }

  // 이 달 공휴일 이름 — 「연휴 제외」를 적어 주려고
  const HOL2 = {};
  {
    const ds = [...new Set((ses || []).map(r => r.plan_date))];
    if (ds.length) {
      const { data: offs } = await sb
        .from('nl_offdays').select('off_date, reason').in('off_date', ds);
      (offs || []).forEach(r => { HOL2[r.off_date] = r.reason || '공휴일'; });
    }
  }

  // 발추 요일 — 발달재활서비스(2번) 수업 요일을 그대로 쓴다
  function devWeekday(childId) {
    const r = (ses || []).find(x =>
      x.child_id === childId && Number(x.support_type_id) === 2
      && String(x.status || '') !== '쉼' && String(x.status || '') !== '휴무');
    return r ? DAYS[new Date(r.plan_date + 'T00:00:00').getDay()] + '요일' : '';
  }

  // 아동 + 지원유형별로 「치료종류(치료사) 요일 · N회」 줄을 만든다
  function detailOf(childId, stId) {
    // 발달재활은 무조건 월 4회. 쉬는 날도 보강해서 채우므로 그대로 4회로 적는다
    const isDev = Number(stId) === 2;
    // 청구 회수와 같은 규칙으로 센다 (2026-09-21 — 납부 계산 단추와 같게)
    //   원래 수업 줄만 센다. 보강·조각 줄은 원래 줄이 이미 한 회라 또 세지 않는다
    //   (전에는 결석+보강이 두 회로, 조각이 덧붙어 「5회」처럼 보였다)
    //   쉬는 날(휴무)은 「보강 받음」을 켠 날만 한 회로 센다
    const rows = (ses || []).filter(r =>
      r.child_id === childId && Number(r.support_type_id) === Number(stId)
      && !r.makeup_for && String(r.status || '') !== '취소'
      && (isDev || (String(r.status || '') !== '쉼'
                    && (String(r.status || '') !== '휴무' || r.want_makeup))));
    const bag = {};
    rows.forEach(r => {
      const tn  = TYPES[T2[r.therapy_id]] || '수업';
      const thn = THRS[r.therapist_id] || '';
      const wd  = DAYS[new Date(r.plan_date + 'T00:00:00').getDay()] + '요일';
      const key = tn + '|' + thn + '|' + wd;
      // 쪼개서 보강한 줄은 분만큼만 센다 (10분이면 0.25회) 2026-09-08
      bag[key] = (bag[key] || 0) + (Number(r.minutes || 40) / 40);
    });
    // 쉬어서 빠진 회기 — 왜 회수가 적은지 알려 주려고
    const off = (ses || []).filter(r =>
      r.child_id === childId && Number(r.support_type_id) === Number(stId)
      && !r.makeup_for && !r.want_makeup
      && (String(r.status || '') === '쉼' || String(r.status || '') === '휴무'));
    const why = {};
    off.forEach(r => {
      const nm = HOL2[r.plan_date] ? HOL2[r.plan_date] + ' 공휴일' : '휴가';
      why[nm] = (why[nm] || 0) + 1;
    });
    // 발달재활(2번)은 월 4회가 반드시 채워지므로 제외 표기를 하지 않는다
    const tail = Number(stId) === 2 ? ''
      : Object.keys(why).map(nm => nm + ' ' + why[nm] + '회 제외').join(' · ');

    return Object.keys(bag).map((key, i) => {
      const p = key.split('|');
      const n = isDev ? 4 : (Math.round(Number(bag[key]) * 100) / 100);
      return p[0] + (p[1] ? ' (' + p[1] + ')' : '') + ' ' + p[2] + ' · ' + n + '회';
    });
  }

  let html = '';
  let allTot = 0;

  // 리뷰 할인 — 납부 계산 화면이 저장한 건수를 그대로 가져온다
  // (메모는 안 가져온다. 건수만 돌려주는 창구를 쓴다)
  const RVC = {};
  for (const k of KIDS) {
    try {
      const { data: rv } = await sb.rpc('nl_review_cnt',
        { p_child: k.id, p_month: CURMK });
      RVC[k.id] = Number(rv || 0) * 5000;
    } catch (e) { RVC[k.id] = 0; }
  }

  KIDS.forEach((k, ki) => {
    const mine = (cur || []).filter(r => r.child_id === k.id && Number(r.amount) > 0);
    if (!mine.length) return;

    const card = mine.filter(r => Number(r.support_type_id) !== 2);
    const acct = mine.filter(r => Number(r.support_type_id) === 2);
    const cardTot = card.reduce((s, r) => s + Number(r.amount), 0);
    const acctTot = acct.reduce((s, r) => s + Number(r.amount), 0);
    allTot += cardTot + acctTot;

    const cc = 'c' + (ki % 4);
    let s = '<div class="pkid ' + cc + '"><div class="knm">' + esc(k.name) + ' 아동</div>';

    if (card.length) {
      s += '<div class="grpttl">\uD83D\uDCB3 신용카드 · 계좌입금</div>';

      // 리뷰 할인을 카드 항목에 차례대로 나눈다
      // (납부 계산 화면과 같은 규칙 — 발달재활은 대상이 아님)
      let rvLeft = Number(RVC[k.id] || 0);
      const RVOF = {};
      card.forEach(r => {
        if (rvLeft <= 0) { RVOF[r.support_type_id] = 0; return; }
        const base = Number(r.amount) + Number(DED[r.support_type_id] || 0)
                   + Number(r.carry_over || 0);
        const take = Math.min(base, rvLeft);
        RVOF[r.support_type_id] = take;
        rvLeft -= take;
      });

      card.forEach(r => {
        let det;
        if (Number(r.support_type_id) === 8) {
          // 발추는 회기로 세지 않는다. 담당 치료사만 보여 준다
          const thn = THRS[X8[k.id]] || '';
          const wd  = devWeekday(k.id);
          det = [ '발달재활 추가' + (thn ? ' (' + thn + ')' : '')
                  + (wd ? ' ' + wd : '') ];
        } else {
          det = detailOf(k.id, r.support_type_id);
        }
        const ded = Number(DED[r.support_type_id] || 0);
        const rvc = Number(RVOF[r.support_type_id] || 0);
        const gross = Number(r.amount) + ded + Number(r.carry_over || 0) + rvc;
        let inner = '';
        det.forEach((t, i) => {
          inner += '<div class="dtl"><span>· ' + esc(t) + '</span><span>'
                 + (i === 0 && det.length === 1 ? won(gross) : '') + '</span></div>';
        });
        if (det.length > 1) {
          inner += '<div class="dtl"><span>수업료</span><span>' + won(gross) + '</span></div>';
        }
        if (ded > 0) {
          inner += '<div class="dtl ded"><span>· 지원금 제외</span><span>−'
                 + Number(ded).toLocaleString() + '원</span></div>';
        }
        if (rvc > 0) {
          inner += '<div class="dtl ded"><span>· 리뷰 할인</span><span>−'
                 + rvc.toLocaleString() + '원</span></div>';
        }
        const co = Number(r.carry_over || 0);
        if (co > 0) {
          inner += '<div class="dtl ded"><span>· 전월 이월</span><span>−'
                 + co.toLocaleString() + '원</span></div>';
        }
        s += '<div class="pr pblk">'
           + '<div class="ptop"><div class="pn">' + esc(SN[r.support_type_id] || '수업료') + '</div>'
           + '<div class="pa">' + won(r.amount) + '</div>'
           + (r.paid_on
              ? '<span class="pill paid">납부완료 ' + mmdd(r.paid_on) + '</span>'
              : (r._est ? '<span class="pill est">예정</span>'
                        : '<span class="pill no">미납</span>')) + '</div>'
           + (inner ? '<div class="pdet">' + inner + '</div>' : '')
           + '</div>';
      });
      s += '<div class="psub">소계 ' + won(cardTot) + '</div>';
      s += '<div class="pacc">· 현장 또는 모바일 결제<br>'
         + '· 국민 자라는나무 749601-01-330411<br>&nbsp;&nbsp;(교육비 전용계좌)</div>';
    }

    if (acct.length) {
      s += '<div class="grpttl">\uD83C\uDFE6 계좌입금</div>';
      acct.forEach(r => {
        const det = detailOf(k.id, 2);
        let inner = '';
        det.forEach(t => {
          inner += '<div class="dtl"><span>· ' + esc(t) + '</span><span></span></div>';
        });
        s += '<div class="pr pblk">'
           + '<div class="ptop"><div class="pn">발달재활서비스</div>'
           + '<div class="pa">' + won(r.amount) + '</div>'
           + (r.paid_on
              ? '<span class="pill paid">납부완료 ' + mmdd(r.paid_on) + '</span>'
              : (r._est ? '<span class="pill est">예정</span>'
                        : '<span class="pill no">미납</span>')) + '</div>'
           + (inner ? '<div class="pdet">' + inner + '</div>' : '')
           + '</div>';
      });
      s += '<div class="psub">소계 ' + won(acctTot) + '</div>';
      s += '<div class="pacc">· 아동 이름으로 입금해 주세요<br>'
         + '· 국민 자라는나무 749601-01-348791<br>&nbsp;&nbsp;(본인부담금 전용계좌)</div>';
    }

    s += '</div>';
    html += s;
  });

  if (!html) {
    $('paylist').innerHTML = '<div class="none">이 달에는 교육비 내역이 없습니다.</div>';
    return;
  }

  const anyEst = Object.keys(EST).length > 0;
  html += '<div class="ptot">' + (+CURMK.slice(5, 7)) + '월 '
        + (anyEst ? '예정 금액 ' : '합계 ') + won(allTot) + '</div>';
  if (anyEst) {
    html += '<div class="estnote">아직 결제 전이라 시간표를 보고 셈한 금액입니다.<br>'
          + '리뷰 차감과 평가비는 결제하실 때 반영됩니다.</div>';
  }

  // 아직 안 낸 것
  if (un && un.length) {
    let u = '<div class="unpaid"><div class="ut">아직 안 낸 것</div>';
    un.forEach(r => {
      const kid = KIDS.find(x => x.id === r.child_id);
      const mon = (+String(r.month_key).slice(5, 7)) + '월';
      u += '<div class="pr"><div class="pn">' + esc(mon) + ' · '
         + (KIDS.length > 1 && kid ? esc(kid.name) + ' · ' : '')
         + esc(SN[r.support_type_id] || '수업료') + '</div>'
         + '<div class="pa">' + won(r.amount) + '</div>'
         + '<span class="pill no">미납</span></div>';
    });
    const ut = un.reduce((s, r) => s + Number(r.amount), 0);
    u += '<div class="psub" style="color:#9c2b2b;font-weight:600;">'
       + '안 낸 것 모두 ' + won(ut) + '</div></div>';
    html += u;
  }

  html += '<div class="pfoot">문의 : 042-488-6011</div>';
  $('paylist').innerHTML = html;
  await drawFixNote();
}

// ── 확정 안내 ─────────────────────────────────────────
// 확정은 수업 안내 창에서만 한다. 여기서는 알려주기만 한다
async function drawFixNote() {
  let fixed = false;
  try {
    const { data: fx } = await sb.from('nl_pay_fix')
      .select('fixed').eq('child_id', CURKID).eq('month_key', CURMK).maybeSingle();
    fixed = !!(fx && fx.fixed);
  } catch (e) {}
  const mm = (+CURMK.slice(5, 7)) + '월';
  $('paylist').innerHTML += fixed
    ? '<div class="needlock">' + esc(mm) + ' 교육비가 <b>확정</b>되었습니다.'
      + '<br>보강이 필요한 수업은 시간표 갈래에서 잡으실 수 있습니다.</div>'
    : '<div class="needlock">' + esc(mm) + ' 교육비는 아직 <b>확정 전</b>입니다.'
      + '<br>수업 안내 창에서 「이대로 좋습니다」를 눌러 주세요.'
      + '<br>고칠 곳이나 잘못된 곳이 있으면 이 화면을 캡처해 채널로 알려주세요.</div>';
}

// 이미 로그인해 있으면 바로 들어간다
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) await afterLogin();
})();
</script>

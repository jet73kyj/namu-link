<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자라는나무 · 학부모</title>
<link rel="manifest" href="manifest-parent.json">
<meta name="theme-color" content="#3c7a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="자라는나무">
<link rel="apple-touch-icon" href="img/nl-icon-180.png">
<style>
  :root {
    /* 꾸밈 B (2026-09-17) — 직원 화면과 같은 색. 옛 초록은 --acc:#3c7a4a */
    --ink:#2F2926; --ink2:#4A433F; --ink3:#A39C95;
    --line:#ECE8E3; --bg:#F5F4F2; --acc:#B07A4A; --acc-bg:#F8F1E8;
  }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg);
         margin:0; padding:18px 14px 40px; color:var(--ink);
         -webkit-font-smoothing:antialiased; }

  .box  { max-width:400px; margin:36px auto; background:#fff; border-radius:14px;
          padding:26px 22px; border:1px solid var(--line); }
  .wrap { max-width:560px; margin:0 auto; }

  h1 { font-size:18px; font-weight:600; letter-spacing:-.01em; margin:0; }
  .sub { font-size:13px; color:var(--ink3); margin:6px 0 20px; }
  label { display:block; font-size:12px; color:var(--ink2); margin:14px 0 6px; }
  input { font:inherit; font-size:16px; padding:11px; color:var(--ink);
          border:1px solid var(--line); border-radius:8px; background:#fff; width:100%; }
  input:focus { outline:2px solid var(--acc); outline-offset:-1px; border-color:transparent; }
  button { font:inherit; font-size:14px; font-weight:500; padding:10px 15px;
           background:var(--acc); color:#fff; border:none; border-radius:8px; cursor:pointer; }
  button:disabled { background:#c3c8c0; cursor:default; }
  .box button { width:100%; padding:13px; margin-top:20px; font-size:15px; }
  .ghost { background:none; color:var(--ink2); border:1px solid var(--line); }

  .out { margin-top:14px; padding:11px 13px; border-radius:8px; font-size:13.5px;
         line-height:1.6; display:none; white-space:pre-wrap; }
  .ok  { background:var(--acc-bg); color:#2c5c37; display:block; }
  .err { background:#fdeeee; color:#9c2b2b; display:block; }

  .top { display:flex; justify-content:space-between; align-items:center;
         gap:10px; margin-bottom:14px; }

  .kids { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .kid  { background:#fff; color:var(--ink2); border:1px solid var(--line);
          border-radius:20px; padding:8px 16px; font-size:14px; }
  .kid.on { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:600; }

  .bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .bar .mk { font-size:15px; font-weight:600; flex:1; text-align:center; }
  .bar button { padding:8px 14px; }

  .day { background:#fff; border:1px solid var(--line); border-radius:12px;
         padding:13px 15px; margin-bottom:9px; }
  .day .dt { font-size:13px; color:var(--ink3); margin-bottom:7px; font-weight:600; }
  .row { display:flex; align-items:baseline; gap:9px; padding:5px 0;
         border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; }
  .row .tm { font-size:15px; font-weight:600; min-width:52px; }
  .row .nm { font-size:14px; flex:1; }
  .row .th { font-size:12.5px; color:var(--ink3); }
  .tag { font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px;
         background:var(--acc-bg); color:#2c5c37; white-space:nowrap; }
  .tag.off { background:#f0f1ee; color:#8b9186; }
  .tag.ab  { background:#fdeeee; color:#9c2b2b; }
  .tag.mk  { background:#fdf3e6; color:#a9701c; }
  .row.rest { background:#f0f1ee; border-radius:8px; padding:9px 12px; margin:4px 0;
              border-top:none; }
  .row.rest .nm { color:#8b9186; font-size:13.5px; font-weight:600; }

  /* 위쪽 갈래 단추 */
  .tabs { display:flex; gap:8px; margin-bottom:14px; }

  /* 시간표 — 지원유형·회차·전월보강 */
  .sup { display:inline-block; font-size:11px; font-weight:700;
         padding:2px 7px; border-radius:6px; margin-right:2px;
         background:#eceff1; color:#546e7a; vertical-align:1px; }
  .sup.s1 { background:#e8f5e9; color:#2e7d32; }
  .sup.s2 { background:#e3f2fd; color:#1565c0; }
  .sup.s3, .sup.s4 { background:#f3e5f5; color:#6a1b9a; }
  .sup.s5 { background:#fff3e0; color:#e65100; }
  .sup.s6, .sup.s7 { background:#fce4ec; color:#ad1457; }
  .sup.s8 { background:#e0f2f1; color:#00695c; }
  .runno { font-size:11.5px; color:#9aa19c; }
  .prevmk { display:inline-block; font-size:11px; font-weight:600;
            padding:2px 7px; border-radius:6px; margin-left:5px;
            background:#e3f2fd; color:#1565c0; }
  .fillnote { font-size:12px; color:#1565c0; margin-top:2px; }


  /* 자녀가 하나일 때 이름 */
  .onekid { font-size:15px; font-weight:700; color:#3c5a44;
            background:#eef3ec; border-radius:9px;
            padding:8px 14px; display:inline-block; }

  /* 결석·보강 신청 */
  .absbtn { margin-left:8px; padding:5px 11px; border:1px solid #cfd8cc;
            border-radius:7px; background:#fff; color:#4a7c59;
            font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .absbtn.wait { border-color:#ffcc80; background:#fff8ec; color:#e65100; }
  .absbtn.undo { border-color:#bcd7ef; background:#f1f7fd; color:#0c447c; }
  .askinfo { font-size:13.5px; color:#5a6156; background:#f4f7f2;
             border-radius:8px; padding:10px 12px; margin-bottom:14px; }
  .asklb { display:block; font-size:12.5px; font-weight:700; color:#4a5a48;
           margin:14px 0 6px; }
  #askWhy { width:100%; padding:10px 12px; border:1px solid #dfe4dc;
            border-radius:8px; font-size:14px; font-family:inherit;
            box-sizing:border-box; }
  .slots { display:flex; flex-wrap:wrap; gap:6px; max-height:190px;
           overflow:auto; padding:2px; }
  .slot { padding:7px 10px; border:1px solid #dfe4dc; border-radius:7px;
          background:#fff; color:#5a6156; font-size:12.5px; cursor:pointer;
          white-space:nowrap; }
  .slot.on { background:#4a7c59; border-color:#4a7c59; color:#fff; font-weight:600; }
  .askhint { font-size:12.5px; color:#9aa19c; padding:6px 2px; width:100%; }
  .askbtns { display:flex; gap:8px; }
  .askbtns .popbtn { flex:1; }
  .popbtn.gray { background:#9aa19c; }

  /* 보강이 필요한 수업 */
  .needbox { background:#fff8ec; border:1px solid #ffd9a0; border-radius:12px;
             padding:14px; margin-bottom:14px; }
  .needttl { font-size:14px; font-weight:700; color:#c25e00; margin-bottom:10px; }
  .needone { background:#fff; border-radius:9px; padding:10px 12px; margin-bottom:8px; }
  .needone:last-child { margin-bottom:0; }
  .needd { font-size:13.5px; color:#2e3d2c; font-weight:600; }
  .needw { font-size:12.5px; color:#7d8479; margin-top:3px; }
  .needbtn { margin-top:8px; padding:7px 14px; border:none; border-radius:8px;
             background:#4a7c59; color:#fff; font-size:12.5px; font-weight:600;
             cursor:pointer; }
  .needbtn.gray { background:#fff; border:1px solid #cfd8cc; color:#7d8479; }
  .needlock { background:#f4f7f2; border:1px solid #e6e9e2; border-radius:12px;
              padding:14px; margin-bottom:14px; font-size:13px; color:#5a6156;
              line-height:1.6; }
  .fixbtn { margin-top:10px; padding:11px 16px; border:none; border-radius:9px;
            background:#4a7c59; color:#fff; font-size:14px; font-weight:700;
            cursor:pointer; width:100%; }
  .fixbtn.gray { background:#fff; border:1px solid #cfd8cc; color:#7d8479; }

  /* 수업 안내 창 */
  .plbody { max-height:52vh; overflow:auto; }
  .plgrp { border:1px solid #e6e9e2; border-radius:10px;
           padding:11px 13px; margin-bottom:9px; }
  .plst { font-size:14px; font-weight:700; color:#2e3d2c; }
  .plln { font-size:13px; color:#5a6156; margin-top:5px; }
  .plam { font-size:13.5px; font-weight:700; color:#4a7c59;
          text-align:right; margin-top:7px; }
  .pltot { font-size:15px; font-weight:700; color:#2e3d2c;
           text-align:right; padding:8px 4px 2px; }

  /* 치료기록지 */
  .rc { background:#fff; border:1px solid #e6e9e2; border-radius:12px;
        padding:16px; margin-bottom:12px; }
  .rchead { display:flex; align-items:center; justify-content:space-between;
            gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .rctitle { font-size:15px; font-weight:700; color:#2e3d2c; }
  .rcsub { font-size:12.5px; color:#9aa19c; margin-top:3px; }
  .rcpdf { padding:7px 14px; border:1px solid #cfd8cc; border-radius:8px;
           background:#fff; color:#4a7c59; font-size:12.5px; font-weight:600;
           cursor:pointer; }
  .rctbl { width:100%; border-collapse:collapse; font-size:13px; }
  .rctbl th { background:#f4f7f2; color:#4a5a48; font-weight:600;
              padding:8px 6px; border:1px solid #e6e9e2; white-space:nowrap; }
  .rctbl td { padding:8px 6px; border:1px solid #eef1ec; vertical-align:top;
              line-height:1.6; }
  .rctbl td.ctr { text-align:center; white-space:nowrap; }
  .abs { color:#c62828; font-weight:600; }
  .mkup { color:#1565c0; font-weight:600; }
  .rcnote { font-size:12.5px; color:#9aa19c; line-height:1.7; margin-top:14px;
            padding-top:12px; border-top:1px solid #eef1ec; }
  @media print {
    .tabs, .bar, .kids, .top, .foot, .rcpdf, .rcnote { display:none !important; }
    body { background:#fff; }
    .rc { border:none; padding:0; margin-bottom:26px; page-break-inside:avoid; }
  }

  /* 공지 */
  .dot { display:inline-block; min-width:17px; height:17px; line-height:17px;
         padding:0 5px; border-radius:9px; background:#e53935; color:#fff;
         font-size:11.5px; font-weight:700; text-align:center;
         margin-left:5px; vertical-align:middle; box-sizing:border-box; }
  .nt { background:#fff; border:1px solid #e6e9e2; border-radius:12px;
        padding:15px 16px; margin-bottom:10px; }
  .nt.unread { border-color:#ffcc80; background:#fffdf7; }
  .nthead { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .nttitle { font-size:15px; font-weight:700; color:#2e3d2c; }
  .ntbody { font-size:14px; color:#5a6156; line-height:1.7; margin-top:8px;
            white-space:pre-wrap; }
  .ntday { font-size:12px; color:#9aa19c; margin-top:9px; }
  .popwrap { position:fixed; inset:0; background:rgba(0,0,0,.45);
             display:flex; align-items:center; justify-content:center;
             padding:20px; z-index:100; }
  .popbox { background:#fff; border-radius:16px; padding:24px 22px;
            max-width:420px; width:100%; max-height:80vh; overflow:auto; }
  .poptag { display:inline-block; font-size:11.5px; padding:3px 10px;
            border-radius:11px; background:#ffe0b2; color:#e65100;
            margin-bottom:10px; }
  .poptitle { font-size:18px; font-weight:700; color:#2e3d2c; margin-bottom:10px; }
  .popbody { font-size:14.5px; color:#5a6156; line-height:1.75;
             white-space:pre-wrap; }
  .popday { font-size:12px; color:#9aa19c; margin-top:14px; }
  .popbtn { width:100%; margin-top:18px; padding:13px; border:none;
            border-radius:10px; background:#4a7c59; color:#fff;
            font-size:15px; font-weight:700; cursor:pointer; }
  .popmore { text-align:center; font-size:12.5px; color:#9aa19c; margin-top:10px; }
  .tabs button { flex:1; background:#fff; color:var(--ink2);
                 border:1px solid var(--line); padding:11px; font-size:15px; }
  .tabs button.on { background:var(--acc); color:#fff; border-color:var(--acc);
                    font-weight:600; }

  /* 기록지 안쪽 갈래 단추 (발달재활 · 치료지원 · 센터치료) */
  .rtabs { display:flex; gap:6px; margin-bottom:12px; }
  .rtabs button { flex:1; background:#fff; color:var(--ink2);
                  border:1px solid var(--line); border-radius:9px;
                  padding:9px 4px; font-size:13.5px; cursor:pointer;
                  white-space:nowrap; }
  .rtabs button.on { background:var(--acc); color:#fff; border-color:var(--acc);
                     font-weight:700; }

  /* 교육비 */
  .pkid { border-radius:16px; padding:16px 17px 14px; margin-bottom:12px;
          border:1px solid rgba(0,0,0,.05); }
  .pkid.c0 { background:#eef4ee; }
  .pkid.c1 { background:#eef1f6; }
  .pkid.c2 { background:#f6f0ea; }
  .pkid.c3 { background:#f3eef5; }
  .pkid .knm { font-size:16px; font-weight:700; margin-bottom:12px;
               display:flex; align-items:center; gap:7px; }
  .pkid .knm::before { content:''; width:5px; height:17px; border-radius:3px;
                       background:var(--acc); }
  .grpttl { font-size:12.5px; font-weight:700; color:var(--ink2);
            background:rgba(255,255,255,.75); border-radius:8px;
            padding:8px 11px; margin:12px 0 6px; }
  .pr { display:flex; align-items:center; gap:8px; padding:8px 11px;
        background:#fff; border-radius:9px; margin-bottom:5px; }
  .pr .pn { flex:1; font-size:14px; }
  .pr .pa { font-size:15px; font-weight:700; white-space:nowrap; }
  .pill { font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px;
          white-space:nowrap; }
  .pr.pblk { display:block; }
  .ptop { display:flex; align-items:center; gap:8px; }
  .pdet { margin-top:7px; padding-top:7px; border-top:1px dashed #e4e7e0; }
  .dtl { display:flex; justify-content:space-between; gap:8px;
         font-size:12.5px; color:var(--ink2); padding:2px 0; }
  .dtl.ded { color:#9c2b2b; }
  .dtl span:last-child { font-weight:600; white-space:nowrap; }
  .pill.paid { background:var(--acc-bg); color:#2c5c37; }
  .pill.no   { background:#fdeaea; color:#9c2b2b; }
  .pill.est  { background:#eef1f6; color:#3b5170; }
  .estnote { font-size:12px; color:var(--ink2); line-height:1.75;
             background:#eef1f6; border-radius:10px; padding:11px 13px;
             margin-bottom:12px; }
  .psub { text-align:right; font-size:13px; color:var(--ink2);
          margin:8px 3px 0; font-weight:600; }
  .ptot { background:var(--acc); color:#fff; border-radius:14px;
          padding:16px 18px; font-size:17px; font-weight:700; text-align:right;
          margin-bottom:12px; box-shadow:0 2px 10px rgba(60,122,74,.18); }
  .pacc { font-size:11.5px; color:var(--ink2); line-height:1.8; margin-top:7px;
          background:rgba(255,255,255,.6); border-radius:8px; padding:9px 11px; }
  .unpaid { background:#fdf1f1; border:1px solid #f4d9d9; border-radius:16px;
            padding:15px 17px; margin-bottom:12px; }
  .unpaid .ut { font-size:14px; font-weight:700; color:#9c2b2b; margin-bottom:9px; }
  .unpaid .pr { background:#fff; }
  .unpaid .pr .pa { color:#9c2b2b; }
  .pfoot { text-align:center; font-size:12px; color:var(--ink3);
           margin-top:16px; line-height:1.9; }

  .none { padding:40px 18px; text-align:center; color:var(--ink3); font-size:14px;
          background:#fff; border:1px solid var(--line); border-radius:12px; }
  .nwrow { background:#fff; border:1px solid var(--line); border-radius:14px;
    margin-bottom:12px; overflow:hidden; }
  .nwin { padding:17px 18px; }
  .nwrow.pin { background:#fffaf2; border-color:#e8c9a4; }
  .nw1 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .nwkind { font-size:12px; font-weight:bold; padding:3px 10px; border-radius:10px;
    background:#eef3ec; color:#2c5c37; white-space:nowrap; }
  .nwkind.k2 { background:#eef2ff; color:#3a4a8a; }
  .nwkind.k3 { background:#fdf0f5; color:#8a3a5a; }
  .nwkind.k4 { background:#f0f7ff; color:#2a5a8a; }
  .nwtt { font-weight:700; font-size:17px; letter-spacing:-0.3px; }
  .nwday { font-size:12.5px; color:#9aa294; margin-top:5px; }
  .nwbd { font-size:14.5px; color:#4a5250; margin-top:9px; line-height:1.8;
    white-space:pre-wrap; }
  .nwvid { margin-top:10px; }
  .nwvid iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:9px; }
  .nwbtn { display:flex; align-items:center; justify-content:center; gap:9px;
    padding:16px; text-decoration:none; background:#E2703A; color:#fff;
    font-size:16px; font-weight:700; letter-spacing:-0.2px; }
  .nwbtn .ico { font-size:18px; line-height:1; }
  .nwbtn .ar  { font-size:20px; opacity:0.8; line-height:1; }
  .nwbtn:active { background:#c25a28; }
  .foot { margin-top:26px; font-size:12px; color:var(--ink3); line-height:1.9;
          border-top:1px solid var(--line); padding-top:14px; }

  /* ===== 꾸밈 B (2026-09-17) — 학부모 화면. 따뜻하지만 차분하게 =====
     내용·셈은 그대로. 되돌리려면 이 묶음과 :root 색만 되돌리면 된다 */
  .loginlogo { display:block; height:52px; width:auto; margin:0 0 12px; }
  .toptitle { display:flex; align-items:center; gap:10px; }
  .toptitle h1 { font-size:16px; border-left:1px solid var(--line); padding-left:10px; }
  .toplogo { height:36px; width:auto; display:block; }
  .top { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 12px; }
  .ghost { background:#fff; color:var(--ink2); border:1px solid #E4E0DA; padding:7px 12px; font-size:13px; }
  .ok  { color:#7E5530; }
  /* 갈래 단추 — 옅은 바탕에 고른 것만 흰색 */
  .tabs { background:#ECE8E3; border-radius:12px; padding:3px; gap:2px; }
  .tabs button { background:transparent; border:none; color:#7D7670; padding:9px 2px;
                 font-size:14px; border-radius:9px; }
  .tabs button.on { background:#fff; color:var(--ink); border:none; font-weight:700;
                    box-shadow:0 1px 3px rgba(47,41,38,.10); }
  .rtabs { background:#F0EDE9; border-radius:10px; padding:3px; gap:2px; }
  .rtabs button { background:transparent; border:none; color:#7D7670; border-radius:8px; }
  .rtabs button.on { background:#fff; color:var(--ink); border:none;
                     box-shadow:0 1px 3px rgba(47,41,38,.10); }
  /* 자녀 고르기 */
  .kid { color:#7D7670; border-color:#E4E0DA; }
  .kid.on { background:#fff; color:var(--ink); border-color:var(--acc); font-weight:700; }
  .onekid { background:#fff; color:var(--ink); border:1px solid var(--line);
            border-left:3px solid #C9A27E; border-radius:8px; }
  .bar button.ghost { padding:7px 12px; }
  /* 시간표 */
  .day { border-color:var(--line); }
  .tag { background:#EEF5EF; color:#3F6B4B; }
  .tag.off { background:#F4F2EF; color:#A39C95; }
  .tag.ab  { background:#FCEFEA; color:#B8573B; }
  .tag.mk  { background:#EFF4F9; color:#4A76A0; }
  .row.rest { background:#F7F6F4; }
  .row.rest .nm { color:#A39C95; }
  .sup { background:#F4F2EF; color:#7D7670; }
  .sup.s1 { background:#F7F1E6; color:#8A6420; }
  .sup.s2 { background:#EFF4F9; color:#4A76A0; }
  .sup.s3, .sup.s4 { background:#F2F0F8; color:#5E5591; }
  .sup.s5 { background:#FBF0EA; color:#9A5A3A; }
  .sup.s6, .sup.s7 { background:#FBF0F4; color:#8E3A5E; }
  .sup.s8 { background:#EEF5F3; color:#3E7A6E; }
  .prevmk { background:#EFF4F9; color:#4A76A0; }
  .fillnote { color:#4A76A0; }
  .runno { color:#A39C95; }
  .absbtn { border-color:#E4E0DA; color:var(--ink2); }
  .absbtn.wait { border-color:#E8CFA0; background:#FBF6EC; color:#9A6E20; }
  .absbtn.undo { border-color:#D3E0EC; background:#fff; color:#4A76A0; }
  /* 보강이 필요한 수업 — 흰 바탕 + 왼쪽 코랄 줄 */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';

// 로그인을 남는 자리에 담는다 — 앱을 닫아도 계속 들어가 있다 (2026-09-19)
//   홈 화면 아이콘으로 쓰시면 앱을 닫을 때마다 끊겨 매번 다시 로그인하셔야 했다
//   끊으시려면 화면 위 「로그아웃」을 누르시면 된다
//   저장소를 못 쓰는 브라우저(시크릿 창 등)에서는 예전처럼 창 안에서만 유지한다
const NLSTORE = (function(){
  try {
    const k = '__nl_t';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return window.localStorage;
  } catch (e) { return window.sessionStorage; }
})();
// ★ 학부모 로그인은 직원 로그인과 다른 이름의 자리에 담는다 (2026-09-21)
//   같은 자리를 쓰면, 직원이 로그인해 둔 컴퓨터에서 이 화면을 열 때
//   직원 로그인 그대로 들어와 모든 아동이 보였다
const NLKEY = 'nl-parent-auth';
// 전(같은 자리)에 담긴 학부모 로그인은 새 자리로 옮겨 다시 로그인하지 않으시게 한다
try {
  if (!NLSTORE.getItem(NLKEY)) {
    const ref = String(URL_).replace(/^https?:\/\//, '').split('.')[0];
    const oldK = 'sb-' + ref + '-auth-token';
    const old = NLSTORE.getItem(oldK);
    if (old) {
      const j = JSON.parse(old);
      const em = String((j && j.user && j.user.email) || '');
      if (/@parent\.namu$/i.test(em)) {
        NLSTORE.setItem(NLKEY, old);
        NLSTORE.removeItem(oldK);
      }
    }
  }
} catch (e) {}
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: { storage: NLSTORE, storageKey: NLKEY, persistSession: true, autoRefreshToken: true }
});
const $ = id => document.getElementById(id);

const MAIL_TAIL = '@parent.namu';
const PW_TAIL   = 'nl26';   // 4자리를 6자 이상으로 채우는 표시
const DAYS = ['일','월','화','수','목','금','토'];

let KIDS = [];      // 내 자녀 [{id, name}]
let ACCID = null;   // 내 계정 번호 (공지 읽음 표시에 쓴다)
let CURKID = null;  // 지금 보고 있는 자녀
let CURMK = '';     // 지금 보고 있는 달 'YYYY-MM'
let TYPES = {};     // 치료 종류 이름
let THRS  = {};     // 치료사 이름

function show(el, t, ok) { el.textContent = t; el.className = 'out ' + (ok ? 'ok' : 'err'); }
function esc(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function thisMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function shiftMonth(mk, n) {
  const y = +mk.slice(0, 4), m = +mk.slice(5, 7);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }

// ── 로그인 ─────────────────────────────────────────────
$('btn').onclick = async () => {
  const phone = $('ph').value.replace(/[^0-9]/g, '');
  const pw    = $('pw').value;
  if (!phone || !pw) { show($('msg'), '휴대폰 번호와 비밀번호를 모두 넣어 주세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    // 잠겨 있는지 먼저 본다
    const { data: g } = await sb.rpc('nl_parent_gate', { p_phone: phone });
    const gate = Array.isArray(g) ? g[0] : g;
    if (gate && gate.locked) {
      const m = Math.ceil((gate.wait_sec || 0) / 60);
      show($('msg'), '비밀번호를 여러 번 잘못 넣어 잠겼습니다.\n'
        + m + '분 뒤에 다시 해 주세요.', false);
      return;
    }

    // 번호가 바뀌어도 되도록, 그 집의 로그인 메일을 표에서 찾아 쓴다 (2026-09-09)
    let mail = phone + MAIL_TAIL;
    try {
      const { data: em } = await sb.rpc('nl_parent_email', { p_login: phone });
      if (em) mail = String(em);
    } catch (e) {}

    // 임시 비번은 4자리 그대로, 학부모가 바꾼 뒤에는 뒤에 표시가 붙는다
    let { error } = await sb.auth.signInWithPassword({
      email: mail, password: pw
    });
    if (error) {
      const r2 = await sb.auth.signInWithPassword({
        email: mail, password: pw + PW_TAIL
      });
      error = r2.error;
    }
    if (error) {
      const n = await sb.rpc('nl_parent_fail', { p_phone: phone });
      const cnt = Number(n && n.data != null ? n.data : (n || 0));
      const left = 5 - cnt;
      show($('msg'), left > 0
        ? '번호나 비밀번호가 맞지 않습니다.\n' + left + '번 더 틀리면 10분 잠깁니다.'
        : '5번 틀려서 10분 잠겼습니다.\n잠시 뒤에 다시 해 주세요.', false);
      return;
    }

    try { localStorage.setItem('nl_parent_phone', phone); } catch (e) {}

    // 성공 — 틀린 횟수를 되돌리고, 비번을 바꿔야 하는지 본다
    let mustChange = false;
    try {
      const { data: ok } = await sb.rpc('nl_parent_ok');
      const row = Array.isArray(ok) ? ok[0] : ok;
      mustChange = !!(row && row.must_change);
    } catch (e) {}

    if (mustChange) { showChange(); return; }
    await afterLogin();
  } catch (e) {
    show($('msg'), '로그인하지 못했습니다.\n잠시 뒤에 다시 해 주세요.', false);
  } finally {
    $('btn').disabled = false; $('btn').textContent = '로그인';
  }
};

// ── 첫 로그인 — 비밀번호 바꾸기 ─────────────────────────
function showChange() {
  $('loginBox').style.display = 'none';
  $('pwBox').style.display    = 'block';
  $('np1').focus();
}

$('npBtn').onclick = async () => {
  const a = $('np1').value.replace(/[^0-9]/g, '');
  const b = $('np2').value.replace(/[^0-9]/g, '');
  if (a.length !== 4) { show($('npMsg'), '숫자 4자리로 정해 주세요.', false); return; }
  if (a !== b)        { show($('npMsg'), '두 칸이 서로 다릅니다.', false); return; }
  if (/^(\d)\1{3}$/.test(a) || a === '1234' || a === '0000') {
    show($('npMsg'), '너무 쉬운 번호입니다. 다른 것으로 정해 주세요.', false); return;
  }
  $('npBtn').disabled = true; $('npBtn').textContent = '바꾸는 중...';
  try {
    const { error } = await sb.auth.updateUser({ password: a + PW_TAIL });
    if (error) throw error;
    await sb.rpc('nl_parent_done');
    $('pwBox').style.display = 'none';
    await afterLogin();
  } catch (e) {
    show($('npMsg'), '바꾸지 못했습니다.\n잠시 뒤에 다시 해 주세요.', false);
  } finally {
    $('npBtn').disabled = false; $('npBtn').textContent = '이 번호로 정하기';
  }
};
$('np2').addEventListener('keydown', e => { if (e.key === 'Enter') $('npBtn').click(); });

$('out').onclick = async () => {
  $('out').disabled = true; $('out').textContent = '나가는 중...';
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('parent.html');
};

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });
$('ph').addEventListener('keydown', e => { if (e.key === 'Enter') $('pw').focus(); });

// 지난번 번호를 채워둔다 (비밀번호는 저장하지 않는다)
try {
  const last = localStorage.getItem('nl_parent_phone');
  if (last) $('ph').value = last;
} catch (e) {}

// ── 로그인 뒤 ───────────────────────────────────────────
async function afterLogin() {
  // 학부모 계정이 아니면 들어오지 못한다 (2026-09-21)
  //   직원 계정이면 표 잠금이 모든 아동을 내려주므로 여기서 막는다
  try {
    const { data: u } = await sb.auth.getUser();
    const em = String((u && u.user && u.user.email) || '');
    if (!/@parent\.namu$/i.test(em)) {
      await sb.auth.signOut({ scope: 'local' });
      show($('msg'), '학부모 계정으로 로그인해 주세요.', false);
      return;
    }
  } catch (e) { return; }
  // 내 자녀 — 표 잠금이 알아서 내 아이만 내려준다
  const { data: kids, error } = await sb
    .from('nl_children').select('id, name').order('id');

  if (error) { show($('msg'), '자료를 가져오지 못했습니다.\n센터로 연락해 주세요.', false); return; }
  if (!kids || !kids.length) {
    // 치료가 끝나고 두 달이 지나면 볼 수 있는 내용이 없어진다
    show($('msg'),
      '치료가 끝나 볼 수 있는 내용이 없습니다.\n'
      + '지난 기록은 치료가 끝난 뒤 두 달까지 보실 수 있습니다.\n\n'
      + '문의는 자라는나무 042-488-6011 로 연락해 주세요.', false);
    return;
  }

  KIDS = kids;
  CURKID = kids[0].id;
  CURMK = thisMonth();
  // 지난번에 보던 달·갈래가 있으면 그대로 연다
  try {
    const km = localStorage.getItem('nl_parent_mon');
    if (km && /^\d{4}-\d{2}$/.test(km) && km <= thisMonth()) CURMK = km;
    const kt = localStorage.getItem('nl_parent_tab');
    if (kt && ['sch','pay','rec','nt','nw'].indexOf(kt) >= 0) TAB = kt;
  } catch (e) {}

  // 이름표 미리 담아둔다
  const { data: tt } = await sb.from('nl_therapy_types').select('id, name');
  (tt || []).forEach(r => { TYPES[r.id] = r.name; });
  // 선생님 이름은 창구에서 번호·이름만 받는다 (2026-09-21)
  //   직원 표를 바로 읽으면 연락처·생년월일 같은 칸까지 내려오므로 쓰지 않는다
  const { data: th } = await sb.rpc('nl_th_names');
  (th || []).forEach(r => { THRS[r.id] = r.name; });

  drawKids();
  $('loginBox').style.display = 'none';
  $('mainBox').style.display  = 'block';
  drawTabs();
  await reload();

  // 공지 — 내 계정 번호를 알아두고, 안 읽은 중요 공지를 띄운다
  //   번호가 바뀌면 메일과 login_id 가 다를 수 있어 메일로도 찾는다 (2026-09-09)
  try {
    const em = (await sb.auth.getUser()).data.user.email;
    const lid = String(em).split('@')[0];
    let acc = null;
    {
      const r = await sb.from('nl_parent_accounts')
        .select('id').eq('auth_email', em).maybeSingle();
      acc = r.data;
    }
    if (!acc) {
      const r2 = await sb.from('nl_parent_accounts')
        .select('id').eq('login_id', lid).maybeSingle();
      acc = r2.data;
    }
    ACCID = acc ? acc.id : null;
  } catch (e) { ACCID = null; }

  try {
    await fetchNotices();
    drawDot();
    showPopups();
  } catch (e) {}

  try { await showPlan(); } catch (e) {}
}

// ── 다음 달 수업 안내 창 ───────────────────────────────
// 25일부터 말일까지는 다음 달, 그 밖의 날은 이 달을 보여준다
// 확정하실 때까지 들어오실 때마다 뜬다
function planMonth() {
  const n = new Date();
  const y = n.getFullYear(), m = n.getMonth() + 1, d = n.getDate();
  const mk = y + '-' + String(m).padStart(2, '0');
  return (d >= 25) ? shiftMonth(mk, 1) : mk;
}

async function showPlan() {
  const mk = planMonth();
  for (const k of KIDS) {
    let fixed = false;
    try {
      const { data: fx } = await sb.from('nl_pay_fix')
        .select('fixed').eq('child_id', k.id).eq('month_key', mk).maybeSingle();
      fixed = !!(fx && fx.fixed);
    } catch (e) {}
    if (fixed) continue;

    let plan = [];
    try {
      const { data: pl } = await sb.rpc('nl_parent_plan',
        { p_child: k.id, p_mk: mk });
      plan = pl || [];
    } catch (e) {}
    if (!plan.length) continue;

    const go = await planPopup(k, mk, plan);
    if (!go) break;    // 「다시 보기」를 누르시면 더 안 띄운다
  }
}

// 창 하나 — 확정하면 true, 닫으면 false
function planPopup(kid, mk, plan) {
  return new Promise(async resolve => {
    // 요일·시각·담당은 회기 줄에서 가져온다
    let ses = [];
    try {
      const { data: s } = await sb.from('nl_sessions')
        .select('support_type_id, therapy_id, therapist_id, plan_date, start_time, status, makeup_for')
        .eq('child_id', kid.id).eq('month_key', mk);
      ses = s || [];
    } catch (e) {}
    const tids = [...new Set(ses.map(r => r.therapy_id).filter(Boolean))];
    const TT = {};
    if (tids.length) {
      try {
        const { data: t } = await sb.from('nl_therapies')
          .select('id, therapy_type_id').in('id', tids);
        (t || []).forEach(r => { TT[r.id] = r.therapy_type_id; });
      } catch (e) {}
    }

    // 지원유형별로 「치료 · 요일 · 시각 · 담당」 줄을 만든다
    function lines(st) {
      const bag = {};
      ses.filter(r => Number(r.support_type_id) === Number(st)).forEach(r => {
        const s = String(r.status || '');
        // 고정 수업만 적는다. 결석·휴무·쉼·보강은 뺀다 (2026-09-09)
        if (s === '취소' || s === '결석' || s === '휴무' || s === '쉼') return;
        if (r.makeup_for) return;
        const tn  = TYPES[TT[r.therapy_id]] || '수업';
        const thn = THRS[r.therapist_id] || '';
        const wd  = DAYS[new Date(r.plan_date + 'T00:00:00').getDay()] + '요일';
        bag[tn + '|' + wd + '|' + hhmm(r.start_time) + '|' + thn] = true;
      });
      return Object.keys(bag).map(k2 => {
        const p = k2.split('|');
        return p[0] + ' · ' + p[1] + ' ' + p[2]
             + (p[3] ? ' · ' + p[3] + ' 선생님' : '');
      });
    }

    let tot = 0;
    let body = '';
    plan.forEach(p => {
      const st = Number(p.support_type_id);
      tot += Number(p.amount || 0);
      body += '<div class="plgrp"><div class="plst">'
            + esc(SN_LABEL[st] || '수업')
            + (p.cnt != null ? ' · ' + Number(p.cnt) + '회' : '')
            + '</div>';
      const ls = lines(st);
      if (ls.length) {
        body += ls.map(t => '<div class="plln">' + esc(t) + '</div>').join('');
      } else if (st === 8) {
        body += '<div class="plln">일정 미정 · 자리가 정해지면 알려드립니다</div>';
      }
      body += '<div class="plam">'
            + (Number(p.amount || 0) > 0 ? won(p.amount)
               : (st === 2 ? '본인부담금 없음' : '지원금으로 냅니다'))
            + '</div></div>';
    });

    const w = document.createElement('div');
    w.className = 'popwrap';
    w.innerHTML =
        '<div class="popbox">'
      + '<div class="poptitle">' + esc(kid.name) + ' · '
      + (+mk.slice(5, 7)) + '월 수업 안내</div>'
      + '<div class="plbody">' + body
      + '<div class="pltot">모두 ' + won(tot) + '</div></div>'
      + '<button class="fixbtn" id="plOk">이대로 좋습니다</button>'
      + '<button class="fixbtn gray" id="plNo">다시 보기</button>'
      + '<div class="popmore">고칠 곳이나 잘못된 곳이 있으면<br>'
      + '이 화면을 캡처해 채널로 알려주세요<br>'
      + '자라는나무 042-488-6011</div>'
      + '</div>';
    document.body.appendChild(w);

    $('plNo').onclick = () => { w.remove(); resolve(false); };
    $('plOk').onclick = async () => {
      const b = $('plOk');
      b.disabled = true; b.textContent = '보내는 중...';
      try {
        const { data: res, error } = await sb.rpc('nl_parent_confirm',
          { p_child: kid.id, p_month: mk });
        if (error) throw error;
        if (String(res) !== '확정') { alert(String(res)); w.remove(); resolve(true); return; }
        w.remove();
        await reload();
        resolve(true);
      } catch (e) {
        b.disabled = false; b.textContent = '이대로 좋습니다';
        alert('확정하지 못했습니다.\n센터로 연락해 주세요.');
      }
    };
  });
}

function drawKids() {
  if (KIDS.length < 2) {
    // 자녀가 하나면 고르기 단추 대신 이름만 보여준다
    const k = KIDS[0];
    $('kids').innerHTML = k
      ? '<div class="onekid">' + esc(k.name) + '</div>' : '';
    return;
  }
  $('kids').innerHTML = KIDS.map(k =>
    '<button class="kid' + (k.id === CURKID ? ' on' : '') + '" data-id="' + k.id + '">'
    + esc(k.name) + '</button>').join('');
  $('kids').querySelectorAll('.kid').forEach(b => {
    b.onclick = async () => { CURKID = +b.dataset.id; drawKids(); await reload(); };
  });
}

function keepParent(){
  try {
    localStorage.setItem('nl_parent_mon', CURMK);
    localStorage.setItem('nl_parent_tab', TAB);
  } catch (e) {}
}
$('prev').onclick = async () => {
  // 기록지는 이 달과 지난 두 달까지만 (표 잠금도 그만큼만 내려준다)
  if (TAB === 'rec' && shiftMonth(CURMK, -1) < shiftMonth(thisMonth(), -2)) return;
  CURMK = shiftMonth(CURMK, -1); keepParent(); drawTabs(); await reload();
};
$('next').onclick = async () => {
  // 기록지는 그 달이 끝나야 작성되므로 앞으로는 못 가게 한다
  if (TAB === 'rec' && shiftMonth(CURMK, 1) > thisMonth()) return;
  CURMK = shiftMonth(CURMK,  1); keepParent(); drawTabs(); await reload();
};

// ── 갈래 단추 ──────────────────────────────────────────
let TAB = 'sch';
$('tabSch').onclick = async () => { TAB = 'sch'; keepParent(); drawTabs(); await reload(); };
$('tabPay').onclick = async () => { TAB = 'pay'; keepParent(); drawTabs(); await reload(); };
$('tabRec').onclick = async () => {
  TAB = 'rec';
  if (CURMK > thisMonth()) CURMK = thisMonth();
  keepParent(); drawTabs(); await reload();
};
$('tabNt').onclick  = async () => { TAB = 'nt';  keepParent(); drawTabs(); await reload(); };
$('tabNw').onclick  = async () => { TAB = 'nw';  keepParent(); drawTabs(); await reload(); };

function drawTabs() {
  $('tabSch').className = (TAB === 'sch' ? 'on' : '');
  $('tabPay').className = (TAB === 'pay' ? 'on' : '');
  $('tabRec').className = (TAB === 'rec' ? 'on' : '');
  $('tabNt').className  = (TAB === 'nt'  ? 'on' : '');
  $('tabNw').className  = (TAB === 'nw'  ? 'on' : '');
  $('list').style.display    = (TAB === 'sch' ? 'block' : 'none');
  if ($('need')) $('need').style.display =
    (TAB === 'sch' && $('need').innerHTML) ? 'block' : 'none';
  $('paylist').style.display = (TAB === 'pay' ? 'block' : 'none');
  $('reclist').style.display = (TAB === 'rec' ? 'block' : 'none');
  $('ntlist').style.display  = (TAB === 'nt'  ? 'block' : 'none');
  $('nwlist').style.display  = (TAB === 'nw'  ? 'block' : 'none');
  // 공지·소식은 아동과 상관없으므로 아동 고르는 줄을 감춘다
  $('kids').style.display    = ((TAB === 'nt' || TAB === 'nw') ? 'none' : 'flex');
  if (TAB !== 'rec') $('rectabs').style.display = 'none';
  if (TAB !== 'nw')  $('nwtabs').style.display  = 'none';
  // 공지는 달과 상관없으므로 달 고르는 줄을 감춘다
  document.querySelector('.bar').style.display =
    ((TAB === 'nt' || TAB === 'nw') ? 'none' : 'flex');
  // 기록지는 이번 달까지만 (그 달이 끝나야 작성되므로)
  const stop = (TAB === 'rec' && shiftMonth(CURMK, 1) > thisMonth());
  $('next').style.visibility = stop ? 'hidden' : 'visible';
  // 기록지는 지난 두 달까지만 거슬러 간다
  const stopBack = (TAB === 'rec'
    && shiftMonth(CURMK, -1) < shiftMonth(thisMonth(), -2));
  $('prev').style.visibility = stopBack ? 'hidden' : 'visible';
}

async function reload() {
  if (TAB === 'sch')      await loadMonth();
  else if (TAB === 'pay') await loadPay();
  else if (TAB === 'rec') await loadRecords();
  else if (TAB === 'nw')  await loadNews();
  else                    await loadNotices();
}

// ── 소식 ───────────────────────────────────────────────
// 센터에서 올린 영상·인스타·블로그 소식을 보여준다.
// 표 잠금이 「올린 날이 지났고 아직 안 내린 것」만 내려준다.
const NW_CLS = { '센터 소식':'k2', '인스타그램':'k3', '블로그':'k4' };

// 유튜브 주소에서 영상 번호를 꺼낸다
function nwYt(u) {
  const s = String(u || '');
  let m = s.match(/[?&]v=([A-Za-z0-9_-]{6,})/);              if (m) return m[1];
  m = s.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);             if (m) return m[1];
  m = s.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/);  if (m) return m[1];
  m = s.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/);   if (m) return m[1];
  return '';
}

// 단추는 어느 갈래든 하나로 통일한다
//   갈래는 위쪽 딱지로 이미 알 수 있으므로, 단추까지 갈래를 말할 필요가 없다
function nwBtn(r) {
  return '<a class="nwbtn" href="' + esc(r.url) + '"'
       + ' target="_blank" rel="noopener">'
       + '<span class="ico">🔗</span>'
       + '<span class="tx">구경하러 가기</span>'
       + '<span class="ar">›</span></a>';
}

// 소식 갈래 — 올라온 것이 있는 갈래만 단추로 보여 준다 (2026-09-18)
//   갈래가 늘거나 줄면 단추도 저절로 따라간다
const NW_ORD = ['치료사 인사', '센터 소식', '인스타그램', '블로그'];
let NW_ALL = [];        // 내려받은 소식 전부
let NW_G = '';          // 고른 갈래 ('' = 전체)

function pickNwGrp(k) {
  NW_G = k;
  drawNews();
}

function drawNwTabs() {
  const box = $('nwtabs');
  const have = NW_ORD.filter(k => NW_ALL.some(r => r.kind === k));
  // 갈래가 하나뿐이면 고를 것이 없으므로 단추를 안 그린다
  if (have.length < 2) { box.style.display = 'none'; return; }
  if (NW_G && have.indexOf(NW_G) < 0) NW_G = '';
  let h = '<button class="' + (NW_G === '' ? 'on' : '') + '"'
        + ' onclick="pickNwGrp(\'\')">전체</button>';
  have.forEach(k => {
    h += '<button class="' + (NW_G === k ? 'on' : '') + '"'
       + ' onclick="pickNwGrp(\'' + k + '\')">' + esc(k) + '</button>';
  });
  box.innerHTML = h;
  box.style.display = 'flex';
}

function drawNews() {
  const box = $('nwlist');
  drawNwTabs();
  const list = NW_G ? NW_ALL.filter(r => r.kind === NW_G) : NW_ALL;
  if (!list.length) {
    box.innerHTML = '<div class="none">아직 올라온 소식이 없습니다.</div>';
    return;
  }
  box.innerHTML = list.map(r => {
    const yid = nwYt(r.url);
    return '<div class="nwrow' + (r.pinned ? ' pin' : '') + '">'
      + '<div class="nwin">'
      +   '<div class="nw1">'
      +     '<span class="nwkind ' + (NW_CLS[r.kind] || '') + '">' + esc(r.kind) + '</span>'
      +     '<span class="nwtt">' + (r.pinned ? '📌 ' : '') + esc(r.title) + '</span>'
      +   '</div>'
      +   '<div class="nwday">' + esc(r.from_date || '') + '</div>'
      +   (r.body ? '<div class="nwbd">' + esc(r.body) + '</div>' : '')
      +   (yid
            ? '<div class="nwvid"><iframe src="https://www.youtube.com/embed/'
              + esc(yid) + '" allowfullscreen loading="lazy"></iframe></div>'
            : '')
      + '</div>'
      + (r.url && !yid ? nwBtn(r) : '')
      + '</div>';
  }).join('');
}

async function loadNews() {
  const box = $('nwlist');
  box.innerHTML = '<div class="none">불러오는 중입니다...</div>';
  const { data, error } = await sb.from('nl_news').select('*');
  if (error) {
    NW_ALL = [];
    $('nwtabs').style.display = 'none';
    box.innerHTML = '<div class="none">소식을 불러오지 못했습니다.</div>';
    return;
  }
  NW_ALL = (data || []).slice().sort((a, b) =>
    (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)
    || String(b.from_date || '').localeCompare(String(a.from_date || ''))
    || (b.id - a.id));
  drawNews();
}

// ── 치료기록지 ─────────────────────────────────────────
// 표 잠금이 최근 2개월분만 내려준다. 그보다 옛것은 아예 오지 않는다.
const ST_NAME = { 1:'센터 치료 기록지', 2:'발달재활서비스 제공기록지',
                  3:'치료지원 누가기록서(언어)', 4:'치료지원 누가기록서(작업)',
                  5:'방과후활동 기록지', 6:'방과후 치료지원 기록지(언어)',
                  7:'방과후 치료지원 기록지(작업)' };

function hm(t) { return t ? String(t).slice(0, 5) : ''; }
function dm(d) {
  if (!d) return '';
  const p = String(d).split('-');
  return p.length === 3 ? (+p[1]) + '월 ' + (+p[2]) + '일' : String(d);
}

// 기록지 갈래 — 발달재활 · 치료지원 · 센터치료
// ※ 방과후활동비(5)는 기록지를 쓰지 않으므로 어디에도 넣지 않는다
const REC_GRP = [
  { key:'dev',  name:'발달재활', sts:[2] },
  { key:'sup',  name:'치료지원', sts:[3, 4, 6, 7] },
  { key:'ctr',  name:'센터치료', sts:[1] }
];
let REC_G = 'dev';   // 지금 고른 갈래

function pickRecGrp(k) {
  REC_G = k;
  loadRecords();
}

async function loadRecords() {
  $('mkLabel').textContent = CURMK.slice(0, 4) + '년 ' + (+CURMK.slice(5, 7)) + '월';
  $('reclist').innerHTML = '<div class="none">불러오는 중...</div>';
  $('rectabs').style.display = 'none';

  const { data: logs, error } = await sb
    .from('nl_session_logs')
    .select('id, support_type_id, month_key, therapist_id')
    .eq('child_id', CURKID)
    .eq('month_key', CURMK);

  if (error) {
    $('reclist').innerHTML = '<div class="none">기록지를 가져오지 못했습니다.<br>센터로 연락해 주세요.</div>';
    return;
  }

  // 그 달에 수업이 있었던 지원유형을 가져온다 (단추를 만들기 위해)
  const { data: sess } = await sb
    .from('nl_sessions')
    .select('support_type_id')
    .eq('child_id', CURKID)
    .eq('month_key', CURMK);

  const have = {};
  (sess || []).forEach(r => { if (r.support_type_id) have[r.support_type_id] = 1; });
  (logs || []).forEach(r => { if (r.support_type_id) have[r.support_type_id] = 1; });

  const grps = REC_GRP.filter(g => g.sts.some(s => have[s]));

  if (!grps.length) {
    $('reclist').innerHTML = '<div class="none">이 달 기록지는 아직 없습니다.<br>'
      + '<span style="font-size:12.5px;">기록지는 최근 2개월분만 보실 수 있습니다.</span></div>';
    return;
  }

  // 고른 갈래가 이 달에 없으면 첫 단추로
  if (!grps.some(g => g.key === REC_G)) REC_G = grps[0].key;

  let btn = '';
  grps.forEach(g => {
    btn += '<button class="' + (g.key === REC_G ? 'on' : '') + '"'
         + ' onclick="pickRecGrp(\'' + g.key + '\')">' + g.name + '</button>';
  });
  $('rectabs').innerHTML = btn;
  $('rectabs').style.display = 'flex';

  // 고른 갈래에 드는 기록지만 남긴다
  const now = REC_GRP.find(g => g.key === REC_G);
  const mine = (logs || []).filter(l => now.sts.indexOf(l.support_type_id) >= 0);

  if (!mine.length) {
    $('reclist').innerHTML = '<div class="none">아직 작성 전입니다.</div>';
    return;
  }

  // 각 기록지의 회차 내용을 가져온다
  const ids = mine.map(l => l.id);
  const { data: items } = await sb
    .from('nl_session_items')
    .select('log_id, seq_no, service_date, start_time, end_time, therapist_id,'
          + ' reaction, status, absent_reason, makeup_date, makeup_time')
    .in('log_id', ids)
    .order('seq_no');

  const bag = {};
  (items || []).forEach(r => { (bag[r.log_id] = bag[r.log_id] || []).push(r); });

  let html = '';
  mine.forEach(lg => {
    const rows = bag[lg.id] || [];
    if (!rows.length) return;
    const nm = ST_NAME[lg.support_type_id] || '치료 기록지';

    html += '<div class="rc">'
      + '<div class="rchead"><div>'
      + '<div class="rctitle">' + esc(nm) + '</div>'
      + '<div class="rcsub">' + CURMK.slice(0,4) + '년 ' + (+CURMK.slice(5,7)) + '월 · '
      + rows.length + '회</div></div>'
      + '<button class="rcpdf" onclick="saveRec(this)">그림으로 저장</button>'
      + '</div>'
      + '<table class="rctbl"><thead><tr>'
      + '<th>회차</th><th>날짜</th><th>시간</th><th>치료사</th><th>수업 내용</th>'
      + '</tr></thead><tbody>';

    rows.forEach((r, i) => {
      const absent = String(r.status || '') === '결석';
      let day = dm(r.service_date);
      if (absent) {
        day = '<span class="abs">' + day + ' 결석</span>';
        if (r.makeup_date) {
          day += '<br><span class="mkup">→ ' + dm(r.makeup_date)
               + (r.makeup_time ? ' ' + hm(r.makeup_time) : '') + ' 보강</span>';
        }
      }
      const tm = (r.start_time || r.end_time)
        ? hm(r.start_time) + (r.end_time ? '~' + hm(r.end_time) : '') : '';
      html += '<tr>'
        + '<td class="ctr">' + (r.seq_no || (i + 1)) + '</td>'
        + '<td class="ctr">' + day + '</td>'
        + '<td class="ctr">' + esc(tm) + '</td>'
        + '<td class="ctr">' + esc(THRS[r.therapist_id] || THRS[lg.therapist_id] || '') + '</td>'
        + '<td>' + esc(r.reaction || '') + '</td>'
        + '</tr>';
    });

    html += '</tbody></table></div>';
  });

  if (!html) {
    $('reclist').innerHTML = '<div class="none">아직 작성 전입니다.</div>';
    return;
  }
  html += '<div class="rcnote">기록지는 최근 2개월분만 보실 수 있습니다.<br>'
       + '「그림으로 저장」을 누르면 기록지가 그림으로 만들어집니다. '
       + '휴대폰에서는 그림을 길게 눌러 「사진에 저장」을 고르시면 됩니다.<br>'
       + '더 지난 기록지가 필요하시면 센터로 말씀해 주세요.</div>';
  $('reclist').innerHTML = html;
}

// ── 기록지를 그림으로 저장 (2026-09-19) ────────────────
//   홈 화면 아이콘(앱 모드)에는 인쇄 창이 없어 window.print() 가 아무 일도 안 했다
//   그래서 화면을 그대로 그림으로 만들어 보여 주고, 길게 눌러 저장하시게 한다
let H2C = null;
function loadH2C(){
  if (H2C) return H2C;
  H2C = new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload = () => ok(window.html2canvas);
    sc.onerror = () => { H2C = null; no(new Error('그림 만들기 꾸러미를 불러오지 못했습니다.')); };
    document.head.appendChild(sc);
  });
  return H2C;
}
async function saveRec(btn){
  const box = btn.closest('.rc');
  if (!box) return;
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '만드는 중…';
  btn.style.visibility = 'hidden';
  try {
    const h2c = await loadH2C();
    const cv = await h2c(box, { backgroundColor: '#ffffff', scale: 2, useCORS: true });
    const url = cv.toDataURL('image/png');
    showShot(url);
  } catch (e) {
    alert('그림을 만들지 못했습니다.\n' + (e && e.message ? e.message : ''));
  } finally {
    btn.style.visibility = '';
    btn.disabled = false; btn.textContent = old;
  }
}
function showShot(url){
  const w = document.createElement('div');
  w.className = 'popwrap';
  w.innerHTML = '<div class="popbox" style="max-width:560px;">'
    + '<div style="font-size:13px;color:#5a6156;line-height:1.7;margin-bottom:10px;">'
    + '그림을 <b>길게 눌러</b> 「사진에 저장」을 고르시면 저장됩니다.<br>'
    + '컴퓨터에서는 아래 「내려받기」를 누르세요.</div>'
    + '<img src="' + url + '" style="width:100%;border:1px solid #e6e9e2;border-radius:8px;">'
    + '<div style="display:flex;gap:8px;margin-top:12px;">'
    + '<a class="popbtn" id="shotDl" download="치료기록지.png" href="' + url + '"'
    + ' style="flex:1;text-align:center;text-decoration:none;padding:11px 0;">내려받기</a>'
    + '<button class="popbtn" id="shotNo" style="flex:1;">닫기</button>'
    + '</div></div>';
  document.body.appendChild(w);
  w.querySelector('#shotNo').onclick = () => w.remove();
  w.onclick = (e) => { if (e.target === w) w.remove(); };
}

// ── 공지사항 ───────────────────────────────────────────
let NOTICES = [];      // 지금 볼 수 있는 공지
let READIDS = {};      // 이미 읽은 공지 번호

// 공지와 「읽음」을 가져온다
async function fetchNotices() {
  const { data, error } = await sb
    .from('nl_notices')
    .select('id, title, body, start_on, end_on, is_popup')
    .order('id', { ascending: false });
  if (error) { NOTICES = []; return; }
  NOTICES = data || [];

  READIDS = {};
  try {
    const { data: rd } = await sb.from('nl_notice_reads').select('notice_id');
    (rd || []).forEach(r => { READIDS[r.notice_id] = true; });
  } catch (e) {}
}

// 안 읽은 공지가 있으면 갈래 단추에 빨간 점을 붙인다
function drawDot() {
  const un = NOTICES.filter(n => !READIDS[n.id]).length;
  $('ntDot').style.display = un ? 'inline-block' : 'none';
  $('ntDot').textContent = un ? String(un) : '';
}

// 읽었다고 적어둔다
async function markRead(id) {
  if (READIDS[id] || !ACCID) return;
  READIDS[id] = true;
  try {
    await sb.from('nl_notice_reads').insert({ notice_id: id, account_id: ACCID });
  } catch (e) {}
}

function loadNotices() {
  if (!NOTICES.length) {
    $('ntlist').innerHTML = '<div class="none">올라온 공지가 없습니다.</div>';
    drawDot();
    return;
  }
  let h = '';
  NOTICES.forEach(n => {
    const unread = !READIDS[n.id];
    h += '<div class="nt' + (unread ? ' unread' : '') + '">'
      + '<div class="nthead"><span class="nttitle">' + esc(n.title) + '</span>'
      + (unread ? '<span class="dot">새 글</span>' : '') + '</div>'
      + '<div class="ntbody">' + esc(n.body) + '</div>'
      + '<div class="ntday">' + esc(n.start_on) + '</div>'
      + '</div>';
  });
  $('ntlist').innerHTML = h;

  // 목록을 열면 다 읽은 것으로 본다
  NOTICES.forEach(n => markRead(n.id));
  setTimeout(drawDot, 400);
}

// ── 중요 공지 창 띄우기 ────────────────────────────────
function showPopups() {
  const list = NOTICES.filter(n => n.is_popup && !READIDS[n.id]);
  if (!list.length) return;
  let i = 0;

  function one() {
    if (i >= list.length) { drawDot(); return; }
    const n = list[i];
    const left = list.length - i - 1;
    const w = document.createElement('div');
    w.className = 'popwrap';
    w.innerHTML =
        '<div class="popbox">'
      + '<div class="poptag">안내 말씀</div>'
      + '<div class="poptitle">' + esc(n.title) + '</div>'
      + '<div class="popbody">' + esc(n.body) + '</div>'
      + '<div class="popday">' + esc(n.start_on) + '</div>'
      + '<button class="popbtn">확인했습니다</button>'
      + (left ? '<div class="popmore">안내가 ' + left + '개 더 있습니다</div>' : '')
      + '</div>';
    document.body.appendChild(w);
    w.querySelector('.popbtn').onclick = async () => {
      await markRead(n.id);
      w.remove();
      i++;
      one();
    };
  }
  one();
}

// 쪼갠 보강 내역 글 (2026-09-17)
//   완료한 조각만 「완료」로 센다 · 아직 안 한 조각은 「예정」 · 결석한 조각은 빼고 셈
function fillText(parts) {
  parts = parts.slice().sort((a, b) =>
    String(a.plan_date + a.start_time).localeCompare(String(b.plan_date + b.start_time)));
  const done = parts.filter(v => v.status === '완료').reduce((t, v) => t + Number(v.minutes || 0), 0);
  const plan = parts.filter(v => v.status === '보강' || v.status === '예정')
                    .reduce((t, v) => t + Number(v.minutes || 0), 0);
  const list = parts.map(v => '+' + Number(v.minutes)
    + ((v.status === '결석' || v.status === '취소') ? '(못 함)' : '')).join(' ');
  let tail;
  if (done >= 40) tail = ' · 완료';
  else if (done + plan >= 40) tail = ' · ' + plan + '분 예정';
  else tail = ' · ' + (40 - done - plan) + '분 남음';
  return list + tail;
}

// ── 한 달 시간표 ────────────────────────────────────────
async function loadMonth() {
  $('mkLabel').textContent = CURMK.slice(0, 4) + '년 ' + (+CURMK.slice(5, 7)) + '월';
  $('list').innerHTML = '<div class="none">불러오는 중...</div>';

  let { data, error } = await sb
    .from('nl_sessions')
    .select('id, plan_date, start_time, status, therapist_id, therapy_id,'
          + ' support_type_id, run_no, makeup_for, minutes, no_makeup')
    .eq('child_id', CURKID)
    .eq('month_key', CURMK)
    .order('plan_date').order('start_time');

  if (error) {
    $('list').innerHTML = '<div class="none">시간표를 가져오지 못했습니다.<br>센터로 연락해 주세요.</div>';
    return;
  }
  // 다른 달 몫이지만 이 달 날짜에 하는 보강·조각도 함께 보여 준다 (2026-09-17)
  //   8월 결석분 20분을 9월 18일 수업 뒤에 하는 것 등
  try {
    const y = +CURMK.slice(0, 4), m = +CURMK.slice(5, 7);
    const last = CURMK + '-' + String(new Date(y, m, 0).getDate()).padStart(2, '0');
    const { data: ox } = await sb.from('nl_sessions')
      .select('id, plan_date, start_time, status, therapist_id, therapy_id,'
            + ' support_type_id, run_no, makeup_for, minutes, no_makeup')
      .eq('child_id', CURKID)
      .neq('month_key', CURMK)
      .not('makeup_for', 'is', null)
      .gte('plan_date', CURMK + '-01').lte('plan_date', last);
    // 못 한(결석·취소) 다른 달 조각은 빼고 보여 준다
    const ox2 = (ox || []).filter(v => v.status !== '결석' && v.status !== '취소');
    if (ox2.length) {
      data = (data || []).concat(ox2).sort((a, b) =>
        String(a.plan_date + a.start_time).localeCompare(String(b.plan_date + b.start_time)));
    }
  } catch (e) {}
  // 「보강 없음」으로 뺀 날은 학부모 시간표에도 안 그린다 (2026-09-09)
  if (data) data = data.filter(r => !r.no_makeup);
  if (!data || !data.length) {
    $('list').innerHTML = '<div class="none">이 달에는 수업이 없습니다.'
      + (CURMK < '2026-08'
         ? '<br><span style="font-size:12.5px;">시간표는 2026년 8월부터 기록되어 있습니다.</span>'
         : '')
      + '</div>';
    return;
  }

  // 치료 종류를 알아내기 위해 치료 줄을 함께 가져온다
  const tids = [...new Set(data.map(r => r.therapy_id).filter(Boolean))];
  const T = {};
  if (tids.length) {
    const { data: ths } = await sb
      .from('nl_therapies').select('id, therapy_type_id').in('id', tids);
    (ths || []).forEach(r => { T[r.id] = r.therapy_type_id; });
  }

  // 공휴일 이름을 가져온다 (치료사 휴가는 표 잠금이 막아 안 내려온다)
  const HOL = {};
  const dates = [...new Set(data.map(r => r.plan_date))];
  if (dates.length) {
    const { data: offs } = await sb
      .from('nl_offdays').select('off_date, reason').in('off_date', dates);
    (offs || []).forEach(r => { HOL[r.off_date] = r.reason || '공휴일'; });
  }

  // 이 아동이 이미 낸 결석 신청을 가져온다
  REQS = {};
  try {
    const { data: rq } = await sb.from('nl_absence_requests')
      .select('id, session_id, state, makeup_date, makeup_time')
      .eq('child_id', CURKID);
    (rq || []).forEach(r => {
      if (r.state === '취소' || r.state === '반려') return;   // 되돌린 것은 다시 신청할 수 있게
      REQS[r.session_id] = r;
    });
  } catch (e) {}

  // 보강 회기의 「원래 어느 날 것인지」를 가져온다 (전월 보강을 알려주려고)
  const ORIG = {};
  const mfs = [...new Set(data.map(r => r.makeup_for).filter(Boolean))];
  if (mfs.length) {
    try {
      const { data: og } = await sb.from('nl_sessions')
        .select('id, plan_date, month_key').in('id', mfs);
      (og || []).forEach(o => { ORIG[o.id] = o; });
    } catch (e) {}
  }

  // 날짜별로 묶는다
  const byDay = {};
  data.forEach(r => { (byDay[r.plan_date] = byDay[r.plan_date] || []).push(r); });

  // 회차 번호를 지원유형별로 다시 센다
  // 휴무·쉼·취소는 빼고, 보강도 번호에서 뺀다 (보강은 「○월 보강」으로 따로 적는다)
  const RUN = {};
  {
    const cnt = {};
    data.slice().sort((a, b) =>
      (a.plan_date + a.start_time) < (b.plan_date + b.start_time) ? -1 : 1
    ).forEach(r => {
      const st = String(r.status || '');
      if (st === '쉼' || st === '휴무' || st === '취소' || st === '보강') return;
      if (r.makeup_for) return;
      const k = String(r.support_type_id || 0);
      cnt[k] = (cnt[k] || 0) + 1;
      RUN[r.id] = cnt[k];
    });
  }

  $('list').innerHTML = Object.keys(byDay).sort().map(d => {
    const dd = new Date(d + 'T00:00:00');
    const head = (+d.slice(5, 7)) + '월 ' + (+d.slice(8, 10)) + '일 ('
               + DAYS[dd.getDay()] + ')';
    const rows = byDay[d].map(r => {
      const tname = TYPES[T[r.therapy_id]] || '수업';
      const thn   = THRS[r.therapist_id] || '';
      const st    = String(r.status || '');

      // 쉬는 날 — 시간을 보이지 않는다
      if (st === '쉼' || st === '휴무') {
        const txt = HOL[d] ? HOL[d] + ' · 공휴일'
                           : (thn ? thn + ' 선생님 휴가' : '휴가');
        // 이 날 몫을 다른 날에 채우면 함께 적는다 (2026-09-17)
        const mine = (data || []).filter(v => Number(v.makeup_for) === Number(r.id)
          && v.status !== '취소');
        let fill = '';
        const pz = mine.filter(v => Number(v.minutes || 40) !== 40);
        const m40 = mine.filter(v => Number(v.minutes || 40) === 40 && v.status !== '결석');
        if (pz.length) fill = ' · 보강 ' + fillText(pz);
        else if (m40.length) fill = ' · ' + m40.map(v => (+String(v.plan_date).slice(5, 7)) + '/'
          + (+String(v.plan_date).slice(8, 10)) + ' 보강').join(', ');
        return '<div class="row rest"><div class="nm">' + esc(txt + fill) + '</div></div>';
      }

      let cls = 'tag', txt = st;
      if (st === '결석')      { cls = 'tag ab'; }
      else if (st === '보강') { cls = 'tag mk'; }

      // 결석 알림 단추 — 아직 안 낸 「예정」 수업에만
      let btn = '';
      const rq = REQS[r.id];
      if (rq) {
        btn = rq.state === '신청'
          ? '<button class="absbtn wait" data-cancel="' + rq.id + '">확인 중 · 요청 취소</button>'
          : (rq.state === '반려' ? ''
             : '<button class="absbtn undo" data-undo="' + rq.id + '">결석 취소</button>');
      } else if (st === '예정' && canAsk(d, r.start_time)) {
        btn = '<button class="absbtn" data-ask="' + r.id + '"'
            + ' data-thr="' + (r.therapist_id || '') + '"'
            + ' data-st="' + (r.support_type_id || '') + '"'
            + ' data-d="' + d + '" data-t="' + esc(hhmm(r.start_time)) + '"'
            + ' data-nm="' + esc(tname) + '">못 가요</button>';
      }

      // 지원유형 이름표
      const sname = ST_LABEL[r.support_type_id] || '';
      const stag = sname ? '<span class="sup s' + r.support_type_id + '">'
                         + esc(sname) + '</span>' : '';

      // 회차 번호 — 시간표 화면과 같게 「9-1」 방식
      const rn = RUN[r.id]
        ? '<span class="runno">' + (+CURMK.slice(5, 7)) + '-' + RUN[r.id] + '</span>'
        : '';

      // 보강이면 원래 어느 달 것인지 밝힌다
      let mtag = '';
      if (r.makeup_for) {
        const o = ORIG[r.makeup_for];
        if (o && o.plan_date) {
          const om = +String(o.plan_date).slice(5, 7);
          const od = +String(o.plan_date).slice(8, 10);
          const cm = +CURMK.slice(5, 7);
          mtag = (om === cm)
            ? '<span class="prevmk">' + om + '/' + od + ' 보강</span>'
            : '<span class="prevmk">' + om + '월 보강</span>';
        } else {
          mtag = '<span class="prevmk">보강</span>';
        }
      }

      // 쪼개서 보강한 줄 — 몇 분인지 밝힌다 (2026-09-08)
      const mn = Number(r.minutes || 40);
      if (mn !== 40) mtag += '<span class="prevmk">+' + mn + '분</span>';

      // 결석 줄에 쪼갠 보강이 붙어 있으면 그 내역을 함께 적는다
      let filltag = '';
      {
        const parts = (data || []).filter(v =>
          Number(v.makeup_for) === Number(r.id) && Number(v.minutes || 40) !== 40);
        if (parts.length) filltag = '<div class="fillnote">' + fillText(parts) + '</div>';
      }

      return '<div class="row">'
        + '<div class="tm">' + esc(hhmm(r.start_time)) + '</div>'
        + '<div class="nm">' + stag + ' ' + esc(tname) + ' ' + rn
        + (thn ? ' <span class="th">' + esc(thn) + ' 선생님</span>' : '')
        + mtag + filltag + '</div>'
        + (txt ? '<span class="' + cls + '">' + esc(txt) + '</span>' : '')
        + btn
        + '</div>';
    }).join('');
    return '<div class="day"><div class="dt">' + esc(head) + '</div>' + rows + '</div>';
  }).join('');

  bindAsk();
  await drawNeed();
}

// ── 보강이 필요한 수업 ─────────────────────────────────
// 셈은 하지 않는다. 저장된 납부 회기와 회기 줄만 본다
async function drawNeed() {
  const box = $('need');
  if (!box) return;
  box.innerHTML = ''; box.style.display = 'none';
  if (TAB !== 'sch') return;

  // ① 이 달에 수업이 있는가 (청구가 0원이면 납부 줄이 없을 수 있다)
  let saved = 0;
  try {
    const { data: sv } = await sb.from('nl_sessions')
      .select('id').eq('child_id', CURKID).eq('month_key', CURMK);
    saved = (sv || []).length;
  } catch (e) {}
  if (!saved) return;

  // ② 확정되었는가
  let fixed = false;
  try {
    const { data: fx } = await sb.from('nl_pay_fix')
      .select('fixed').eq('child_id', CURKID).eq('month_key', CURMK).maybeSingle();
    fixed = !!(fx && fx.fixed);
  } catch (e) {}

  if (!fixed) {
    box.innerHTML =
        '<div class="needlock">이 달 교육비가 아직 <b>확정 전</b>입니다.<br>'
      + '교육비 갈래에서 내용을 보시고 <b>「이대로 좋습니다」</b>를 눌러 주세요.<br>'
      + '확정하시면 보강 요청이 열립니다.'
      + '<button class="fixbtn" id="goFix">교육비 보러 가기</button></div>';
    box.style.display = 'block';
    const g = $('goFix');
    if (g) g.onclick = () => { TAB = 'pay'; keepParent(); drawTabs(); reload(); };
    return;
  }

  // ③ 보강이 필요한 줄 — 셈은 서버 창구 한 곳에서만 한다 (2026-09-11)
  //   시간표 「결석 보강」·「회기가 모자란 수업」·「넘어온 보강」과 같은 규칙
  //   이 달 전부 + 지난달(발달재활은 뺌). 화면은 받은 줄을 그리기만 한다
  let rows = [];
  try {
    const { data: nd } = await sb.rpc('nl_parent_need', { p_child: CURKID, p_mk: CURMK });
    rows = nd || [];
  } catch (e) {}
  const miss   = rows.filter(r => r.session_id);   // 날짜가 있는 줄 → 「보강 잡기」
  const shorts = rows.filter(r => !r.session_id);  // 자리 자체가 모자란 회 → 센터로 말씀

  // ④ 이미 낸 신청
  let reqs = [];
  try {
    const { data: rq } = await sb.from('nl_absence_requests')
      .select('id, session_id, state, makeup_date, makeup_time')
      .eq('child_id', CURKID);
    reqs = rq || [];
  } catch (e) {}
  const RQ = {};
  reqs.forEach(r => { if (r.state !== '반려' && r.state !== '취소') RQ[r.session_id] = r; });

  if (!miss.length && !shorts.length) return;

  // 치료 종류 이름
  const tid3 = [...new Set(miss.map(r => r.therapy_id).filter(Boolean))];
  const T3 = {};
  if (tid3.length) {
    try {
      const { data: t3 } = await sb.from('nl_therapies')
        .select('id, therapy_type_id').in('id', tid3);
      (t3 || []).forEach(r => { T3[r.id] = r.therapy_type_id; });
    } catch (e) {}
  }

  let h = '<div class="needbox"><div class="needttl">보강이 필요한 수업 '
        + (miss.length + shorts.length) + '</div>';

  miss.forEach(r => {
    const dd = new Date(r.plan_date + 'T00:00:00');
    const day = (+r.plan_date.slice(5, 7)) + '월 ' + (+r.plan_date.slice(8, 10))
              + '일 (' + DAYS[dd.getDay()] + ')';
    const tn  = TYPES[T3[r.therapy_id]] || '수업';
    const thn = THRS[r.therapist_id] || '';
    let why = String(r.why || '');
    if (r.kind === 'prev') why = '지난달에서 넘어온 것 · ' + why;
    const q = RQ[r.session_id];
    h += '<div class="needone">'
       + '<div class="needd">' + esc(day) + ' · ' + esc(hhmm(r.start_time))
       + ' · ' + esc(tn) + '</div>'
       + '<div class="needw">' + esc(why) + (thn ? ' · ' + esc(thn) + ' 선생님' : '')
       + (q ? ' · <b>행정샘 확인 중</b>'
            + (q.makeup_date
               ? ' (' + (+q.makeup_date.slice(5, 7)) + '/' + (+q.makeup_date.slice(8, 10))
                 + ' ' + String(q.makeup_time || '').slice(0, 5) + '로 요청)'
               : ' (보강일은 나중에)')
          : '')
       + '</div>'
       + (q
          ? (q.state === '신청'
             ? '<button class="needbtn gray" data-cancel="' + q.id + '">요청 취소</button>'
             : '<button class="needbtn gray" data-undo="' + q.id + '">결석 취소</button>')
          : '<button class="needbtn" data-ask="' + r.session_id + '"'
            + ' data-d="' + r.plan_date + '" data-t="' + hhmm(r.start_time) + '"'
            + ' data-thr="' + (r.therapist_id || '') + '"'
            + ' data-st="' + (r.support_type_id || '') + '"'
            + ' data-nm="' + esc(tn) + '" data-done="1">보강 요청</button>')
       + '</div>';
  });

  shorts.forEach(s => {
    const nm = ST_LABEL[Number(s.support_type_id)] || '수업';
    const x8 = Number(s.support_type_id) === 8;
    h += '<div class="needone">'
       + '<div class="needd">' + esc(nm) + ' · ' + Number(s.short) + '회 모자랍니다</div>'
       + '<div class="needw">'
       + (x8 ? '이 달 발달추가 수업 자리가 아직 없습니다.'
             : '이 달에 받으실 회수보다 ' + Number(s.short) + '회 적게 잡혀 있습니다.')
       + ' 센터로 말씀해 주세요.</div>'
       + '</div>';
  });

  h += '</div>';
  box.innerHTML = h;
  box.style.display = 'block';
  bindAsk();
}

// 지원유형 이름표 — 학부모께 보일 짧은 이름
const ST_LABEL = { 1:'센터', 2:'발달재활', 3:'치료지원', 4:'치료지원',
                   5:'방과후활동', 6:'방과후치료', 7:'방과후치료',
                   8:'발달추가', 9:'평가' };
// 안내 창에 쓰는 긴 이름
const SN_LABEL = { 1:'센터비용', 2:'발달재활서비스', 3:'치료지원(언어)',
                   4:'치료지원(작업)', 5:'방과후활동비',
                   6:'방과후치료지원(언어)', 7:'방과후치료지원(작업)',
                   8:'발달추가비용', 9:'평가비' };

// ── 결석·보강 신청 ─────────────────────────────────────
let REQS = {};      // 수업번호 -> 이미 낸 신청

// 지금 신청할 수 있는 수업인가
// 오후 수업(정오 뒤)은 그날 정오까지, 오전 수업은 전날까지
function canAsk(dstr, stime) {
  const now = new Date();
  const t = String(stime || '00:00').slice(0, 5);
  const isAfternoon = t >= '12:00';
  const lim = new Date(dstr + 'T00:00:00');
  if (isAfternoon) lim.setHours(12, 0, 0, 0);          // 그날 정오
  else             lim.setDate(lim.getDate() - 1),
                   lim.setHours(23, 59, 59, 0);        // 전날 밤까지
  return now < lim;
}

function bindAsk() {
  document.querySelectorAll('button[data-ask]').forEach(b => {
    b.onclick = () => openAsk(b.dataset);
  });
  document.querySelectorAll('button[data-cancel]').forEach(b => {
    b.onclick = () => cancelAsk(Number(b.dataset.cancel));
  });
  document.querySelectorAll('button[data-undo]').forEach(b => {
    b.onclick = () => undoAbsence(Number(b.dataset.undo), b);
  });
}

// 확정된 결석 되돌리기 — 보강까지 함께 지운다
async function undoAbsence(id, btn) {
  if (!confirm('결석을 취소할까요?\n\n수업은 원래대로 진행되고,\n잡혀 있던 보강 일정은 지워집니다.')) return;
  if (btn) { btn.disabled = true; btn.textContent = '취소 중...'; }
  try {
    const { data, error } = await sb.rpc('nl_parent_cancel', { p_req_id: id });
    if (error) throw error;
    alert(data || '취소했습니다.');
    await loadMonth();
  } catch (e) {
    alert('취소하지 못했습니다.\n자라는나무 042-488-6011 로 연락해 주세요.');
    if (btn) { btn.disabled = false; btn.textContent = '결석 취소'; }
  }
}

// 낸 신청 취소하기
async function cancelAsk(id) {
  if (!confirm('보낸 요청을 취소할까요?')) return;
  try {
    const { error } = await sb.from('nl_absence_requests').delete().eq('id', id);
    if (error) throw error;
    await loadMonth();
  } catch (e) {
    alert('취소하지 못했습니다.\n센터로 연락해 주세요.');
  }
}

// 신청 창 열기
async function openAsk(d) {
  const done = d.done === '1';    // 이미 못 한 회 — 사유를 다시 묻지 않는다
  const w = document.createElement('div');
  w.className = 'popwrap';
  w.innerHTML =
      '<div class="popbox">'
    + '<div class="poptitle">' + (done ? '보강 요청' : '못 가는 수업 알리기') + '</div>'
    + '<div class="askinfo">' + esc(d.d.slice(5).replace('-', '월 ')) + '일 · '
    + esc(d.t) + ' · ' + esc(d.nm) + '</div>'
    + (done ? ''
       : '<label class="asklb">왜 못 오시는지 짧게 적어주세요</label>'
         + '<input id="askWhy" type="text" placeholder="예) 감기로 병원에 갑니다" maxlength="60">')
    + '<label class="asklb">보강을 원하시는 시간을 골라 주세요</label>'
    + '<div id="askSlots" class="slots">빈 자리를 찾는 중...</div>'
    + '<div class="askbtns">'
    + '<button id="askGo" class="popbtn">요청하기</button>'
    + '<button id="askNo" class="popbtn gray">닫기</button>'
    + '</div>'
    + '<div class="popmore">요청하신 일정은 행정샘 확인 후 보강 확정해 드릴게요.<br>확정되면 시간표에 나옵니다.</div>'
    + '</div>';
  document.body.appendChild(w);

  let pick = null;   // 고른 자리
  w.querySelector('#askNo').onclick = () => w.remove();

  // 빈 자리 가져오기
  // 발달재활서비스(2번)는 월 4회를 그 달 안에 채워야 하므로 그 달 말까지만 보여준다
  const isDev = Number(d.st) === 2;
  let last = null;
  if (isDev) {
    const y = +d.d.slice(0, 4), m = +d.d.slice(5, 7);
    const e = new Date(y, m, 0);
    last = y + '-' + String(m).padStart(2, '0') + '-'
         + String(e.getDate()).padStart(2, '0');
  }

  let slots = [];
  try {
    const { data: fs } = await sb.rpc('nl_free_slots', {
      p_therapist_id: Number(d.thr), p_last: last, p_child: CURKID
    });
    slots = fs || [];
  } catch (e) {}

  let sh = done ? ''
    : '<button class="slot on" data-later="1">보강은 나중에 정할게요</button>';
  slots.slice(0, 60).forEach(s => {
    const dd = new Date(s.slot_date + 'T00:00:00');
    sh += '<button class="slot" data-sd="' + s.slot_date + '" data-st="' + s.slot_time + '">'
        + (+s.slot_date.slice(5, 7)) + '/' + (+s.slot_date.slice(8, 10))
        + '(' + DAYS[dd.getDay()] + ') ' + String(s.slot_time).slice(0, 5)
        + '</button>';
  });
  if (!slots.length) {
    sh += '<div class="askhint">'
        + (isDev ? '이 달 안에 빈 자리가 없습니다. 센터로 말씀해 주세요.'
                 : '빈 자리가 없습니다. 센터로 말씀해 주세요.')
        + '</div>';
  } else if (isDev) {
    sh += '<div class="askhint">발달재활서비스는 이 달 안에 보강해야 합니다.</div>';
  }
  const box = w.querySelector('#askSlots');
  box.innerHTML = sh;
  box.querySelectorAll('.slot').forEach(b => {
    b.onclick = () => {
      box.querySelectorAll('.slot').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      pick = b.dataset.later ? null : { d: b.dataset.sd, t: b.dataset.st };
    };
  });

  w.querySelector('#askGo').onclick = async () => {
    let why;
    if (done) {
      if (!pick) { alert('보강 자리를 하나 골라주세요.'); return; }
      why = '보강 요청';
    } else {
      why = (w.querySelector('#askWhy').value || '').trim();
      if (!why) { alert('왜 못 오시는지 짧게 적어주세요.'); return; }
    }
    const go = w.querySelector('#askGo');
    go.disabled = true; go.textContent = '보내는 중...';
    try {
      const { error } = await sb.from('nl_absence_requests').insert({
        child_id: CURKID,
        session_id: Number(d.ask),
        account_id: ACCID,
        reason: why,
        makeup_date: pick ? pick.d : null,
        makeup_time: pick ? pick.t : null,
        makeup_therapist_id: pick ? Number(d.thr) : null,
        state: '신청'
      });
      if (error) throw error;
      w.remove();
      alert('요청을 보냈습니다.\n\n요청하신 일정은 행정샘 확인 후 보강 확정해 드릴게요.');
      await loadMonth();
    } catch (e) {
      go.disabled = false; go.textContent = '요청하기';
      const m = String(e.message || e);
      alert(m.indexOf('duplicate') >= 0
        ? '방금 다른 분이 그 자리를 먼저 잡으셨습니다.\n다른 자리를 골라주세요.'
        : '요청을 보내지 못했습니다.\n센터로 연락해 주세요.');
    }
  };
}

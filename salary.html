<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>급여명세서 - 나무링크</title>
<style>
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:#f5f9f0;
         margin:0; padding:20px; color:#333; }
  .box { max-width:460px; margin:40px auto; background:#fff; border-radius:12px;
         padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .wide { max-width:840px; margin:16px auto; background:#fff; border-radius:12px;
          padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:20px; color:#2e7d32; margin:0 0 4px; }
  .sub { font-size:13px; color:#888; margin-bottom:22px; }
  label { display:block; font-size:13px; font-weight:bold; margin:14px 0 5px; }
  input { width:100%; padding:11px; border:1px solid #ddd; border-radius:7px;
          font-size:15px; box-sizing:border-box; }
  button { width:100%; padding:13px; margin-top:20px; background:#2e7d32; color:#fff;
           border:none; border-radius:7px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { background:#bbb; cursor:default; }
  .out { margin-top:16px; padding:13px; border-radius:8px; font-size:14px;
         line-height:1.7; display:none; white-space:pre-wrap; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }

  .top { display:flex; justify-content:space-between; align-items:center;
         flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .who { font-size:13px; color:#666; }
  .btn-out { width:auto; margin:0; padding:8px 16px; background:#757575; font-size:13px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .sel { width:auto; padding:9px 12px; font-size:14px; border:1px solid #ddd;
         border-radius:7px; font-family:inherit; }
  .prtbtn { width:auto; margin:0; padding:9px 16px; background:#546e7a; font-size:13.5px; }

  /* 입력 칸 */
  .editbox { background:#f1f8e9; border:1px solid #c5e1a5; border-radius:10px;
             padding:16px 18px; margin-bottom:18px; }
  .editbox .t { font-size:15px; font-weight:bold; color:#33691e; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
          gap:10px 14px; }
  .grid label { font-size:12.5px; font-weight:normal; margin:0 0 4px; color:#555; }
  .grid input { padding:8px 10px; font-size:14px; }
  .grid input.n { text-align:right; }
  .btns { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn2 { width:auto; margin:0; padding:9px 18px; font-size:13.5px; }
  .grey { background:#9e9e9e; }
  .hint { font-size:12px; color:#7cb342; margin-top:6px; }

  /* 명세서 */
  .paper { border:2px solid #333; padding:26px 30px; max-width:640px; margin:0 auto; }
  .ptitle { text-align:center; font-size:20px; font-weight:bold; margin-bottom:20px;
            letter-spacing:2px; }
  .pinfo { font-size:13.5px; line-height:2; margin-bottom:18px; }
  .pinfo b { display:inline-block; width:76px; color:#555; font-weight:normal; }
  .ptab { width:100%; border-collapse:collapse; font-size:14px; }
  .ptab th { background:#eceff1; border:1px solid #999; padding:8px;
             text-align:center; font-size:13.5px; }
  .ptab td { border:1px solid #999; padding:7px 10px; }
  .ptab td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .ptab .sum td { font-weight:bold; background:#f5f5f5; }
  .pfinal { margin-top:16px; border:2px solid #333; padding:12px 14px;
            display:flex; justify-content:space-between; align-items:center;
            font-size:17px; font-weight:bold; }
  .pfoot { margin-top:22px; text-align:center; font-size:13px; color:#666; }
  .vac { color:#c62828; }

  @media print {
    body { background:#fff; padding:0; }
    .wide { box-shadow:none; max-width:none; margin:0; padding:0; }
    .noprint { display:none !important; }
    .paper { border:2px solid #000; }
  }

  .btn-home { display:inline-block; padding:8px 16px; background:#2e7d32; color:#fff;
              font-size:13px; border-radius:8px; text-decoration:none;
              white-space:nowrap; margin-right:8px; }
  .btn-home:hover { filter:brightness(1.08); }
  .vacbox { margin-top:18px; padding-top:16px; border-top:1px solid #e8ebe4; }
  .vactit { font-size:15px; font-weight:600; margin-bottom:10px; }

  .vacsum .sml { font-size:11.5px; color:#9aa294; line-height:1.6; }

  @media print { .vacbox { display:none; } }
</style>

// 로그인을 창(탭) 안에서만 유지한다. 창을 닫으면 자동으로 끊긴다.

let PEOPLE = [], ROW = null;
let mon = '', sid = 0;
// 「지난 달 금액 가져오기」로 넣었지만 아직 저장 안 한 상태인지
let DIRTY = false;

function show(t, ok){ $('msg').textContent=t; $('msg').className='out '+(ok?'ok':'err'); }
function msg2(t, ok){ $('msg2').textContent=t; $('msg2').className='out '+(ok?'ok':'err'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function won(n){ return Number(n||0).toLocaleString('ko-KR'); }
function num(s){ return Number(String(s||'').replace(/[^0-9-]/g,'')) || 0; }
function monNo(k){ return Number(String(k).split('-')[1]); }
function yrNo(k){ return Number(String(k).split('-')[0]); }
function fmtDate(d){
  if (!d) return '';
  const p = String(d).split('-');
  return p[0] + '.' + p[1] + '.' + p[2] + '.';
}
// 지난 달 (2026-08 -> 2026-07)
function prevMon(k){
  const p = String(k).split('-');
  const d = new Date(Number(p[0]), Number(p[1]) - 2, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
// 그 달 다음 달 8일 (지급일 기본값)
function payDay(k){
  const p = String(k).split('-');
  const d = new Date(Number(p[0]), Number(p[1]), 8);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-08';
}

// 입력칸에 숫자를 넣을 때 쉼표 붙이기
['f_base','f_pen','f_hea','f_car','f_emp','f_tax','f_loc'].forEach(k => {
  document.addEventListener('DOMContentLoaded', () => {});
});

  $('f_base').value = r ? won(r.base_pay)   : '';
  $('f_pen').value  = r ? won(r.pension)    : '';
  $('f_hea').value  = r ? won(r.health)     : '';
  $('f_car').value  = r ? won(r.care)       : '';
  $('f_emp').value  = r ? won(r.employ)     : '';
  $('f_tax').value  = r ? won(r.income_tax) : '';

  $('f_vac').value  = r ? (r.vacation || '') : '';
  $('f_vac').dataset.auto = '0';
  if (!$('f_vac').value.trim()) fillVacAuto();
  $('hint').textContent = r

}

function drawPaper(){
  const p = PEOPLE.find(x => x.id === sid);
  if (!ROW) {

          + '<td class="n" style="border:none;border-bottom:1px solid #999;">지급금액</td></tr>'
          + '<tr><td style="border:none;">기본급</td>'
          + '<td class="n" style="border:none;">' + won(r.base_pay) + '</td></tr>'
        + '</table></td>'
      + '<td style="padding:0;vertical-align:top;">'
        + '<table class="ptab" style="border:none;">'
          + cl('국민연금',   r.pension)
          + cl('건강보험',   r.health)
          + cl('장기요양보험', r.care)
          + cl('고용보험',   r.employ)
          + cl('소득세',     r.income_tax)

// ── 연차 ────────────────────────────────────────
let VACS = [];

// 근로기준법 — 근속에 따라 그 해에 생기는 연차 일수
//   1년 미만  한 달 개근마다 1일 (최대 11일)
//   1~2년     15일
//   3년째부터 2년마다 1일씩 더함 (최대 25일)
function vacCalc(hired, today) {
  if (!hired) return null;
  const h = new Date(String(hired) + 'T00:00:00');
  const t = today ? new Date(String(today) + 'T00:00:00') : new Date();
  if (isNaN(h)) return null;

  // 근속 햇수
  let yrs = t.getFullYear() - h.getFullYear();
  const before = (t.getMonth() < h.getMonth())
    || (t.getMonth() === h.getMonth() && t.getDate() < h.getDate());
  if (before) yrs--;

  if (yrs < 1) {
    // 한 달씩 채울 때마다 1일
    let mons = (t.getFullYear() - h.getFullYear()) * 12 + (t.getMonth() - h.getMonth());
    if (t.getDate() < h.getDate()) mons--;
    if (mons < 0) mons = 0;
    if (mons > 11) mons = 11;
    return { yrs: 0, mons: mons, give: mons, under1: true, next: nextAnniv(h) };
  }
  let give = 15 + Math.floor((yrs - 1) / 2);
  if (give > 25) give = 25;
  return { yrs: yrs, mons: 0, give: give, under1: false, next: nextAnniv(h) };
}
function nextAnniv(h) {
  const t = new Date();
  let y = t.getFullYear();
  const a = new Date(y, h.getMonth(), h.getDate());
  if (a < t) y++;
  return y + '년 ' + (h.getMonth() + 1) + '월 ' + h.getDate() + '일';
}
// 그 해에 쓴 연차 일수
function vacUsed(yr) {
  let s = 0;
  VACS.forEach(v => {
    if (String(v.use_date).slice(0,4) === String(yr)) s += Number(v.days || 0);
  });
  return s;
}
// 명세서 휴가 칸에 넣을 글
function vacLine() {
  const p = PEOPLE.find(x => x.id === sid);
  const c = p ? vacCalc(p.hired_on) : null;
  if (!c) return '';
  const used = vacUsed(yrNo(mon));
  return '연차 ' + c.give + '일 중 ' + used + '일 사용 · '
       + (c.give - used) + '일 남음';
}

async function loadVacs() {
  const { data } = await sb.from('nl_vacations')
    .select('*').eq('staff_id', sid).order('use_date', { ascending:false });
  VACS = data || [];
  drawVacs();
}
function drawVacs() {
  const p = PEOPLE.find(x => x.id === sid);
  const c = p ? vacCalc(p.hired_on) : null;
  if (!c) {
    $('vacsum').innerHTML = '입사일이 없어 연차를 셈할 수 없습니다.<br>'
      + '<span class="sml">등록 아동 관리가 아니라 Supabase 직원 표에서 입사일을 넣어 주세요.</span>';
  } else {
    const used = vacUsed(yrNo(mon));
    $('vacsum').innerHTML =
        '입사 ' + fmtDate(p.hired_on) + ' · 근속 <b>'
      + (c.under1 ? c.mons + '개월' : c.yrs + '년') + '</b><br>'
      + '올해 생긴 연차 <b>' + c.give + '일</b> · 쓴 것 <b>' + used + '일</b> · '
      + '남은 것 <b class="left">' + (c.give - used) + '일</b>'
      + '<div class="sml">'
      + (c.under1
          ? '1년 미만은 한 달 개근마다 1일씩 생깁니다 (최대 11일).<br>'
            + c.next + '에 15일이 한꺼번에 생깁니다.'
          : '1년 이상은 15일이며 3년째부터 2년마다 1일씩 늘어납니다 (최대 25일).<br>'
            + '다음 발생일은 ' + c.next + '입니다.')
      + '</div>';
  }

  if (!VACS.length) {
    $('vaclist').innerHTML = '<div class="vacnone">아직 넣은 것이 없습니다.</div>';
  } else {
    $('vaclist').innerHTML = VACS.map((v, i) =>
      '<div class="vacrow">'
      + '<span class="d">' + fmtDate(v.use_date) + '</span>'
      + '<span class="n2">' + Number(v.days) + '일</span>'
      + '<span class="k">' + esc(v.kind || '') + '</span>'
      + '<span class="m">' + esc(v.memo || '') + '</span>'
      + '<button data-del="' + i + '">지우기</button>'
      + '</div>').join('');
    $('vaclist').querySelectorAll('[data-del]').forEach(el => {
      el.onclick = () => delVac(VACS[Number(el.dataset.del)]);
    });
  }
}
$('v_add').onclick = async () => {
  const d = $('v_d').value;
  if (!d) { vmsg('쓴 날을 고르세요.', false); return; }
  const n = Number(String($('v_n').value).replace(/[^0-9.]/g, '')) || 0;
  if (!n) { vmsg('일수를 넣으세요. 반차는 0.5 입니다.', false); return; }
  const { error } = await sb.from('nl_vacations').insert({
    staff_id: sid, use_date: d, days: n,
    kind: $('v_k').value, memo: $('v_m').value.trim() || null
  });
  if (error) { vmsg('❌ 넣지 못했습니다.\n' + error.message, false); return; }
  $('v_d').value = ''; $('v_n').value = '1'; $('v_m').value = '';
  vmsg('✅ 넣었습니다.', true);
  await loadVacs();
  if (!$('f_vac').value.trim() || $('f_vac').dataset.auto === '1') fillVacAuto();
};
async function delVac(v) {
  if (!confirm(fmtDate(v.use_date) + ' ' + Number(v.days) + '일을 지울까요?')) return;
  const { error } = await sb.from('nl_vacations').delete().eq('id', v.id);
  if (error) { vmsg('❌ 지우지 못했습니다.\n' + error.message, false); return; }
  vmsg('✅ 지웠습니다.', true);
  await loadVacs();
  if ($('f_vac').dataset.auto === '1') fillVacAuto();
}
function vmsg(s, ok) { $('vacmsg').textContent = s; $('vacmsg').className = 'out ' + (ok?'ok':'err'); }
// 명세서 휴가 칸을 자동으로 채운다 (고치면 손으로 적은 것으로 본다)
function fillVacAuto() {
  const s = vacLine();
  if (!s) return;
  $('f_vac').value = s;
  $('f_vac').dataset.auto = '1';
}

async function loadRow(){
  const { data } = await sb.from('nl_salary')
    .select('*').eq('staff_id', sid).eq('month_key', mon).maybeSingle();
  ROW = data || null;
  // 아직 저장 안 한 금액이 있고, 그 달에 저장된 자료가 없으면
  //   칸을 비우지 않고 그대로 둔다 (달만 바꾸어 저장하려는 경우)
  if (DIRTY && !ROW) {
    $('f_pd').value = payDay(mon);
    $('hint').textContent = '⚠️ 지난 달에서 가져온 금액이 그대로 있습니다. '
      + monNo(mon) + '월분으로 저장하려면 「저장하기」를 누르세요.';
    $('hint').style.color = '#8a5a1a';
  } else {
    DIRTY = false;
    $('hint').style.color = '';
    fillForm(ROW);
  }
  drawPaper();
}

$('save').onclick = async () => {
  const row = {
    staff_id: sid, month_key: mon,
    base_pay:   num($('f_base').value),
    pension:    num($('f_pen').value),
    health:     num($('f_hea').value),
    care:       num($('f_car').value),
    employ:     num($('f_emp').value),
    income_tax: num($('f_tax').value),
    local_tax:  num($('f_loc').value),
    pay_date:   $('f_pd').value || null,
    vacation:   $('f_vac').value.trim() || null,
    updated_at: new Date().toISOString()
  };
  if (!row.base_pay) { msg2('기본급을 넣으세요.', false); return; }

  $('save').disabled = true; $('save').textContent = '저장 중...';
  try {
    const { error } = await sb.from('nl_salary')
      .upsert(row, { onConflict: 'staff_id,month_key' });
    if (error) throw error;
    msg2('✅ 저장했습니다.', true);
    DIRTY = false;
    await loadRow();
  } catch (e) {
    msg2('❌ 저장하지 못했습니다.\n' + e.message, false);
  } finally {
    $('save').disabled = false; $('save').textContent = '저장하기';
  }
};

$('prev').onclick = async () => {
  const pm = prevMon(mon);
  const { data } = await sb.from('nl_salary')
    .select('*').eq('staff_id', sid).eq('month_key', pm).maybeSingle();
  if (!data) { msg2(monNo(pm) + '월 자료가 없습니다.', false); return; }
  $('f_base').value = won(data.base_pay);
  $('f_pen').value  = won(data.pension);
  $('f_hea').value  = won(data.health);
  $('f_car').value  = won(data.care);
  $('f_emp').value  = won(data.employ);
  $('f_tax').value  = won(data.income_tax);
  $('f_loc').value  = won(data.local_tax);
  $('f_pd').value   = payDay(mon);
  DIRTY = true;
  msg2('✅ ' + monNo(pm) + '월 금액을 가져왔습니다. 휴가는 새로 적으세요.\n'
     + '이제 달을 바꾸어도 금액이 남습니다. 「저장하기」를 눌러야 저장됩니다.', true);
};

$('f_vac').addEventListener('input', () => { $('f_vac').dataset.auto = '0'; });

$('prt').onclick = () => {
  // PDF로 저장할 때 파일 이름이 「홍길동 26년 8월 급여명세서」가 되게
  //   브라우저는 화면 제목을 파일 이름으로 쓴다. 인쇄가 끝나면 되돌린다
  const p = PEOPLE.find(x => x.id === sid);
  const old = document.title;
  document.title = (p ? p.name : '') + ' '
    + String(yrNo(mon)).slice(2) + '년 ' + monNo(mon) + '월 급여명세서';
  window.print();
  setTimeout(() => { document.title = old; }, 1500);
};

async function afterLogin(user){
  const { data: me, error: e1 } = await sb.from('nl_therapists')
    .select('id, name, role').eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (e1)  { show('❌ 직원 조회 실패\n'+e1.message, false); return; }
  if (!me) { show('⚠️ 직원 표에 이 이메일이 없습니다.', false); return; }
  nlKeep(me.id);   // 대표(8번)만 로그인을 브라우저에 남긴다
  if (CAN_SEE.indexOf(me.id) < 0) {
    show('이 화면은 관리자만 볼 수 있습니다.', false); return;
  }

  const { data: ps } = await sb.from('nl_therapists')
    .select('id, name, role, birth, hired_on').in('id', STAFF).order('id');
  PEOPLE = ps || [];
  $('staff').innerHTML = PEOPLE.map(p =>
    '<option value="'+p.id+'">'+esc(p.name)+' ('+esc(p.role)+')</option>').join('');
  sid = PEOPLE.length ? PEOPLE[0].id : 0;

  const now = new Date();
  let opts = '';
  for (let k = 11; k >= 0; k--) {
    const d = new Date(now.getFullYear(), now.getMonth() - k, 1);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    opts += '<option value="'+key+'">'+key+'</option>';
  }
  $('mon').innerHTML = opts;
  mon = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  $('mon').value = mon;

  $('who').textContent = me.name + ' (' + me.role + ') 님으로 로그인됨';
  $('loginBox').style.display = 'none';
  $('mainBox').style.display  = 'block';
  await loadVacs();
  await loadRow();
}

$('mon').onchange   = async () => { mon = $('mon').value; await loadRow(); drawVacs(); };
$('staff').onchange = async () => {
  // 사람이 바뀌면 넣어둔 금액을 반드시 비운다 (엉뚱한 사람에게 저장되는 것을 막음)
  if (DIRTY && !confirm('저장하지 않은 금액이 있습니다.\n사람을 바꾸면 지워집니다. 그래도 바꿀까요?')) {
    $('staff').value = sid; return;
  }
  DIRTY = false;
  sid = Number($('staff').value);
  await loadVacs();
  await loadRow();
};

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase(), pw = $('pw').value;
  if (!email || !pw) { show('이메일과 비밀번호를 모두 입력하세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) { show('❌ 로그인 실패\n'+e.message, false); }
  finally { $('btn').disabled = false; $('btn').textContent = '로그인'; }
};
$('out').onclick = async () => {
  nlKeepOff();
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
  else {
    // 로그인이 없으면 첫 화면으로 보낸다 (빈 화면이 열리는 것을 막기 위함)
    location.replace('index.html');
  }
})();
</script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소식 · 나무링크</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3c7a4a">
<style>
  :root { --ink:#2F2926; --ink2:#5F5E5A; --ink3:#A39C95;
          --line:#ECE8E3; --bg:#F5F4F2; --acc:#B07A4A; --acc-bg:#F8F1E8;
          --camBg:#FBF5EE; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg);
         margin:0; padding:0; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .hd { background:#fff; border-bottom:1px solid var(--line); display:flex;
        align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; }
  .hd img.lg { height:22px; display:block; }
  .hd .bar0 { width:1px; height:16px; background:var(--line); }
  .hd h1 { font-size:15px; font-weight:600; margin:0; }
  .hd .sp { flex:1 1 auto; }
  .wrap { max-width:820px; margin:0 auto; padding:16px; }
  .box { background:#fff; border:1px solid var(--line); border-radius:12px;
         padding:16px 18px; margin-bottom:12px; }
  #loginBox { max-width:420px; margin:60px auto; padding:28px; }
  #loginBox img.lg { height:26px; display:block; margin:0 auto 14px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
  .who { font-size:12px; color:var(--ink3); }
  .top { display:flex; justify-content:space-between; align-items:flex-start;
         gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--ink2); margin:12px 0 5px; }
  input, select, textarea { width:100%; font:inherit; font-size:14px; padding:9px 11px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  textarea { resize:vertical; line-height:1.7; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--acc);
    outline-offset:-1px; border-color:transparent; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .grid .full { grid-column:1 / -1; }
  button { font:inherit; font-size:14px; padding:7px 16px; border-radius:8px;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  button:hover { background:var(--acc-bg); filter:none; }
  .go { background:#fff; color:var(--ink); border-color:var(--ink3); font-weight:500; }
  .btns { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .out { margin-top:12px; font-size:13.5px; line-height:1.7; white-space:pre-wrap; }
  .ok { color:var(--ink2); } .err { color:#993C1D; }
  .hint { font-size:11.5px; color:var(--ink3); margin-top:5px; line-height:1.6; }
  #edBox { background:var(--camBg); border:1px solid var(--line); border-radius:12px;
           padding:14px 16px; }

  .row { border:1px solid var(--line); border-radius:12px;
         margin-bottom:12px; background:#fff; overflow:hidden; }
  .rin { padding:15px 16px; }
  .nwbtn { display:flex; align-items:center; justify-content:center; gap:9px;
    padding:13px; text-decoration:none; background:#FBEDE6; color:#C2553A;
    font-size:14px; font-weight:500; letter-spacing:-0.2px;
    border-top:1px solid #F2D3C8; }
  .nwbtn .ico { font-size:16px; line-height:1; }
  .nwbtn .ar  { font-size:17px; opacity:0.8; line-height:1; }
  .nwbtn:active { background:#F5C4B3; }
  .row.pin { background:#fff; border-color:var(--line); border-left:3px solid #D29A3C;
             border-radius:0; }
  .row.off { opacity:0.55; }
  .r1 { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .kind { font-size:12px; font-weight:500; padding:2px 10px; border-radius:10px;
          background:#EAF3DE; color:#3B6D11; white-space:nowrap; }
  .kind.k2 { background:#E6F1FB; color:#185FA5; }
  .kind.k3 { background:#FBEAF0; color:#993556; }
  .kind.k4 { background:#EEF5FA; color:#0C447C; }
  .tt { font-weight:500; font-size:16px; letter-spacing:-0.3px; }
  .day { font-size:12.5px; color:var(--ink3); margin-top:5px; }
  .bd { font-size:14px; color:var(--ink2); margin-top:9px; line-height:1.8;
        white-space:pre-wrap; }
  .lk { font-size:12px; color:#185FA5; margin-top:6px; word-break:break-all; }
  .rb { display:flex; gap:6px; margin-top:9px; }
  .rb button { font-size:12px; padding:4px 11px; }
  .none { text-align:center; color:var(--ink3); font-size:13.5px; padding:26px 0; }
  .tabs { display:flex; gap:16px; margin-bottom:12px; flex-wrap:wrap;
          border-bottom:1px solid var(--line); }
  .tab { font-size:13.5px; padding:2px 0 7px; border:none;
         border-bottom:2px solid transparent; border-radius:0;
         background:none; color:var(--ink3); cursor:pointer; }
  .tab:hover { background:none; color:var(--ink); }
  .tab.on { background:none; color:var(--ink); font-weight:500;
            border-bottom-color:var(--acc); }
  .vid { margin-top:11px; }
  .vid iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:8px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <div class="box" id="loginBox">
    <img src="img/nl-logo.png" alt="" class="lg" onerror="this.style.display='none'">
    <h1 style="text-align:center">소식</h1>
    <div class="who" style="text-align:center">나무링크에 로그인해 주세요.</div>
    <label for="em">이메일</label>
    <input id="em" type="email" autocomplete="username">
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="btns"><button id="btn" class="go">로그인</button>
      <button onclick="location.href='index.html'">처음으로</button></div>
    <div id="msg" class="out"></div>
  </div>

</div>

  <!-- 본 화면 -->
  <div id="mainBox" style="display:none;">
    <div class="hd">
      <img src="img/nl-logo.png" alt="" class="lg" onerror="this.style.display='none'">
      <span class="bar0"></span>
      <h1>소식</h1>
      <span class="who" id="who"></span>
      <span class="sp"></span>
      <button id="out">로그아웃</button>
      <button id="goHome" style="color:#B07A4A">처음으로</button>
    </div>
    <div class="wrap">
    <div class="box" style="padding:0;border:none;background:none;margin-bottom:12px;">

      <!-- 올리기 (관리자·행정·홍보만) -->
      <div id="edBox" style="display:none;">
        <div class="grid">
          <div>
            <label for="f_kind">갈래</label>
            <select id="f_kind">
              <option>치료사 인사</option>
              <option>센터 소식</option>
              <option>인스타그램</option>
              <option>블로그</option>
            </select>
          </div>
          <div>
            <label for="f_from">올리는 날</label>
            <input id="f_from" type="date">
          </div>
          <div class="full">
            <label for="f_title">제목 <span style="color:#c62828;">*</span></label>
            <input id="f_title" type="text" placeholder="예: 새로 오신 언어치료 선생님 인사">
          </div>
          <div class="full">
            <label for="f_url">주소 (유튜브 · 인스타 · 블로그)</label>
            <input id="f_url" type="text" placeholder="https://...">
            <div class="hint">유튜브 주소를 넣으면 학부모 화면에서 바로 재생됩니다.<br>
              영상은 유튜브에 「일부 공개」로 올려 주세요. 검색에는 안 나오고
              주소를 아는 분만 보실 수 있습니다.</div>
          </div>
          <div class="full">
            <label for="f_body">설명</label>
            <textarea id="f_body" rows="4" placeholder="학부모께 전할 말씀"></textarea>
          </div>
          <div>
            <label for="f_to">내리는 날 <span style="color:#9aa294;">(비우면 계속)</span></label>
            <input id="f_to" type="date">
          </div>
          <div>
            <label for="f_pin">맨 위에 고정</label>
            <select id="f_pin">
              <option value="0">아니요</option>
              <option value="1">예</option>
            </select>
          </div>
        </div>
        <div class="btns">
          <button id="save" class="go">올리기</button>
          <button id="cancel" style="display:none;">고치기 그만</button>
        </div>
        <div id="msg2" class="out"></div>
      </div>
    </div>

    <div class="box">
      <div class="tabs" id="tabs">
        <button class="tab on" data-k="전체">전체</button>
        <button class="tab" data-k="치료사 인사">치료사 인사</button>
        <button class="tab" data-k="센터 소식">센터 소식</button>
        <button class="tab" data-k="인스타그램">인스타그램</button>
        <button class="tab" data-k="블로그">블로그</button>
      </div>
      <div id="rows"></div>
    </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nl-login.js"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: { storage: window.nlStore, persistSession: true, autoRefreshToken: true }
});
const $ = id => document.getElementById(id);

let ME = null, ROWS = [], kFilter = '전체', edId = null;

function show(el, t, ok) { el.textContent = t; el.className = 'out ' + (ok ? 'ok' : 'err'); }
function esc(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function today() {
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

// 유튜브 주소에서 영상 번호를 꺼낸다
function ytId(u) {
  const s = String(u || '');
  let m = s.match(/[?&]v=([A-Za-z0-9_-]{6,})/);        if (m) return m[1];
  m = s.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);       if (m) return m[1];
  m = s.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/); if (m) return m[1];
  m = s.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/);  if (m) return m[1];
  return '';
}
function kindCls(k) {
  return k === '센터 소식' ? 'k2' : k === '인스타그램' ? 'k3'
       : k === '블로그' ? 'k4' : '';
}

function canEdit() {
  return ME && [8, 9, 10].indexOf(Number(ME.id)) >= 0;
}

function draw() {
  const td = today();
  const list = ROWS.filter(r => kFilter === '전체' || r.kind === kFilter);
  if (!list.length) {
    $('rows').innerHTML = '<div class="none">아직 올라온 소식이 없습니다.</div>';
    return;
  }
  $('rows').innerHTML = list.map(r => {
    const on = (!r.from_date || r.from_date <= td)
            && (!r.to_date || r.to_date >= td);
    const yid = ytId(r.url);
    return '<div class="row' + (r.pinned ? ' pin' : '') + (on ? '' : ' off') + '">'
      + '<div class="rin">'
      +   '<div class="r1">'
      +     '<span class="kind ' + kindCls(r.kind) + '">' + esc(r.kind) + '</span>'
      +     '<span class="tt">' + (r.pinned ? '📌 ' : '') + esc(r.title) + '</span>'
      +   '</div>'
      +   '<div class="day">' + esc(r.from_date || '')
      +     (r.to_date ? ' ~ ' + esc(r.to_date) : '')
      +     (on ? '' : ' · 아직 안 보임') + '</div>'
      +   (r.body ? '<div class="bd">' + esc(r.body) + '</div>' : '')
      +   (yid ? '<div class="vid"><iframe src="https://www.youtube.com/embed/'
                 + esc(yid) + '" allowfullscreen loading="lazy"></iframe></div>' : '')
      +   (canEdit()
            ? '<div class="rb">'
              + '<button data-ed="' + r.id + '">고치기</button>'
              + '<button data-del="' + r.id + '" style="color:#c62828;">지우기</button>'
              + '</div>'
            : '')
      + '</div>'
      + (r.url && !yid
          ? '<a class="nwbtn" href="' + esc(r.url) + '" target="_blank" rel="noopener">'
            + '<span class="ico">🔗</span><span>구경하러 가기</span>'
            + '<span class="ar">›</span></a>'
          : '')
      + '</div>';
  }).join('');

  $('rows').querySelectorAll('[data-ed]').forEach(el => {
    el.onclick = () => openEdit(Number(el.dataset.ed));
  });
  $('rows').querySelectorAll('[data-del]').forEach(el => {
    el.onclick = () => delOne(Number(el.dataset.del));
  });
}

function clearForm() {
  edId = null;
  $('f_kind').value = '치료사 인사';
  $('f_title').value = ''; $('f_url').value = ''; $('f_body').value = '';
  $('f_from').value = today(); $('f_to').value = '';
  $('f_pin').value = '0';
  $('save').textContent = '올리기';
  $('cancel').style.display = 'none';
  ED_ORIG = null;
  show($('msg2'), '', true);
}

function openEdit(id) {
  const r = ROWS.find(x => x.id === id);
  if (!r) return;
  if (!leaveOk()) return;
  edId = id;
  $('f_kind').value  = r.kind || '센터 소식';
  $('f_title').value = r.title || '';
  $('f_url').value   = r.url || '';
  $('f_body').value  = r.body || '';
  $('f_from').value  = r.from_date || today();
  $('f_to').value    = r.to_date || '';
  $('f_pin').value   = r.pinned ? '1' : '0';
  $('save').textContent = '고친 대로 저장';
  $('cancel').style.display = '';
  ED_ORIG = snapForm();
  $('edBox').scrollIntoView({ behavior:'smooth', block:'start' });
  show($('msg2'), '고치는 중입니다.', true);
}

async function delOne(id) {
  const r = ROWS.find(x => x.id === id);
  if (!r) return;
  if (!confirm('「' + r.title + '」 소식을 지웁니다.\n지운 뒤에는 되돌릴 수 없습니다.\n\n계속할까요?')) return;
  const { error } = await sb.from('nl_news').delete().eq('id', id);
  if (error) { show($('msg2'), '❌ 지우지 못했습니다.\n' + error.message, false); return; }
  ROWS = ROWS.filter(x => x.id !== id);
  draw();
  show($('msg2'), '✅ 지웠습니다.', true);
}

$('save').onclick = async () => {
  const title = $('f_title').value.trim();
  if (!title) { show($('msg2'), '제목을 넣어 주세요.', false); return; }

  const row = {
    kind:      $('f_kind').value,
    title:     title,
    body:      $('f_body').value.trim() || null,
    url:       $('f_url').value.trim() || null,
    from_date: $('f_from').value || today(),
    to_date:   $('f_to').value || null,
    pinned:    $('f_pin').value === '1',
    staff_id:  ME ? ME.id : null,
    updated_at: new Date().toISOString()
  };

  $('save').disabled = true;
  $('save').textContent = '저장 중…';
  try {
    let data, error;
    if (edId) {
      ({ data, error } = await sb.from('nl_news')
        .update(row).eq('id', edId).select().single());
    } else {
      ({ data, error } = await sb.from('nl_news')
        .insert(row).select().single());
    }
    if (error) throw error;
    const i = ROWS.findIndex(x => x.id === data.id);
    if (i >= 0) ROWS[i] = data; else ROWS.unshift(data);
    sortRows();
    draw();
    show($('msg2'), edId ? '✅ 고쳤습니다.' : '✅ 올렸습니다.', true);
    clearForm();
  } catch (e) {
    show($('msg2'), '❌ 저장하지 못했습니다.\n' + e.message, false);
    $('save').textContent = edId ? '고친 대로 저장' : '올리기';
  } finally {
    $('save').disabled = false;
  }
};

$('cancel').onclick = () => {
  if (!leaveOk()) return;
  clearForm();
};

// ── 올리지 않은 글이 있으면 나갈 때 묻는다 (2026-09-16) ──
//   새로 쓸 때 — 제목·내용·주소에 글자가 있음
//   고칠 때   — 불러온 것에서 하나라도 바뀜
let ED_ORIG = null;
let LEAVING = false;   // 한 번 물었으면 탭 닫기 창을 또 띄우지 않는다
function snapForm() {
  return [$('f_kind').value, $('f_title').value, $('f_url').value, $('f_body').value,
          $('f_from').value, $('f_to').value, $('f_pin').value].join('\u0001');
}
function hasDraft() {
  if (!$('f_title')) return false;
  if (edId) return ED_ORIG !== null && snapForm() !== ED_ORIG;
  return !!($('f_title').value.trim() || $('f_body').value.trim() || $('f_url').value.trim());
}
function leaveOk() {
  if (!hasDraft()) return true;
  return confirm((edId ? '고친 소식을 아직 저장하지 않았습니다.' : '올리지 않은 소식이 있습니다.')
    + '\n\n그래도 나갈까요? (적어 둔 글은 사라집니다)');
}
$('goHome').onclick = () => {
  if (!leaveOk()) return;
  LEAVING = true;
  location.href = 'index.html';
};
window.addEventListener('beforeunload', e => {
  if (LEAVING || !hasDraft()) return;
  e.preventDefault();
  e.returnValue = '';
});

function sortRows() {
  ROWS.sort((a, b) =>
    (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)
    || String(b.from_date || '').localeCompare(String(a.from_date || ''))
    || (b.id - a.id));
}

document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    kFilter = b.dataset.k;
    draw();
  };
});

async function afterLogin(user) {
  const { data: me, error } = await sb.from('nl_therapists')
    .select('id, name, role').eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (error) { show($('msg'), '❌ 직원 조회 실패\n' + error.message, false); return; }
  if (!me)   { show($('msg'), '⚠️ 직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.', false); return; }
  nlKeep(me.id);
  ME = me;

  $('who').textContent = me.name + ' (' + me.role + ') 님'
    + (canEdit() ? '' : ' · 보기만 하실 수 있습니다');
  $('edBox').style.display = canEdit() ? '' : 'none';
  if (canEdit()) clearForm();

  const { data, error: e2 } = await sb.from('nl_news').select('*');
  if (e2) { show($('msg'), '❌ 소식을 읽지 못했습니다.\n' + e2.message, false); return; }
  ROWS = data || [];
  sortRows();
  draw();

  $('loginBox').style.display = 'none';
  $('mainBox').style.display  = 'block';
}

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show($('msg'), '이메일과 비밀번호를 모두 넣으세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show($('msg'), '❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false; $('btn').textContent = '로그인';
  }
};

$('out').onclick = async () => {
  if (!leaveOk()) return;
  LEAVING = true;
  nlKeepOff();
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
};

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
})();

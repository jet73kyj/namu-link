<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>납부 계산 - 나무링크</title>
<style>
  :root {
    --ink:#1c1f1a; --ink2:#5a6156; --ink3:#9aa294;
    --line:#e8ebe4; --bg:#f7f8f5; --acc:#3c7a4a; --acc-bg:#eef3ec;
  }
  * { box-sizing:border-box; }
  body { font-family:-apple-system, "Malgun Gothic", sans-serif; background:var(--bg);
         margin:0; padding:28px 20px; color:var(--ink);
         font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }

  .box  { max-width:400px; margin:56px auto; background:#fff; border-radius:14px;
          padding:32px; border:1px solid var(--line); }
  .wide { max-width:820px; margin:0 auto; }

  h1 { font-size:19px; font-weight:600; letter-spacing:-.01em; margin:0; color:var(--ink); }
  .sub { font-size:13px; color:var(--ink3); margin:6px 0 24px; }
  label { display:block; font-size:12px; color:var(--ink2); margin:16px 0 6px; }

  input, select { font:inherit; font-size:14px; padding:9px 11px; color:var(--ink);
                  border:1px solid var(--line); border-radius:8px; background:#fff; }
  input:focus, select:focus { outline:2px solid var(--acc); outline-offset:-1px;
                              border-color:transparent; }
  .box input { width:100%; }

  button { font:inherit; font-size:14px; font-weight:500; padding:10px 16px;
           background:var(--acc); color:#fff; border:none; border-radius:8px;
           cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button:disabled { background:#c3c8c0; cursor:default; }
  .box button { width:100%; padding:12px; margin-top:24px; }
  .ghost { background:none; color:var(--ink2); border:1px solid var(--line); }

  .out { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13.5px;
         line-height:1.6; display:none; white-space:pre-wrap; }
  .ok  { background:var(--acc-bg); color:#2c5c37; display:block; }
  .err { background:#fdeeee; color:#9c2b2b; display:block; }

  .top { display:flex; justify-content:space-between; align-items:flex-start;
         gap:12px; margin-bottom:24px; }
  .who { font-size:13px; color:var(--ink3); margin-top:4px; }

  .tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
           padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .tools label { margin:0; }
  .allsum { margin-left:auto; font-size:14px; color:var(--ink2); }

  .note { font-size:12.5px; color:var(--ink3); line-height:1.9; margin:14px 0 22px; }
  .note b { color:var(--ink2); font-weight:600; }

  /* ── 아동 카드 ── */
  .kid { background:#fff; border:1px solid var(--line); border-radius:14px;
         padding:22px 24px; margin-bottom:14px; }
  .kidhead { display:flex; align-items:baseline; gap:10px; margin-bottom:18px; }
  .kidname { font-size:16px; font-weight:600; letter-spacing:-.01em; }
  .kidno   { font-size:12px; color:var(--ink3); }
  .ktotal  { margin-left:auto; font-size:17px; font-weight:600; }

  .sect { font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--ink3);
          margin:0 0 10px; }
  .sect.bank { margin-top:24px; margin-bottom:0; padding:12px 14px 8px;
               background:#eef1fb; border-radius:10px 10px 0 0;
               color:#4a56a6; border-top:none; }
  .bankbody { background:#eef1fb; border-radius:0 0 10px 10px;
              padding:2px 14px 14px; margin-bottom:4px; }
  .bankbody .r { padding:6px 0; }
  .bankbody .nm { color:#3b4694; font-weight:600; }
  .bankbody .am { color:#3b4694; font-weight:600; }
  .bankbody input { border-color:#c9d0ec; }
  .bankbody .pay { margin-top:10px; }

  .r { display:flex; align-items:center; gap:12px; padding:5px 0; font-size:14px; }
  .r .nm  { flex:0 0 170px; color:var(--ink2); }
  .r .de  { flex:1; color:var(--ink3); font-size:13px; }
  .thr { color:var(--ink2); font-weight:600; }
  .r .ct  { flex:0 0 46px; }
  .r .up  { flex:0 0 68px; text-align:right; color:var(--ink3); font-size:13px; }
  .r .am  { flex:0 0 96px; text-align:right; }
  .r input.cnt { width:46px; padding:5px 0; text-align:center; font-size:13px; }
  .r input.mn  { width:96px; padding:5px 8px; text-align:right; font-size:13px; }
  .r select.xthr { padding:4px 6px; font-size:12.5px; border-radius:6px;
                   border:1px solid var(--line); max-width:110px; }

  .r.sum { padding-top:11px; margin-top:5px; border-top:1px solid var(--line);
           font-weight:600; }
  .r.sub2 .am { color:var(--ink3); font-size:13px; }
  .r.tot { margin-top:9px; padding-top:11px; border-top:1.5px solid var(--ink);
           font-size:15px; font-weight:600; }
  .cut { color:var(--ink3); font-size:12px; font-weight:400; }
  .warn { color:#b5651d; font-size:12.5px; }

  .pay { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .pay input.dt { width:150px; }
  .pay input.tx { flex:1; min-width:150px; }
  .kidfoot { display:flex; margin-top:20px; }
  .kidfoot button { margin-left:auto; }
  .saved { font-size:11px; color:var(--acc); font-weight:500; margin-left:5px; }
  .empty { padding:60px 20px; text-align:center; color:var(--ink3); font-size:14px; }

  @media (max-width:640px) {
    .r { flex-wrap:wrap; gap:8px; }
    .r .nm { flex:0 0 100%; }
    .r .de { flex:1 1 auto; }
  }
</style>
</head>
<body>

<!-- 로그인 전 -->
<div class="box" id="loginBox">
  <h1>납부 계산</h1>
  <div class="sub">나무링크</div>
  <label for="em">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com">
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 로그인 후 -->
<div class="wide" id="mainBox" style="display:none;">
  <div class="top">
    <div>
      <h1>납부 계산</h1>
      <div class="who" id="who"></div>
    </div>
    <button id="out" class="ghost">로그아웃</button>
  </div>

  <div class="tools">
    <input id="mk" type="month" value="2026-08">
    <input id="q" type="search" placeholder="아동 이름" style="width:150px;">
    <button id="load">불러오기</button>
    <span class="allsum" id="allsum"></span>
  </div>

  <div class="note">
    <b>회기</b>는 그 달의 수업 요일 수로 채워집니다. 결석이 있으면 숫자를 고치세요.<br>
    <b>리뷰</b>는 1건 5,000원, 월 4건까지. 발달재활 본인부담금에서는 빠지지 않습니다.<br>
    날짜를 넣으면 납부완료, 비워두면 미납으로 저장됩니다.
  </div>

  <div id="kids"></div>
  <div class="empty" id="empty">달을 고르고 불러오기를 누르세요.</div>
  <div id="msg2" class="out"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';

const sb = window.supabase.createClient(URL_, KEY_);
const $  = id => document.getElementById(id);

const REVIEW_UNIT = 5000;   // 리뷰 1건당 차감액
const REVIEW_MAX  = 4;      // 월 최대 건수

let CHILDREN = [], TYPES = {}, TTYPES = {}, THERAPISTS = [];
let FEES = {}, RULES = {}, GRADES = {};
let SCHED = {};             // child_id -> 수업 목록
let SAVED = {};             // child_id -> 저장된 납부
let LASTX = {};             // child_id -> 지난 발추 담당 치료사
let LOADED_MK = null;

function show(el, text, ok) {
  el.textContent = text;
  el.className = 'out ' + (ok ? 'ok' : 'err');
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function won(n) { return (n || 0).toLocaleString() + '원'; }
// 2019-03-14 -> 190314
function ymd(b) {
  const s = String(b || '').replace(/[^0-9]/g, '');
  return s.length >= 8 ? s.slice(2, 8) : '';
}

// 그 달에 해당 요일이 몇 번 있는지 센다
function countWeekday(mk, day) {
  const NAMES = ['일','월','화','수','목','금','토'];
  const [y, m] = mk.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  let n = 0;
  for (let d = 1; d <= last; d++) {
    if (NAMES[new Date(y, m - 1, d).getDay()] === day) n++;
  }
  return n;
}

// 여러 줄 중 from_month 가 기준달 이하인 것 중 가장 최근 것을 고른다
function pickLatest(rows, mk, keyName) {
  const out = {};
  (rows || []).forEach(r => {
    if (r.from_month > mk) return;
    const k = r[keyName];
    if (!out[k] || r.from_month > out[k].from_month) out[k] = r;
  });
  return out;
}

async function afterLogin(user) {
  const { data: me, error: e1 } = await sb
    .from('nl_therapists').select('name, role')
    .eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (e1)  { show($('msg'), '❌ 직원 조회 실패\n' + e1.message, false); return; }
  if (!me) { show($('msg'), '⚠️ 직원 표에 이 이메일이 없습니다.', false); return; }

  const [c, st, tt, th] = await Promise.all([
    sb.from('nl_children').select('id, name, birth, manager_no, status').order('name'),
    sb.from('nl_support_types').select('id, name').order('id'),
    sb.from('nl_therapy_types').select('id, name').order('id'),
    sb.from('nl_therapists').select('id, name, active').order('id')
  ]);
  if (c.error)  { show($('msg'), '❌ 아동 조회 실패\n' + c.error.message, false); return; }
  if (st.error) { show($('msg'), '❌ 지원유형 조회 실패\n' + st.error.message, false); return; }

  CHILDREN = (c.data || []).filter(x => x.status === '치료중');
  (st.data || []).forEach(x => TYPES[x.id] = x.name);
  (tt.data || []).forEach(x => TTYPES[x.id] = x.name);
  THERAPISTS = (th.data || []).filter(x => x.active !== false);

  $('who').textContent = me.name + ' (' + me.role + ') 님 · 치료중 아동 ' + CHILDREN.length + '명';
  $('loginBox').style.display = 'none';
  $('mainBox').style.display  = 'block';
}

async function load() {
  const mk = $('mk').value;
  if (!mk) { show($('msg2'), '달을 골라주세요.', false); return; }

  $('load').disabled = true;
  $('load').textContent = '불러오는 중...';
  try {
    const ids = CHILDREN.map(c => c.id);

    const [th, fe, ru, gr, pay, px] = await Promise.all([
      sb.from('nl_therapies')
        .select('id, child_id, therapy_type_id, support_type_id, nl_therapy_schedules(weekday, start_time, therapist_id, duration)')
        .in('child_id', ids),
      sb.from('nl_therapist_fees').select('*'),
      sb.from('nl_support_rules').select('*'),
      sb.from('nl_child_grades').select('*'),
      sb.from('nl_payments').select('child_id, support_type_id, amount, paid_on, memo')
        .eq('month_key', mk),
      sb.from('nl_payments').select('child_id, month_key, memo')
        .eq('support_type_id', 8).lt('month_key', mk)
        .order('month_key', { ascending: false })
    ]);
    if (th.error)  throw th.error;
    if (fe.error)  throw fe.error;
    if (ru.error)  throw ru.error;
    if (gr.error)  throw gr.error;
    if (pay.error) throw pay.error;
    if (px.error)  throw px.error;

    FEES   = pickLatest(fe.data, mk, 'therapist_id');
    RULES  = pickLatest(ru.data, mk, 'support_type_id');
    GRADES = pickLatest(gr.data, mk, 'child_id');

    SCHED = {};
    (th.data || []).forEach(t => {
      (t.nl_therapy_schedules || []).forEach(s => {
        (SCHED[t.child_id] = SCHED[t.child_id] || []).push({
          therapy_type_id: t.therapy_type_id,
          support_type_id: t.support_type_id,
          weekday: s.weekday,
          start_time: s.start_time,
          therapist_id: s.therapist_id,
          duration: s.duration || 40
        });
      });
    });

    SAVED = {};
    (pay.data || []).forEach(p => {
      (SAVED[p.child_id] = SAVED[p.child_id] || {})[p.support_type_id] = p;
    });

    // 지난달 이전 기록에서 아동별 발추 담당 치료사를 찾아둔다 (가장 최근 것)
    LASTX = {};
    (px.data || []).forEach(p => {
      if (LASTX[p.child_id]) return;   // 이미 더 최근 것이 있음
      const t = extraTherapistOf(p);
      if (t) LASTX[p.child_id] = t;
    });

    LOADED_MK = mk;
    drawAll();
    show($('msg2'), mk + ' 계산했습니다. 회기와 리뷰를 확인하고 아동별로 저장하세요.', true);
  } catch (e) {
    show($('msg2'), '❌ 불러오지 못했습니다.\n' + e.message, false);
  } finally {
    $('load').disabled = false;
    $('load').textContent = '불러오기';
  }
}

// 한 아동의 계산 줄들을 만든다
function buildRows(childId, mk) {
  const list = SCHED[childId] || [];
  const groups = {};   // support_type_id -> 줄들

  list.forEach(s => {
    const fee = FEES[s.therapist_id];
    const unit = !fee ? null
      : s.duration === 60 ? fee.fee_60
      : s.duration === 50 ? fee.fee_50
      : fee.fee_40;
    (groups[s.support_type_id] = groups[s.support_type_id] || []).push({
      kind: '회기',
      label: (TTYPES[s.therapy_type_id] || '치료') + ' ' + s.weekday + ' '
             + String(s.start_time).slice(0,5) + ' (' + s.duration + '분)',
      therapist_name: thrName(s.therapist_id),
      therapist_id: s.therapist_id,
      unit: unit,
      count: countWeekday(mk, s.weekday)
    });
  });

  const out = [];
  Object.keys(groups).forEach(stid => {
    const rule = RULES[stid] || { calc_type: '회기계산', deduction: 0, review_target: true };
    out.push({
      support_type_id: Number(stid),
      calc_type: rule.calc_type,
      deduction: rule.deduction || 0,
      review_target: rule.review_target !== false,
      items: groups[stid]
    });
  });

  // 발달재활(2번)이 있으면 발추(8번) 줄도 만들어 둔다
  const dev = out.find(g => g.support_type_id === 2);
  if (dev) {
    const tid = dev.items.length ? dev.items[0].therapist_id : null;
    const fee = tid ? FEES[tid] : null;
    const rule8 = RULES[8] || { calc_type: '치료사정액', deduction: 0, review_target: true };
    out.push({
      support_type_id: 8,
      calc_type: rule8.calc_type,
      deduction: 0,
      review_target: rule8.review_target !== false,
      extra_unit: fee ? (fee.fee_extra || 0) : null,
      extra_therapist: tid,
      items: []
    });
  }

  out.sort((a, b) => a.support_type_id - b.support_type_id);
  return out;
}

function drawAll() {
  const q = $('q').value.trim().toLowerCase();
  const list = CHILDREN.filter(c => !q || (c.name || '').toLowerCase().includes(q));

  $('empty').style.display = list.length ? 'none' : 'block';
  if (!list.length) { $('kids').innerHTML = ''; $('allsum').textContent = ''; return; }

  $('kids').innerHTML = list.map(c => drawKid(c)).join('');
  list.forEach(c => calcKid(c.id));
  sumAll();
}

function drawKid(c) {
  const mk = LOADED_MK;
  const groups = buildRows(c.id, mk);
  const sv = SAVED[c.id] || {};

  const head = '<div class="kidhead">'
    + '<span class="kidname">' + esc(c.name) + '</span>'
    + '<span class="kidno">' + ymd(c.birth) + '</span>'
    + '<span class="kidno">' + esc(c.manager_no) + '</span>'
    + '<span class="ktotal">0원</span></div>';

  if (!groups.length) {
    return '<div class="kid" data-child="' + c.id + '">' + head
      + '<div class="warn">수업이 등록되어 있지 않습니다. 아동 목록 화면에서 치료를 먼저 넣으세요.</div>'
      + '</div>';
  }

  let b = '<div class="sect">카드결제</div>';

  groups.filter(g => g.support_type_id !== 2).forEach(g => {
    const tn = TYPES[g.support_type_id] || ('유형' + g.support_type_id);
    const sd = sv[g.support_type_id] !== undefined
      ? '<span class="saved">저장됨</span>' : '';

    if (g.calc_type === '회기계산') {
      const savedCnt = countsOf(sv[g.support_type_id]);
      g.items.forEach((it, i) => {
        const cnt = (savedCnt && savedCnt[i] != null && !isNaN(savedCnt[i]))
                    ? savedCnt[i] : it.count;
        b += '<div class="r line" data-st="' + g.support_type_id + '">'
          + '<span class="nm">' + (i === 0 ? esc(tn) + sd : '') + '</span>'
          + '<span class="de">' + esc(it.label)
          + ' · <b class="thr">' + esc(it.therapist_name) + '</b></span>'
          + '<span class="ct"><input class="cnt" type="text" inputmode="numeric" value="' + cnt + '"></span>'
          + '<span class="up">' + (it.unit == null ? '<span class="warn">단가없음</span>' : it.unit.toLocaleString()) + '</span>'
          + '<span class="am lineamt" data-unit="' + (it.unit == null ? '' : it.unit) + '">0</span>'
          + '</div>';
      });
      if (g.deduction > 0) {
        b += '<div class="r sub2"><span class="nm"></span>'
          + '<span class="de">지원금 제외</span><span class="ct"></span><span class="up"></span>'
          + '<span class="am">−' + g.deduction.toLocaleString() + '</span></div>';
        b += '<div class="r sum gsum" data-st="' + g.support_type_id + '" data-ded="' + g.deduction + '">'
          + '<span class="nm"></span><span class="de"></span><span class="ct"></span>'
          + '<span class="up">' + esc(tn) + '</span>'
          + '<span class="am gamt">0</span></div>';
      } else {
        b += '<div class="gsum" data-st="' + g.support_type_id + '" data-ded="0" hidden>'
          + '<span class="gamt"></span></div>';
      }

    } else if (g.calc_type === '치료사정액') {
      const savedT = sv[8] ? extraTherapistOf(sv[8]) : null;
      const curT = savedT || LASTX[c.id] || g.extra_therapist;
      b += '<div class="r gsum" data-st="8">'
        + '<span class="nm">' + esc(tn) + sd + '</span>'
        + '<span class="de">담당 <select class="xthr">' + therapistOptions(curT) + '</select></span>'
        + '<span class="ct"><input class="cnt xcnt" type="text" inputmode="numeric" value="' + (sv[8] !== undefined ? 1 : 0) + '"></span>'
        + '<span class="up xunit">' + feeExtra(curT).toLocaleString() + '</span>'
        + '<span class="am gamt">0</span></div>';
    }
  });

  const ev = sv[9];
  b += '<div class="r gsum" data-st="9" data-manual="1">'
    + '<span class="nm">평가비' + (ev ? '<span class="saved">저장됨</span>' : '') + '</span>'
    + '<span class="de">있을 때만</span><span class="ct"></span><span class="up"></span>'
    + '<span class="am"><input class="mn evamt" type="text" inputmode="numeric" value="'
    + (ev ? Number(ev.amount).toLocaleString() : '') + '" placeholder="0"></span></div>';

  b += '<div class="r"><span class="nm">리뷰 차감</span>'
    + '<span class="de">1건 5,000원 · 4건까지</span>'
    + '<span class="ct"><input class="cnt rv" type="text" inputmode="numeric" value="0"></span>'
    + '<span class="up"></span><span class="am rvtxt">0</span></div>';

  b += '<div class="r tot"><span class="nm"></span><span class="de"></span>'
    + '<span class="ct"></span><span class="up">카드 합계</span>'
    + '<span class="am cardtotal">0원</span></div>';

  const cp = Object.keys(sv).map(k => sv[k])
    .find(p => Number(p.support_type_id) !== 2 && p.paid_on);
  const cm = Object.keys(sv).map(k => sv[k])
    .find(p => Number(p.support_type_id) !== 2 && memoOf(p, false));
  b += '<div class="pay">'
    + '<input class="dt pday" type="date" value="' + (cp ? cp.paid_on : '') + '">'
    + '<input class="tx kmemo" type="text" placeholder="메모 (승인번호 등)" value="'
    + esc(cm ? memoOf(cm, false) : '') + '"></div>';

  const dev = groups.find(g => g.support_type_id === 2);
  if (dev) {
    const gr = GRADES[c.id];
    const pv = gr ? gr.self_pay : null;
    const ds = sv[2];
    b += '<div class="sect bank">계좌입금 · 발달재활서비스 본인부담금</div>'
      + '<div class="bankbody">'
      + '<div class="r gsum" data-st="2" data-fixed="' + (pv == null ? '' : pv) + '">'
      + '<span class="nm">발달재활서비스'
      + (gr ? ' <b>' + gr.grade + '형</b>' : '')
      + (ds ? '<span class="saved">저장됨</span>' : '') + '</span>'
      + '<span class="de">' + (gr ? '본인부담금'
          : '<span class="warn">등급이 없습니다. 아동 목록에서 먼저 넣으세요.</span>')
      + (dev.items.length ? ' · <b class="thr">' + esc(thrName(dev.items[0].therapist_id)) + '</b>' : '')
      + '</span>'
      + '<span class="ct"></span><span class="up"></span>'
      + '<span class="am gamt">0</span></div>'
      + '<div class="pay">'
      + '<input class="dt bday" type="date" value="' + (ds && ds.paid_on ? ds.paid_on : '') + '">'
      + '<input class="tx bmemo" type="text" placeholder="입금자명" value="'
      + esc(memoOf(ds, true)) + '"></div>'
      + '</div>';
  }

  b += '<div class="kidfoot"><button class="ksave" type="button">저장</button></div>';

  return '<div class="kid" data-child="' + c.id + '">' + head + b + '</div>';
}

// 저장된 메모에서 사람이 적은 부분만 꺼낸다
function memoOf(p, isBank) {
  let m = (p && p.memo) ? String(p.memo) : '';
  if (isBank) {
    if (m === '계좌입금') return '';
    if (m.indexOf('계좌입금 ') === 0) return m.slice(5);
  } else {
    if (m.indexOf('2026-08-11 자동이관') === 0) return '';
  }
  m = m.replace(/\s*\[회기[0-9,]+\]/g, '')
       .replace(/\s*\[발추치료사\d+\]/g, '').trim();
  if (m === '카드결제' || m === '자동계산' || m === '화면입력' || m === '계좌입금') return '';
  return m;
}

// 치료사 고르는 칸
function therapistOptions(sel) {
  let o = '';
  THERAPISTS.forEach(t => {
    o += '<option value="' + t.id + '"' + (String(sel) === String(t.id) ? ' selected' : '')
       + '>' + esc(t.name) + '</option>';
  });
  return o;
}
// 치료사 이름
function thrName(tid) {
  const t = THERAPISTS.find(x => String(x.id) === String(tid));
  return t ? t.name : ('치료사' + (tid == null ? '?' : tid));
}
// 그 치료사의 발추 단가
function feeExtra(tid) {
  const f = FEES[tid];
  return f ? (f.fee_extra || 0) : 0;
}
// 저장된 발추 메모에서 치료사 번호를 꺼낸다
// 저장된 메모에서 회기 목록을 꺼낸다  [회기2,4,3]
function countsOf(p) {
  const m = String((p && p.memo) || '').match(/\[회기([0-9,]+)\]/);
  return m ? m[1].split(',').map(x => parseInt(x, 10)) : null;
}

function extraTherapistOf(p) {
  const m = String((p && p.memo) || '').match(/\[발추치료사(\d+)\]/);
  return m ? Number(m[1]) : null;
}

function numOf(v) {
  const s = String(v == null ? '' : v).replace(/[^0-9]/g, '');
  return s === '' ? 0 : parseInt(s, 10);
}

// 한 아동의 금액을 다시 계산한다
function calcKid(childId) {
  const box = document.querySelector('.kid[data-child="' + childId + '"]');
  if (!box) return;

  // 1) 회기계산 줄
  box.querySelectorAll('.line').forEach(tr => {
    const unit = tr.querySelector('.lineamt').dataset.unit;
    const cnt  = numOf(tr.querySelector('.cnt').value);
    const amt  = unit === '' ? 0 : Number(unit) * cnt;
    tr.querySelector('.lineamt').textContent = amt.toLocaleString();
  });

  // 2) 유형별 합계
  const parts = [];   // {st, amt, review}
  box.querySelectorAll('.gsum').forEach(tr => {
    const st = Number(tr.dataset.st);
    let amt = 0;

    if (tr.dataset.fixed !== undefined) {
      amt = tr.dataset.fixed === '' ? 0 : Number(tr.dataset.fixed);
    } else if (tr.querySelector('.xthr')) {
      const tid = Number(tr.querySelector('.xthr').value);
      const unit = feeExtra(tid);
      tr.querySelector('.xunit').textContent = unit.toLocaleString();
      amt = unit * numOf(tr.querySelector('.xcnt').value);
    } else if (tr.dataset.manual !== undefined) {
      amt = numOf(tr.querySelector('.evamt').value);
    } else {
      let base = 0;
      box.querySelectorAll('.line[data-st="' + st + '"] .lineamt')
         .forEach(td => base += numOf(td.textContent));
      amt = Math.max(0, base - Number(tr.dataset.ded || 0));
    }

    if (tr.querySelector('.gamt')) tr.querySelector('.gamt').textContent = amt.toLocaleString();
    parts.push({ st: st, amt: amt, review: st !== 2 });
  });

  // 3) 리뷰 차감 — 발달재활(2번) 빼고 나머지에서 순서대로 뺀다
  const rvEl = box.querySelector('.rv');
  let rv = rvEl ? Math.min(numOf(rvEl.value), REVIEW_MAX) : 0;
  let cut = rv * REVIEW_UNIT;
  if (box.querySelector('.rvtxt')) {
    box.querySelector('.rvtxt').textContent = cut ? '−' + cut.toLocaleString() : '0';
  }

  parts.forEach(p => {
    if (!p.review || cut <= 0) return;
    const take = Math.min(p.amt, cut);
    p.amt -= take; cut -= take;
    const tr = box.querySelector('.gsum[data-st="' + p.st + '"]');
    if (tr && tr.querySelector('.gamt') && take > 0) {
      tr.querySelector('.gamt').innerHTML = p.amt.toLocaleString()
        + ' <span class="dim">(리뷰 −' + take.toLocaleString() + ')</span>';
    }
  });

  const card = parts.filter(p => p.st !== 2).reduce((s, p) => s + p.amt, 0);
  const bank = parts.filter(p => p.st === 2).reduce((s, p) => s + p.amt, 0);
  if (box.querySelector('.cardtotal')) {
    box.querySelector('.cardtotal').textContent = won(card);
  }

  const total = card + bank;
  box.querySelector('.ktotal').textContent = won(total);
  box.dataset.total = total;
  box.dataset.parts = JSON.stringify(parts);
}

function sumAll() {
  let t = 0, n = 0;
  document.querySelectorAll('.kid').forEach(b => {
    const v = Number(b.dataset.total || 0);
    if (v > 0) { t += v; n++; }
  });
  $('allsum').textContent = n + '명 · ' + won(t);
}

async function saveKid(childId, btn) {
  const box = document.querySelector('.kid[data-child="' + childId + '"]');
  const parts = JSON.parse(box.dataset.parts || '[]');
  const cEl = box.querySelector('.pday'),  cMemo = box.querySelector('.kmemo');
  const bEl = box.querySelector('.bday'),  bMemo = box.querySelector('.bmemo');
  const cardDay  = cEl ? cEl.value : '';
  const cardMemo = cMemo ? cMemo.value.trim() : '';
  const bankDay  = bEl ? bEl.value : '';
  const bankMemo = bMemo ? bMemo.value.trim() : '';

  const rows = parts.filter(p => p.amt > 0 || p.st === 2).map(p => {
    const isBank = (p.st === 2);
    const day  = isBank ? bankDay  : cardDay;
    const memo = isBank ? (bankMemo ? '계좌입금 ' + bankMemo : '계좌입금')
                        : (cardMemo || '카드결제');
    let memo2 = memo;
    if (p.st === 8) {
      const el = box.querySelector('.gsum[data-st="8"] .xthr');
      if (el) memo2 = memo + ' [발추치료사' + el.value + ']';
    } else {
      const cs = [];
      box.querySelectorAll('.line[data-st="' + p.st + '"] .cnt')
         .forEach(el => cs.push(numOf(el.value)));
      if (cs.length) memo2 = memo + ' [회기' + cs.join(',') + ']';
    }
    return {
      child_id: childId,
      support_type_id: p.st,
      month_key: LOADED_MK,
      amount: p.amt,
      is_paid: !!day,
      paid_on: day || null,
      memo: memo2
    };
  });

  if (!rows.length) { show($('msg2'), '저장할 내용이 없습니다.', false); return; }

  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    const { error } = await sb.from('nl_payments')
      .upsert(rows, { onConflict: 'child_id,support_type_id,month_key' });
    if (error) throw error;
    rows.forEach(r => {
      (SAVED[childId] = SAVED[childId] || {})[r.support_type_id] = r;
    });
    const unpaid = rows.filter(r => !r.paid_on).length;
    show($('msg2'), '✅ ' + rows.length + '건 저장했습니다.'
      + (unpaid ? ' (그중 ' + unpaid + '건은 날짜가 없어 미납으로 저장)' : ''), true);
    btn.textContent = '저장됨';
    setTimeout(() => { btn.textContent = '저장'; btn.disabled = false; }, 1200);
  } catch (e) {
    show($('msg2'), '❌ 저장하지 못했습니다.\n' + e.message, false);
    btn.disabled = false; btn.textContent = '저장';
  }
}

// 숫자 고치면 바로 다시 계산
$('kids').addEventListener('input', e => {
  if (e.target.classList.contains('cnt') || e.target.classList.contains('evamt')) {
    const box = e.target.closest('.kid');
    if (e.target.classList.contains('evamt')) {
      const v = numOf(e.target.value);
      e.target.value = v === 0 ? '' : v.toLocaleString();
    }
    calcKid(Number(box.dataset.child));
    sumAll();
  }
});
$('kids').addEventListener('change', e => {
  if (e.target.classList.contains('xthr')) {
    const box = e.target.closest('.kid');
    calcKid(Number(box.dataset.child));
    sumAll();
  }
});
$('kids').addEventListener('click', e => {
  if (e.target.classList.contains('ksave')) {
    saveKid(Number(e.target.closest('.kid').dataset.child), e.target);
  }
});
$('q').addEventListener('input', () => { if (LOADED_MK) drawAll(); });
$('mk').addEventListener('change', () => {
  $('kids').innerHTML = ''; $('allsum').textContent = '';
  LOADED_MK = null; $('empty').style.display = 'block';
  show($('msg2'), '달이 바뀌었습니다. [불러오기] 를 눌러주세요.', true);
});

// 마우스 휠로 칸 값이 바뀌지 않게
document.addEventListener('wheel', () => {
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT') a.blur();
}, true);

$('load').onclick = load;

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show($('msg'), '이메일과 비밀번호를 모두 입력하세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show($('msg'), '❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false; $('btn').textContent = '로그인';
  }
};
$('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) await afterLogin(data.session.user);
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무위탁 수수료 정산 - 나무링크</title>
<style>
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:#f5f9f0;
         margin:0; padding:20px; color:#333; }
  .box { max-width:460px; margin:40px auto; background:#fff; border-radius:12px;
         padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .wide { max-width:1000px; margin:16px auto; background:#fff; border-radius:12px;
          padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:20px; color:#2e7d32; margin:0 0 4px; }
  #monBig { font-size:28px; font-weight:800; color:#1b5e20; vertical-align:-2px;
            margin-left:6px; }
  .sub { font-size:13px; color:#888; margin-bottom:22px; }
  label { display:block; font-size:13px; font-weight:bold; margin:14px 0 5px; }
  input { width:100%; padding:11px; border:1px solid #ddd; border-radius:7px;
          font-size:15px; box-sizing:border-box; }
  button { width:100%; padding:13px; margin-top:20px; background:#2e7d32; color:#fff;
           border:none; border-radius:7px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { background:#bbb; cursor:default; }
  .out { margin-top:16px; padding:13px; border-radius:8px; font-size:14px;
         line-height:1.7; display:none; white-space:pre-wrap; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }

  .top { display:flex; justify-content:space-between; align-items:center;
         flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .who { font-size:13px; color:#666; }
  .btn-out { width:auto; margin:0; padding:8px 16px; background:#757575; font-size:13px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .sel { width:auto; padding:9px 12px; font-size:14px; border:1px solid #ddd;
         border-radius:7px; font-family:inherit; }
  .prtbtn { width:auto; margin:0; padding:9px 16px; background:#546e7a; font-size:13.5px; }

  .sec { margin-top:26px; }
  .sec-t { font-size:15px; font-weight:bold; color:#33691e; margin-bottom:10px;
           padding-bottom:6px; border-bottom:2px solid #c5e1a5; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { background:#f1f8e9; color:#33691e; padding:9px 8px; text-align:left;
       border-bottom:2px solid #c5e1a5; font-size:12.5px; white-space:nowrap; }
  td { padding:8px; border-bottom:1px solid #eee; }
  td.n, th.n { text-align:right; }
  tr:hover td { background:#fafdf7; }
  tfoot td { font-weight:bold; background:#f7faf4; border-top:2px solid #c5e1a5; }

  /* 지급 내역 */
  .pay { max-width:520px; }
  .pay td { padding:9px 8px; }
  .pay .lab { color:#5a6156; }
  .pay .amt { text-align:right; font-variant-numeric:tabular-nums; }
  .pay .sum td { font-weight:bold; background:#f7faf4; }
  .pay .minus .amt { color:#c62828; }
  .pay .plus  .amt { color:#00695c; }
  .pay .final td { font-size:16px; font-weight:800; background:#e8f5e9;
                   color:#1b5e20; border-top:2px solid #a5d6a7; }
  .note { font-size:12.5px; color:#888; margin-top:8px; line-height:1.8; }
  .warn { background:#fff3e0; border:1px solid #ffcc80; color:#e65100;
          border-radius:8px; padding:12px 14px; font-size:13.5px; margin-bottom:14px; }
  .evalbox { background:#f1f8e9; border:1px solid #c5e1a5; border-radius:10px;
             padding:14px 16px; margin-bottom:14px; }
  .evalrow { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .evalrow > div { display:flex; flex-direction:column; }
  .evalrow label { margin:0 0 4px; font-size:12.5px; font-weight:normal; color:#555; }
  .evalrow input, .evalrow select { padding:8px 10px; font-size:14px;
       border:1px solid #ddd; border-radius:6px; font-family:inherit; }
  .evalrow .addb { width:auto; margin:0; padding:8px 16px; font-size:13.5px;
       background:#8bc34a; }
  .delx { color:#c62828; cursor:pointer; font-weight:bold; }
  .small { font-size:12px; color:#8d6e63; }

  @media print {
    body { background:#fff; padding:0; }
    .wide { box-shadow:none; max-width:none; margin:0; padding:10px; }
    .tools, .btn-out, .evalbox, .noprint { display:none !important; }
  }

  .btn-home { display:inline-block; padding:8px 16px; background:#2e7d32; color:#fff;
              font-size:13px; border-radius:8px; text-decoration:none;
              white-space:nowrap; margin-right:8px; }
  .btn-home:hover { filter:brightness(1.08); }
</style>
</head>
<body>

<!-- 로그인 전 -->
<div class="box" id="loginBox">
  <h1>🌿 나무링크</h1>
  <div class="sub">업무위탁 수수료 정산 — 관리자 전용</div>
  <label for="em">이메일</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@example.com">
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="btn">로그인</button>
  <div id="msg" class="out"></div>
</div>

<!-- 로그인 후 -->
<div class="wide" id="mainBox" style="display:none;">
  <div class="top">
    <div>
      <h1>🌿 업무위탁 수수료 <span id="monBig"></span></h1>
      <div class="who" id="who"></div>
    </div>
    <a href="index.html" class="btn-home noprint">🌿 처음으로</a>
    <button id="out" class="btn-out noprint">로그아웃</button>
  </div>

  <div class="tools">
    <select id="mon" class="sel"></select>
    <select id="th" class="sel"></select>
    <button id="prt" class="prtbtn">인쇄 / PDF 저장</button>
  </div>

  <div id="warnBox" class="warn" style="display:none;"></div>

  <!-- 평가 손입력 -->
  <div class="evalbox noprint">
    <div class="sec-t" style="border:none;padding:0;margin-bottom:8px;">평가 넣기</div>
    <div class="evalrow">
      <div>
        <label for="ev_date">날짜</label>
        <input id="ev_date" type="date">
      </div>
      <div>
        <label for="ev_kid">아동 이름</label>
        <input id="ev_kid" type="text" placeholder="아동 이름">
      </div>
      <div>
        <label for="ev_cnt">평가 개수</label>
        <select id="ev_cnt"></select>
      </div>
      <div>
        <label for="ev_memo">종류</label>
        <input id="ev_memo" type="text" placeholder="예: 언어, 심리">
      </div>
      <button id="evAdd" class="addb">넣기</button>
    </div>
    <div class="note">평가는 회기수에 넣지 않고 따로 수수료를 드립니다.
      1개 27,000 / 2개 53,000 / 3개 80,000원</div>
    <div id="evMsg" class="out"></div>
  </div>

  <div class="sec">
    <div class="sec-t">1. 세션 진행 내역</div>
    <table id="t1">
      <thead>
        <tr>
          <th>아동명 · 사업</th>
          <th class="n">40분</th>
          <th class="n">60분</th>
          <th class="n">특수</th>
          <th class="n">합계</th>
          <th class="n">수수료</th>
          <th>진행 날짜</th>
        </tr>
      </thead>
      <tbody id="rows1"></tbody>
      <tfoot id="foot1"></tfoot>
    </table>
  </div>

  <div class="sec">
    <div class="sec-t">2. 평가 진행 내역</div>
    <table id="t2">
      <thead>
        <tr><th>날짜</th><th>아동명</th><th>종류</th>
            <th class="n">개수</th><th class="n">수수료</th><th class="noprint"></th></tr>
      </thead>
      <tbody id="rows2"></tbody>
      <tfoot id="foot2"></tfoot>
    </table>
  </div>

  <div class="sec">
    <div class="sec-t">3. 지급 내역</div>
    <table class="pay"><tbody id="rows3"></tbody></table>
    <div class="note" id="payNote"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
// 로그인을 창(탭) 안에서만 유지한다. 창을 닫으면 자동으로 끊긴다.
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: {
    storage: window.sessionStorage,
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false
  }
});
const $  = id => document.getElementById(id);

// 이 화면을 볼 수 있는 사람 — 관리자(8)만
const CAN_SEE = [8];

// 4대보험 요율 (2026년)
const INS = {
  pension:  { emp:0.0475,  own:0.0475 },
  health:   { emp:0.03595, own:0.03595 },
  care:     0.1314,                       // 건강보험료에 곱함
  employ:   { emp:0.009,   own:0.0115 },
  accident: { emp:0,       own:0.0153 }
};
const TAX = 0.033;
const STYPE = {1:'센',2:'발',3:'치',4:'치',5:'방',6:'방치',7:'방치',8:'발추',9:'평가'};

let RATES = {};   // 치료사 번호 -> 단가
let EVFEE = {};   // 평가 개수 -> 수수료
let THS   = [];
let SESS  = [], ROWS = [], KIDS = {};
let EVALS = [];   // 그 달 평가
let mon = '', thId = 0;

function show(t, ok){ $('msg').textContent=t; $('msg').className='out '+(ok?'ok':'err'); }
function evmsg(t, ok){ $('evMsg').textContent=t; $('evMsg').className='out '+(ok?'ok':'err'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function won(n){ return Number(n||0).toLocaleString('ko-KR'); }
function monNo(k){ return Number(String(k).split('-')[1]); }
function dayNo(d){ return Number(String(d).split('-')[2]); }
function monEnd(k){
  const p=String(k).split('-');
  const d=new Date(Number(p[0]), Number(p[1]), 0);
  return k+'-'+String(d.getDate()).padStart(2,'0');
}

// ===== 계산 =====
function calc(){
  const r = RATES[thId];
  $('monBig').textContent = monNo(mon) + '월';

  if (!r) {
    $('warnBox').style.display = 'block';
    $('warnBox').innerHTML = '<b>이 치료사의 단가가 없습니다.</b> '
      + '단가를 넣어야 계산됩니다.';
    $('rows1').innerHTML = ''; $('foot1').innerHTML = '';
    $('rows2').innerHTML = ''; $('foot2').innerHTML = '';
    $('rows3').innerHTML = '';
    return;
  }

  // 완료·보강만 센다
  const done = SESS.filter(s => s.therapist_id === thId
                 && (s.status === '완료' || s.status === '보강'));

  if (!SESS.length) {
    $('warnBox').style.display = 'block';
    $('warnBox').innerHTML = '<b>' + monNo(mon) + '월은 회차 자료가 없습니다.</b> '
      + '매달 초에 회차를 깔아야 이 화면이 계산됩니다.';
  } else if (!done.length) {
    $('warnBox').style.display = 'block';
    $('warnBox').innerHTML = '<b>완료·보강으로 표시된 회차가 없습니다.</b> '
      + '시간표에서 진행한 수업을 완료로 표시하면 여기에 잡힙니다.';
  } else {
    $('warnBox').style.display = 'none';
  }

  // 아동별로 모으기
  const byKid = {};
  done.forEach(s => {
    const sc = ROWS.find(x => x.id === s.schedule_id);
    const dur = sc ? Number(sc.duration || 40) : 40;
    const tt  = sc ? sc._tt : null;
    const stid = s.support_type_id || (sc ? sc.support_type_id : null);
    const nm  = (KIDS[s.child_id] || ('아동 ' + s.child_id + '번'))
              + (stid ? ' · ' + (STYPE[stid] || ('유형'+stid)) : '');
    const k = byKid[nm] = byKid[nm] || { m40:0, m60:0, sp:0, days:[], fee:0 };
    // 심리치료(특수 단가)는 치료종류가 아니라 메모로 구분해야 하므로
    // 지금은 특수 단가가 있는 치료사의 60분 아닌 수업 중
    // 메모에 '심리'가 있는 것만 특수로 본다
    const isSp = r.special_fee && String(s.memo||'').includes('심리');
    let fee;
    if (isSp)          { k.sp++;  fee = r.special_fee; }
    else if (dur >= 60){ k.m60++; fee = Math.round(r.session_fee * 1.5); }
    else               { k.m40++; fee = r.session_fee; }
    k.fee += fee;
    k.days.push(dayNo(s.plan_date) + (s.status==='보강' ? '(보강)' : ''));
  });

  const names = Object.keys(byKid).sort((a,b)=>a.localeCompare(b,'ko'));
  let t40=0, t60=0, tsp=0, tcnt=0, tfee=0;
  $('rows1').innerHTML = names.map(nm => {
    const k = byKid[nm];
    const cnt = k.m40 + k.m60 + k.sp;
    t40+=k.m40; t60+=k.m60; tsp+=k.sp; tcnt+=cnt; tfee+=k.fee;
    k.days.sort((a,b)=>parseInt(a)-parseInt(b));
    return '<tr><td>' + esc(nm) + '</td>'
      + '<td class="n">' + (k.m40||'–') + '</td>'
      + '<td class="n">' + (k.m60||'–') + '</td>'
      + '<td class="n">' + (k.sp ||'–') + '</td>'
      + '<td class="n">' + cnt + '</td>'
      + '<td class="n">' + won(k.fee) + '</td>'
      + '<td class="small">' + k.days.join(', ') + '</td></tr>';
  }).join('');
  const nKid = new Set(done.map(x => x.child_id)).size;
  $('foot1').innerHTML = '<tr><td>세션 소계 아동 ' + nKid + '명 · ' + names.length + '줄</td>'
    + '<td class="n">' + t40 + '</td><td class="n">' + t60 + '</td>'
    + '<td class="n">' + tsp + '</td><td class="n">' + tcnt + '</td>'
    + '<td class="n">' + won(tfee) + '</td><td></td></tr>';

  // 평가
  const evs = EVALS.filter(e => e.therapist_id === thId);
  let efee = 0;
  $('rows2').innerHTML = evs.length ? evs.map(e => {
    const f = EVFEE[e.cnt] || 0; efee += f;
    return '<tr><td>' + esc(e.ev_date) + '</td><td>' + esc(e.child_name) + '</td>'
      + '<td>' + esc(e.memo || '') + '</td>'
      + '<td class="n">' + e.cnt + '개</td>'
      + '<td class="n">' + won(f) + '</td>'
      + '<td class="noprint"><span class="delx" data-ev="' + e.id + '">✕</span></td></tr>';
  }).join('') : '<tr><td colspan="6" style="color:#999;">평가 없음</td></tr>';
  $('foot2').innerHTML = evs.length
    ? '<tr><td colspan="4">평가 소계 ' + evs.length + '건</td>'
      + '<td class="n">' + won(efee) + '</td><td class="noprint"></td></tr>' : '';
  $('rows2').querySelectorAll('.delx').forEach(el => {
    el.onclick = async () => {
      if (!confirm('이 평가를 지울까요?')) return;
      const { error } = await sb.from('nl_eval_logs').delete().eq('id', Number(el.dataset.ev));
      if (error) { evmsg('❌ 지우지 못했습니다.\n' + error.message, false); return; }
      await loadEvals(); calc();
    };
  });

  // 주유비 — 완료 회차가 있는 날만 (보강만 있는 날은 뺀다)
  const fuelDays = new Set();
  SESS.filter(s => s.therapist_id === thId && s.status === '완료')
      .forEach(s => fuelDays.add(s.plan_date));
  const fuel = (r.daily_fuel || 0) * fuelDays.size;

  // 4대보험
  let ins = 0, insTxt = '가입 안 함';
  if (r.insured && r.declared_amt > 0) {
    const d = r.declared_amt;
    const pen = d * (INS.pension.emp + INS.pension.own);
    const hea = d * (INS.health.emp + INS.health.own);
    const car = hea * INS.care;
    const emp = d * (INS.employ.emp + INS.employ.own);
    const acc = d * (INS.accident.emp + INS.accident.own);
    ins = Math.round(pen + hea + car + emp + acc);
    insTxt = '신고금액 ' + won(d) + '원 · 국민연금 ' + won(Math.round(pen))
           + ' / 건강 ' + won(Math.round(hea)) + ' / 장기요양 ' + won(Math.round(car))
           + ' / 고용 ' + won(Math.round(emp)) + ' / 산재 ' + won(Math.round(acc));
  }

  const total  = tfee + efee;
  const taxBase= total - ins;
  const tax    = Math.round(taxBase * TAX);
  const net    = taxBase - tax + fuel;

  const line = (lab, amt, cls) =>
    '<tr class="' + (cls||'') + '"><td class="lab">' + lab + '</td>'
    + '<td class="amt">' + amt + '</td></tr>';

  $('rows3').innerHTML =
      line('회기 수수료 <span class="small">(' + tcnt + '회기)</span>', won(tfee))
    + line('평가 수수료 <span class="small">(' + evs.length + '건)</span>', won(efee))
    + line('총 수수료', won(total), 'sum')
    + line('4대보험 공제', ins ? '(' + won(ins) + ')' : '–', 'minus')
    + line('과세대상액', won(taxBase), 'sum')
    + line('원천징수 3.3%', '(' + won(tax) + ')', 'minus')
    + (r.daily_fuel
        ? line('주유비 <span class="small">(' + fuelDays.size + '일 × '
               + won(r.daily_fuel) + '원 · 비과세)</span>',
               '+' + won(fuel), 'plus')
        : '')
    + line('실 지급액', won(net) + ' 원', 'final');

  $('payNote').innerHTML =
      '회기는 <b>완료·보강</b>만 셉니다. 결석·휴무·예정은 빠집니다.<br>'
    + '60분 수업은 회기 단가의 1.5배입니다. 회기 단가 ' + won(r.session_fee) + '원'
    + (r.special_fee ? ' · 특수 단가 ' + won(r.special_fee) + '원' : '') + '<br>'
    + '4대보험 — ' + insTxt + '<br>'
    + (r.daily_fuel ? '주유비는 <b>완료 회차가 있는 날</b>만 셉니다. 보강만 있는 날은 빠집니다. 비과세라 원천징수 뒤에 더합니다.<br>' : '')
    + '<b>아동별 진행 날짜</b>가 위 표에 있으니 숫자가 안 맞으면 그 표에서 찾으세요.';
}

// ===== 평가 넣기 =====
$('evAdd').onclick = async () => {
  const d = $('ev_date').value;
  const nm = $('ev_kid').value.trim();
  if (!d)  { evmsg('날짜를 고르세요.', false); return; }
  if (!nm) { evmsg('아동 이름을 적으세요.', false); return; }
  $('evAdd').disabled = true;
  try {
    const { error } = await sb.from('nl_eval_logs').insert({
      month_key: mon, therapist_id: thId, ev_date: d,
      child_name: nm, cnt: Number($('ev_cnt').value),
      memo: $('ev_memo').value.trim() || null
    });
    if (error) throw error;
    $('ev_kid').value = ''; $('ev_memo').value = '';
    evmsg('✅ 넣었습니다.', true);
    await loadEvals(); calc();
  } catch (e) {
    evmsg('❌ 넣지 못했습니다.\n' + e.message, false);
  } finally { $('evAdd').disabled = false; }
};

async function loadEvals(){
  const { data } = await sb.from('nl_eval_logs')
    .select('id, therapist_id, ev_date, child_name, cnt, memo')
    .eq('month_key', mon).order('ev_date');
  EVALS = data || [];
}

async function loadMonth(){
  const { data } = await sb.from('nl_sessions')
    .select('id, child_id, schedule_id, plan_date, status, therapist_id, memo, support_type_id')
    .eq('month_key', mon);
  SESS = data || [];
  await loadEvals();
}

$('prt').onclick = () => window.print();

async function afterLogin(user){
  const { data: me, error: e1 } = await sb.from('nl_therapists')
    .select('id, name, role').eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (e1)  { show('❌ 직원 조회 실패\n'+e1.message, false); return; }
  if (!me) { show('⚠️ 직원 표에 이 이메일이 없습니다.', false); return; }
  if (CAN_SEE.indexOf(me.id) < 0) {
    show('이 화면은 관리자만 볼 수 있습니다.', false); return;
  }

  const { data: ths } = await sb.from('nl_therapists')
    .select('id, name').lte('id', 7).order('id');
  THS = ths || [];
  $('th').innerHTML = THS.map(t =>
    '<option value="'+t.id+'">'+esc(t.name)+' 치료사</option>').join('');
  thId = THS.length ? THS[0].id : 0;

  const { data: rates } = await sb.from('nl_pay_rates').select('*');
  (rates || []).forEach(r => RATES[r.therapist_id] = r);

  const { data: ef } = await sb.from('nl_eval_pay').select('cnt, fee').order('cnt');
  (ef || []).forEach(x => EVFEE[x.cnt] = x.fee);
  $('ev_cnt').innerHTML = (ef || []).map(x =>
    '<option value="'+x.cnt+'">'+x.cnt+'개 · '+won(x.fee)+'원</option>').join('');

  // 수업 · 아동
  const { data: sc } = await sb.from('nl_therapy_schedules')
    .select('id, therapy_id, duration, therapist_id');
  const { data: tp } = await sb.from('nl_therapies')
    .select('id, child_id, therapy_type_id, support_type_id');
  const { data: kids } = await sb.from('nl_children').select('id, name');
  const tpMap = {}; (tp||[]).forEach(x => tpMap[x.id] = x);
  (kids||[]).forEach(k => KIDS[k.id] = k.name);
  ROWS = (sc||[]).map(r => {
    const t = tpMap[r.therapy_id];
    r._tt = t ? t.therapy_type_id : null;
    r.support_type_id = t ? t.support_type_id : null;
    return r;
  });

  // 달 목록
  const now = new Date();
  let opts = '';
  for (let k = 6; k >= -1; k--) {
    const d = new Date(now.getFullYear(), now.getMonth() - k, 1);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    opts += '<option value="'+key+'">'+key+'</option>';
  }
  $('mon').innerHTML = opts;
  mon = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  $('mon').value = mon;

  await loadMonth();
  if (!SESS.length) {
    const d2 = new Date(now.getFullYear(), now.getMonth()+1, 1);
    const nk = d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0');
    const save = mon; mon = nk; await loadMonth();
    if (SESS.length) $('mon').value = nk;
    else { mon = save; $('mon').value = save; await loadMonth(); }
  }
  $('ev_date').value = mon + '-01';

  $('who').textContent = me.name + ' (' + me.role + ') 님으로 로그인됨';
  $('loginBox').style.display = 'none';
  $('mainBox').style.display  = 'block';
  calc();
}

$('mon').onchange = async () => { mon = $('mon').value; $('ev_date').value = mon+'-01';
  await loadMonth(); calc(); };
$('th').onchange  = () => { thId = Number($('th').value); calc(); };

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase(), pw = $('pw').value;
  if (!email || !pw) { show('이메일과 비밀번호를 모두 입력하세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) { show('❌ 로그인 실패\n'+e.message, false); }
  finally { $('btn').disabled = false; $('btn').textContent = '로그인'; }
};
$('out').onclick = async () => {
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
  else {
    // 로그인이 없으면 첫 화면으로 보낸다 (빈 화면이 열리는 것을 막기 위함)
    location.replace('index.html');
  }
})();
</script>
</body>
